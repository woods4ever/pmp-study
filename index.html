function toggleDarkMode(){
  document.querySelector('.app').classList.toggle('dark-mode');
  var isDark = document.querySelector('.app').classList.contains('dark-mode');
  localStorage.setItem('pmp_dark_mode', isDark ? '1' : '0');
}
// Auto-apply dark mode on load
if(localStorage.getItem('pmp_dark_mode')==='1'){document.addEventListener('DOMContentLoaded',function(){var el=document.querySelector('.app');if(el)el.classList.add('dark-mode');});}
function shuffleOptions(q){
  var indices = q.options.map(function(_,i){return i});
  for(var i=indices.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var temp=indices[i];indices[i]=indices[j];indices[j]=temp;
  }
  var shuffled={};for(var k in q)shuffled[k]=q[k];
  shuffled.options=indices.map(function(idx){return q.options[idx]});
  shuffled.answer=indices.indexOf(q.answer);
  return shuffled;
}
function premiumChapterClass(chapterId){

const chapters = [{"id":2,"title":"Chapter 2: Key Project Management Terms","summary":"Key PMP terms including projects, operations, progressive elaboration, life cycles, baselines, PMO types, stakeholders, organizational structures, constraints, and success.","notes":["Page 21 – Key Project Management Terms","PMBOK® Guide and Agile Practice Guide","Originally published in 1996, the PMBOK® Guide is currently in its 6th edition.","It has been consistently updated every four to five years.","When you get certified in one PMBOK® Guide, you do not need to be certified in another if all you have to do is maintain that certification.","The PMBOK® Guide was written by a large body of individuals who came together to write common standards for project management.","The PMBOK® Guide provides a standard set of processes that standardize the way a project is managed across different industries.","The goal of the PMBOK® Guide is to answer questions about whether all projects follow a standard set of processes and what those processes are.","The Agile Practice Guide is another guide used heavily on the exam.","The Agile Practice Guide outlines agile concepts, processes, and terminology needed for the exam.","Although 50% of the exam is still based on the PMBOK® Guide, questions on agile practices should also be expected.","Review the dedicated Agile chapter to learn more about the guide and the terms needed to understand Agile.","Project","A temporary endeavor to create a unique product, service, or result.","A project is temporary; it can be either short or long.","Projects can range from tasks lasting a few days to efforts requiring multiple years to complete.","All projects must:","Be temporary.","Have a start date and an end date.","Produce a unique output.","Be unique to the customer.","Even though a project is temporary, the output or main deliverable may exist for a very long time.","Examples of projects can include:","Building a house.","Creating new software.","Installing a new computer network.","Redesigning a process in a company.","Merging different organizations.","Operations","Operations are the opposite of projects.","Operations deal with the day-to-day work of a business.","One of the main differences between projects and operations is that projects are temporary while operations are ongoing.","Operations have no start date or end date.","Sales is an example of an operation because it is performed every day and is never finished.","Providing IT support is also an operation.","Page 22 – Key Project Management Terms","Operations (continued)","Building cars on an assembly line is also an operation because the output is not unique, and there is no start or end date.","Main difference for the exam:","Projects are temporary and unique.","Operations have no start date, no end date, and are not unique.","Progressive Elaboration","Progressive elaboration involves discovering greater levels of detail as the project moves toward completion.","Also known as “rolling wave planning.”","As time progresses, things get more detailed.","At the beginning of a project, you may not know the specific details of what you want to do.","Initially, only high-level information may be known, such as an approximate cost.","As the project progresses, details become more elaborated.","Over time, more specific information becomes known about the project outcome.","Project Management","Project management is the application of knowledge, skills, tools, and techniques to meet the project requirements.","It is about managing people to accomplish the scope of the project within the constraints of time and costs.","All projects are limited as to time, cost, and scope.","In project management, the goal is to get work done within a specific budget and a specific timeframe.","Accomplishing project activities results in completing the actual project requirements.","Three Approaches to Managing a Project","Predictive","Also known as traditional waterfall or plan-driven.","Much of the planning is done upfront at the beginning of the project.","The remainder of the project focuses on executing the plan to complete the work.","More of a traditional project approach.","Planning is completed first, followed by execution with very few changes throughout the project.","Agile","Also known as adaptive or change-driven.","Product is built in small increments instead of all at once.","Allows more customer interactions as increments are being built.","Users can begin using portions of the product and provide feedback.","Supports changes throughout the entire project.","Allows customers to add requirements without going through a change management process as in a traditional project.","Hybrid"],"examples":["The PMBOK® Guide was written by a large body of individuals who came together to write common standards for project management.","The PMBOK® Guide provides a standard set of processes that standardize the way a project is managed across different industries.","The goal of the PMBOK® Guide is to answer questions about whether all projects follow a standard set of processes and what those processes are.","The Agile Practice Guide is another guide used heavily on the exam.","The Agile Practice Guide outlines agile concepts, processes, and terminology needed for the exam."],"podcast":[{"speaker":"Maya","text":"Welcome to Chapter 2: Key Project Management Terms. This chapter is foundational, so the goal is to understand the PMP meaning of each term."},{"speaker":"Jordan","text":"Exactly. These concepts show up everywhere else in the exam, so this is about building clean mental hooks."},{"speaker":"Maya","text":"PMBOK® Guide and Agile Practice Guide"},{"speaker":"Jordan","text":"Originally published in 1996, the PMBOK® Guide is currently in its 6th edition."},{"speaker":"Maya","text":"It has been consistently updated every four to five years."},{"speaker":"Jordan","text":"When you get certified in one PMBOK® Guide, you do not need to be certified in another if all you have to do is maintain that certification."},{"speaker":"Maya","text":"The PMBOK® Guide was written by a large body of individuals who came together to write common standards for project management."},{"speaker":"Jordan","text":"The PMBOK® Guide provides a standard set of processes that standardize the way a project is managed across different industries."},{"speaker":"Maya","text":"The goal of the PMBOK® Guide is to answer questions about whether all projects follow a standard set of processes and what those processes are."},{"speaker":"Jordan","text":"The Agile Practice Guide is another guide used heavily on the exam."},{"speaker":"Maya","text":"The Agile Practice Guide outlines agile concepts, processes, and terminology needed for the exam."},{"speaker":"Jordan","text":"Although 50% of the exam is still based on the PMBOK® Guide, questions on agile practices should also be expected."},{"speaker":"Maya","text":"Review the dedicated Agile chapter to learn more about the guide and the terms needed to understand Agile."},{"speaker":"Jordan","text":"Project"},{"speaker":"Maya","text":"A temporary endeavor to create a unique product, service, or result."},{"speaker":"Jordan","text":"A project is temporary; it can be either short or long."},{"speaker":"Maya","text":"Projects can range from tasks lasting a few days to efforts requiring multiple years to complete."},{"speaker":"Jordan","text":"All projects must:"},{"speaker":"Maya","text":"The key is to connect each term to how it behaves in an exam scenario."},{"speaker":"Jordan","text":"Right. Slow down, identify the exact PMP term being tested, and eliminate answers that sound related but do not match the definition."}],"questions":[{"q": "What is a project?", "options": ["A temporary endeavor to create a unique product, service, or result", "An ongoing effort to maintain daily business functions and operations", "A permanent assignment to support routine organizational activities", "A recurring task performed by the operations team each quarter"], "answer": 0, "why": "A project is defined as a temporary endeavor to create a unique product, service, or result.", "mindset": "Projects are always temporary and produce something unique.", "tags": ["Concept", "Foundation"], "chapterRef": "Chapter 2 - Project Definition"}, {"q": "Which characteristic must ALL projects have?", "options": ["A start date, end date, and unique output", "A permanent team assigned for the life of the organization", "Ongoing operations with no defined completion point", "Daily repetitive tasks performed in a standard sequence"], "answer": 0, "why": "All projects must be temporary, have a start and end date, and produce a unique output.", "mindset": "Temporary + unique = project.", "tags": ["Concept", "Foundation"], "chapterRef": "Chapter 2 - Project Characteristics"}, {"q": "What is the main difference between projects and operations?", "options": ["Projects are temporary and unique; operations are ongoing and repetitive", "Projects require a budget while operations do not require one", "Operations are temporary and unique; projects are ongoing and repetitive", "Projects always cost more money than operations cost the business"], "answer": 0, "why": "Projects are temporary and unique. Operations have no start or end date and are not unique.", "mindset": "Temporary/unique vs ongoing/repetitive is the key exam distinction.", "tags": ["Concept", "Exam Trap"], "chapterRef": "Chapter 2 - Projects vs Operations"}, {"q": "Which is an example of an operation?", "options": ["Providing daily IT support to an organization", "Building a new house for a specific customer", "Installing a new computer network at a site", "Creating custom software for a one-time client"], "answer": 0, "why": "IT support is ongoing, has no end date, and is not unique â€” making it an operation.", "mindset": "Operations are day-to-day, repetitive, and never-ending.", "tags": ["Concept", "Foundation"], "chapterRef": "Chapter 2 - Operations"}, {"q": "What is progressive elaboration?", "options": ["Discovering greater levels of detail as the project progresses", "Reducing project scope each time the budget is exceeded", "Eliminating all requirements before the project begins execution", "Adding new team members every week to increase team productivity"], "answer": 0, "why": "Progressive elaboration means details become clearer and more refined as the project moves forward.", "mindset": "You don't know everything upfront â€” details emerge over time.", "tags": ["Concept", "Planning"], "chapterRef": "Chapter 2 - Progressive Elaboration"}, {"q": "What is another name for progressive elaboration?", "options": ["Rolling wave planning for the project", "Fast tracking the project schedule ahead", "Crashing the critical path activities now", "Performing earned value analysis work"], "answer": 0, "why": "The notes state progressive elaboration is also known as rolling wave planning.", "mindset": "Rolling wave = plan near-term in detail, future work later.", "tags": ["Concept", "Exam Trap"], "chapterRef": "Chapter 2 - Progressive Elaboration"}, {"q": "What is the definition of project management?", "options": ["Applying knowledge, skills, tools, and techniques to meet requirements", "Managing only the budget without considering schedule or scope", "Completing all operations tasks within a fiscal year timeframe", "Assigning team members to permanent roles in the organization"], "answer": 0, "why": "Project management applies knowledge, skills, tools, and techniques to meet project requirements.", "mindset": "PM balances people, scope, time, and cost.", "tags": ["Concept", "Foundation"], "chapterRef": "Chapter 2 - Project Management"}, {"q": "All projects are limited by which three constraints?", "options": ["Time, cost, and scope", "Quality, risk, and procurement", "Stakeholders, communication, and resources", "Charter, baseline, and deliverables"], "answer": 0, "why": "All projects are limited as to time, cost, and scope (the triple constraint).", "mindset": "Triple constraint: time + cost + scope.", "tags": ["Concept", "Foundation"], "chapterRef": "Chapter 2 - Project Constraints"}, {"q": "What is the predictive approach also known as?", "options": ["Traditional waterfall or plan-driven methodology", "Adaptive or change-driven project methodology", "Incremental delivery with customer feedback loops", "Kanban-based flow with work-in-progress limits"], "answer": 0, "why": "Predictive is also called traditional waterfall or plan-driven.", "mindset": "Predictive = planning upfront, minimal changes during execution.", "tags": ["Lifecycle", "Concept"], "chapterRef": "Chapter 2 - Predictive Approach"}, {"q": "In the predictive approach, when is most planning done?", "options": ["Upfront at the beginning of the project", "Throughout execution on a continuous basis", "Only after all deliverables are completed", "During the closing phase of the project"], "answer": 0, "why": "In predictive, much of the planning is done upfront at the beginning.", "mindset": "Plan first, then execute with few changes.", "tags": ["Lifecycle", "Concept"], "chapterRef": "Chapter 2 - Predictive Approach"}, {"q": "What is the agile approach also known as?", "options": ["Adaptive or change-driven methodology", "Traditional waterfall or plan-driven methodology", "Progressive elaboration of the project charter", "Fixed-price contracting with fully defined scope"], "answer": 0, "why": "Agile is also known as adaptive or change-driven.", "mindset": "Agile welcomes change and adapts throughout.", "tags": ["Agile", "Lifecycle"], "chapterRef": "Chapter 2 - Agile Approach"}, {"q": "How does agile build the product?", "options": ["In small increments with customer feedback after each", "All at once in a single long execution phase", "Only after full requirements are documented completely upfront", "By eliminating all change requests from project stakeholders"], "answer": 0, "why": "Agile builds the product in small increments and allows customer feedback on each.", "mindset": "Increments + feedback = agile delivery.", "tags": ["Agile", "Lifecycle"], "chapterRef": "Chapter 2 - Agile Approach"}, {"q": "What does a hybrid approach combine?", "options": ["Predictive and agile methods together on one project", "Only predictive methods with no agile elements at all", "Only agile methods with no traditional planning involved", "Operations and portfolio management into one framework"], "answer": 0, "why": "Hybrid combines predictive and agile methods depending on project needs.", "mindset": "Hybrid blends approaches â€” no single right way.", "tags": ["Lifecycle", "Concept"], "chapterRef": "Chapter 2 - Hybrid Approach"}, {"q": "What is a phase in project management?", "options": ["A division within the project where extra control is needed", "A permanent department within the performing organization", "The final deliverable given to the customer for acceptance", "A type of contract between a buyer and a seller"], "answer": 0, "why": "A phase is a project division used for extra control, usually ending with deliverable acceptance.", "mindset": "Phases help manage and control large projects.", "tags": ["Lifecycle", "Process"], "chapterRef": "Chapter 2 - Phases"}, {"q": "What happens at a phase gate?", "options": ["A review determines whether the project should continue", "The project is automatically terminated without any review", "All team members are permanently reassigned to other work", "The budget is doubled for the next execution phase"], "answer": 0, "why": "Phase gates review progress and decide whether the project should continue to the next phase.", "mindset": "Phase gate = decision point / kill point.", "tags": ["Process", "Exam Trap"], "chapterRef": "Chapter 2 - Phase Gates"}, {"q": "What is a deliverable?", "options": ["A part of the product presented for acceptance", "The project manager's daily status email to the team", "A stakeholder's verbal request for a scope change", "The organization's annual operating budget document"], "answer": 0, "why": "A deliverable is presented to customers or stakeholders for acceptance.", "mindset": "Deliverables are what customers accept.", "tags": ["Scope", "Concept"], "chapterRef": "Chapter 2 - Deliverables"}, {"q": "How many process groups exist in project management?", "options": ["Five process groups", "Three process groups", "Ten process groups", "Forty-nine process groups"], "answer": 0, "why": "There are five process groups: Initiating, Planning, Executing, Monitoring & Controlling, and Closing.", "mindset": "5 process groups, 10 knowledge areas, 49 processes.", "tags": ["Process", "Foundation"], "chapterRef": "Chapter 2 - Process Groups"}, {"q": "Are process groups the same as project phases?", "options": ["No, process groups can repeat within each phase", "Yes, they are identical concepts used interchangeably", "Yes, each phase equals exactly one process group", "No, phases contain only two process groups maximum"], "answer": 0, "why": "Process groups are not phases â€” all five process groups may occur within a single phase.", "mindset": "Don't confuse phases with process groups.", "tags": ["Process", "Exam Trap"], "chapterRef": "Chapter 2 - Process Groups vs Phases"}, {"q": "What are the three project baselines?", "options": ["Scope, schedule/time, and cost", "Quality, risk, and procurement", "Charter, register, and final report", "Communication, stakeholder, and resource"], "answer": 0, "why": "The three baselines are scope, time/schedule, and cost.", "mindset": "Baselines = what you measure performance against.", "tags": ["Baseline", "Process"], "chapterRef": "Chapter 2 - Baselines"}, {"q": "What is a baseline in project management?", "options": ["The original plan plus any approved changes", "Only the first rough idea before planning begins", "An informal suggestion from any project team member", "The final report written during the closing phase"], "answer": 0, "why": "A baseline is the original plan plus approved changes â€” it's what you measure against.", "mindset": "Approved changes update baselines through change control.", "tags": ["Baseline", "Change Control"], "chapterRef": "Chapter 2 - Baselines"}, {"q": "What should happen when a sponsor requests added scope?", "options": ["Submit a formal change request and assess the impacts", "Add the work immediately without any documentation", "Ignore the request until the project is formally closed", "Reduce the budget to accommodate the new scope additions"], "answer": 0, "why": "Added scope requires a formal change request and impact assessment before approval.", "mindset": "All scope changes go through change control.", "tags": ["Change Control", "Exam Trap"], "chapterRef": "Chapter 2 - Baselines and Change"}, {"q": "What does a supportive PMO provide?", "options": ["Templates and training with low authority over projects", "Full direct control over all project managers", "Mandatory compliance frameworks with no flexibility allowed", "Executive decisions on all project scope change requests"], "answer": 0, "why": "A supportive PMO provides templates, training, and guidance with low authority.", "mindset": "Supportive = low authority, advisory role.", "tags": ["PMO", "Organization"], "chapterRef": "Chapter 2 - PMO Types"}, {"q": "Which PMO type has the highest authority?", "options": ["Directive PMO", "Supportive PMO", "Controlling PMO", "Advisory PMO"], "answer": 0, "why": "A directive PMO has the highest authority and directly manages project managers.", "mindset": "Directive = high authority/control over projects.", "tags": ["PMO", "Exam Trap"], "chapterRef": "Chapter 2 - PMO Types"}, {"q": "What does ITTO stand for?", "options": ["Inputs, Tools and Techniques, Outputs", "Initiating, Testing, Tracking, Operations", "Integration, Time, Team, Outcomes", "Issues, Tools, Teams, Objectives"], "answer": 0, "why": "ITTO stands for Inputs, Tools and Techniques, and Outputs â€” every process has them.", "mindset": "Every process has ITTOs.", "tags": ["Process", "Foundation"], "chapterRef": "Chapter 2 - ITTO"}, {"q": "Even though a project is temporary, what may last a long time?", "options": ["The output or main deliverable of the project", "The project team's employment contracts with the company", "The project manager's authority over daily operations", "The change control board's recurring meeting schedule"], "answer": 0, "why": "The output or main deliverable may exist for a very long time even though the project is temporary.", "mindset": "Project = temporary. Deliverable = potentially permanent.", "tags": ["Concept", "Foundation"], "chapterRef": "Chapter 2 - Project Definition"}, {"q": "You're managing a warehouse construction project. Six months in, the operations team asks you to handle ongoing facility maintenance. What should you do?", "options": ["Explain that maintenance is an operation and recommend they assign an operations manager", "Accept the maintenance work since you understand the facility better than anyone else", "Submit a change request to add maintenance as a new deliverable to the project scope", "Escalate to the sponsor and ask them to decide whether maintenance belongs in scope"], "answer": 0, "why": "Maintenance is ongoing (no end date) and not unique — it's an operation, not project work. The PM should clarify this boundary.", "mindset": "PMI mindset: projects are temporary. Don't let operations work creep into your project scope.", "tags": ["Projects vs Operations", "Scope"], "chapterRef": "Chapter 2 - Projects vs Operations"}, {"q": "A sponsor wants a fixed budget and end date but says scope will be defined as the project progresses. What should you do FIRST?", "options": ["Explain the risks of fixing constraints without clear scope and propose a phased approach", "Accept all three constraints and begin planning with whatever information is available", "Refuse to start the project until the sponsor provides complete requirements documentation", "Escalate to the PMO and request they mediate the conversation between you and sponsor"], "answer": 0, "why": "The PM educates the sponsor about constraint relationships and proposes a workable path (phased approach).", "mindset": "PMI mindset: communicate constraints honestly. Propose solutions rather than refusing or blindly accepting.", "tags": ["Triple Constraint", "Communication"], "chapterRef": "Chapter 2 - Constraints"}, {"q": "A stakeholder submits a request to add a feature not in the original scope. They say it's critical. What should you do FIRST?", "options": ["Evaluate the impact on scope, schedule, cost, and quality before making any decision", "Add the feature immediately since the stakeholder described it as critical to success", "Reject the request because it was not included in the original approved project scope", "Ask the team if they have capacity and add it if they confirm they can absorb it"], "answer": 0, "why": "Impact analysis comes before any accept/reject decision. Never act on changes without assessing first.", "mindset": "PMI mindset: analyze before deciding. All changes require impact assessment regardless of urgency.", "tags": ["Change Control", "Impact Analysis"], "chapterRef": "Chapter 2 - Baselines and Change"}, {"q": "You're in a matrix organization and a functional manager pulls your team member during a critical phase. What should you do FIRST?", "options": ["Discuss the conflict with the functional manager to negotiate priorities and find resolution", "Escalate immediately to the sponsor and ask them to intervene on your behalf right away", "Tell the team member to ignore the functional manager and continue all project work", "Accept the situation without discussion and adjust your project schedule accordingly"], "answer": 0, "why": "In a matrix, negotiate directly first. Escalation is a last resort, not a first response.", "mindset": "PMI mindset: resolve conflicts at the lowest level possible before escalating upward.", "tags": ["Matrix Organization", "Conflict Resolution"], "chapterRef": "Chapter 2 - Organizational Structures"}, {"q": "A team member says the project keeps finding new work and will never end. What is this MOST likely?", "options": ["Scope creep caused by uncontrolled changes outside the change management process", "Normal progressive elaboration that occurs as the project naturally moves forward", "A sign that the project should be converted into an ongoing operations function", "An indication that the team member needs performance coaching from the project manager"], "answer": 0, "why": "Endless expansion without change control is scope creep. Progressive elaboration adds detail, not endless new work.", "mindset": "PMI mindset: projects have endpoints. Protect scope through change control.", "tags": ["Scope Creep", "Project Definition"], "chapterRef": "Chapter 2 - Scope Creep"}, {"q": "Your sponsor asks for a cost estimate before requirements are fully defined. What should you provide?", "options": ["A rough order of magnitude estimate with the confidence range clearly communicated", "A definitive estimate based on detailed bottom-up analysis of all work packages", "No estimate at all until all requirements are fully defined and formally approved", "The exact budget number the sponsor wants to hear so they can get project approval"], "answer": 0, "why": "ROM is appropriate early when information is limited. Always communicate the confidence range.", "mindset": "PMI mindset: estimate accuracy matches available information. Be honest about uncertainty.", "tags": ["Estimating", "Communication"], "chapterRef": "Chapter 2 - Estimation"}, {"q": "In a projectized organization, a functional manager requests your team member for two weeks. What is MOST likely true?", "options": ["You have full authority over project resources and can decline the request directly", "You must share the resource because functional managers have equal authority here", "The functional manager's request automatically takes priority over project assignments", "You need PMO approval before making any resource decisions on the project"], "answer": 0, "why": "In projectized orgs, the PM has full authority over resources. Functional managers have limited influence.", "mindset": "PMI mindset: organizational structure determines PM authority level.", "tags": ["Organizational Structure", "Authority"], "chapterRef": "Chapter 2 - Organizational Structures"}, {"q": "A previous PM created a charter that doesn't mention key stakeholders or success criteria. What should you do?", "options": ["Request the charter be updated to include missing elements before starting planning", "Ignore it since the charter was already signed and formally approved by the sponsor", "Create a completely new charter from scratch and replace the existing one entirely", "Proceed directly to planning and address the gaps inside the project management plan"], "answer": 0, "why": "A charter with missing critical elements creates risk. Fix the foundation before building on it.", "mindset": "PMI mindset: don't inherit broken foundations. Get gaps fixed before planning.", "tags": ["Project Charter", "Initiation"], "chapterRef": "Chapter 2 - Project Charter"}, {"q": "Stakeholders want to see working deliverables earlier instead of waiting until the end. What is the BEST approach?", "options": ["Propose phased delivery with incremental releases within the current predictive framework", "Tell stakeholders they must wait for final delivery as originally planned and approved", "Switch the entire project to agile methodology immediately without further analysis", "Deliver incomplete work quickly to satisfy the stakeholder request as soon as possible"], "answer": 0, "why": "You can deliver incrementally within a predictive framework without fully switching methodologies.", "mindset": "PMI mindset: be flexible within your approach. Adapt to stakeholder needs pragmatically.", "tags": ["Delivery Approach", "Stakeholder Engagement"], "chapterRef": "Chapter 2 - Life Cycles"}, {"q": "A sponsor says the team of five has six months to complete twelve months of work. What constraint is MOST impacted?", "options": ["Scope must be reduced or quality will suffer since time and resources are both fixed", "The team can work overtime and meet all constraints without any adjustments needed", "Budget should be increased to hire additional resources to complete all required work", "Only the schedule constraint is affected because scope and cost remain fully unchanged"], "answer": 0, "why": "With fixed time and resources, scope or quality must flex. The PM communicates this tradeoff.", "mindset": "PMI mindset: constraints are interconnected. If you fix some, others must flex.", "tags": ["Triple Constraint", "Communication"], "chapterRef": "Chapter 2 - Project Constraints"}]},{"id":3,"title":"Chapter 3: Project Management Processes and Role of the Project Manager","summary":"Process groups, knowledge areas, common ITTOs, work performance flow, and the role/skills of the project manager.","notes":["Page 42 – 49 Project Management Processes","Process Groups","Initiating (2)","Planning (24)","Executing (10)","Monitoring & Controlling (12)","Closing (1)","Integration Management (7)","Develop Project Charter","Develop Project Management Plan","Direct & Manage Project Work","Manage Project Knowledge","Monitor & Control Project Work","Perform Integrated Change Control","Close Project or Phase","Scope Management (6)","Plan Scope Management","Collect Requirements","Define Scope","Create WBS","Validate Scope","Control Scope","Schedule Management (6)","Plan Schedule Management","Define Activities","Sequence Activities","Estimate Activity Durations","Develop Schedule","Control Schedule","Cost Management (4)","Plan Cost Management","Estimate Costs","Determine Budget","Control Costs","Quality Management (3)","Plan Quality Management","Manage Quality","Control Quality","Resource Management (6)","Plan Resource Management","Estimate Activity Resources","Acquire Resources","Develop Team","Manage Team","Control Resources","Communication Management (3)","Plan Communications Management","Manage Communications","Monitor Communications","Risk Management (7)","Plan Risk Management","Identify Risks","Perform Qualitative Risk Analysis","Perform Quantitative Risk Analysis","Plan Risk Responses","Implement Risk Responses","Monitor Risks","Procurement Management (3)","Plan Procurement Management","Conduct Procurements","Control Procurements","Stakeholder Management (4)","Identify Stakeholders","Plan Stakeholder Engagement","Manage Stakeholder Engagement","Monitor Stakeholder Engagement","Exam Tip: You will need to memorize this page. You should be able to write this entire page in about 5 minutes.","Page 43 – PM Processes and Role of the Project Manager","This chapter will review the framework that projects will follow in each phase.","Includes the five process groups and 10 knowledge areas."],"examples":["Monitoring & Controlling (12)","Closing (1)","Integration Management (7)","Develop Project Charter","Develop Project Management Plan"],"podcast":[{"speaker":"Maya","text":"Welcome to Chapter 3: Project Management Processes and Role of the Project Manager. This chapter is foundational, so the goal is to understand the PMP meaning of each term."},{"speaker":"Jordan","text":"Exactly. These concepts show up everywhere else in the exam, so this is about building clean mental hooks."},{"speaker":"Maya","text":"Process Groups"},{"speaker":"Jordan","text":"Initiating (2)"},{"speaker":"Maya","text":"Planning (24)"},{"speaker":"Jordan","text":"Executing (10)"},{"speaker":"Maya","text":"Monitoring & Controlling (12)"},{"speaker":"Jordan","text":"Closing (1)"},{"speaker":"Maya","text":"Integration Management (7)"},{"speaker":"Jordan","text":"Develop Project Charter"},{"speaker":"Maya","text":"Develop Project Management Plan"},{"speaker":"Jordan","text":"Direct & Manage Project Work"},{"speaker":"Maya","text":"Manage Project Knowledge"},{"speaker":"Jordan","text":"Monitor & Control Project Work"},{"speaker":"Maya","text":"Perform Integrated Change Control"},{"speaker":"Jordan","text":"Close Project or Phase"},{"speaker":"Maya","text":"Scope Management (6)"},{"speaker":"Jordan","text":"Plan Scope Management"},{"speaker":"Maya","text":"The key is to connect each term to how it behaves in an exam scenario."},{"speaker":"Jordan","text":"Right. Slow down, identify the exact PMP term being tested, and eliminate answers that sound related but do not match the definition."}],"questions":[{"q": "How many total project management processes are there?", "options": ["49 processes across all knowledge areas", "39 processes across all knowledge areas", "10 processes across all knowledge areas", "24 processes across all knowledge areas"], "answer": 0, "why": "The framework lists 49 total processes across the five process groups and ten knowledge areas.", "mindset": "49 processes, 5 groups, 10 knowledge areas.", "tags": ["Process", "Foundation"], "chapterRef": "Chapter 3 - Process Framework"}, {"q": "How many processes does the Initiating process group have?", "options": ["2 processes", "5 processes", "10 processes", "24 processes"], "answer": 0, "why": "Initiating has 2 processes: Develop Project Charter and Identify Stakeholders.", "mindset": "Initiating is the smallest process group.", "tags": ["Process", "Foundation"], "chapterRef": "Chapter 3 - Initiating"}, {"q": "How many processes does Planning have?", "options": ["24 processes", "12 processes", "10 processes", "2 processes"], "answer": 0, "why": "Planning is the largest process group with 24 processes.", "mindset": "Planning is the most process-heavy group.", "tags": ["Process", "Foundation"], "chapterRef": "Chapter 3 - Planning"}, {"q": "How many processes does Executing have?", "options": ["10 processes", "24 processes", "12 processes", "1 process"], "answer": 0, "why": "Executing has 10 processes where project work is performed.", "mindset": "Executing is where deliverables are created.", "tags": ["Process", "Execution"], "chapterRef": "Chapter 3 - Executing"}, {"q": "How many processes does Monitoring and Controlling have?", "options": ["12 processes", "10 processes", "24 processes", "5 processes"], "answer": 0, "why": "Monitoring & Controlling has 12 processes that compare actual work to the plan.", "mindset": "M&C runs in parallel with execution.", "tags": ["Process", "Control"], "chapterRef": "Chapter 3 - Monitoring and Controlling"}, {"q": "How many processes does Closing have?", "options": ["1 process", "2 processes", "5 processes", "12 processes"], "answer": 0, "why": "Closing has 1 process: Close Project or Phase.", "mindset": "Closing is still heavily tested on the exam.", "tags": ["Process", "Closing"], "chapterRef": "Chapter 3 - Closing"}, {"q": "How many knowledge areas exist in project management?", "options": ["10 knowledge areas", "5 knowledge areas", "49 knowledge areas", "3 knowledge areas"], "answer": 0, "why": "There are 10 knowledge areas: Integration, Scope, Schedule, Cost, Quality, Resource, Communication, Risk, Procurement, and Stakeholder.", "mindset": "10 knowledge areas organize the 49 processes.", "tags": ["Process", "Foundation"], "chapterRef": "Chapter 3 - Knowledge Areas"}, {"q": "What is the purpose of the Initiating process group?", "options": ["Authorize the project or phase to start", "Create all project deliverables during execution", "Close all contracts and release the team", "Inspect quality of completed deliverables"], "answer": 0, "why": "Initiating formally authorizes the project or phase and establishes the PM's authority.", "mindset": "Initiating = authorization to begin.", "tags": ["Process", "Foundation"], "chapterRef": "Chapter 3 - Initiating Purpose"}, {"q": "What are the main outputs of Initiating?", "options": ["Project charter and stakeholder register", "Cost baseline and schedule baseline", "Work performance reports and change requests", "Accepted deliverables and final report"], "answer": 0, "why": "Initiating produces the project charter and stakeholder register.", "mindset": "Charter authorizes; stakeholder register identifies.", "tags": ["Process", "ITTO"], "chapterRef": "Chapter 3 - Initiating Outputs"}, {"q": "What is the main output of the Planning process group?", "options": ["Project management plan", "Work performance data from execution", "Accepted deliverables from the customer", "Final report and lessons learned"], "answer": 0, "why": "Planning creates the project management plan that guides the rest of the project.", "mindset": "The plan tells you how to execute, monitor, and close.", "tags": ["Planning", "Process"], "chapterRef": "Chapter 3 - Planning Output"}, {"q": "What is the main output of the Executing process group?", "options": ["Deliverables created by project work", "The project charter authorization document", "The final project closure report", "The cost and schedule baselines"], "answer": 0, "why": "Executing produces deliverables â€” the actual products of project work.", "mindset": "Execution = where work gets done and deliverables are made.", "tags": ["Execution", "Process"], "chapterRef": "Chapter 3 - Executing Output"}, {"q": "What does Monitoring and Controlling do?", "options": ["Compares actual work to planned work and identifies variances", "Authorizes the project and assigns the project manager", "Only closes contracts at the end of the project", "Only identifies stakeholders at project start"], "answer": 0, "why": "M&C measures actual performance against the plan to detect variances.", "mindset": "Off-plan work may need corrective action.", "tags": ["Control", "Process"], "chapterRef": "Chapter 3 - M&C Purpose"}, {"q": "When do Executing and Monitoring/Controlling occur relative to each other?", "options": ["They occur in parallel simultaneously", "Executing must fully complete before M&C begins", "M&C only happens after the project is closed", "They alternate but never overlap"], "answer": 0, "why": "Executing and M&C are parallel â€” you monitor while executing.", "mindset": "You don't wait until execution is done to start monitoring.", "tags": ["Process", "Exam Trap"], "chapterRef": "Chapter 3 - Process Group Relationships"}, {"q": "What happens during the Closing process group?", "options": ["Deliverables are transitioned, records archived, and lessons learned documented", "The project is first authorized to begin work", "Requirements are collected from all stakeholders", "The project schedule is developed for the first time"], "answer": 0, "why": "Closing transitions deliverables, archives records, documents lessons learned, and releases the team.", "mindset": "Closing is more than just finishing work.", "tags": ["Closing", "Process"], "chapterRef": "Chapter 3 - Closing Activities"}, {"q": "What are Enterprise Environmental Factors (EEFs)?", "options": ["Factors not under the project team's control that may affect outcomes", "Templates and lessons learned owned by the organization", "Only the project charter and stakeholder register", "Only change requests submitted by team members"], "answer": 0, "why": "EEFs are internal or external factors outside the project team's control that can affect the project.", "mindset": "EEFs can help or hurt â€” they're not controllable.", "tags": ["ITTO", "Process"], "chapterRef": "Chapter 3 - EEF"}, {"q": "What are Organizational Process Assets (OPAs)?", "options": ["Plans, processes, policies, procedures, and knowledge bases the organization uses", "External regulations imposed on the project by the government", "Only the project charter and the stakeholder register documents", "Only change requests submitted by the project team members"], "answer": 0, "why": "OPAs include templates, historical information, lessons learned, policies, and procedures.", "mindset": "OPAs help the PM manage the project using existing organizational knowledge.", "tags": ["ITTO", "Process"], "chapterRef": "Chapter 3 - OPA"}, {"q": "What is the project management plan?", "options": ["The document defining how the project is executed, monitored, and closed", "A stakeholder list with only their contact information", "Raw work performance data collected during execution", "The final project closure report for the sponsor"], "answer": 0, "why": "The PM plan is the single most important document â€” it guides execution, M&C, and closing.", "mindset": "The plan is the guide for everything after planning.", "tags": ["Plan", "Process"], "chapterRef": "Chapter 3 - Project Management Plan"}, {"q": "What is work performance data?", "options": ["Raw data with no analysis applied to it yet", "Analyzed status compared to the project management plan", "A compiled project report for stakeholders", "A final closure document for the sponsor"], "answer": 0, "why": "Work performance data is raw information â€” it hasn't been analyzed yet.", "mindset": "Data is raw; information is analyzed; reports summarize.", "tags": ["ITTO", "Exam Trap"], "chapterRef": "Chapter 3 - Work Performance Data"}, {"q": "What is work performance information?", "options": ["Work data analyzed and compared against the project plan", "Raw unprocessed data from project execution", "A compiled report given to senior management", "The final project deliverable"], "answer": 0, "why": "Work performance information compares raw data to the plan to show status.", "mindset": "Information = data + plan comparison.", "tags": ["ITTO", "Exam Trap"], "chapterRef": "Chapter 3 - Work Performance Information"}, {"q": "What is the correct work performance flow?", "options": ["Data â†’ Information â†’ Reports", "Reports â†’ Data â†’ Information", "Information â†’ Data â†’ Reports", "Data â†’ Charter â†’ Reports"], "answer": 0, "why": "Raw data is analyzed into information, which is compiled into reports.", "mindset": "Data feeds info; info creates reports.", "tags": ["ITTO", "Exam Trap"], "chapterRef": "Chapter 3 - Work Performance Flow"}, {"q": "How many processes does Integration Management have?", "options": ["7 processes", "3 processes", "6 processes", "4 processes"], "answer": 0, "why": "Integration Management has 7 processes spanning all five process groups.", "mindset": "Integration touches every process group.", "tags": ["Process", "Foundation"], "chapterRef": "Chapter 3 - Integration Management"}, {"q": "How many processes does Scope Management have?", "options": ["6 processes", "3 processes", "7 processes", "4 processes"], "answer": 0, "why": "Scope Management has 6 processes.", "mindset": "Plan, Collect, Define, Create WBS, Validate, Control.", "tags": ["Process", "Foundation"], "chapterRef": "Chapter 3 - Scope Management"}, {"q": "How many processes does Risk Management have?", "options": ["7 processes", "3 processes", "4 processes", "6 processes"], "answer": 0, "why": "Risk Management has 7 processes â€” the most of any knowledge area besides Integration.", "mindset": "Risk has the most processes after Integration.", "tags": ["Process", "Foundation"], "chapterRef": "Chapter 3 - Risk Management"}, {"q": "Which knowledge area has only 3 processes?", "options": ["Quality Management, Communication Management, and Procurement Management each have 3", "Only Integration Management has exactly 3 processes", "Only Scope Management has exactly 3 processes", "Only Cost Management has exactly 3 processes"], "answer": 0, "why": "Quality, Communication, and Procurement each have exactly 3 processes.", "mindset": "3-process KAs: Quality, Communication, Procurement.", "tags": ["Process", "Foundation"], "chapterRef": "Chapter 3 - Knowledge Area Counts"}, {"q": "How many processes does Cost Management have?", "options": ["4 processes", "3 processes", "6 processes", "7 processes"], "answer": 0, "why": "Cost Management has 4 processes: Plan, Estimate, Determine Budget, Control Costs.", "mindset": "Cost: Plan, Estimate, Budget, Control.", "tags": ["Process", "Foundation"], "chapterRef": "Chapter 3 - Cost Management"}, {"q": "You've just been assigned as PM. The sponsor hands you deliverables and says 'Just get it done.' What should you do FIRST?", "options": ["Clarify project objectives, constraints, and success criteria with the sponsor first", "Start creating the WBS immediately since you already have the deliverables list", "Assign work to team members based on the deliverables list provided by sponsor", "Create a project schedule and present it to the sponsor for immediate approval"], "answer": 0, "why": "Before planning, understand the full picture. A deliverables list alone is insufficient context.", "mindset": "PMI mindset: don't jump to execution without understanding context first.", "tags": ["Initiation", "PM Role"], "chapterRef": "Chapter 3 - Role of the PM"}, {"q": "Your team struggles with a technical decision and asks you to make the call. As a servant leader, what should you do?", "options": ["Facilitate a discussion to help the team analyze options and reach their own decision", "Make the decision immediately since the team directly asked you to choose for them", "Tell them it's not your job to make technical decisions and walk away from it", "Escalate the decision to the sponsor since it involves technical complexity"], "answer": 0, "why": "Servant leaders empower teams. Facilitate, don't dictate — unless they're truly stuck.", "mindset": "PMI mindset: servant leadership means enabling the team, not commanding them.", "tags": ["Servant Leadership", "Team Empowerment"], "chapterRef": "Chapter 3 - Servant Leadership"}, {"q": "The sponsor wants to skip the phase gate review to save time. What should you do?", "options": ["Explain the value of the review and how it prevents problems from carrying forward", "Skip it since the sponsor requested it and they have authority over the project", "Conduct the review secretly without informing the sponsor about the activity", "Delay the entire project indefinitely until the sponsor agrees to the review"], "answer": 0, "why": "Phase gates validate deliverables and readiness. Educate the sponsor on value rather than blindly complying.", "mindset": "PMI mindset: protect project integrity. Educate stakeholders on why controls exist.", "tags": ["Phase Gates", "Stakeholder Management"], "chapterRef": "Chapter 3 - Process Groups"}, {"q": "Midway through your project, you realize M&C processes were never set up. No variance reports exist. What should you do?", "options": ["Immediately establish monitoring processes with metrics, baselines, and reporting cadence", "Continue without monitoring since the project is already halfway through execution", "Only set up monitoring if specific problems arise that require immediate attention", "Ask the team to informally self-report their own progress via weekly email updates"], "answer": 0, "why": "M&C is continuous. Without it you're flying blind. It's never too late to establish proper monitoring.", "mindset": "PMI mindset: you cannot manage what you cannot measure. Fix it immediately.", "tags": ["Monitoring and Controlling", "Baselines"], "chapterRef": "Chapter 3 - M&C"}, {"q": "A new PM asks how process groups relate to project phases. Which statement is MOST accurate?", "options": ["Process groups are not phases and can repeat within each phase of a project", "Process groups and phases are exactly the same thing used interchangeably", "Each project phase corresponds to precisely one process group and no others", "Process groups only apply to waterfall projects and not to agile projects"], "answer": 0, "why": "Process groups can repeat within phases. All five may occur in a single phase.", "mindset": "PMI mindset: process groups ≠ phases. They're distinct concepts.", "tags": ["Process Groups", "Phases"], "chapterRef": "Chapter 3 - Process Groups vs Phases"}, {"q": "An executive asks why formal closing is needed when work is already done. What is the BEST justification?", "options": ["Closing ensures formal acceptance, captures lessons learned, and releases resources properly", "Closing is just required paperwork that doesn't add real value to the project", "Closing is only needed when the project encountered problems during execution", "Closing only matters for projects with budgets exceeding one million dollars"], "answer": 0, "why": "Closing has real outputs — acceptance, lessons learned, resource release, contract closure.", "mindset": "PMI mindset: closing is a real process, not an afterthought.", "tags": ["Closing", "Process Groups"], "chapterRef": "Chapter 3 - Closing"}, {"q": "Your organization wants to improve PM maturity. What single thing would have the MOST impact?", "options": ["Implement consistent lessons learned practices so each project improves upon the last", "Purchase the most expensive project management software tool available on market", "Hire additional project managers to handle the increasing workload across teams", "Create more detailed documentation templates for every possible project scenario"], "answer": 0, "why": "Lessons learned drive continuous improvement — the foundation of organizational maturity.", "mindset": "PMI mindset: improvement comes from systematic learning, not tools or headcount.", "tags": ["Lessons Learned", "Organizational Maturity"], "chapterRef": "Chapter 3 - PM Processes"}, {"q": "A stakeholder says all your process is slowing the team down. Investigation shows excessive documentation adds no value. What should you do?", "options": ["Review and streamline documentation — eliminate what adds no value while keeping essentials", "Defend all current processes since they follow the PMBOK Guide methodology completely", "Remove all documentation entirely to appease the stakeholder and speed the team up", "Ignore the feedback since stakeholders don't understand project management processes"], "answer": 0, "why": "Process should serve the project. If documentation adds no value, reduce it. Tailor to actual needs.", "mindset": "PMI mindset: more process isn't always better. Tailor and simplify based on feedback.", "tags": ["Tailoring", "Process Improvement"], "chapterRef": "Chapter 3 - Tailoring"}, {"q": "Your project team works across three time zones. Standups work for two zones but exclude the third. What should you do FIRST?", "options": ["Rotate meeting times or create alternative mechanisms so all members participate equitably", "Tell the excluded team member to adjust their personal schedule to attend meetings", "Keep the current schedule since the majority of the team can attend without problems", "Cancel all standup meetings entirely since they clearly don't work for everyone"], "answer": 0, "why": "The PM ensures inclusive communication. Adapt the approach to the team's reality.", "mindset": "PMI mindset: communication must reach all stakeholders. Adapt to the team.", "tags": ["Communication", "Distributed Teams"], "chapterRef": "Chapter 3 - PM Role"}, {"q": "You discover planning was incomplete — several work packages have no estimates. The project is in execution. What should you do?", "options": ["Pause affected work, complete missing estimates, and re-baseline with sponsor approval", "Guess at estimates and continue executing the work to avoid losing project momentum", "Wait until the work is done and simply record the actual costs that were incurred", "Escalate to the sponsor and wait for them to tell you exactly what to do next"], "answer": 0, "why": "Don't execute blindly without baselines. Fix planning gaps before proceeding with that work.", "mindset": "PMI mindset: planning isn't one-time. Fix gaps when found, then proceed.", "tags": ["Planning", "Baselines", "Execution"], "chapterRef": "Chapter 3 - Iterative Planning"}]},{"id":4,"title":"Chapter 4: Agile and Hybrid Project Management","summary":"Agile and hybrid project management, including Agile values/principles, Scrum/XP terms, product backlog, sprint flow, MVP, Kanban, Lean, servant leadership, and hybrid approaches.","notes":["Page 65 – Agile and Hybrid Project Management","Review of Agile processes and terms likely to appear on the PMP exam.","Need to be familiar with the entire Agile process and different Agile terms.","Chapter serves as an introduction to Agile project management and is more than sufficient for PMP exam questions.","Traditional (predictive) project management:","Goes through initiating, planning, executing, monitoring and controlling, and closing.","Has a strenuous change management approach.","Project manager generally in charge of the entire project.","Agile:","Represents iterative (flexible) project management.","Includes different Agile methods.","Agile framework:","Builds the product in increments versus as a whole.","Traditional projects generally build the product in its entirety in one long execution phase.","Agile projects build the product in small increments.","Customers provide feedback on each increment.","Allows more interaction with customers and more empowerment to the team.","Agile has become one of the most popular project management methods because of:","Frequent product delivery.","Customer interaction.","Value being realized throughout the project.","Agile is included on the current PMP exam.","Page 65 – What is Agile?","Agile is an umbrella term used to refer to different types of iterative development.","Agile methods include:","Scrum","Extreme Programming (XP)","Kanban","Lean development","Others","PMP exam will not go into these methodologies in detail.","Need to understand the Agile process and some terminology from these methodologies.","Agile techniques have been used for several decades in various forms.","In 2000, software developers created the manifesto for Agile software development.","The Agile manifesto outlines:","4 values","12 principles","No need to memorize the values or principles; a brief understanding is sufficient.","The four values are as follows:","Individuals and interactions over processes and tools","Working software over comprehensive documentation","Customer collaboration over contract negotiation","Responding to change over following a plan","Page 66 – Agile Manifesto Values (Explanation)","While they are valuable practices on the right, in Agile, we value things on the left more.","It is more important to have competent people working effectively in order to get the work done.","Projects are done by people, not by tools and processes.","Customers are more interested in working software, not comprehensive documentation.","While contracts are important, it will be more important to work with the customer to understand what they actually need on the project.","Need to be willing to accept changes and be willing to change the plan as the needs of the customer change.","Willingness to accept changes at any point throughout a project is one of the main differentiating factors between traditional projects and Agile projects.","Page 66 – The 12 Agile Principles","Customer satisfaction by early and continuous delivery of valuable software.","Welcome changing requirements, even late in development.","Deliver working software frequently (weeks rather than months).","Close, daily cooperation between business people and developers.","Projects are built around motivated individuals who should be trusted.","Face-to-face conversation is the best form of communication (co-location).","Working software is the primary measure of progress.","Sustainable development, able to maintain a constant pace.","Continuous attention to technical excellence and good design.","Simplicity—the art of maximizing the amount of work not done—is essential.","Best architectures, requirements, and designs emerge from self-organizing teams.","Regularly, the team reflects on how to become more effective, and adjusts accordingly.","Page 66 – Brief Explanation of the 12 Principles","Agile is about continuously delivering increments of a product over a span of time.","Traditional projects may take many months to a few years to deliver a working product.","Agile delivers increments of the product in a very short period of time.","The short period of time can be anywhere from a few weeks to a few months.","Fast delivery allows customers to realize the value of the product faster.","Allows the customer to fund the development of the product incrementally.","In a traditional project, value will not be realized until the entire project is done and the product is delivered to the customer.","A unique aspect of an Agile project is the ability to accept and welcome change throughout the entire development process.","Agile does not have a strenuous change management process that requires:","A formal change request.","Usage of a change management board.","Customers are able to submit changes throughout the entire Agile project.","Changes will be accepted and inputted into the product backlog, which may get completed.","Allows customers to feel more welcomed throughout the entire project.","Agile projects will not suppress change management like some traditional projects.","Agile is all about people collaboration.","It is important for Agile participants to consistently be in contact with each other.","This can be done using:","Daily standup meetings with team members.","Meetings with customers during iteration reviews to review the product.","Allows everyone to contribute and have a voice as the project is progressing.","Agile promotes face-to-face interaction.","Page 67 – Agile Principles (Continued)","Agile promotes face-to-face interaction as the best means of communication.","This means bringing together teams into one central location (co-location) for them to work together."],"examples":["Goes through initiating, planning, executing, monitoring and controlling, and closing.","Has a strenuous change management approach.","Project manager generally in charge of the entire project.","Agile:","Represents iterative (flexible) project management."],"podcast":[{"speaker":"Maya","text":"Welcome to Chapter 4: Agile and Hybrid Project Management. This chapter is about understanding Agile and hybrid project management the way the PMP exam wants you to think about it."},{"speaker":"Jordan","text":"Exactly. The big theme is value, collaboration, customer feedback, and using the right approach for the project."},{"speaker":"Maya","text":"Review of Agile processes and terms likely to appear on the PMP exam."},{"speaker":"Jordan","text":"Need to be familiar with the entire Agile process and different Agile terms."},{"speaker":"Maya","text":"Chapter serves as an introduction to Agile project management and is more than sufficient for PMP exam questions."},{"speaker":"Jordan","text":"Traditional (predictive) project management:"},{"speaker":"Maya","text":"Goes through initiating, planning, executing, monitoring and controlling, and closing."},{"speaker":"Jordan","text":"Has a strenuous change management approach."},{"speaker":"Maya","text":"Project manager generally in charge of the entire project."},{"speaker":"Jordan","text":"Agile:"},{"speaker":"Maya","text":"Represents iterative (flexible) project management."},{"speaker":"Jordan","text":"Includes different Agile methods."},{"speaker":"Maya","text":"Agile framework:"},{"speaker":"Jordan","text":"Builds the product in increments versus as a whole."},{"speaker":"Maya","text":"Traditional projects generally build the product in its entirety in one long execution phase."},{"speaker":"Jordan","text":"Agile projects build the product in small increments."},{"speaker":"Maya","text":"Customers provide feedback on each increment."},{"speaker":"Jordan","text":"Allows more interaction with customers and more empowerment to the team."},{"speaker":"Maya","text":"Agile has become one of the most popular project management methods because of:"},{"speaker":"Jordan","text":"Frequent product delivery."},{"speaker":"Maya","text":"For the exam, do not treat Agile as chaos. Agile still has structure, roles, events, and artifacts."},{"speaker":"Jordan","text":"Right. Think servant leadership, value delivery, feedback, sustainable pace, and empowered teams."}],"questions":[{"q": "What is Agile an umbrella term for?", "options": ["Different types of iterative development methods", "Only the Scrum framework and nothing else", "Only predictive project management approaches", "Only formal change control board processes"], "answer": 0, "why": "Agile is an umbrella term for different types of iterative development including Scrum, XP, Kanban, Lean.", "mindset": "Agile is broader than any single method.", "tags": ["Agile", "Concept"], "chapterRef": "Chapter 4 - What is Agile"}, {"q": "Which methods are listed as Agile approaches?", "options": ["Scrum, Extreme Programming, Kanban, and Lean development", "PERT, CPM, EVM, and critical path method", "Fixed price, cost-reimbursable, and time and materials", "Scope baseline, schedule baseline, and cost baseline"], "answer": 0, "why": "The notes list Scrum, XP, Kanban, Lean development, and others as Agile methods.", "mindset": "Know the different Agile method names.", "tags": ["Agile", "Concept"], "chapterRef": "Chapter 4 - Agile Methods"}, {"q": "What year was the Agile Manifesto created?", "options": ["2000 by software developers", "1996 by PMI members", "2010 by Scrum Alliance", "1985 by quality engineers"], "answer": 0, "why": "In 2000, software developers created the manifesto for Agile software development.", "mindset": "The manifesto predates the current PMP exam format.", "tags": ["Agile", "Foundation"], "chapterRef": "Chapter 4 - Agile Manifesto"}, {"q": "How many values does the Agile Manifesto have?", "options": ["4 values", "12 values", "7 values", "49 values"], "answer": 0, "why": "The Agile manifesto outlines 4 values and 12 principles.", "mindset": "4 values, 12 principles â€” brief understanding is sufficient.", "tags": ["Agile", "Foundation"], "chapterRef": "Chapter 4 - Agile Manifesto"}, {"q": "Which is an Agile Manifesto value?", "options": ["Individuals and interactions over processes and tools", "Processes and tools over individuals and interactions", "Comprehensive documentation over working software", "Following a plan over responding to change"], "answer": 0, "why": "The manifesto values items on the left MORE â€” individuals and interactions over processes and tools.", "mindset": "Left side is valued more, but right side still has value.", "tags": ["Agile", "Mindset"], "chapterRef": "Chapter 4 - Agile Values"}, {"q": "What is the primary measure of progress in Agile?", "options": ["Working software delivered to customers", "Comprehensive documentation produced by team", "Number of formal change requests submitted", "Percentage of planning documents completed"], "answer": 0, "why": "Working software is the primary measure of progress according to the Agile principles.", "mindset": "Delivered value > documentation volume.", "tags": ["Agile", "Value"], "chapterRef": "Chapter 4 - Agile Principles"}, {"q": "What does Agile promote as the best form of communication?", "options": ["Face-to-face conversation and co-location", "Formal written reports distributed weekly", "Email chains with all stakeholders copied", "Recorded video presentations stored in archives"], "answer": 0, "why": "Agile promotes face-to-face interaction as the best means of communication.", "mindset": "Rich, direct communication beats written methods.", "tags": ["Agile", "Communication"], "chapterRef": "Chapter 4 - Agile Principles"}, {"q": "What is a main differentiating factor between traditional and Agile projects?", "options": ["Willingness to accept changes at any point throughout the project", "Requirement that all planning be completed before any work begins", "Use of a formal change control board for every modification", "Assignment of all authority to the project manager alone"], "answer": 0, "why": "Willingness to accept changes at any point is a main differentiating factor.", "mindset": "Agile welcomes change; predictive uses formal change management.", "tags": ["Agile", "Change"], "chapterRef": "Chapter 4 - Agile vs Traditional"}, {"q": "What is the Agile project manager's primary role?", "options": ["Facilitator and servant leader who removes impediments", "Dictator who assigns all technical tasks to team members", "Functional manager who controls all team resources directly", "Customer representative who prioritizes the product backlog"], "answer": 0, "why": "The Agile PM acts as facilitator and servant leader, removing impediments for the team.", "mindset": "Support and enable rather than command and control.", "tags": ["Agile", "PM Role"], "chapterRef": "Chapter 4 - Agile PM Role"}, {"q": "In Scrum, what is the work period called?", "options": ["A sprint lasting one to four weeks", "A phase gate review checkpoint", "A control account in the WBS", "A portfolio management cycle"], "answer": 0, "why": "In Scrum, the work period is called a sprint (typically 1-4 weeks).", "mindset": "Sprint = iteration = time-boxed work period.", "tags": ["Agile", "Process"], "chapterRef": "Chapter 4 - Scrum Terms"}, {"q": "In XP (Extreme Programming), what is a sprint known as?", "options": ["An iteration of development work", "A portfolio-level deliverable", "A cost baseline component", "A risk response strategy"], "answer": 0, "why": "In XP, the sprint is called an iteration. For exam purposes they're treated the same.", "mindset": "Sprint and iteration are interchangeable for the PMP.", "tags": ["Agile", "Exam Trap"], "chapterRef": "Chapter 4 - Scrum and XP"}, {"q": "Who represents the customer on an Agile project?", "options": ["Product Owner", "Scrum Master", "Functional Manager", "PMO Director"], "answer": 0, "why": "The Product Owner is the designated person who represents the customer.", "mindset": "PO owns/prioritizes the product backlog based on value.", "tags": ["Agile", "Roles"], "chapterRef": "Chapter 4 - Product Owner"}, {"q": "Who prioritizes the product backlog?", "options": ["Only the Product Owner based on value", "The Agile project manager exclusively", "The project team by majority vote", "Senior management through formal approval"], "answer": 0, "why": "Only the Product Owner can prioritize the product backlog based on value.", "mindset": "Backlog priority is value-driven and PO-owned.", "tags": ["Agile", "Roles"], "chapterRef": "Chapter 4 - Product Backlog"}, {"q": "What is the sprint backlog?", "options": ["Work the team selects to complete in the next sprint", "All project requirements from all customers combined", "A list of all stakeholders on the project", "A formal change request log maintained by the PM"], "answer": 0, "why": "The sprint backlog contains the work the team selects to get done in the next sprint.", "mindset": "Product backlog = all work; Sprint backlog = this sprint's work.", "tags": ["Agile", "Process"], "chapterRef": "Chapter 4 - Sprint Backlog"}, {"q": "What is the purpose of the daily standup?", "options": ["A quick daily meeting to discuss status and impediments", "A two-hour lessons learned session with the whole team", "A formal contract negotiation meeting with the seller", "A change control board review of all pending requests"], "answer": 0, "why": "The daily standup is a quick (15 min) meeting where team discusses status and impediments.", "mindset": "Standups surface blockers quickly.", "tags": ["Agile", "Communication"], "chapterRef": "Chapter 4 - Daily Standup"}, {"q": "What happens at a sprint review?", "options": ["Customer inspects the increment and provides feedback", "Team discusses only internal process improvements privately", "Project manager assigns next sprint work to each member", "Change control board approves all scope modifications"], "answer": 0, "why": "The sprint review is a customer inspection at the end of the sprint for feedback.", "mindset": "Sprint review = demo to customer for feedback.", "tags": ["Agile", "Process"], "chapterRef": "Chapter 4 - Sprint Review"}, {"q": "What is a retrospective?", "options": ["A meeting to identify what went right and wrong and how to improve", "A customer acceptance inspection of completed deliverables", "A project charter approval meeting with the sponsor", "A seller selection meeting during the procurement process"], "answer": 0, "why": "A retrospective identifies what went right, what went wrong, and how to improve next sprint.", "mindset": "Retrospective = team process improvement.", "tags": ["Agile", "Continuous Improvement"], "chapterRef": "Chapter 4 - Retrospective"}, {"q": "What is an MVP (Minimum Viable Product)?", "options": ["A usable product that may not have all features yet", "A fully complete final product with every planned feature", "A predictive project baseline approved by the sponsor", "A procurement document sent to potential sellers"], "answer": 0, "why": "An MVP is usable and delivers value but may not have all features â€” it's enough to get feedback.", "mindset": "MVP delivers value early for faster feedback.", "tags": ["Agile", "Value"], "chapterRef": "Chapter 4 - MVP"}, {"q": "How does Agile invert the traditional constraint triangle?", "options": ["Time and cost are fixed while scope varies", "Scope is fixed while time and cost vary", "All three constraints are fixed permanently", "No constraints exist in Agile projects"], "answer": 0, "why": "Agile keeps time and cost fixed while allowing scope to vary based on value.", "mindset": "Fixed time/cost, variable scope = Agile triangle.", "tags": ["Agile", "Exam Trap"], "chapterRef": "Chapter 4 - Inverted Triangle"}, {"q": "What is grooming the product backlog?", "options": ["Adding, removing, and reprioritizing items based on value", "Closing the project and releasing all team resources", "Approving the cost baseline for the next fiscal year", "Testing final deliverables before customer acceptance"], "answer": 0, "why": "Grooming means adding, removing, and reprioritizing backlog items so highest value is on top.", "mindset": "Backlog is continuously managed, not static.", "tags": ["Agile", "Process"], "chapterRef": "Chapter 4 - Backlog Grooming"}, {"q": "What is the purpose of Kanban limiting work in progress (WIP)?", "options": ["Prevent overburdening the team and reveal bottlenecks", "Make all project work invisible to stakeholders", "Increase multitasking as much as possible for efficiency", "Remove all customer feedback from the development process"], "answer": 0, "why": "WIP limits prevent overburdening and help teams see issues and bottlenecks.", "mindset": "Limit WIP to improve focus, flow, and visibility.", "tags": ["Agile", "Lean"], "chapterRef": "Chapter 4 - Kanban"}, {"q": "What does sustainable development mean in Agile?", "options": ["The team maintains a constant pace without burning out", "The team works maximum hours until project completion", "The product never needs updates after initial delivery", "The budget never changes regardless of scope additions"], "answer": 0, "why": "Sustainable development means the team can maintain a constant pace indefinitely.", "mindset": "Agile values long-term sustainable pace over short-term heroics.", "tags": ["Agile", "Principles"], "chapterRef": "Chapter 4 - Agile Principles"}, {"q": "According to Agile principles, who should be trusted to do the work?", "options": ["Motivated individuals who are given support and autonomy", "Only senior managers who approve all technical decisions", "Only external consultants hired for specialized expertise", "Only the project manager who directs every team activity"], "answer": 0, "why": "Projects are built around motivated individuals who should be trusted.", "mindset": "Trust the team â€” give them environment and support.", "tags": ["Agile", "Team"], "chapterRef": "Chapter 4 - Agile Principles"}, {"q": "How do Agile projects handle change requests compared to traditional projects?", "options": ["Changes are added to the product backlog and reprioritized by the PO", "Changes require a formal request and change control board review", "Changes are automatically rejected once planning is complete", "Changes are only accepted during the first sprint of the project"], "answer": 0, "why": "Agile doesn't use a strenuous change process â€” changes go to the backlog and get prioritized.", "mindset": "Agile welcomes change through backlog management.", "tags": ["Agile", "Change"], "chapterRef": "Chapter 4 - Agile Change Management"}, {"q": "What does Agile say about delivering working software?", "options": ["Deliver frequently in weeks rather than months", "Deliver only once at the very end of the project", "Deliver only after complete documentation is finished", "Deliver only when the sponsor formally requests it"], "answer": 0, "why": "Agile principle: deliver working software frequently, in weeks rather than months.", "mindset": "Frequent delivery = faster value realization.", "tags": ["Agile", "Principles"], "chapterRef": "Chapter 4 - Agile Principles"}, {"q": "Why has Agile become popular according to the notes?", "options": ["Frequent delivery, customer interaction, and value realized throughout", "It eliminates all project risk completely", "It requires no planning or documentation at all", "It removes the need for any stakeholder engagement"], "answer": 0, "why": "Agile is popular because of frequent delivery, customer interaction, and continuous value realization.", "mindset": "Agile popularity stems from its value-delivery focus.", "tags": ["Agile", "Foundation"], "chapterRef": "Chapter 4 - Why Agile"}, {"q": "Your agile team's velocity has been stable at 30 points. The product owner wants to commit to 45 points next sprint to impress a stakeholder. What should you do?", "options": ["Explain that overcommitting beyond proven velocity creates delivery risk for the team", "Agree to 45 points since the PO has authority over backlog and sprint commitments", "Push the team to work overtime this sprint to meet the higher commitment target", "Split the sprint into two smaller sprints so more total points can be completed"], "answer": 0, "why": "Velocity is empirical. Inflating commitments beyond what's proven leads to burnout and broken trust.", "mindset": "PMI mindset: respect empirical data. Don't let pressure override proven capacity.", "tags": ["Agile", "Velocity", "Sustainable Pace"], "chapterRef": "Chapter 4 - Velocity"}, {"q": "A stakeholder insists on detailed upfront requirements before the agile project begins. The team prefers user stories. What is the BEST approach?", "options": ["Offer high-level epics and acceptance criteria to give the stakeholder confidence to begin", "Force the stakeholder to accept pure agile with absolutely no documentation upfront", "Create full detailed documentation to satisfy stakeholder then ignore it during sprints", "Tell the stakeholder they cannot be involved until the team builds the first increment"], "answer": 0, "why": "Meet stakeholders where they are. Agile doesn't mean zero documentation — it means the right amount.", "mindset": "PMI mindset: tailor the approach. Bridge the gap between stakeholder needs and agile principles.", "tags": ["Agile", "Stakeholder Engagement", "Tailoring"], "chapterRef": "Chapter 4 - Agile Documentation"}, {"q": "During a retrospective, the team says daily standups have become status reports to you. What should you do?", "options": ["Coach the team that standups are for their coordination, then step back and let them run it", "Cancel standups entirely since the team says they aren't working as intended", "Continue as-is since you're getting useful daily status information from each person", "Make standups longer so the team has more time to discuss topics in depth"], "answer": 0, "why": "Standups are team coordination events, not management reporting. Coach the anti-pattern and step back.", "mindset": "PMI mindset: servant leaders empower teams to self-organize.", "tags": ["Agile", "Scrum Ceremonies", "Servant Leadership"], "chapterRef": "Chapter 4 - Daily Standup"}, {"q": "Your hybrid project has a fixed regulatory deadline. The team completed 70% of features with 3 sprints left. The PO wants to add features. What should you do?", "options": ["Prioritize remaining backlog to ensure highest-value items are delivered by the deadline", "Add all new features since agile methodology welcomes changes at any point in time", "Extend the deadline to accommodate all requested features from the product owner", "Remove the sprint structure entirely and switch to waterfall to control scope better"], "answer": 0, "why": "Fixed deadlines require scope discipline through prioritization, not unlimited addition.", "mindset": "PMI mindset: when time is fixed, manage scope through ruthless prioritization.", "tags": ["Hybrid", "Prioritization"], "chapterRef": "Chapter 4 - Hybrid Approach"}, {"q": "A team member says self-organizing teams don't need a project manager. How should you respond?", "options": ["Explain that self-organizing teams still need someone who removes impediments and facilitates", "Agree with the team member and remove yourself from the project immediately", "Assert your PM authority and override the team's preferences on all decisions", "Report the team member to management for questioning your role on the project"], "answer": 0, "why": "Self-organizing doesn't mean leaderless. The PM role shifts to servant leadership in agile.", "mindset": "PMI mindset: the PM role evolves in agile — it doesn't disappear.", "tags": ["Agile", "Servant Leadership", "PM Role"], "chapterRef": "Chapter 4 - Self-Organizing Teams"}, {"q": "The product owner is unavailable for sprint planning. The team doesn't know what to work on. What should you do FIRST?", "options": ["Escalate the PO availability issue and help the team use existing prioritized backlog", "Have the team pick whatever work they find most interesting this sprint", "Cancel the sprint entirely until the product own
