source is valid when objectively justified. Document why and get proper approvals.", "mindset": "PMI mindset: competition preferred but sole-source acceptable when justified.", "tags": ["Sole Source", "Procurement"], "chapterRef": "Chapter 13 - Plan Procurement"}, {"q": "A T&M contract has been running 6 months with escalating costs beyond budget. What should you have done?", "options": ["Included a not-to-exceed ceiling and defined time limits to protect from unlimited cost", "T&M contracts can't be controlled so switching to fixed-price was the only option", "Nothing could have been done since T&M costs are always completely unpredictable", "The seller must be cheating and should be investigated for fraud immediately"], "answer": 0, "why": "T&M without a ceiling = unlimited buyer exposure. Always include NTE clauses.", "mindset": "PMI mindset: T&M is high-risk for buyers. Protect with ceilings and time limits.", "tags": ["T&M", "Contract Risk"], "chapterRef": "Chapter 13 - T&M"}, {"q": "Two proposals score equally on technical criteria. One is 15% cheaper. Should you automatically select it?", "options": ["Not necessarily — review all criteria including past performance, risk, and total ownership cost", "Always automatically select the cheapest proposal that meets technical requirements", "Flip a coin since they scored equally on the most important criteria", "Ask both sellers to lower their prices further before making any decision"], "answer": 0, "why": "Lowest price ≠ best value. Past performance, risk, management approach all matter.", "mindset": "PMI mindset: best value considers total picture, not just price.", "tags": ["Source Selection", "Best Value"], "chapterRef": "Chapter 13 - Conduct Procurements"}, {"q": "All contract deliverables are accepted. What must happen during procurement closure?", "options": ["Formal written notice of completion, final payments settled, documentation archived", "Just stop paying the seller — that effectively closes the contract", "Send a thank-you email and consider the contract informally complete", "Nothing — acceptance of deliverables automatically closes the contract"], "answer": 0, "why": "Procurement closure requires formal documentation, final settlement, and archiving.", "mindset": "PMI mindset: close contracts formally in writing. Always.", "tags": ["Contract Closure", "Procurement"], "chapterRef": "Chapter 13 - Close Procurements"}, {"q": "The seller claims scope change. You believe the work was in the original SOW. What should you do?", "options": ["Review the contract and SOW together to determine if disputed work is in-scope", "Pay them to maintain the relationship and avoid confrontation", "Refuse to discuss it since you're confident you're correct about the scope", "Terminate the contract immediately over the scope disagreement"], "answer": 0, "why": "Disputes require objective document review. Don't pay blindly or refuse blindly.", "mindset": "PMI mindset: refer to the contract. Use dispute resolution process.", "tags": ["Claims", "Dispute Resolution"], "chapterRef": "Chapter 13 - Claims"}, {"q": "You want innovation from sellers. What type of SOW should you use?", "options": ["Performance-based SOW describing desired outcomes rather than prescribing methods", "A highly detailed design SOW specifying exactly how to build everything", "No SOW at all — let sellers figure out what you need on their own", "A functional specification combined with step-by-step instructions"], "answer": 0, "why": "Performance-based = describe WHAT you want, not HOW. Sellers bring innovative solutions.", "mindset": "PMI mindset: outcomes-based SOW enables innovation. Method-based SOW enables compliance.", "tags": ["SOW", "Innovation"], "chapterRef": "Chapter 13 - Plan Procurement"}]},{"id":14,"title":"Chapter 14: Project Stakeholder Management","summary":"Chapter 14: Project Stakeholder Management","notes":["Chapter 14: Project Stakeholder Management","This knowledge area is about documenting how you plan to keep your stakeholders engaged and actually engaging them on the project.","Keep stakeholders engaged in the project","Make sure their needs are met","Identify stakeholders","Create the stakeholder engagement plan","Agile projects:","This knowledge area is greatly expanded","Agile is more dependent on stakeholder engagement than traditional projects","Stakeholders are involved in:","Giving requirements throughout the project","Reviewing iterations once completed","Stakeholders tend to be more involved in agile projects than traditional projects","Stakeholder register","Stakeholder engagement plan","Identify Stakeholders","Process Group: Initiating","Main Output: Stakeholder Register","Plan Stakeholder Engagement","Process Group: Planning","Main Output: Stakeholder Engagement Plan","Manage Stakeholder Engagement"],"examples":["This knowledge area is about documenting how you plan to keep your stakeholders engaged and actually engaging them on the project.","Keep stakeholders engaged in the project","Make sure their needs are met","Identify stakeholders"],"podcast":[{"speaker":"Maya","text":"Alright, let’s study Chapter 14: Project Stakeholder Management. This is one of those PMP areas where you want to understand both the terminology and the project manager mindset behind it."},{"speaker":"Jordan","text":"Exactly. The PMP rarely rewards memorizing words only. It wants you to recognize the situation, identify what process or principle is being tested, and choose the next best action."},{"speaker":"Maya","text":"One key point is this: Chapter 14: Project Stakeholder Management"},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. This knowledge area is about documenting how you plan to keep your stakeholders engaged and actually engaging them on the project."},{"speaker":"Maya","text":"One key point is this: Keep stakeholders engaged in the project"},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. Make sure their needs are met"},{"speaker":"Maya","text":"One key point is this: Identify stakeholders"},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. Create the stakeholder engagement plan"},{"speaker":"Maya","text":"One key point is this: Agile projects:"},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. This knowledge area is greatly expanded"},{"speaker":"Maya","text":"One key point is this: Agile is more dependent on stakeholder engagement than traditional projects"},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. Stakeholders are involved in:"},{"speaker":"Maya","text":"One key point is this: Giving requirements throughout the project"},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. Reviewing iterations once completed"},{"speaker":"Maya","text":"One key point is this: Stakeholders tend to be more involved in agile projects than traditional projects"},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. Stakeholder register"},{"speaker":"Maya","text":"One key point is this: Stakeholder engagement plan"},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. Identify Stakeholders"},{"speaker":"Maya","text":"One key point is this: Process Group: Initiating"},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. Main Output: Stakeholder Register"},{"speaker":"Maya","text":"So the big takeaway is not just knowing the definition. You want to ask: what is happening in the scenario, who is impacted, what process should be used, and what should the project manager do next?"},{"speaker":"Jordan","text":"Right. Slow down, do not jump straight to escalation, and use the correct PMP process. That is how this chapter turns into points on the exam."}],"questions":[{"q": "What is the main goal of stakeholder management?", "options": ["Keep stakeholders engaged and ensure their needs are met throughout", "Only calculate cost performance index for budget tracking", "Only select the best contract type for procurement", "Only inspect deliverables for quality defects"], "answer": 0, "why": "Stakeholder management = engagement + meeting needs throughout the project.", "mindset": "Active engagement, not just identification.", "tags": ["Stakeholder", "Concept"], "chapterRef": "Chapter 14 - Stakeholder Management"}, {"q": "Who is a stakeholder?", "options": ["Anyone with a positive or negative interest in the project outcome", "Only the sponsor who funds the project budget", "Only the project manager who leads the team", "Only the customer who accepts deliverables"], "answer": 0, "why": "Stakeholders include anyone affected by or interested in the project — positive or negative.", "mindset": "Include supporters AND opponents in your register.", "tags": ["Stakeholder", "Concept"], "chapterRef": "Chapter 14 - Stakeholder Definition"}, {"q": "When is Identify Stakeholders first performed?", "options": ["Right after the project charter is signed during initiation", "Only during the closing phase of the project", "Only after all deliverables are completed", "Only when the sponsor specifically requests it"], "answer": 0, "why": "Identify Stakeholders happens right after charter approval — it's an initiating process.", "mindset": "Identify early, then continuously.", "tags": ["Stakeholder", "Process"], "chapterRef": "Chapter 14 - Identify Stakeholders"}, {"q": "Does stakeholder identification continue throughout the project?", "options": ["Yes — new stakeholders can emerge at any point during the lifecycle", "No — all stakeholders must be identified only during initiation", "Only on agile projects does identification continue", "Only during procurement do new stakeholders appear"], "answer": 0, "why": "Stakeholder identification is iterative — new stakeholders can appear at any time.", "mindset": "Continuously update the stakeholder register.", "tags": ["Stakeholder", "Process"], "chapterRef": "Chapter 14 - Continuous Identification"}, {"q": "What is the main output of Identify Stakeholders?", "options": ["The stakeholder register with contact info, role, and influence", "The cost baseline with contingency reserve amounts", "The schedule baseline with critical path identified", "The scope baseline with WBS and dictionary"], "answer": 0, "why": "Identify Stakeholders creates the stakeholder register.", "mindset": "The register is the key stakeholder document.", "tags": ["Stakeholder", "ITTO"], "chapterRef": "Chapter 14 - Stakeholder Register"}, {"q": "Why is stakeholder management expanded on agile projects?", "options": ["Agile depends heavily on stakeholder feedback during iterations", "Agile removes all stakeholders from the project", "Agile uses no requirements from any stakeholders", "Agile avoids all customer interaction and reviews"], "answer": 0, "why": "Agile stakeholders give requirements throughout and review iterations — more involvement.", "mindset": "Agile = more frequent stakeholder engagement.", "tags": ["Agile", "Stakeholder"], "chapterRef": "Chapter 14 - Agile Stakeholders"}, {"q": "What does a power/interest grid group stakeholders by?", "options": ["Their level of authority (power) and level of concern (interest)", "Their cost estimate accuracy and schedule performance", "Their contract type and payment terms only", "Their risk probability and impact scores only"], "answer": 0, "why": "Power/interest grids categorize stakeholders by authority level and concern level.", "mindset": "High power + high interest = manage closely.", "tags": ["Stakeholder", "Tools"], "chapterRef": "Chapter 14 - Power/Interest Grid"}, {"q": "What does the salience model use to classify stakeholders?", "options": ["Power, urgency, and legitimacy as three dimensions", "Cost, scope, and quality as triple constraints", "Risk, schedule, and budget as performance metrics", "Probability, impact, and detectability as risk factors"], "answer": 0, "why": "Salience model = power + urgency + legitimacy.", "mindset": "Salience helps with complex stakeholder classification.", "tags": ["Stakeholder", "Tools"], "chapterRef": "Chapter 14 - Salience Model"}, {"q": "What does Plan Stakeholder Engagement create?", "options": ["The stakeholder engagement plan documenting how to keep stakeholders engaged", "The project charter authorizing the project to begin", "The cost baseline determining the project budget", "The risk register listing all identified threats"], "answer": 0, "why": "Plan Stakeholder Engagement creates the engagement plan — how to engage each stakeholder.", "mindset": "Plan engagement based on each stakeholder's needs and influence.", "tags": ["Stakeholder", "Process"], "chapterRef": "Chapter 14 - Plan Engagement"}, {"q": "What does the stakeholder engagement assessment matrix show?", "options": ["Current engagement level vs desired engagement level for each stakeholder", "Only the project's earned value management metrics", "Only the critical path activities and their float values", "Only the communication channels formula calculation"], "answer": 0, "why": "The matrix maps C (current) and D (desired) engagement for each stakeholder.", "mindset": "Identify gaps between where stakeholders ARE and where you NEED them.", "tags": ["Stakeholder", "Tools"], "chapterRef": "Chapter 14 - Engagement Matrix"}, {"q": "What does 'Unaware' mean in the engagement matrix?", "options": ["The stakeholder doesn't know they're a stakeholder or the project exists", "The stakeholder is actively opposing the project objectives", "The stakeholder is fully supportive and engaged with the project", "The stakeholder is leading and driving project success"], "answer": 0, "why": "Unaware = doesn't know about the project. Need to move them to at least Neutral.", "mindset": "Start by making unaware stakeholders aware.", "tags": ["Stakeholder", "Engagement Levels"], "chapterRef": "Chapter 14 - Engagement Levels"}, {"q": "What does 'Resistant' mean in the engagement matrix?", "options": ["The stakeholder opposes the project objectives and may work against it", "The stakeholder is fully supportive of all project decisions", "The stakeholder is actively leading and championing the project", "The stakeholder is unaware that the project even exists"], "answer": 0, "why": "Resistant = opposes objectives. May be negatively impacted by the project.", "mindset": "Resistant stakeholders need special engagement strategies.", "tags": ["Stakeholder", "Engagement Levels"], "chapterRef": "Chapter 14 - Engagement Levels"}, {"q": "What does 'Leading' mean in the engagement matrix?", "options": ["The stakeholder is aware and actively engaged in driving project success", "The stakeholder is completely unaware the project exists", "The stakeholder is resistant to all project objectives", "The stakeholder is neutral and neither supports nor opposes"], "answer": 0, "why": "Leading = highest engagement. Actively driving and championing the project.", "mindset": "Leading stakeholders are your strongest allies.", "tags": ["Stakeholder", "Engagement Levels"], "chapterRef": "Chapter 14 - Engagement Levels"}, {"q": "What is 'upward' direction of influence?", "options": ["Influence toward senior management above the project", "Influence toward team members below the project manager", "Influence toward external parties like vendors or government", "Influence toward peer project managers at the same level"], "answer": 0, "why": "Upward = senior management. Direction matters for engagement strategy.", "mindset": "Know direction of influence for strategy planning.", "tags": ["Stakeholder", "Concept"], "chapterRef": "Chapter 14 - Directions of Influence"}, {"q": "What is 'outward' direction of influence?", "options": ["Influence toward external parties like vendors, government, or end-users", "Influence toward senior management above the project", "Influence toward team members working on the project", "Influence toward the project sponsor who funds the work"], "answer": 0, "why": "Outward = external parties (vendors, government, public, end-users).", "mindset": "Outward stakeholders are outside the project hierarchy.", "tags": ["Stakeholder", "Concept"], "chapterRef": "Chapter 14 - Directions of Influence"}, {"q": "What should the stakeholder register contain?", "options": ["Contact info, role, communication requirements, expectations, and power/influence level", "Only the project schedule and cost baseline numbers", "Only the approved change request log entries", "Only the procurement contract terms and conditions"], "answer": 0, "why": "Register contains: contact, role, requirements, expectations, impact, power/influence.", "mindset": "The register is comprehensive and should be kept secure.", "tags": ["Stakeholder", "ITTO"], "chapterRef": "Chapter 14 - Register Contents"}, {"q": "What are the four stakeholder management processes?", "options": ["Identify Stakeholders, Plan Engagement, Manage Engagement, Monitor Engagement", "Identify, Rank, Transfer, and Accept Stakeholders", "Plan, Execute, Monitor, and Close Stakeholder Work", "Initiate, Plan, Execute, and Close Stakeholder Management"], "answer": 0, "why": "Four processes: Identify, Plan Engagement, Manage Engagement, Monitor Engagement.", "mindset": "Identify → Plan → Manage → Monitor.", "tags": ["Stakeholder", "Process"], "chapterRef": "Chapter 14 - Stakeholder Processes"}, {"q": "What does Manage Stakeholder Engagement do?", "options": ["Communicates and works with stakeholders to meet their needs and expectations", "Only identifies who the stakeholders are at project start", "Only creates the engagement plan during the planning phase", "Only monitors whether engagement strategies are working"], "answer": 0, "why": "Manage Engagement = actively communicate, collaborate, and address stakeholder needs.", "mindset": "This is where engagement actually HAPPENS (executing).", "tags": ["Stakeholder", "Process"], "chapterRef": "Chapter 14 - Manage Engagement"}, {"q": "What does Monitor Stakeholder Engagement do?", "options": ["Monitors relationships and adjusts strategies when stakeholder engagement shifts", "Only identifies new stakeholders at the beginning of each phase", "Only creates the initial stakeholder register during initiation", "Only closes stakeholder relationships at the end of the project"], "answer": 0, "why": "Monitor = watch for shifts in engagement and adapt strategies accordingly.", "mindset": "Engagement is dynamic. Monitor and adjust continuously.", "tags": ["Stakeholder", "Process"], "chapterRef": "Chapter 14 - Monitor Engagement"}, {"q": "Why might identifying a new stakeholder later in the project create change requests?", "options": ["The new stakeholder may have requirements that affect the product, plan, or documents", "Identifying stakeholders never creates any change requests at all", "Only closing processes can generate change requests on a project", "Change requests only come from the change control board directly"], "answer": 0, "why": "Late-identified stakeholders may have legitimate needs that require scope, plan, or document changes.", "mindset": "New stakeholders can affect baselined work.", "tags": ["Stakeholder", "Change Control"], "chapterRef": "Chapter 14 - Late Identification"}, {"q": "A powerful stakeholder is actively opposing your project. They influence key decision-makers. What should you do FIRST?", "options": ["Meet with them to understand their concerns and whether they can be addressed", "Escalate to your sponsor to have the opposing stakeholder overruled", "Ignore them and work around their influence on the project", "Remove them from the stakeholder register so they're no longer tracked"], "answer": 0, "why": "Understanding opposition is the first step. They may have legitimate concerns worth addressing.", "mindset": "PMI mindset: engage resistors, don't bypass them. Find their reasons.", "tags": ["Stakeholder Engagement", "Opposition"], "chapterRef": "Chapter 14 - Manage Engagement"}, {"q": "A key stakeholder is at 'Resistant' but you need them at 'Supportive.' What approach should you take?", "options": ["Identify their interests, address concerns, involve them in decisions, and move them gradually", "Force compliance since the project was already formally approved by the sponsor", "Skip resistant stakeholders and focus all effort on those already supportive", "Report their resistance to leadership and request they be disciplined"], "answer": 0, "why": "Moving engagement levels requires understanding interests and tailoring your approach gradually.", "mindset": "PMI mindset: you can't force engagement. Build trust and demonstrate value.", "tags": ["Engagement Assessment", "Strategy"], "chapterRef": "Chapter 14 - Engagement Matrix"}, {"q": "A previously supportive stakeholder becomes negative after a project delay. What should you do?", "options": ["Meet with them immediately to acknowledge the delay and explain corrective actions", "Avoid them until you have positive news to share about project recovery", "Send a detailed technical explanation of exactly why the delay occurred", "Ask their manager to speak with them about maintaining a positive attitude"], "answer": 0, "why": "When trust erodes, direct engagement is needed. Acknowledge, explain actions, rebuild trust.", "mindset": "PMI mindset: when trust drops, act immediately. Avoidance makes it worse.", "tags": ["Stakeholder Trust", "Communication"], "chapterRef": "Chapter 14 - Monitor Engagement"}, {"q": "You have 75 stakeholders. Individual plans for all seems impractical. What should you do?", "options": ["Categorize by power/interest and create targeted strategies per group — top stakeholders get individual plans", "Create individual detailed plans for all 75 regardless of the effort required", "Only manage the top 5 most powerful stakeholders and ignore all others", "Reduce the register to a manageable number by removing less important people"], "answer": 0, "why": "Categorize and tailor effort. High-power stakeholders get individual attention; others by group.", "mindset": "PMI mindset: all matter, but not equally. Prioritize engagement effort.", "tags": ["Stakeholder Classification", "Power/Interest"], "chapterRef": "Chapter 14 - Identify Stakeholders"}, {"q": "A new stakeholder with legitimate authority appears late and demands changes to your nearly-complete project. What should you do?", "options": ["Add them to the register and assess their requirements through the change control process", "Refuse all changes since the project is nearly complete and baselined", "Implement all their changes immediately without any impact analysis", "Tell them they should have been involved earlier and it's too late now"], "answer": 0, "why": "Late doesn't mean invalid. Engage properly, assess through change control.", "mindset": "PMI mindset: stakeholder identification is iterative. Use proper process.", "tags": ["Late Stakeholders", "Change Control"], "chapterRef": "Chapter 14 - Identify Stakeholders"}, {"q": "Two influential stakeholders want opposite things. One wants speed, the other thoroughness. Both have authority. How do you proceed?", "options": ["Facilitate discussion to find balance, escalating to sponsor only if they can't align", "Side with whichever stakeholder has slightly more organizational power", "Try to satisfy both completely without revealing the conflict to either", "Pick whichever direction is easiest for your team to implement"], "answer": 0, "why": "Surface conflicts and facilitate alignment. Don't hide tradeoffs or make unilateral choices.", "mindset": "PMI mindset: make tradeoffs visible. Facilitate, don't hide or dictate.", "tags": ["Stakeholder Conflict", "Facilitation"], "chapterRef": "Chapter 14 - Manage Engagement"}, {"q": "You're new to a project and need to identify stakeholders quickly. What is the MOST comprehensive first step?", "options": ["Review project documents and interview the sponsor and key team members", "Ask the previous PM for their stakeholder list and use only that", "Send a mass email asking people to self-identify as stakeholders", "Wait until stakeholders contact you with their own concerns"], "answer": 0, "why": "Multiple sources give the most complete picture. Documents + interviews cover formal and informal stakeholders.", "mindset": "PMI mindset: cast a wide net. No single source is complete.", "tags": ["Stakeholder Identification", "Techniques"], "chapterRef": "Chapter 14 - Identify Stakeholders"}, {"q": "A high-power, low-interest stakeholder suddenly becomes highly interested after a risk materializes. What should you do?", "options": ["Update your assessment and increase proactive communication to manage their involvement", "Do nothing since stakeholders change interest levels all the time naturally", "Reduce communication since they'll likely lose interest again soon", "Treat this as a threat that needs immediate escalation to the sponsor"], "answer": 0, "why": "Shifting engagement requires updated strategies. Newly active powerful stakeholders need attention.", "mindset": "PMI mindset: engagement is dynamic. Monitor shifts and adapt strategy.", "tags": ["Stakeholder Monitoring", "Dynamic Engagement"], "chapterRef": "Chapter 14 - Monitor Engagement"}, {"q": "Your sponsor rarely attends meetings or responds to escalations. You need decisions. What should you do?", "options": ["Adapt your approach — schedule brief 1:1s, send concise decision requests with deadlines", "Go around the sponsor and start making all decisions yourself", "Complain to the sponsor's manager about their lack of engagement", "Stop escalating entirely since the sponsor clearly doesn't respond"], "answer": 0, "why": "Disengaged sponsors require adapted strategies. Find what works for them, don't give up or bypass.", "mindset": "PMI mindset: if your approach isn't working, change it. Don't blame or abandon.", "tags": ["Sponsor Management", "Engagement"], "chapterRef": "Chapter 14 - Manage Engagement"}, {"q": "A stakeholder makes negative hallway comments about the project. Nothing formal has been communicated. What should you do?", "options": ["Proactively reach out to understand their concerns before negativity spreads further", "Ignore hallway gossip since it's not official formal feedback", "Confront the stakeholder publicly about their negative comments", "Report them to management for being unsupportive of the project"], "answer": 0, "why": "Informal negativity spreads and undermines support. Engage proactively before it escalates.", "mindset": "PMI mindset: informal signals are early warnings. Engage before it becomes formal opposition.", "tags": ["Stakeholder Engagement", "Proactive Communication"], "chapterRef": "Chapter 14 - Monitor Engagement"}]},{"id":15,"title":"Chapter 15: PMP Mindset / People & Process","summary":"Domain 1: People (14 Tasks)","notes":["Domain 1: People (14 Tasks)","Task 1: Manage Conflict","One of the most fundamental responsibilities of a project manager is managing conflicts between stakeholders on a project.","Conflicts can occur:","Between team members","Between sponsors and team members","Between suppliers and the project manager","Between any combination of stakeholders","For any conflict:","Understand the source and stage of the conflict","Why did the conflict happen?","What was the main underlying reason?","How did it escalate to this?","Analyze the context of the conflict","Evaluate/recommend/reconcile the appropriate conflict resolution solution","Example of conflict between two team members:","Interpret the main cause (source) of the conflict","Speak to the team members","Evaluate exactly what the difference of opinion is between them","Look for solutions that lead to a win for both sides","When following the servant leadership role in managing conflicts:","Let the team select the appropriate solution while supporting their solution"],"examples":["Task 1: Manage Conflict","One of the most fundamental responsibilities of a project manager is managing conflicts between stakeholders on a project.","Conflicts can occur:","Between team members"],"podcast":[{"speaker":"Maya","text":"Alright, let’s study Chapter 15: PMP Mindset / People & Process. This is one of those PMP areas where you want to understand both the terminology and the project manager mindset behind it."},{"speaker":"Jordan","text":"Exactly. The PMP rarely rewards memorizing words only. It wants you to recognize the situation, identify what process or principle is being tested, and choose the next best action."},{"speaker":"Maya","text":"One key point is this: Domain 1: People (14 Tasks)"},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. Task 1: Manage Conflict"},{"speaker":"Maya","text":"One key point is this: One of the most fundamental responsibilities of a project manager is managing conflicts between stakeholders on a project."},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. Conflicts can occur:"},{"speaker":"Maya","text":"One key point is this: Between team members"},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. Between sponsors and team members"},{"speaker":"Maya","text":"One key point is this: Between suppliers and the project manager"},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. Between any combination of stakeholders"},{"speaker":"Maya","text":"One key point is this: For any conflict:"},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. Understand the source and stage of the conflict"},{"speaker":"Maya","text":"One key point is this: Why did the conflict happen?"},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. What was the main underlying reason?"},{"speaker":"Maya","text":"One key point is this: How did it escalate to this?"},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. Analyze the context of the conflict"},{"speaker":"Maya","text":"One key point is this: Evaluate/recommend/reconcile the appropriate conflict resolution solution"},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. Example of conflict between two team members:"},{"speaker":"Maya","text":"One key point is this: Interpret the main cause (source) of the conflict"},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. Speak to the team members"},{"speaker":"Maya","text":"So the big takeaway is not just knowing the definition. You want to ask: what is happening in the scenario, who is impacted, what process should be used, and what should the project manager do next?"},{"speaker":"Jordan","text":"Right. Slow down, do not jump straight to escalation, and use the correct PMP process. That is how this chapter turns into points on the exam."}],"questions":[{"q": "What should a PM do FIRST when conflict occurs?", "options": ["Understand the source, stage, and context of the conflict before acting", "Immediately remove one of the conflicting parties from the project", "Ignore the conflict entirely and hope it resolves on its own", "Dictate the final resolution without hearing from either side"], "answer": 0, "why": "Diagnosis before treatment. Understand why and how before choosing a response.", "mindset": "Conflict requires understanding before action.", "tags": ["Conflict", "Mindset"], "chapterRef": "Chapter 15 - Manage Conflict"}, {"q": "What is the servant-leader approach to team conflict?", "options": ["Let the team select an appropriate solution while supporting their decision", "Dictate every action the team must take to resolve it", "Avoid the conflict and let them figure it out alone", "Escalate immediately to senior management for resolution"], "answer": 0, "why": "Servant leaders support the team's solution rather than imposing their own.", "mindset": "Facilitate and support, don't command.", "tags": ["Servant Leadership", "Conflict"], "chapterRef": "Chapter 15 - Servant Leadership"}, {"q": "What does leading a team include?", "options": ["Setting vision/mission, providing direction, and building commitment", "Only tracking project costs and earned value metrics", "Only writing procurement contracts for external sellers", "Only creating the WBS and scheduling activities"], "answer": 0, "why": "Leadership = vision + direction + commitment. It's about purpose, not just task management.", "mindset": "Leadership inspires; management controls.", "tags": ["Leadership", "Mindset"], "chapterRef": "Chapter 15 - Lead a Team"}, {"q": "What should a servant leader remove for the team?", "options": ["Obstacles and impediments causing delays or conflicts", "All stakeholder feedback and change requests", "All team decision-making authority and autonomy", "All communication between team members"], "answer": 0, "why": "Servant leaders clear the path — remove blockers so the team can deliver.", "mindset": "Remove obstacles, don't add them.", "tags": ["Servant Leadership", "Mindset"], "chapterRef": "Chapter 15 - Remove Impediments"}, {"q": "What should the PM avoid when leading the team?", "options": ["Micromanaging or acting like a controlling dictator", "Empowering team members to make their own decisions", "Being approachable and available for team questions", "Coaching team members toward better performance"], "answer": 0, "why": "PMI mindset: don't micromanage. Empower, coach, and facilitate instead.", "mindset": "Command-and-control = wrong approach for PMI.", "tags": ["Leadership", "Mindset"], "chapterRef": "Chapter 15 - PM Approach"}, {"q": "What does empowering team members include?", "options": ["Allowing appropriate levels of decision-making authority and supporting decisions", "Removing all accountability from team members entirely", "Making every single decision for them without their input", "Avoiding all stakeholder input on team decisions"], "answer": 0, "why": "Empowerment = giving authority to decide + supporting those decisions.", "mindset": "Empowerment increases ownership and practical solutions.", "tags": ["Empowerment", "Mindset"], "chapterRef": "Chapter 15 - Empower Team"}, {"q": "Why is adequate training important?", "options": ["It boosts morale, reduces conflict, and helps work finish on time", "It replaces the need for all project requirements", "It removes the need for any quality management processes", "It only matters at the very end of the project"], "answer": 0, "why": "Training improves capability, confidence, morale, and reduces knowledge-gap conflicts.", "mindset": "Invest in people to prevent problems.", "tags": ["Training", "Team"], "chapterRef": "Chapter 15 - Training"}, {"q": "What should happen after training is completed?", "options": ["Measure outcomes and assess whether people can now use the tools and processes", "Assume it worked without any verification or follow-up", "Close the project immediately since training is done", "Remove all coaching since training replaces ongoing support"], "answer": 0, "why": "Verify training effectiveness — can they actually apply what they learned?", "mindset": "Training without measurement = unknown value.", "tags": ["Training", "Mindset"], "chapterRef": "Chapter 15 - Training Assessment"}, {"q": "What does emotional intelligence help a PM do?", "options": ["Understand feelings, assess behavior, de-escalate tensions, and adjust responses", "Only calculate earned value management formulas accurately", "Only select the best procurement contract type for sellers", "Only create the critical path network diagram"], "answer": 0, "why": "EI helps PMs read people, adapt, de-escalate, and respond productively to situations.", "mindset": "EI is a major people-domain skill for the PMP.", "tags": ["Emotional Intelligence", "Mindset"], "chapterRef": "Chapter 15 - EI"}, {"q": "What is the PMI-preferred conflict resolution technique?", "options": ["Collaborate/problem-solve to find a win-win solution for all parties", "Force/direct by imposing your authority to end it quickly", "Avoid/withdraw by ignoring it and hoping it goes away", "Accommodate/smooth by giving in to keep peace temporarily"], "answer": 0, "why": "Collaborate = win-win. PMI's preferred approach for most conflict situations.", "mindset": "Always try to collaborate first. Other approaches are situational.", "tags": ["Conflict Resolution", "Mindset"], "chapterRef": "Chapter 15 - Conflict Resolution"}, {"q": "On agile projects, what should be avoided regarding team composition during iterations?", "options": ["Changing team members — keep the same team through each iteration", "Maintaining the same team throughout the entire sprint", "Allowing team collaboration on shared items", "Using daily standups for coordination"], "answer": 0, "why": "Stable teams deliver more predictably. Don't disrupt during iterations.", "mindset": "Team stability = delivery predictability.", "tags": ["Agile", "Team"], "chapterRef": "Chapter 15 - Agile Teams"}, {"q": "What are impediments likely to cause on a project?", "options": ["Delays in schedule and reduced quality of deliverables", "Automatic project success with no effort needed", "Lower need for project manager support or involvement", "No impact on any stakeholder at any level"], "answer": 0, "why": "Impediments → delays + reduced quality. Removing them is a core PM responsibility.", "mindset": "Impediments = blockers that hurt delivery.", "tags": ["Impediments", "Concept"], "chapterRef": "Chapter 15 - Impediments"}, {"q": "What skills help remove impediments?", "options": ["Negotiation tactics and emotional intelligence applied skillfully", "Only mathematical formulas for earned value analysis", "Only procurement contract selection methodologies", "Only network diagram calculations for critical path"], "answer": 0, "why": "People skills (negotiation, EI) are how PMs resolve blockers involving other humans.", "mindset": "Impediment removal often requires people skills, not just technical ones.", "tags": ["Skills", "Mindset"], "chapterRef": "Chapter 15 - Remove Impediments"}, {"q": "What does collaboration help stakeholders feel?", "options": ["Included and that their opinions matter to the project", "Excluded from all project decisions and communication", "Unaware of project objectives and direction", "Removed from all feedback and engagement loops"], "answer": 0, "why": "Collaboration builds inclusion, trust, and buy-in from stakeholders.", "mindset": "Included stakeholders support; excluded ones resist.", "tags": ["Collaboration", "Stakeholder"], "chapterRef": "Chapter 15 - Collaboration"}, {"q": "How can shared understanding be built with stakeholders?", "options": ["Survey parties, seek consensus, and ensure everyone understands the plan", "Avoid investigating any misunderstandings that arise", "Let conflicts escalate without any PM intervention", "Use only one-way push reports with no feedback loop"], "answer": 0, "why": "Survey, seek consensus, clarify. Fix misunderstandings early before they escalate.", "mindset": "Shared understanding prevents future conflicts.", "tags": ["Communication", "Mindset"], "chapterRef": "Chapter 15 - Shared Understanding"}, {"q": "What should a PM do if virtual collaboration tools aren't working effectively?", "options": ["Change tools, train the team on usage, or simulate face-to-face environment", "Cancel all virtual work entirely and only use in-person meetings", "Ignore the tool problem and accept poor collaboration", "Avoid all communication until better tools are purchased"], "answer": 0, "why": "Virtual teams need active support. Change tools, train, or adjust the environment.", "mindset": "Adapt the approach when it isn't working.", "tags": ["Virtual Teams", "Mindset"], "chapterRef": "Chapter 15 - Virtual Collaboration"}, {"q": "What should the PM analyze during negotiations?", "options": ["Bounds, priorities, and objectives to get the best outcome for the project", "Only defect frequency data from quality inspections", "Only the stakeholder cube dimensions and measurements", "Only the burnup chart progress indicators"], "answer": 0, "why": "Understand what you need, what you can give, and what matters most before negotiating.", "mindset": "Preparation is key to successful negotiation.", "tags": ["Negotiation", "Mindset"], "chapterRef": "Chapter 15 - Negotiations"}, {"q": "What does PMI say about diversity and inclusion?", "options": ["PMs should always support diversity and inclusion on their teams", "Diversity only matters in certain industries and situations", "Inclusion is optional and depends on organizational culture", "Only the HR department is responsible for diversity"], "answer": 0, "why": "PMI says PMs always support diversity and inclusion — it improves team performance.", "mindset": "Inclusive environments produce better results.", "tags": ["Diversity", "Mindset"], "chapterRef": "Chapter 15 - Diversity"}, {"q": "What should a PM do when team members work slowly because they need help?", "options": ["Coach them and provide corrective training to improve their performance", "Punish them immediately for being too slow on their tasks", "Ignore the performance issue and hope it improves naturally", "Reduce quality requirements so their speed appears acceptable"], "answer": 0, "why": "Support growth through coaching and training before jumping to punishment.", "mindset": "Help before punishing. Development before discipline.", "tags": ["Coaching", "Team"], "chapterRef": "Chapter 15 - Performance Support"}, {"q": "What should the PM consider when building a team?", "options": ["Evaluate skills and whether they fit the project's specific needs", "Put any available person on any team regardless of capability", "Avoid any skill assessment since it might offend people", "Only choose personal friends for team assignments"], "answer": 0, "why": "Right people for right roles. Skills must match project needs.", "mindset": "Team fit directly affects project success.", "tags": ["Team Building", "Resource"], "chapterRef": "Chapter 15 - Build a Team"}, {"q": "A team member asks you what to do about a problem. You know the answer immediately. As a servant leader, what should you do?", "options": ["Ask what they think the options are and guide them through questions to build capability", "Tell them the answer immediately since you already know the correct solution", "Tell them to figure it out completely on their own without any guidance", "Schedule a meeting next week to discuss it when you have more time"], "answer": 0, "why": "Servant leaders develop people. Guiding through questions builds capability over dependency.", "mindset": "PMI mindset: develop others by coaching, not giving answers.", "tags": ["Servant Leadership", "Coaching"], "chapterRef": "Chapter 15 - Servant Leadership"}, {"q": "A decision has unclear right answer with pros and cons on both sides. There's pressure to decide quickly. What should you do?", "options": ["Take enough time to analyze tradeoffs and consult stakeholders before committing", "Flip a coin and commit to whatever random outcome appears", "Defer the decision indefinitely until perfect information becomes available", "Make whatever decision your manager would prefer regardless of analysis"], "answer": 0, "why": "Don't rush recklessly or stall indefinitely. Analyze proportionally, then commit.", "mindset": "PMI mindset: bias for action ≠ recklessness. Deliberate ≠ paralysis.", "tags": ["Decision Making", "PMI Mindset"], "chapterRef": "Chapter 15 - Decision Making"}, {"q": "A deliverable meets all documented requirements but you personally think it could be better. What should you do?", "options": ["Accept it — quality means conformance to requirements, not personal standards", "Reject it until it meets your higher personal standard of excellence", "Gold-plate it with improvements before delivering to the customer", "Report the quality team for having standards that are too low"], "answer": 0, "why": "Quality = conformance to requirements, not subjective excellence. If specs are wrong, fix specs.", "mindset": "PMI mindset: quality is objective (requirements), not subjective (personal opinion).", "tags": ["Quality Mindset", "Gold-Plating"], "chapterRef": "Chapter 15 - PMI Quality Mindset"}, {"q": "A conflict arises between two team members. Options are: escalate, facilitate, ignore, document. Which is MOST likely correct?", "options": ["Facilitate — address conflicts directly and collaboratively at the lowest level first", "Escalate to management immediately without attempting any resolution", "Document the conflict in the issue log but take no other action", "Ignore it completely and let the team members work it out alone"], "answer": 0, "why": "PMI default: facilitate resolution at the lowest level. Escalation is a last resort.", "mindset": "PMI mindset: FIRST = understand + facilitate. Not escalate or ignore.", "tags": ["Conflict Resolution", "Exam Strategy"], "chapterRef": "Chapter 15 - Conflict Mindset"}, {"q": "Project is behind schedule. Options: crash, fast-track, cut scope, analyze cause. Which does PMI prefer FIRST?", "options": ["Analyze the root cause before selecting any corrective action", "Crash immediately by adding resources to all activities", "Fast-track everything by running all activities in parallel", "Cut scope to meet the deadline without further investigation"], "answer": 0, "why": "PMI pattern: analyze → understand → then choose the right response. Never skip analysis.", "mindset": "PMI mindset: understand BEFORE acting. Always.", "tags": ["Root Cause Analysis", "Exam Strategy"], "chapterRef": "Chapter 15 - Analyze Before Acting"}, {"q": "One team member works 70-hour weeks. They seem happy. Is this a PM concern?", "options": ["Yes — single points of failure and unsustainable pace create project risk", "No — if they're happy and productive there's no problem at all", "Only if they explicitly complain about their working hours to you", "This is great performance that should be encouraged in other team members"], "answer": 0, "why": "Single-point dependency + unsustainable pace = risk. Even willing heroes create problems.", "mindset": "PMI mindset: sustainable pace and knowledge distribution protect the project.", "tags": ["Sustainable Pace", "Risk"], "chapterRef": "Chapter 15 - People Mindset"}, {"q": "A question has a 'nice' answer (help personally) vs a 'correct' answer (follow process). Which should you choose?", "options": ["Follow process — the exam tests professional discipline while showing respect", "Always choose the kindest-sounding answer regardless of project impact", "Always choose the strictest process answer regardless of human impact", "Choose whatever feels right based on your personal gut instinct"], "answer": 0, "why": "PMP balances people and process. When they conflict, process usually wins — but with empathy.", "mindset": "PMI mindset: care about people AND follow process. Process protects the project.", "tags": ["Exam Strategy", "People vs Process"], "chapterRef": "Chapter 15 - Exam Mindset"}, {"q": "You could either escalate to the sponsor or resolve an issue yourself. It's within your authority. What does PMI prefer?", "options": ["Resolve it at your level first — use your authority before escalating upward", "Always escalate everything to be safe and avoid any personal accountability", "Let the team decide completely without any PM involvement whatsoever", "Wait passively to see if the problem resolves itself over time"], "answer": 0, "why": "PMI wants PMs to use their authority. Unnecessary escalation signals inability to manage.", "mindset": "PMI mindset: own what's yours. Escalate only what exceeds your authority.", "tags": ["PM Authority", "Escalation"], "chapterRef": "Chapter 15 - PM Authority"}, {"q": "After discovering a variance, what's the PMI-preferred sequence? Options: update plan, inform stakeholders, investigate cause, implement action.", "options": ["Investigate cause → determine action → update plan → communicate to stakeholders", "Update the plan immediately before understanding what happened", "Inform all stakeholders before doing any investigation at all", "Implement corrective action right away without any analysis"], "answer": 0, "why": "PMI sequence: investigate → analyze → respond → document → communicate. Analysis always first.", "mindset": "PMI mindset: investigate → analyze → respond → document → communicate.", "tags": ["Variance Response", "Process Sequence"], "chapterRef": "Chapter 15 - Response Sequence"}, {"q": "What is the single MOST important mindset principle for PMP exam success?", "options": ["Think like PMI — analyze first, follow process, communicate transparently, resolve at your level", "Memorize every formula and all 49 process ITTOs perfectly", "Always choose the longest and most detailed answer option", "Pick whatever answer sounds most like what your real-world manager would do"], "answer"     {front:"CV (Cost Variance)",back:"CV = EV - AC\nPositive = under budget\nNegative = over budget"},

    {front:"EAC (Estimate at Completion)\nCurrent trend continues",back:"EAC = BAC / CPI\nUsed when current variances are typical"},
    {front:"EAC (Atypical variance)",back:"EAC = AC + (BAC - EV)\nUsed when current variances are one-time"},
    {front:"EAC (Both cost and schedule)",back:"EAC = AC + [(BAC - EV) / (CPI x SPI)]\nUsed when both schedule and cost matter"},
    {front:"ETC (Estimate to Complete)",back:"ETC = EAC - AC\nHow much more will we spend?"},
    {front:"VAC (Variance at Completion)",back:"VAC = BAC - EAC\nPositive = under budget at end\nNegative = over budget at end"},
    {front:"TCPI (To Complete Performance Index)\nBased on BAC",back:"TCPI = (BAC - EV) / (BAC - AC)\nAbove 1 = harder road ahead\nBelow 1 = easier road ahead"},
    {front:"TCPI (Based on EAC)",back:"TCPI = (BAC - EV) / (EAC - AC)\nPerformance needed to hit revised estimate"},
    {front:"Communication Channels",back:"Channels = N(N-1) / 2\nN = number of stakeholders\n10 people = 45 channels"},
    {front:"PERT Expected Duration",back:"tE = (O + 4M + P) / 6\nO = optimistic\nM = most likely\nP = pessimistic"},
    {front:"PERT Standard Deviation",back:"SD = (P - O) / 6\nUsed for confidence ranges"},
    {front:"Float / Slack",back:"Float = LS - ES = LF - EF\nCritical path activities have 0 float"},
    {front:"Point of Total Assumption (PTA)",back:"PTA = [(Ceiling - Target Price) / Buyer Share Ratio] + Target Cost\nOnly for FPIF contracts"},
    {front:"EMV (Expected Monetary Value)",back:"EMV = Probability x Impact\nUsed in quantitative risk analysis\nPositive for opportunities, negative for threats"},
    {front:"Cost of Quality Components",back:"Prevention + Appraisal = Conformance\nInternal Failure + External Failure = Non-conformance\nInvest in prevention to reduce failure costs"},
    {front:"Earned Value Basics",back:"PV = Planned Value (budgeted cost of planned work)\nEV = Earned Value (budgeted cost of completed work)\nAC = Actual Cost (actual cost of completed work)\nBAC = Budget at Completion (total budget)"},
    {front:"Crashing vs Fast-Tracking",back:"Crashing = add resources = more cost, same risk\nFast-tracking = overlap activities = same cost, more risk\nBoth only work on critical path"}
  ];
  return cards;
}

function getStats(){
  const attempts = studyHistory.flatMap(s => s.results || []);
  const byChapter = {};
  const byTag = {};
  let confidentWrong = 0, confidentCorrect = 0, unsureCorrect = 0, guessCorrect = 0, guessWrong = 0;
  attempts.forEach(r => {
    const correct = r.selected === r.question.answer;
    const ch = r.question.chapterTitle || r.question.chapterRef || "Unknown";
    if(!byChapter[ch]) byChapter[ch] = {total:0, correct:0, time:0};
    byChapter[ch].total++;
    if(correct) byChapter[ch].correct++;
    byChapter[ch].time += r.timeSpent || 0;
    (r.question.tags || ["Concept"]).forEach(t => {
      if(!byTag[t]) byTag[t] = {total:0, correct:0};
      byTag[t].total++;
      if(correct) byTag[t].correct++;
    });
    if(r.confidence === "confident" && correct) confidentCorrect++;
    if(r.confidence === "confident" && !correct) confidentWrong++;
    if(r.confidence === "unsure" && correct) unsureCorrect++;
    if(r.confidence === "guess" && correct) guessCorrect++;
    if(r.confidence === "guess" && !correct) guessWrong++;
  });
  return {attempts, byChapter, byTag, confidentCorrect, confidentWrong, unsureCorrect, guessCorrect, guessWrong};
}

function weakestChapter(){
  const stats = getStats();
  let weakest = null;
  Object.entries(stats.byChapter).forEach(([name, s]) => {
    if(s.total < 1) return;
    const acc = s.correct / s.total;
    if(!weakest || acc < weakest.acc) weakest = {name, ...s, acc};
  });
  return weakest;
}

function weakestTag(){
  const stats = getStats();
  let weakest = null;
  Object.entries(stats.byTag).forEach(([tag, s]) => {
    if(s.total < 1) return;
    const acc = s.correct / s.total;
    if(!weakest || acc < weakest.acc) weakest = {tag, ...s, acc};
  });
  return weakest;
}

function pmiMindsetFor(question){
  const text = ((question.q || "") + " " + (question.chapterRef || "") + " " + (question.tags||[]).join(" ")).toLowerCase();
  if(text.includes("conflict") || text.includes("team") || text.includes("servant")){
    return "PMI mindset: support the team, understand the issue, coach where needed, and avoid command-and-control unless the situation is severe.";
  }
  if(text.includes("risk")){
    return "PMI mindset: identify and document risks early, analyze probability/impact, plan responses, and monitor continuously.";
  }
  if(text.includes("stakeholder")){
    return "PMI mindset: identify stakeholders early, understand their needs/influence, engage them proactively, and tailor communication.";
  }
  if(text.includes("change") || text.includes("baseline")){
    return "PMI mindset: do not change baselines informally. Analyze impact and follow change control.";
  }
  if(text.includes("contract") || text.includes("procurement")){
    return "PMI mindset: assume buyer perspective unless told otherwise, choose the contract that best fits scope clarity and risk ownership.";
  }
  if(text.includes("communication")){
    return "PMI mindset: communication is not complete until the receiver understands. Tailor the method to urgency, complexity, and stakeholder need.";
  }
  if(text.includes("quality")){
    return "PMI mindset: build quality in through prevention and process improvement; do not rely only on final inspection.";
  }
  return "PMI mindset: analyze first, use the right process, collaborate, avoid knee-jerk escalation, and choose the answer that protects project value.";
}

function trapPatternFor(question){
  const q = question.q || "";
  const traps = ["FIRST","NEXT","BEST","MOST","LEAST","EXCEPT","ALWAYS","NEVER","AVOID","IMMEDIATELY","ONLY","NOT"];
  const found = traps.filter(t => new RegExp("\\b"+t+"\\b","i").test(q));
  return found.length ? "Trap words detected: " + found.join(", ") + ". Slow down and answer exactly what the question asks." : "No major trap words detected. Still check whether the question asks for first, next, best, or exception logic.";
}

function getReadiness(){
  const stats = getStats();
  const attempts = stats.attempts || [];
  const total = attempts.length;
  const correct = attempts.filter(r => r.selected === r.question.answer).length;
  const accuracy = total ? correct / total : 0;
  const avgTime = total ? attempts.reduce((s,r)=>s+(r.timeSpent||0),0)/total : 999;
  const confidentWrongRate = total ? stats.confidentWrong / total : 0;
  const weakTag = weakestTag();
  const weakPenalty = weakTag && weakTag.acc < .65 ? .10 : 0;
  let score = 0;
  score += Math.min(.55, accuracy * .55);
  score += avgTime <= 80 ? .20 : avgTime <= 95 ? .14 : .07;
  score += confidentWrongRate <= .05 ? .15 : confidentWrongRate <= .10 ? .08 : .02;
  score += reviewQueue.length <= 10 ? .10 : reviewQueue.length <= 25 ? .05 : .01;
  score = Math.max(0, Math.min(1, score - weakPenalty));
  const pct = Math.round(score * 100);
  let level = "Not ready yet";
  if(pct >= 85) level = "Exam-ready trend";
  else if(pct >= 70) level = "Close, keep tightening weak areas";
  else if(pct >= 55) level = "Building foundation";
  return {pct, level, accuracy:Math.round(accuracy*100), avgTime:Math.round(avgTime === 999 ? 0 : avgTime), confidentWrong:stats.confidentWrong, total};
}

function readinessViewBlock(){
  const r = getReadiness();
  const cls = r.pct >= 85 ? "readiness-good" : r.pct >= 70 ? "readiness-mid" : "readiness-low";
  return `<div class="readiness-meter"><p>Exam Readiness Score</p><div class="readiness-score ${cls}">${r.pct}%</div><h3>${r.level}</h3><p>Accuracy: ${r.accuracy}% • Avg time: ${r.avgTime}s • Confident+Wrong: ${r.confidentWrong}</p></div>`;
}

function buildExamQuestionSet(){
  let all = getAllQuestions();
  let set = [];
  // Repeat/shuffle existing bank to simulate 180 questions without inventing unsupported content.
  while(set.length < 180){
    set = set.concat(all.sort(()=>Math.random()-.5));
  }
  return set.slice(0,180).map((q,i)=>shuffleOptions({...q, examNumber:i+1}));
}

function updateExamTimerUI(){

  const remaining = Math.max(0, examDurationSeconds - examElapsed);

  const m = Math.floor((remaining%3600)/60);
  const s = remaining%60;
  clock.textContent = `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  status.className = remaining < 900 ? "exam-danger" : remaining < 1800 ? "exam-warning" : "";

const TRAP_WORDS = ["FIRST","NEXT","BEST","MOST","LEAST","EXCEPT","ALWAYS","NEVER","AVOID","IMMEDIATELY","ONLY","INITIAL","PRIMARY","NOT","MOST LIKELY","LEAST LIKELY"];

function highlightTrapWords(text){
  if(!showTrapWords) return esc(text);
  let safe = esc(text);
  const phrases = ["MOST LIKELY","LEAST LIKELY"];
  phrases.forEach(word => {
    const re = new RegExp("\\b" + word.replace(" ", "\\s+") + "\\b", "gi");
    safe = safe.replace(re, m => `<span class="trap-word">${m}</span>`);
  });
  const singles = TRAP_WORDS.filter(w => !w.includes(" "));
  singles.forEach(word => {
    const re = new RegExp("\\b" + word + "\\b", "gi");
    safe = safe.replace(re, m => `<span class="trap-word">${m}</span>`);
  });
  return safe;
}

function generateTutorAnswer(q){let s=q.toLowerCase();if(s.includes("cpi"))return "CPI is Cost Performance Index. Formula: EV divided by AC. If CPI is below 1, the project is over budget. If CPI is above 1, the project is under budget. PMP mindset: interpret the number, then analyze the cause before taking corrective action.";if(s.includes("spi"))return "SPI is Schedule Performance Index. Formula: EV divided by PV. Below 1 means behind schedule; above 1 means ahead of schedule. PMP mindset: use schedule data to understand performance before changing the baseline.";if(s.includes("critical"))return "The critical path is the longest path through the network diagram and determines project duration. Critical path activities have no float. If one slips, the project slips unless corrective action is taken.";if(s.includes("crashing")||s.includes("fast"))return "Crashing adds resources to shorten the schedule and increases cost. Fast-tracking overlaps activities and increases risk. Exam trap: adding people or equipment is crashing; doing tasks in parallel is fast-tracking.";if(s.includes("manage quality")||s.includes("control quality"))return "Manage Quality focuses on the processes used to produce deliverables. Control Quality inspects completed deliverables to determine whether they meet standards. Exam shortcut: process = Manage Quality; deliverable inspection = Control Quality.";if(s.includes("reserve"))return "Contingency reserve covers known unknowns and is included in the cost baseline. Management reserve covers unknown unknowns, sits above the baseline, and requires management approval.";if(s.includes("float")||s.includes("slack"))return "Float, or slack, is how long an activity can be delayed without delaying the project. Critical path activities have zero float. Slack can be calculated as LS minus ES or LF minus EF.";if(s.includes("quality"))return "Quality means meeting requirements, not just having fancy features. Grade can be low or high, but quality must be high. PMI favors prevention, clear requirements, process improvement, and objective measurement.";
if(s.includes("raci")||s.includes("accountable"))return "RACI means Responsible, Accountable, Consulted, and Informed. The exam trap is accountability: avoid having more than one accountable person for the same work because it creates confusion and blame.";
if(s.includes("communication channel")||s.includes("channels"))return "Communication channels use N(N-1)/2. N is the number of stakeholders or people. Example: 10 people gives 10×9/2 = 45 channels.";
if(s.includes("stakeholder"))return "Stakeholder management is about identifying stakeholders, understanding their power/interest/influence, planning engagement, managing engagement, and monitoring it. PMP mindset: engage early, tailor communication, and move stakeholders toward the desired engagement level.";
if(s.includes("procurement")||s.includes("contract"))return "For procurement, assume you are the buyer unless the question says otherwise. Fixed price works best when scope is clear and shifts risk to the seller. Cost reimbursable and time/material place more cost risk on the buyer.";
if(s.includes("conflict"))return "For conflict, first understand the source and context. Use servant leadership: facilitate, listen, and help the team reach a constructive solution instead of dictating immediately.";
if(s.includes("emotional intelligence"))return "Emotional intelligence helps the PM read tone, facial expression, and behavior, then adjust responses to de-escalate and support project outcomes.";

return "Based on the loaded chapters, think like PMI: understand the issue first, use the right process, analyze data, avoid jumping straight to escalation, engage stakeholders, communicate clearly, support the team, and protect baselines through change control when needed."}

function addToSR(question){
  var id=question.q.substring(0,80);
  if(srDeck.some(function(c){return c.id===id;}))return;
  srDeck.push({id:id,question:question,interval:1,nextReview:new Date(Date.now()+86400000).toISOString().slice(0,10),repetitions:0,ease:2.5});
  save();
}
function getSRDueCards(){
  var today=new Date().toISOString().slice(0,10);
  return srDeck.filter(function(c){return c.nextReview<=today;});
}
function reviewSRCard(cardId,quality){
  var card=srDeck.find(function(c){return c.id===cardId;});
  if(!card)return;
  if(quality>=3){
    if(card.repetitions===0)card.interval=1;
    else if(card.repetitions===1)card.interval=3;
    else card.interval=Math.round(card.interval*card.ease);
    card.repetitions++;
    card.ease=Math.max(1.3,card.ease+0.1-0.08*(5-quality)-0.02*(5-quality)*(5-quality));
  }else{
    card.repetitions=0;
    card.interval=1;
    card.ease=Math.max(1.3,card.ease-0.2);
  }
  var next=new Date(Date.now()+card.interval*86400000);
  card.nextReview=next.toISOString().slice(0,10);
  save();
}

  var due=getSRDueCards();
  var total=srDeck.length;
  return '<div class="card"><h3>Spaced Repetition</h3><p class="muted">Questions you missed are scheduled for review at increasing intervals. Get them right and they appear less often. Get them wrong and they come back tomorrow.</p><p><strong>'+due.length+'</strong> cards due today | <strong>'+total+'</strong> total in deck</p>'+(due.length>0?'<button class="btn green" onclick="startSRReview()">Review Due Cards ('+due.length+')</button>':'<p class="muted small">All caught up. New cards appear after you miss questions in quizzes.</p>')+'</div>';
}
function updateStreak(){var today=new Date().toISOString().slice(0,10);if(streakData.lastDate===today)return;var yesterday=new Date(Date.now()-86400000).toISOString().slice(0,10);if(streakData.lastDate===yesterday){streakData.current++;if(streakData.current>streakData.best)streakData.best=streakData.current;}else if(streakData.lastDate!==today){streakData.current=1;}streakData.lastDate=today;save();}
function getStreakDisplay(){return streakData.current>0?""+streakData.current+" day"+(streakData.current>1?"s":""):"0 days";}
function render(){let root=document.getElementById("root"); if(screen==="home")root.innerHTML=home(); if(screen==="chapters")root.innerHTML=chaptersView(); if(screen==="chapterDetail")root.innerHTML=chapterDetail(); if(screen==="quiz")root.innerHTML=quizView(); if(screen==="results")root.innerHTML=resultsView(); if(screen==="missed")root.innerHTML=missedView(); if(screen==="bookmarks")root.innerHTML=bookmarksView(); if(screen==="tutor")root.innerHTML=tutorView(); if(screen==="progress")root.innerHTML=progressView(); if(screen==="reviewQueue")root.innerHTML=reviewQueueView(); if(screen==="dailyPlan")root.innerHTML=dailyPlanView(); if(screen==="flashcards")root.innerHTML=flashcardsView(); if(screen==="hardSelect")root.innerHTML=hardSelectView();}
console.log('[PMP] Startup - studyHistory:',studyHistory.length,'items, srDeck:',srDeck.length,'cards, missed:',missed.length);
render();
