xamLike":true,"temptingWrong":"The tempting wrong answers usually confuse leads/lags, crashing/fast-tracking, or critical path versus non-critical float."},{"q":"What is the main output of Sequence Activities?","options":["Cost baseline","Project schedule network diagram","Stakeholder register","Quality report"],"answer":1,"why":"Sequence Activities creates the project schedule network diagram showing order and dependencies.","mindset":"Sequencing is about relationships between activities.","chapterRef":"Chapter 7: Sequence Activities","tags":["Concept","Schedule"],"examLike":true,"temptingWrong":"The tempting wrong answers usually confuse leads/lags, crashing/fast-tracking, or critical path versus non-critical float."},{"q":"Which relationship is most commonly used in network diagrams?","options":["Start-to-Finish","Finish-to-Start","Finish-to-Finish","Start-to-Start"],"answer":1,"why":"Finish-to-Start is the most commonly used relationship; one activity must finish before the next starts.","mindset":"Do not overthink rare relationships when the question points to common sequencing.","chapterRef":"Chapter 7: PDM Relationships","tags":["Concept","Schedule"],"examLike":true,"temptingWrong":"The tempting wrong answers usually confuse leads/lags, crashing/fast-tracking, or critical path versus non-critical float."},{"q":"A city permit must be approved before work begins. What type of dependency is this?","options":["Internal","External","Discretionary","Soft logic"],"answer":1,"why":"A permit is outside the project team’s control, making it an external dependency.","mindset":"Outside control usually means external dependency.","chapterRef":"Chapter 7: Dependency Types","tags":["Concept","Schedule"],"examLike":true,"temptingWrong":"The tempting wrong answers usually confuse leads/lags, crashing/fast-tracking, or critical path versus non-critical float."},{"q":"A team prefers to test after installation because it is a best practice, but it is not required. What dependency type is this?","options":["Mandatory","Discretionary","External","Start-to-Finish"],"answer":1,"why":"Discretionary dependencies are preferred order but not required.","mindset":"Preferred sequence equals soft logic/discretionary dependency.","chapterRef":"Chapter 7: Dependency Types","tags":["Resource","Schedule","Scenario"],"examLike":true,"temptingWrong":"The tempting wrong answers usually confuse leads/lags, crashing/fast-tracking, or critical path versus non-critical float."},{"q":"What is a lead?","options":["A delay between activities","An overlap between activities","The longest path","A zero-duration milestone"],"answer":1,"why":"A lead allows overlap between activities; a successor may start before the predecessor finishes.","mindset":"Lead overlaps; lag delays.","chapterRef":"Chapter 7: Leads and Lags","tags":["Concept","Schedule"],"examLike":true,"temptingWrong":"The tempting wrong answers usually confuse leads/lags, crashing/fast-tracking, or critical path versus non-critical float."},{"q":"What is a lag?","options":["A delay between activities","The value of completed work","The first activity in a network","A resource histogram"],"answer":0,"why":"A lag is a waiting period or delay between activities.","mindset":"Lag is wait time, like drying time after painting.","chapterRef":"Chapter 7: Leads and Lags","tags":["Concept","Schedule"],"examLike":true,"temptingWrong":"The tempting wrong answers usually confuse leads/lags, crashing/fast-tracking, or critical path versus non-critical float."},{"q":"What is the PERT beta formula?","options":["(O + M + P) / 3","(O + 4M + P) / 6","(P - O) / 6","EV / AC"],"answer":1,"why":"PERT beta uses optimistic plus four times most likely plus pessimistic, divided by six.","mindset":"If not specified, your notes say to use PERT beta.","chapterRef":"Chapter 7: Three-Point Estimating","tags":["Formula","Schedule"],"examLike":true,"temptingWrong":"The tempting wrong answers usually confuse leads/lags, crashing/fast-tracking, or critical path versus non-critical float."},{"q":"What is the standard deviation formula for three-point estimates?","options":["(O + 4M + P) / 6","(O + M + P) / 3","(P - O) / 6","LS - ES"],"answer":2,"why":"Standard deviation is calculated as pessimistic minus optimistic, divided by six.","mindset":"Standard deviation measures variability/uncertainty.","chapterRef":"Chapter 7: Standard Deviation","tags":["Formula","Process","Schedule"],"examLike":true,"temptingWrong":"The tempting wrong answers usually confuse leads/lags, crashing/fast-tracking, or critical path versus non-critical float."},{"q":"Which estimating method is most accurate but time-consuming?","options":["Analogous estimating","Bottom-up estimating","T-shirt sizing","Expert judgment only"],"answer":1,"why":"Bottom-up estimating breaks work into the smallest components and aggregates the estimates.","mindset":"Detailed estimating improves accuracy but takes more time.","chapterRef":"Chapter 7: Bottom-Up Estimating","tags":["Concept","Schedule"],"examLike":true,"temptingWrong":"The tempting wrong answers usually confuse leads/lags, crashing/fast-tracking, or critical path versus non-critical float."},{"q":"What is the critical path?","options":["The shortest path through the network","The path with the most stakeholders","The longest path that determines project duration","The path with the lowest cost"],"answer":2,"why":"The critical path is the longest path through the network diagram and determines total project duration.","mindset":"If the critical path slips, the project slips.","chapterRef":"Chapter 7: Critical Path Method","tags":["Concept","Schedule"],"examLike":true,"temptingWrong":"The tempting wrong answers usually confuse leads/lags, crashing/fast-tracking, or critical path versus non-critical float."},{"q":"What is true about activities on the critical path?","options":["They have no float","They always cost the most","They are optional","They are always external"],"answer":0,"why":"Critical path activities have no float; delays delay the project.","mindset":"Zero float is a critical path clue.","chapterRef":"Chapter 7: Critical Path Method","tags":["Concept","Schedule"],"examLike":true,"temptingWrong":"The tempting wrong answers usually confuse leads/lags, crashing/fast-tracking, or critical path versus non-critical float."},{"q":"What does float/slack measure?","options":["How much an activity can be delayed without delaying the project","How much budget remains","How many people are on the team","How much risk tolerance exists"],"answer":0,"why":"Float is the amount of time an activity can be delayed without delaying the project.","mindset":"Float helps determine flexibility in non-critical activities.","chapterRef":"Chapter 7: Slack / Float","tags":["Formula","Schedule"],"examLike":true,"temptingWrong":"The tempting wrong answers usually confuse leads/lags, crashing/fast-tracking, or critical path versus non-critical float."},{"q":"Which formula can calculate slack?","options":["EV - AC","LS - ES","BAC / CPI","N(N-1)/2"],"answer":1,"why":"Slack can be calculated as LS minus ES or LF minus EF.","mindset":"Slack formulas compare late and early dates.","chapterRef":"Chapter 7: Slack Formulas","tags":["Formula","Schedule"],"examLike":true,"temptingWrong":"The tempting wrong answers usually confuse leads/lags, crashing/fast-tracking, or critical path versus non-critical float."},{"q":"What is resource leveling likely to do?","options":["Shorten the project with no risk","Adjust schedule due to limited resources and may increase duration","Remove the critical path","Create the stakeholder register"],"answer":1,"why":"Resource leveling adjusts the schedule for limited or overallocated resources and may extend the critical path.","mindset":"Resource leveling can delay work when resources are constrained.","chapterRef":"Chapter 7: Resource Optimization","tags":["Formula","Resource","Schedule"],"examLike":true,"temptingWrong":"The tempting wrong answers usually confuse leads/lags, crashing/fast-tracking, or critical path versus non-critical float."},{"q":"What is crashing?","options":["Doing activities in parallel","Adding resources to finish faster","Delaying activities intentionally","Reducing product quality"],"answer":1,"why":"Crashing adds resources to finish faster and usually increases cost.","mindset":"Crashing buys time with money/resources.","chapterRef":"Chapter 7: Schedule Compression","tags":["Concept","Schedule"],"examLike":true,"temptingWrong":"The tempting wrong answers usually confuse leads/lags, crashing/fast-tracking, or critical path versus non-critical float."},{"q":"What is the key difference between burnup and burndown charts?","options":["Burnup shows completed work; burndown shows remaining work","Burnup is for cost; burndown is for quality","Burnup is predictive only; burndown is procurement only","There is no difference"],"answer":0,"why":"Burnup charts show work completed; burndown charts show work remaining.","mindset":"Remember: burnup = done, burndown = left.","chapterRef":"Chapter 7: Agile Scheduling","tags":["Agile","Schedule"],"examLike":true,"temptingWrong":"The tempting wrong answers usually confuse leads/lags, crashing/fast-tracking, or critical path versus non-critical float."},{"q":"Your critical path shows zero float on a sequence of 5 activities. A team member finishes one critical activity 2 days early. What happens to the project schedule?","options":["The project could finish 2 days early IF no other critical activities are delayed â€” but you should verify by recalculating the critical path since it may have shifted","The project will definitely finish 2 days early","Nothing changes â€” float is always zero on critical path","You should add 2 days of buffer to another activity"],"answer":0,"why":"Finishing early on one activity creates potential, but the critical path must be recalculated. Other constraints or resource dependencies might negate the gain.","mindset":"PMI mindset: the critical path is dynamic. Don\u0027t assume a local gain translates to a project-level gain without recalculating.","tags":["Critical Path","Float","Schedule Management"],"chapterRef":"Chapter 7 - Critical Path Method"},{"q":"Your project is 3 weeks behind schedule. The sponsor demands you crash the schedule. What should you consider FIRST?","options":["Identify which critical path activities can be crashed at the lowest cost, and analyze whether crashing actually shortens the overall schedule","Add resources to all activities equally","Fast-track everything by running activities in parallel","Tell the sponsor crashing won\u0027t help"],"answer":0,"why":"Crashing only helps on critical path activities. Adding resources to non-critical activities wastes money without shortening the schedule. Analyze first.","mindset":"PMI mindset: crashing targets critical path activities at lowest incremental cost. Don\u0027t throw resources at everything blindly.","tags":["Schedule Compression","Crashing","Critical Path"],"chapterRef":"Chapter 7 - Schedule Compression"},{"q":"A team lead suggests fast-tracking to recover schedule. What risk should you communicate?","options":["Fast-tracking increases risk because parallel activities that were meant to be sequential may create rework if earlier activities produce unexpected outputs","Fast-tracking has no additional risks","Fast-tracking always works and has no downsides","Fast-tracking is the same as crashing"],"answer":0,"why":"Fast-tracking overlaps activities meant to be sequential, which means later activities might need rework if assumptions from earlier work prove wrong.","mindset":"PMI mindset: fast-tracking trades risk for time. Always communicate this tradeoff â€” don\u0027t present it as a free solution.","tags":["Fast-Tracking","Risk","Schedule Compression"],"chapterRef":"Chapter 7 - Schedule Compression"},{"q":"You used three-point estimating: Optimistic = 4 days, Most Likely = 7 days, Pessimistic = 16 days. The stakeholder asks for \u0027the estimate.\u0027 What should you provide?","options":["The PERT expected duration: (4 + 4Ã—7 + 16) / 6 = 8 days, along with the range and confidence level so the stakeholder understands the uncertainty","Just give the optimistic estimate of 4 days to make them happy","Use the pessimistic estimate to be safe","Give the most likely estimate of 7 days without context"],"answer":0,"why":"PERT formula gives the weighted average. But equally important is communicating the range and confidence â€” a single number without context misleads stakeholders.","mindset":"PMI mindset: estimates have ranges. Communicate uncertainty honestly. A single number without context creates false precision.","tags":["Estimating","Three-Point","PERT"],"chapterRef":"Chapter 7 - Estimate Activity Durations"},{"q":"Your resource-leveled schedule is now 4 weeks longer than the original schedule. The sponsor won\u0027t accept the delay. What are your options?","options":["Present options: accept the longer schedule, add resources to eliminate the constraint, reduce scope, or accept higher risk by not leveling â€” the sponsor decides the tradeoff","Level the resources anyway and hide the schedule impact","Remove resource leveling and accept that resources will be over-allocated","Tell the sponsor there\u0027s no solution"],"answer":0,"why":"Resource leveling extends schedules. When that\u0027s unacceptable, the PM presents tradeoff options â€” more resources, less scope, or accepted over-allocation risk.","mindset":"PMI mindset: present options with tradeoffs. Don\u0027t hide impacts, don\u0027t give up, and don\u0027t make the tradeoff decision unilaterally.","tags":["Resource Leveling","Schedule","Tradeoffs"],"chapterRef":"Chapter 7 - Resource Optimization"},{"q":"A dependency between Activity A and Activity B is Finish-to-Start with a 5-day lag. A stakeholder asks you to remove the lag to shorten the schedule. What should you do?","options":["Investigate why the lag exists â€” if it represents a real constraint (like curing time or approval wait), removing it could cause quality issues or rework","Remove the lag immediately since the stakeholder requested it","Change it to a Start-to-Start dependency instead","Add a lead instead of removing the lag"],"answer":0,"why":"Lags usually represent real constraints. Removing them without understanding why they exist can cause downstream problems. Investigate first.","mindset":"PMI mindset: understand the reason behind constraints before removing them. Don\u0027t optimize the schedule by eliminating real-world realities.","tags":["Dependencies","Leads and Lags","Schedule"],"chapterRef":"Chapter 7 - Sequence Activities"},{"q":"Your team uses analogous estimating for a new project because it\u0027s similar to a past project. The actual project turns out to be much more complex. What should you have done differently?","options":["Used analogous estimates only as a starting point and refined with bottom-up or parametric estimates as more detail became available â€” analogous alone is insufficient for complex work","Analogous estimating was fine â€” the complexity was unforeseeable","You should have used only bottom-up from the start","Padding the estimate by 50% would have solved it"],"answer":0,"why":"Analogous is a top-down, rough estimate. For complex work, it should be supplemented with more detailed techniques as information becomes available.","mindset":"PMI mindset: match estimating technique to available information. Refine as you learn more. Don\u0027t rely on a single technique when complexity is high.","tags":["Estimating","Analogous","Progressive Elaboration"],"chapterRef":"Chapter 7 - Estimation Techniques"},{"q":"A milestone on your project has been missed. The sponsor asks what you\u0027re going to do. What is the BEST first response?","options":["Analyze the root cause of the missed milestone and its downstream impact before proposing corrective action","Immediately crash the next set of activities","Blame the team for not working hard enough","Move the milestone to a future date"],"answer":0,"why":"Before acting, understand why the milestone was missed and what its impact is. Root cause analysis informs the right corrective action.","mindset":"PMI mindset: analyze before acting. A missed milestone requires understanding, not knee-jerk reactions.","tags":["Schedule Control","Root Cause Analysis","Milestones"],"chapterRef":"Chapter 7 - Control Schedule"},{"q":"Your project network diagram shows two parallel critical paths. What does this mean for project risk?","options":["Risk is higher because a delay on ANY activity on EITHER path will delay the project â€” there\u0027s no near-critical path to absorb delays","Risk is lower because you have two paths providing redundancy","It means the estimate is wrong and one path must be longer","Parallel critical paths are impossible"],"answer":0,"why":"Multiple critical paths mean more activities with zero float, increasing the probability that at least one will delay the project. Risk is amplified.","mindset":"PMI mindset: more critical activities = more schedule risk. Monitor both paths closely and consider adding buffers.","tags":["Critical Path","Risk","Network Diagram"],"chapterRef":"Chapter 7 - Critical Path Method"},{"q":"The team wants to add 20% padding to all activity duration estimates \u0027just to be safe.\u0027 What is the problem with this approach?","options":["Padding individual activities hides risk instead of managing it â€” use contingency reserve at the project level based on identified risks and quantitative analysis","There is no problem â€” padding is good practice","Only 10% padding is acceptable","Let them pad since they know their work best"],"answer":0,"why":"Individual padding inflates schedules, hides true estimates, and enables Parkinson\u0027s Law. Risk should be managed through explicit reserves based on analysis.","mindset":"PMI mindset: risks should be visible and managed, not hidden in inflated estimates. Use reserves, not padding.","tags":["Estimating","Contingency Reserve","Risk Management"],"chapterRef":"Chapter 7 - Duration Estimating"}]},{"id":8,"title":"Chapter 8: Cost Management","summary":"Cost management focuses on creating the cost baseline, managing the project budget, and using earned value formulas to interpret performance.","notes":["Cost management is about creating the cost baseline and ensuring the project stays on budget.","Cost types include variable, fixed, direct, indirect, sunk, and value engineering.","The four cost processes are Plan Cost Management, Estimate Costs, Determine Budget, and Control Costs.","Traditional project budgeting is done upfront; agile project funding is done incrementally.","Contingency reserves cover known unknowns and are included in the cost baseline.","Management reserves cover unknown unknowns and require management approval.","Earned Value Management includes BAC, PV, EV, AC, CV, CPI, SV, SPI, EAC, ETC, VAC, and TCPI.","Negative CV means over budget. Negative SV means behind schedule. CPI or SPI below 1 is unfavorable."],"examples":["If EV is 75 and AC is 70, CV is +5, meaning the project is under budget.","If EV is 75 and PV is 60, SV is +15, meaning the project is ahead of schedule.","If CPI is 0.80, the project is getting 80 cents of value for every dollar spent.","Contingency reserve is for identified risks; management reserve is for unforeseen risks."],"podcast":[{"speaker":"Host 1","text":"Let’s dig into Chapter 8, Cost Management. This chapter matters because it combines basic cost concepts, budgeting process flow, reserves, and earned value management."},{"speaker":"Host 2","text":"And earned value is one of those areas where students might memorize formulas but still miss questions because they do not understand what the numbers actually mean."},{"speaker":"Host 1","text":"The big goal of cost management is creating the cost baseline, which is the project budget, and then ensuring the project stays on budget."},{"speaker":"Host 2","text":"Start with cost types. Variable costs change as the project progresses. Fixed costs stay the same. Direct costs are directly tied to project work and are included in the cost baseline. Indirect costs are not included in the project budget."},{"speaker":"Host 1","text":"Sunk cost is money already spent. Value engineering, also called value analysis, is finding a less costly way to achieve the same goal or scope."},{"speaker":"Host 2","text":"And the PMP mindset is important here. Value engineering is not cutting quality or removing requirements. It is finding a less costly way to achieve the required outcome."},{"speaker":"Host 1","text":"The four cost management processes are Plan Cost Management, Estimate Costs, Determine Budget, and Control Costs."},{"speaker":"Host 2","text":"Plan Cost Management creates the cost management plan. That plan guides how activity costs will be estimated, how the budget will be created, and how project costs will be monitored and controlled."},{"speaker":"Host 1","text":"Estimate Costs assigns a cost to each activity. Costs can include labor, materials, equipment, services, facilities, inflation, and reserves for risk."},{"speaker":"Host 2","text":"Know the estimate ranges. Rough Order of Magnitude is the least accurate and is usually minus 25 percent to plus 75 percent. Budget estimate is around minus 10 to plus 25. Definitive estimate is the most accurate, around minus 5 to plus 10."},{"speaker":"Host 1","text":"Analogous estimating is top-down. It uses previous similar projects. It is quick, but can be inaccurate if the previous work is not very similar."},{"speaker":"Host 2","text":"Bottom-up estimating is the opposite. It breaks work into smaller pieces, estimates each part, and aggregates the total. It is time-consuming but very accurate."},{"speaker":"Host 1","text":"Parametric estimating uses math and historical data. For example, if painting costs two dollars per square foot, then five hundred square feet costs one thousand dollars."},{"speaker":"Host 2","text":"Reserve analysis is a big exam topic. Contingency reserves cover known unknowns. That means identified risks. They are included in the cost baseline and the project manager can usually use them without additional approval."},{"speaker":"Host 1","text":"Management reserves cover unknown unknowns. These are unforeseen events management did not identify earlier. Management reserves are above the cost baseline and require management approval."},{"speaker":"Host 2","text":"That distinction is critical. Contingency equals known unknown and included in baseline. Management equals unknown unknown and above baseline."},{"speaker":"Host 1","text":"Determine Budget aggregates cost estimates to create the project budget. Cost aggregation rolls up activity cost estimates and work packages into the total project cost."},{"speaker":"Host 2","text":"The cost baseline includes project work and contingency reserve, but not management reserve. It can be shown as an S-curve because spending is often lower at the start, highest in the middle, and lower at the end."},{"speaker":"Host 1","text":"Control Costs is where the project manager monitors cost performance. The PM compares planned work to actual work, identifies variances, determines why they happened, and decides corrective action."},{"speaker":"Host 2","text":"Now earned value. BAC is Budget at Completion, the total planned budget. PV is Planned Value, the cost of work planned to be completed. EV is Earned Value, the value of work actually completed. AC is Actual Cost, the amount actually spent."},{"speaker":"Host 1","text":"Cost Variance is EV minus AC. If CV is positive, the project is under budget. If CV is negative, the project is over budget."},{"speaker":"Host 2","text":"Cost Performance Index is EV divided by AC. CPI tells how efficiently the project is spending money. CPI above 1 is good. CPI below 1 is bad."},{"speaker":"Host 1","text":"So if CPI is point eight, that means for every dollar spent, the project only gets eighty cents of value. That is over budget."},{"speaker":"Host 2","text":"Schedule Variance is EV minus PV. If SV is positive, the project is ahead of schedule. If SV is negative, the project is behind schedule."},{"speaker":"Host 1","text":"Schedule Performance Index is EV divided by PV. SPI above 1 means ahead of schedule. SPI below 1 means behind schedule."},{"speaker":"Host 2","text":"Estimate at Completion is BAC divided by CPI. This is the forecasted final project cost if the project continues at the current spending rate."},{"speaker":"Host 1","text":"Estimate to Complete is EAC minus AC. That tells how much more money is needed to finish the project."},{"speaker":"Host 2","text":"Variance at Completion is BAC minus EAC. Positive VAC means money left over. Negative VAC means more money is needed."},{"speaker":"Host 1","text":"TCPI is the To-Complete Performance Index. It tells the efficiency needed to finish within budget. If TCPI is higher than 1, the project team must work more efficiently to finish within budget."},{"speaker":"Host 2","text":"The exam may give numbers and ask you to calculate, but the real skill is interpretation. If CPI is less than 1, cost is bad. If SPI is less than 1, schedule is bad. If CV is negative, over budget. If SV is negative, behind schedule."},{"speaker":"Host 1","text":"Agile budgeting is also different. Traditional projects calculate the entire budget during planning. Agile projects are often funded incrementally as iterations are completed."},{"speaker":"Host 2","text":"Agile can use a burn rate approach. For example, number of people times hourly cost times hours worked gives cost per week. Then multiply by iteration length and number of iterations."},{"speaker":"Host 1","text":"Final mindset: when cost issues appear, the project manager should analyze the data, understand the variance, determine corrective action, and use change control when budget changes are needed."},{"speaker":"Host 2","text":"Do not just ask for more money. Do not ignore the variance. Do not change the budget informally. Analyze, forecast, communicate, and follow the process."}],"questions":[{"q":"What is the main purpose of cost management?","options":["Creating the cost baseline and keeping the project on budget","Creating the stakeholder register","Defining quality metrics","Closing procurements"],"answer":0,"why":"Cost management focuses on creating the cost baseline and ensuring the project stays on budget.","mindset":"Cost management is budget creation plus cost control.","chapterRef":"Chapter 8: Cost Management","tags":["Process","Cost"],"examLike":true,"temptingWrong":"The tempting wrong answers usually mix up cost versus schedule performance. Read the formula and interpret whether the value is favorable or unfavorable."},{"q":"Which cost changes as the project progresses?","options":["Fixed cost","Variable cost","Sunk cost","Indirect cost"],"answer":1,"why":"Variable costs change as the project progresses.","mindset":"Variable means it varies with project conditions or usage.","chapterRef":"Chapter 8: Types of Costs","tags":["Concept","Cost"],"examLike":true,"temptingWrong":"The tempting wrong answers usually mix up cost versus schedule performance. Read the formula and interpret whether the value is favorable or unfavorable."},{"q":"Which cost stays the same as the project progresses?","options":["Fixed cost","Variable cost","Direct cost","Reserve cost"],"answer":0,"why":"Fixed costs stay the same as the project progresses.","mindset":"Fixed means stable regardless of normal project progress.","chapterRef":"Chapter 8: Types of Costs","tags":["Concept","Cost"],"examLike":true,"temptingWrong":"The tempting wrong answers usually mix up cost versus schedule performance. Read the formula and interpret whether the value is favorable or unfavorable."},{"q":"Which cost is directly incurred by project work and included in the cost baseline?","options":["Indirect cost","Direct cost","Sunk cost","Management reserve"],"answer":1,"why":"Direct costs are directly incurred by project work and included in the cost baseline.","mindset":"Direct costs belong to the project work itself.","chapterRef":"Chapter 8: Types of Costs","tags":["Concept","Cost"],"examLike":true,"temptingWrong":"The tempting wrong answers usually mix up cost versus schedule performance. Read the formula and interpret whether the value is favorable or unfavorable."},{"q":"What is a sunk cost?","options":["Money already spent on the project","Money held for unknown unknowns","A cost that changes over time","A seller incentive"],"answer":0,"why":"Sunk cost is money already spent on the project.","mindset":"Do not let sunk costs drive future decisions.","chapterRef":"Chapter 8: Types of Costs","tags":["Concept","Cost"],"examLike":true,"temptingWrong":"The tempting wrong answers usually mix up cost versus schedule performance. Read the formula and interpret whether the value is favorable or unfavorable."},{"q":"What is value engineering?","options":["Finding a less costly way to achieve the goal/scope","Increasing scope without approval","Removing quality requirements","Adding management reserve"],"answer":0,"why":"Value engineering finds a less costly way to achieve the same goal or scope.","mindset":"Value engineering protects value while reducing cost.","chapterRef":"Chapter 8: Value Engineering","tags":["Concept","Cost"],"examLike":true,"temptingWrong":"The tempting wrong answers usually mix up cost versus schedule performance. Read the formula and interpret whether the value is favorable or unfavorable."},{"q":"Which process creates the cost management plan?","options":["Estimate Costs","Determine Budget","Plan Cost Management","Control Costs"],"answer":2,"why":"Plan Cost Management creates the cost management plan.","mindset":"The plan guides estimating, budgeting, and controlling costs.","chapterRef":"Chapter 8: Plan Cost Management","tags":["Process","Cost"],"examLike":true,"temptingWrong":"The tempting wrong answers usually mix up cost versus schedule performance. Read the formula and interpret whether the value is favorable or unfavorable."},{"q":"Which estimate type is the least accurate?","options":["Definitive estimate","Budget estimate","Rough Order of Magnitude","Bottom-up estimate"],"answer":2,"why":"ROM is the most inaccurate estimate, with a wide range.","mindset":"ROM is early and rough.","chapterRef":"Chapter 8: Estimate Types","tags":["Process","Cost"],"examLike":true,"temptingWrong":"The tempting wrong answers usually mix up cost versus schedule performance. Read the formula and interpret whether the value is favorable or unfavorable."},{"q":"Which estimate type is most accurate?","options":["ROM","Budget estimate","Definitive estimate","Analogous estimate"],"answer":2,"why":"Definitive estimate is considered the best estimate possible and is usually done later in planning.","mindset":"More detail usually produces a better estimate.","chapterRef":"Chapter 8: Estimate Types","tags":["Process","Cost"],"examLike":true,"temptingWrong":"The tempting wrong answers usually mix up cost versus schedule performance. Read the formula and interpret whether the value is favorable or unfavorable."},{"q":"Which estimating method is also known as top-down estimating?","options":["Analogous estimating","Bottom-up estimating","Parametric estimating","Reserve analysis"],"answer":0,"why":"Analogous estimating is also called top-down estimating and uses previous similar work.","mindset":"Analogous is quick but less accurate.","chapterRef":"Chapter 8: Analogous Estimating","tags":["Concept","Cost"],"examLike":true,"temptingWrong":"The tempting wrong answers usually mix up cost versus schedule performance. Read the formula and interpret whether the value is favorable or unfavorable."},{"q":"Which estimating method is very accurate but complex and time-consuming?","options":["Analogous estimating","Bottom-up estimating","ROM estimating","Funding limit reconciliation"],"answer":1,"why":"Bottom-up estimating breaks work into smaller pieces and aggregates estimates.","mindset":"Bottom-up trades speed for accuracy.","chapterRef":"Chapter 8: Bottom-Up Estimating","tags":["Concept","Cost"],"examLike":true,"temptingWrong":"The tempting wrong answers usually mix up cost versus schedule performance. Read the formula and interpret whether the value is favorable or unfavorable."},{"q":"Which reserve covers known unknowns and is included in the cost baseline?","options":["Management reserve","Contingency reserve","Executive reserve","Sunk reserve"],"answer":1,"why":"Contingency reserves cover known unknowns and are included in the budget baseline.","mindset":"Known risk = contingency reserve.","chapterRef":"Chapter 8: Reserve Analysis","tags":["Concept","Cost"],"examLike":true,"temptingWrong":"The tempting wrong answers usually mix up cost versus schedule performance. Read the formula and interpret whether the value is favorable or unfavorable."},{"q":"Which reserve covers unknown unknowns and requires management approval?","options":["Contingency reserve","Management reserve","Activity reserve","Cost baseline"],"answer":1,"why":"Management reserves cover unknown unknowns and require management approval.","mindset":"Unknown unknown = management reserve.","chapterRef":"Chapter 8: Reserve Analysis","tags":["Process","Cost"],"examLike":true,"temptingWrong":"The tempting wrong answers usually mix up cost versus schedule performance. Read the formula and interpret whether the value is favorable or unfavorable."},{"q":"What does Determine Budget do?","options":["Aggregates cost estimates to create the project budget","Inspects deliverables","Identifies stakeholders","Creates quality reports"],"answer":0,"why":"Determine Budget aggregates project cost estimates to create the overall project budget.","mindset":"Budgeting rolls up activity/work package costs.","chapterRef":"Chapter 8: Determine Budget","tags":["Concept","Cost"],"examLike":true,"temptingWrong":"The tempting wrong answers usually mix up cost versus schedule performance. Read the formula and interpret whether the value is favorable or unfavorable."},{"q":"Does the cost baseline include management reserve?","options":["Yes, always","No, it includes project work and contingency reserve but not management reserve","Only in agile projects","Only after closeout"],"answer":1,"why":"The cost baseline includes project work and contingency reserve, but not management reserve.","mindset":"Management reserve sits above the cost baseline.","chapterRef":"Chapter 8: Cost Baseline","tags":["Process","Cost"],"examLike":true,"temptingWrong":"The tempting wrong answers usually mix up cost versus schedule performance. Read the formula and interpret whether the value is favorable or unfavorable."},{"q":"What is BAC?","options":["Budget at Completion, the original project budget","Actual Cost","Budget Adjustment Cost","Baseline Activity Cost"],"answer":0,"why":"BAC is Budget at Completion, the original total project budget.","mindset":"BAC is the budget anchor for EVM formulas.","chapterRef":"Chapter 8: EVM","tags":["Formula","Cost"],"examLike":true,"temptingWrong":"The tempting wrong answers usually mix up cost versus schedule performance. Read the formula and interpret whether the value is favorable or unfavorable."},{"q":"What is the formula for Cost Variance?","options":["EV - AC","EV / AC","EV - PV","BAC / CPI"],"answer":0,"why":"CV equals EV minus AC.","mindset":"Negative CV means over budget.","chapterRef":"Chapter 8: EVM Formulas","tags":["Formula","Cost"],"examLike":true,"temptingWrong":"The tempting wrong answers usually mix up cost versus schedule performance. Read the formula and interpret whether the value is favorable or unfavorable."},{"q":"If CPI is below 1, what does that mean?","options":["The project is under budget","The project is over budget","The project is ahead of schedule","The project has no variance"],"answer":1,"why":"CPI below 1 means the project is spending inefficiently and is over budget.","mindset":"For CPI, below 1 is bad.","chapterRef":"Chapter 8: CPI","tags":["Formula","Cost"],"examLike":true,"temptingWrong":"The tempting wrong answers usually mix up cost versus schedule performance. Read the formula and interpret whether the value is favorable or unfavorable."},{"q":"What is the formula for SPI?","options":["EV / PV","EV / AC","BAC / CPI","BAC - EAC"],"answer":0,"why":"SPI equals EV divided by PV.","mindset":"SPI measures schedule efficiency.","chapterRef":"Chapter 8: SPI","tags":["Formula","Cost"],"examLike":true,"temptingWrong":"The tempting wrong answers usually mix up cost versus schedule performance. Read the formula and interpret whether the value is favorable or unfavorable."},{"q":"What does EAC forecast?","options":["Final project cost at completion","Number of communication channels","Total work remaining in agile","Stakeholder engagement level"],"answer":0,"why":"EAC forecasts what the project could cost at completion based on current performance.","mindset":"Forecast final cost = EAC.","chapterRef":"Chapter 8: EAC","tags":["Formula","Cost"],"examLike":true,"temptingWrong":"The tempting wrong answers usually mix up cost versus schedule performance. Read the formula and interpret whether the value is favorable or unfavorable."},{"q":"Your project\u0027s CPI is 0.85 and SPI is 0.92. The sponsor asks if the project can recover. What is the MOST accurate response?","options":["A CPI below 1.0 this far into the project rarely recovers â€” research shows cost performance tends to worsen or stay flat. We should reforecast and discuss options including scope reduction.","The team will work harder next month to bring CPI back to 1.0","CPI always recovers in later phases of the project","These metrics don\u0027t matter â€” only the final cost matters"],"answer":0,"why":"PMI research shows CPI typically doesn\u0027t improve significantly once established. It\u0027s an early warning that the project needs corrective action or replanning.","mindset":"PMI mindset: CPI is a leading indicator. Once established, it rarely improves. Use it to reforecast, not to hope for recovery.","tags":["EVM","CPI","Cost Control"],"chapterRef":"Chapter 8 - Earned Value Management"},{"q":"Your project budget is $500K. You\u0027ve spent $200K (AC) and completed work worth $180K (EV). The sponsor asks for Estimate at Completion. Using the CPI method, what is EAC?","options":["EAC = BAC / CPI = $500K / 0.90 = $555,556 â€” the project is trending to be ~$55K over budget if current performance continues","EAC = $500K because the budget doesn\u0027t change","EAC = $200K + remaining budget = $500K","EAC = AC + BAC - EV = $520K"],"answer":0,"why":"EAC = BAC/CPI is used when current variances are expected to continue. CPI = EV/AC = 180/200 = 0.90. So EAC = 500/0.90 = $555,556.","mindset":"PMI mindset: know which EAC formula to use and when. BAC/CPI assumes current performance continues â€” it\u0027s the most common exam scenario.","tags":["EVM","EAC","Formulas"],"chapterRef":"Chapter 8 - EAC Formulas"},{"q":"Management asks you to reduce the project budget by 15% with no scope reduction. What should you do?","options":["Present an impact analysis showing what quality, schedule, or risk tradeoffs would result from a 15% budget cut with unchanged scope â€” the decision belongs to management but they need full information","Accept the cut and figure it out later","Refuse since it\u0027s impossible","Cut quality controls to save money"],"answer":0,"why":"Budget cuts with fixed scope create tradeoffs. The PM\u0027s job is to make those tradeoffs visible so decision-makers choose with full information.","mindset":"PMI mindset: never silently accept impossible constraints. Present the tradeoffs clearly. Let management decide with eyes open.","tags":["Cost Management","Constraints","Stakeholder Communication"],"chapterRef":"Chapter 8 - Plan Cost Management"},{"q":"Your team used bottom-up estimating and the total is 30% higher than the sponsor\u0027s budget expectation. What should you do?","options":["Present the detailed estimate with supporting data, explain the methodology, and work with the sponsor to reconcile â€” through scope reduction, phasing, or additional funding","Reduce your estimates by 30% to match the budget","Use analogous estimating instead since it gives a lower number","Submit the lower number the sponsor wants and manage the overrun later"],"answer":0,"why":"Bottom-up estimates are the most accurate. If they exceed budget, the gap is real and needs honest discussion â€” not manipulation of numbers.","mindset":"PMI mindset: never manipulate estimates to fit a budget. Present reality, discuss options, and let the sponsor make informed tradeoff decisions.","tags":["Estimating","Bottom-Up","Budget"],"chapterRef":"Chapter 8 - Estimate Costs"},{"q":"Your project has a contingency reserve of $50K and a management reserve of $30K. A known risk materializes costing $40K. Which reserve do you use?","options":["Contingency reserve â€” it covers identified risks. You can access it without additional approval since it\u0027s part of the cost baseline.","Management reserve â€” it\u0027s larger and meant for problems","Neither â€” submit a change request for new funding","Split it between both reserves"],"answer":0,"why":"Contingency reserve is for known risks (known unknowns) and is within the PM\u0027s authority. Management reserve is for unknown unknowns and requires management approval.","mindset":"PMI mindset: know the difference. Contingency = known risks = PM authority. Management reserve = unknown unknowns = needs approval.","tags":["Reserves","Risk Response","Cost Baseline"],"chapterRef":"Chapter 8 - Determine Budget"},{"q":"The TCPI based on BAC is 1.35 for your project. What does this tell you?","options":["The team must perform at 135% efficiency for all remaining work to finish on the original budget â€” this is likely unrealistic and the budget needs to be revised","The project is doing great since the number is above 1","TCPI doesn\u0027t provide useful information","The team needs to work 35% fewer hours"],"answer":0,"why":"TCPI \u003e 1.0 means you need above-average performance on remaining work. 1.35 is extremely aggressive and usually signals the BAC is no longer achievable.","mindset":"PMI mindset: TCPI tells you how hard the road ahead is. Values significantly above 1.0 are red flags that the original budget is unrealistic.","tags":["EVM","TCPI","Cost Control"],"chapterRef":"Chapter 8 - TCPI"},{"q":"A team member asks why we track cost of quality. What is the BEST explanation?","options":["Cost of quality shows that investing in prevention (training, process improvement) costs less than paying for failures (rework, scrap, warranty) â€” it justifies quality spending","We track it because PMI requires it","Cost of quality is just an accounting exercise","It\u0027s only relevant for manufacturing projects"],"answer":0,"why":"CoQ demonstrates that prevention is cheaper than correction. It\u0027s a business justification for quality investment, not just an academic exercise.","mindset":"PMI mindset: quality is not just a cost â€” it\u0027s an investment. Prevention costs less than failure. CoQ makes this visible.","tags":["Cost of Quality","Quality Management"],"chapterRef":"Chapter 8 - Cost of Quality"},{"q":"Your project EV is $300K, PV is $350K, and AC is $320K. A stakeholder asks \u0027Are we over budget or behind schedule â€” or both?\u0027 What do you tell them?","options":["Both â€” SV is negative ($300K - $350K = -$50K, behind schedule) and CV is also negative ($300K - $320K = -$20K, over budget)","Only behind schedule because SV is negative","Only over budget because we\u0027ve spent $320K","Neither â€” the project is fine since we\u0027ve only spent $320K of a larger budget"],"answer":0,"why":"SV = EV - PV (negative = behind schedule). CV = EV - AC (negative = over budget). Both are negative, so both problems exist.","mindset":"PMI mindset: EVM gives objective status. SV and CV don\u0027t lie. Report both clearly without sugarcoating.","tags":["EVM","SV","CV","Status Reporting"],"chapterRef":"Chapter 8 - Earned Value"},{"q":"During a budget review, your finance department says they want to spread the project funding evenly across all quarters. Your project has heavy spending in Q2 and Q3. What tool addresses this?","options":["Funding limit reconciliation â€” compare the cost baseline S-curve against funding availability and adjust scheduling of expenditures to align with funding constraints","Ignore finance and spend according to plan","Move all expensive work to Q4 when funding catches up","Reduce scope to flatten spending"],"answer":0,"why":"Funding limit reconciliation matches planned spending to available funding. If spending is uneven, you may need to reschedule work or negotiate different funding timing.","mindset":"PMI mindset: budget planning must consider when money is available, not just total amount. Cash flow timing matters.","tags":["Budget","Funding Limits","Cost Baseline"],"chapterRef":"Chapter 8 - Determine Budget"},{"q":"A vendor submits an invoice for $75K but the earned value for their work is only $50K based on % complete. What should you do?","options":["Investigate the discrepancy â€” the vendor may be billing ahead of actual progress. Verify actual % complete before approving payment.","Pay the invoice since the vendor submitted it","Refuse payment entirely until all work is done","Pay $50K and dispute the rest later"],"answer":0,"why":"Invoiced amount exceeding earned value suggests billing ahead of progress. The PM should verify actual completion before authorizing payment.","mindset":"PMI mindset: EV provides an objective check against invoices. Don\u0027t pay based on billing alone â€” verify against actual progress.","tags":["Cost Control","EVM","Procurement"],"chapterRef":"Chapter 8 - Control Costs"}]},{"id":9,"title":"Chapter 9: Project Quality Management","summary":"Quality management focuses on planning quality, managing quality processes, and controlling deliverable quality.","notes":["Quality is the degree to which inherent characteristics fulfill requirements.","Quality must always be high, while grade can be low or high.","Continuous improvement is also known as Kaizen and focuses on small improvements to quality and processes.","Prevention is generally more cost-effective than inspection.","The three quality processes are Plan Quality Management, Manage Quality, and Control Quality.","Manage Quality focuses on processes used to produce deliverables.","Control Quality inspects deliverables to determine whether they meet quality standards and requirements.","Quality tools include flowcharts, checklists, check sheets, fishbone diagrams, histograms, audits, control charts, and testing."],"examples":["A basic TV can be low grade but high quality if it meets requirements.","A high-grade TV can still be low quality if it breaks often or has poor display quality.","A checklist confirms required items were reviewed; a check sheet counts defects.","A fishbone diagram helps identify possible causes of defects."],"podcast":[{"speaker":"Host 1","text":"Chapter 9 is Project Quality Management, and this chapter is very PMP mindset heavy. It is not just about inspecting work at the end. It is about understanding requirements, preventing defects, improving processes, and confirming deliverables meet standards."},{"speaker":"Host 2","text":"Exactly. Quality is defined as the degree to which a set of inherent characteristics fulfill requirements. So if requirements are unclear, quality becomes hard to prove."},{"speaker":"Host 1","text":"That is why collecting requirements correctly matters. If the project team does not understand what quality means for the stakeholder, the deliverable may fail even if the team thinks it did good work."},{"speaker":"Host 2","text":"Grade and quality are different. Grade is the category or level of features. Quality is whether the product meets requirements."},{"speaker":"Host 1","text":"A low-grade product can be high quality if it meets requirements. A high-grade product can be low quality if it fails, breaks, or does not meet requirements."},{"speaker":"Host 2","text":"The exam tip is simple: quality must always be high, while grade can be low or high."},{"speaker":"Host 1","text":"Just-in-time is also mentioned. It is where a product-based company maintains very low or no inventory and obtains latest products, helping with inventory quality and lower inventory cost."},{"speaker":"Host 2","text":"Plan-Do-Check-Act is another major quality theory. Plan means design or revise the process. Do means implement the plan and measure performance. Check means assess the measurements. Act means decide what changes are needed to improve the process."},{"speaker":"Host 1","text":"Continuous improvement, also called Kaizen, focuses on small changes to improve processes and quality. The key idea is that products and services become outdated if they are not continuously improved."},{"speaker":"Host 2","text":"And everyone is responsible for quality. Customers, project managers, team members, sponsors, and senior management all play a role."},{"speaker":"Host 1","text":"Prevention over inspection is a huge PMP mindset concept. It is generally more cost-effective to prevent defects than inspect after deliverables are already made."},{"speaker":"Host 2","text":"Prevention can include better planning, better materials, knowledgeable team members, and better equipment. The more prevention you build in, the fewer defects you should have later."},{"speaker":"Host 1","text":"Six Sigma focuses on improving processes to reduce defects. You do not need sigma calculations for the exam, but you do need to understand the theory."},{"speaker":"Host 2","text":"Now let’s separate attribute sampling and variable sampling. Attribute sampling is about presence or absence of characteristics. Good or bad. Yes or no. One or zero."},{"speaker":"Host 1","text":"Variable sampling measures degree. Something can be okay, good, very good, bad, or very bad. So attribute is binary, variable is degree."},{"speaker":"Host 2","text":"The three quality processes are Plan Quality Management, Manage Quality, and Control Quality."},{"speaker":"Host 1","text":"Plan Quality Management identifies quality requirements and documents how the project will meet them. The main outputs are the quality management plan and quality metrics."},{"speaker":"Host 2","text":"Quality metrics are used to measure deliverables and processes against quality standards. Examples include program load speed, software test coverage, and process improvements."},{"speaker":"Host 1","text":"Manage Quality is about executing the activities in the quality management plan. This is where quality assurance appears."},{"speaker":"Host 2","text":"Quality assurance ensures the correct processes are followed and processes are improved. Manage Quality focuses on the processes used to produce deliverables."},{"speaker":"Host 1","text":"Control Quality is different. Control Quality inspects completed deliverables to determine whether they meet quality standards and requirements."},{"speaker":"Host 2","text":"That is one of the biggest exam distinctions. Process focus equals Manage Quality. Deliverable inspection equals Control Quality."},{"speaker":"Host 1","text":"Now let’s talk tools. Benchmarking compares project quality requirements to other projects’ quality requirements. Cost-benefit analysis compares the benefits of meeting quality requirements against the cost of meeting them."},{"speaker":"Host 2","text":"Cost of quality includes cost of conformance and cost of nonconformance. Conformance includes prevention and appraisal costs. Nonconformance includes internal and external failure costs."},{"speaker":"Host 1","text":"A flowchart shows the process and room for improvement. If you want to make sure the team follows a process correctly, think flowchart."},{"speaker":"Host 2","text":"A checklist helps verify that deliverable components are checked correctly. A check sheet keeps a running total or tally of defects."},{"speaker":"Host 1","text":"A cause-and-effect diagram, also called a fishbone or Ishikawa diagram, identifies causes of defects and root causes of potential defects."},{"speaker":"Host 2","text":"Histograms are bar charts showing distribution of numerical data. They can show frequency of defects."},{"speaker":"Host 1","text":"Audits make sure the project follows organizational quality policies, processes, and procedures. They can also verify that approved change requests were implemented."},{"speaker":"Host 2","text":"Control charts show whether a process is in control. The mean is represented by the center line, and upper and lower control limits are typically three standard deviations from the mean."},{"speaker":"Host 1","text":"The rule of seven says if seven consecutive points fall on one side of the mean, the process must be inspected."},{"speaker":"Host 2","text":"Testing and product evaluations are used to verify that deliverables meet requirements. In software, examples include unit testing and integration testing."},{"speaker":"Host 1","text":"Final mindset for Chapter 9: quality is planned in, built through good processes, and confirmed through inspection and testing."},{"speaker":"Host 2","text":"Exactly. PMP wants the project manager to prevent defects, improve processes, understand requirements, use objective metrics, and confirm deliverables meet quality standards."}],"questions":[{"q":"How is quality defined in the notes?","options":["The degree to which inherent characteristics fulfill requirements","The number of features in a product","The cost of testing deliverables","The project manager’s opinion"],"answer":0,"why":"Quality is the degree to which inherent characteristics fulfill requirements.","mindset":"Quality starts with clear requirements.","chapterRef":"Chapter 9: Quality Definition","tags":["Quality"],"examLike":true,"temptingWrong":"The tempting wrong answers usually rely only on inspection. PMP prefers prevention, process improvement, and objective quality metrics."},{"q":"What is the difference between grade and quality?","options":["They mean the same thing","Grade is feature category; quality is meeting requirements","Quality is always lower than grade","Grade only applies to agile"],"answer":1,"why":"Grade is category/feature level; quality is whether requirements are met.","mindset":"Low grade can still be high quality.","chapterRef":"Chapter 9: Grade vs Quality","tags":["Quality"],"examLike":true,"temptingWrong":"The tempting wrong answers usually rely only on inspection. PMP prefers prevention, process improvement, and objective quality metrics."},{"q":"Which statement is true?","options":["Quality must always be high, while grade can be low or high","Grade must always be high","Low grade means low quality","High grade guarantees high quality"],"answer":0,"why":"Your notes state quality must always be high, while grade can be low or high.","mindset":"Do not confuse features with requirement fulfillment.","chapterRef":"Chapter 9: Grade vs Quality","tags":["Quality"],"examLike":true,"temptingWrong":"The tempting wrong answers usually rely only on inspection. PMP prefers prevention, process improvement, and objective quality metrics."},{"q":"What is Plan-Do-Check-Act used for?","options":["Process improvement","Contract selection","Communication channel counting","Float calculation"],"answer":0,"why":"PDCA is a process improvement cycle: plan, do, check, act.","mindset":"Quality is improved through measured process changes.","chapterRef":"Chapter 9: PDCA","tags":["Process","Quality"],"examLike":true,"temptingWrong":"The tempting wrong answers usually rely only on inspection. PMP prefers prevention, process improvement, and objective quality metrics."},{"q":"What is continuous improvement also known as?","options":["Kaizen","RACI","PERT","Sunk cost"],"answer":0,"why":"Continuous improvement is also called Kaizen.","mindset":"Kaizen focuses on small ongoing improvements.","chapterRef":"Chapter 9: Continuous Improvement","tags":["Concept","Quality"],"examLike":true,"temptingWrong":"The tempting wrong answers usually rely only on inspection. PMP prefers prevention, process improvement, and objective quality metrics."},{"q":"What is the principle of prevention over inspection?","options":["It is usually cheaper to prevent defects than inspect after they happen","Inspection should replace planning","Defects should be ignored until closeout","Only customers are responsible for quality"],"answer":0,"why":"Prevention is generally more cost-effective than inspection after deliverables are made.","mindset":"PMI favors proactive quality planning.","chapterRef":"Chapter 9: Prevention over Inspection","tags":["Formula","Quality"],"examLike":true,"temptingWrong":"The tempting wrong answers usually rely only on inspection. PMP prefers prevention, process improvement, and objective quality metrics."},{"q":"What does Six Sigma focus on?","options":["Improving processes to reduce defects","Counting stakeholders","Creating contracts","Estimating communication channels"],"answer":0,"why":"Six Sigma focuses on improving processes to reduce defects.","mindset":"For PMP, understand the theory, not sigma calculations.","chapterRef":"Chapter 9: Six Sigma","tags":["Concept","Quality"],"examLike":true,"temptingWrong":"The tempting wrong answers usually rely only on inspection. PMP prefers prevention, process improvement, and objective quality metrics."},{"q":"What is attribute sampling?","options":["Measuring presence or absence of characteristics","Measuring degree of performance","Calculating float","Ranking stakeholders"],"answer":0,"why":"Attribute sampling measures whether a characteristic is present or absent, such as yes/no or good/bad.","mindset":"Attribute is binary.","chapterRef":"Chapter 9: Attribute Sampling","tags":["Concept","Quality"],"examLike":true,"temptingWrong":"The tempting wrong answers usually rely only on inspection. PMP prefers prevention, process improvement, and objective quality metrics."},{"q":"What is variable sampling?","options":["Measuring degree of conformity or performance","Counting communication channels","A yes/no quality check","A procurement contract type"],"answer":0,"why":"Variable sampling measures degree, such as okay, good, very good, bad, or very bad.","mindset":"Variable sampling is not just yes/no.","chapterRef":"Chapter 9: Variable Sampling","tags":["Concept","Quality"],"examLike":true,"temptingWrong":"The tempting wrong answers usually rely only on inspection. PMP prefers prevention, process improvement, and objective quality metrics."},{"q":"What are the three quality management processes?","options":["Plan Quality Management, Manage Quality, Control Quality","Estimate Quality, Build Quality, Close Quality","Identify Quality, Rank Quality, Transfer Quality","Plan Scope, Validate Scope, Control Scope"],"answer":0,"why":"The notes list Plan Quality Management, Manage Quality, and Control Quality.","mindset":"Quality planning, assurance/process, and inspection/control are distinct.","chapterRef":"Chapter 9: Quality Processes","tags":["Process","Quality"],"examLike":true,"temptingWrong":"The tempting wrong answers usually rely only on inspection. PMP prefers prevention, process improvement, and objective quality metrics."},{"q":"What is a main output of Plan Quality Management?","options":["Quality management plan and quality metrics","Risk register","Resource calendar","Cost baseline"],"answer":0,"why":"Plan Quality Management outputs the quality management plan and quality metrics.","mindset":"Planning quality defines requirements and how they will be measured.","chapterRef":"Chapter 9: Plan Quality Management","tags":["Process","Quality"],"examLike":true,"temptingWrong":"The tempting wrong answers usually rely only on inspection. PMP prefers prevention, process improvement, and objective quality metrics."},{"q":"What are quality metrics used for?","options":["Measuring deliverables and processes against standards","Selecting sellers only","Counting stakeholders","Calculating SPI"],"answer":0,"why":"Quality metrics measure project quality for deliverables and processes.","mindset":"Metrics make quality objective.","chapterRef":"Chapter 9: Quality Metrics","tags":["Quality"],"examLike":true,"temptingWrong":"The tempting wrong answers usually rely only on inspection. PMP prefers prevention, process improvement, and objective quality metrics."},{"q":"What does Manage Quality focus on?","options":["Processes used to produce deliverables","Final inspection of completed deliverables only","Contract closeout","Schedule compression"],"answer":0,"why":"Manage Quality includes quality assurance and focuses on processes followed while creating deliverables.","mindset":"Process focus = Manage Quality.","chapterRef":"Chapter 9: Manage Quality","tags":["Process","Quality"],"examLike":true,"temptingWrong":"The tempting wrong answers usually rely only on inspection. PMP prefers prevention, process improvement, and objective quality metrics."},{"q":"What does Control Quality focus on?","options":["Inspecting deliverables to determine whether they meet requirements","Creating the team charter","Developing the cost baseline","Identifying stakeholders"],"answer":0,"why":"Control Quality inspects deliverables to determine whether they meet quality requirements.","mindset":"Deliverable inspection = Control Quality.","chapterRef":"Chapter 9: Control Quality","tags":["Process","Quality"],"examLike":true,"temptingWrong":"The tempting wrong answers usually rely only on inspection. PMP prefers prevention, process improvement, and objective quality metrics."},{"q":"Which tool helps verify deliverable components are checked correctly?","options":["Checklist","Check sheet","Histogram","Bubble chart"],"answer":0,"why":"A checklist helps the project manager determine what to check when inspecting deliverables.","mindset":"Checklist checks items.","chapterRef":"Chapter 9: Checklists","tags":["Quality"],"examLike":true,"temptingWrong":"The tempting wrong answers usually rely only on inspection. PMP prefers prevention, process improvement, and objective quality metrics."},{"q":"Which tool keeps a running total or tally of defects?","options":["Check sheet","Checklist","Flowchart","RACI chart"],"answer":0,"why":"A check sheet gathers defects and keeps a running total.","mindset":"Check sheet counts defects.","chapterRef":"Chapter 9: Check Sheets","tags":["Quality"],"examLike":true,"temptingWrong":"The tempting wrong answers usually rely only on inspection. PMP prefers prevention, process improvement, and objective quality metrics."},{"q":"What is a fishbone diagram also called?","options":["Ishikawa or cause-and-effect diagram","RACI chart","Gantt chart","Burnup chart"],"answer":0,"why":"A fishbone diagram is also called an Ishikawa or cause-and-effect diagram.","mindset":"Use fishbone for causes/root causes of defects.","chapterRef":"Chapter 9: Cause-and-Effect Diagrams","tags":["Concept","Quality"],"examLike":true,"temptingWrong":"The tempting wrong answers usually rely only on inspection. PMP prefers prevention, process improvement, and objective quality metrics."},{"q":"What do histograms show?","options":["Frequency/distribution of numerical data","Contract type risk","Stakeholder power only","Project funding timing"],"answer":0,"why":"Histograms are bar charts showing distribution/frequency of numerical data.","mindset":"Use histograms to see frequency of defects.","chapterRef":"Chapter 9: Histograms","tags":["Concept","Quality"],"examLike":true,"temptingWrong":"The tempting wrong answers usually rely only on inspection. PMP prefers prevention, process improvement, and objective quality metrics."},{"q":"What is an audit used for in quality?","options":["Ensuring policies, processes, and procedures are followed","Approving the project charter","Calculating EAC","Setting stakeholder urgency"],"answer":0,"why":"Audits ensure the project follows organizational quality policies, processes, and procedures.","mindset":"Audits check process compliance and implementation.","chapterRef":"Chapter 9: Audits","tags":["Quality"],"examLike":true,"temptingWrong":"The tempting wrong answers usually rely only on inspection. PMP prefers prevention, process improvement, and objective quality metrics."},{"q":"What does the Rule of Seven indicate on a control chart?","options":["If seven consecutive points fall on one side of the mean, inspect the process","Seven defects means close the project","Seven stakeholders means 21 channels","Seven activities make a critical path"],"answer":0,"why":"The Rule of Seven says the process must be inspected if seven consecutive points fall on one side of the mean.","mindset":"Control charts show when processes may be out of control.","chapterRef":"Chapter 9: Control Charts","tags":["Formula","Process","Quality"],"examLike":true,"temptingWrong":"The tempting wrong answers usually rely only on inspection. PMP prefers prevention, process improvement, and objective quality metrics."},{"q":"A defect is found during final testing. The team says \u0027We can fix it in a patch after release.\u0027 The deadline is tomorrow. What should you do?","options":["Assess the defect severity and customer impact. If it\u0027s critical, delay release to fix it â€” delivering a known-defective product damages trust more than a short delay.","Release on time with the defect since deadlines matter more than quality","Let the customer decide whether to accept the defect","Fix it without testing since there\u0027s no time"],"answer":0,"why":"Quality means meeting requirements. Knowingly releasing defects without customer awareness violates PMI principles. Assess severity and make an informed decision.","mindset":"PMI mindset: schedule pressure doesn\u0027t justify releasing known-defective products. Quality is non-negotiable â€” assess impact and decide deliberately.","tags":["Quality Control","Decision Making"],"chapterRef":"Chapter 9 - Control Quality"},{"q":"Your team spends 30% of their time on rework. A stakeholder says \u0027That\u0027s just how it is in our industry.\u0027 What should you recommend?","options":["Investigate root causes of rework and implement prevention activities â€” 30% rework indicates a process problem, not an industry standard","Accept it since the stakeholder said it\u0027s normal","Add 30% buffer to all future estimates","Hire more people to handle the rework volume"],"answer":0,"why":"High rework indicates process failure. PMI emphasizes prevention over inspection. Root cause analysis and process improvement can reduce rework significantly.","mindset":"PMI mindset: quality problems are process problems. Don\u0027t normalize waste. Invest in prevention to eliminate the root cause.","tags":["Quality Management","Prevention","Continuous Improvement"],"chapterRef":"Chapter 9 - Manage Quality"},{"q":"What is the difference between Manage Quality and Control Quality?","options":["Manage Quality focuses on the process (are we using the right methods?) while Control Quality inspects deliverables (does the output meet specifications?)","They are the same thing with different names","Manage Quality is for the PM; Control Quality is for the team","Control Quality comes before Manage Quality"],"answer":0,"why":"Manage Quality = process auditing and improvement. Control Quality = deliverable inspection. Process comes before product â€” get the process right and outputs improve.","mindset":"PMI mindset: if your process is right, outputs will be right. Manage Quality improves HOW work is done; Control Quality verifies WHAT was produced.","tags":["Manage Quality","Control Quality"],"chapterRef":"Chapter 9 - Quality Processes"},{"q":"The quality team wants to inspect 100% of deliverables. The project has 10,000 units to produce. What should you recommend?","options":["Statistical sampling â€” inspect a representative sample to draw conclusions about the whole lot. 100% inspection is cost-prohibitive and often unnecessary.","Inspect all 10,000 units regardless of cost","Skip inspection entirely to save time","Inspect only the first and last units"],"answer":0,"why":"100% inspection is rarely practical at scale. Statistical sampling provides confidence in quality at reasonable cost â€” it\u0027s the standard approach for large volumes.","mindset":"PMI mindset: use the right tool for the scale. Statistical sampling balances confidence and cost.","tags":["Quality Control","Statistical Sampling","Inspection"],"chapterRef":"Chapter 9 - Quality Tools"},{"q":"A quality audit reveals that the team is not following the documented process. However, their outputs meet specifications. What should you do?","options":["Investigate why the process isn\u0027t being followed â€” it may be outdated or impractical. Update the process OR enforce compliance, but don\u0027t ignore the gap.","Ignore it since outputs are good","Force compliance immediately with no discussion","Eliminate the documented process since it\u0027s not needed"],"answer":0,"why":"Process non-compliance is a governance issue even when outputs seem fine. The process may catch problems the team got lucky on. Investigate and resolve.","mindset":"PMI mindset: good outputs today don\u0027t guarantee good outputs tomorrow. Process compliance provides consistency and predictability.","tags":["Quality Audit","Process Compliance","Manage Quality"],"chapterRef":"Chapter 9 - Quality Audits"},{"q":"Your project has a high cost of quality â€” mostly in failure costs (rework, scrap). Where should you invest to reduce total cost of quality?","options":["Invest more in prevention (training, process improvement, better tools) â€” prevention reduces failures, which reduces total cost of quality even though appraisal costs may also increase slightly","Reduce inspection to lower appraisal costs","Accept the failures as unavoidable","Invest in faster rework processes"],"answer":0,"why":"Prevention is the cheapest category of quality cost. Every dollar spent on prevention saves multiple dollars in failure costs.","mindset":"PMI mindset: cost of quality follows a pattern â€” prevention investment reduces failure costs disproportionately. Prevention \u003e inspection \u003e failure.","tags":["Cost of Quality","Prevention","Quality Investment"],"chapterRef":"Chapter 9 - Cost of Quality"},{"q":"A team member says \u0027The customer didn\u0027t ask for that level of quality â€” we\u0027re over-engineering.\u0027 The specs are minimal but your team is building to a higher standard. What should you do?","options":["Review the quality requirements with the team â€” gold-plating (adding unrequested quality) wastes resources. Build to the specified requirements, not beyond.","Always build to the highest possible quality regardless of requirements","Let the team decide their own quality standards","Lower quality below what\u0027s specified to save money"],"answer":0,"why":"Gold-plating adds unrequested features or quality levels. It wastes resources and may not add value. Build to requirements â€” no more, no less.","mindset":"PMI mindset: quality means conformance to requirements, not excellence beyond what\u0027s asked. Gold-plating is waste.","tags":["Gold-Plating","Quality Requirements"],"chapterRef":"Chapter 9 - Define Quality"},{"q":"During a retrospective, the team identifies that defects cluster around a specific module. What quality tool would BEST help identify the root cause?","options":["A cause-and-effect (fishbone/Ishikawa) diagram to systematically explore all potential root causes across categories","A Gantt chart to see if the module was rushed","A RACI matrix to find who\u0027s responsible","A stakeholder register to identify who owns the module"],"answer":0,"why":"Fishbone diagrams systematically decompose potential causes into categories (methods, materials, machines, people, environment). They\u0027re designed for root cause analysis.","mindset":"PMI mindset: use the right tool for the problem. Root cause analysis needs structured decomposition, not project management artifacts.","tags":["Root Cause Analysis","Quality Tools","Fishbone Diagram"],"chapterRef":"Chapter 9 - Quality Tools"},{"q":"Your project delivered on time and on budget, but the customer reports frequent issues in production. Your quality metrics all passed during the project. What likely went wrong?","options":["The quality metrics may have measured the wrong things â€” they validated specifications but not actual fitness for use in the customer\u0027s real environment","Nothing went wrong â€” post-delivery issues aren\u0027t the project\u0027s problem","The customer is using the product incorrectly","The testing team failed"],"answer":0,"why":"Quality is about meeting customer needs, not just passing tests. If metrics pass but the product fails in use, the metrics weren\u0027t measuring the right things.","mindset":"PMI mindset: quality = fitness for purpose. Passing internal tests isn\u0027t enough if the product doesn\u0027t work in the real world. Validate assumptions.","tags":["Quality","Customer Satisfaction","Validation"],"chapterRef":"Chapter 9 - Quality Planning"},{"q":"Management wants to cut the testing phase by 50% to meet a deadline. What should you communicate?","options":["Present the risk â€” reduced testing means more defects reach the customer, increasing warranty costs, reputation damage, and post-release support. Show the cost tradeoff.","Agree since management made the decision","Cut testing to zero since 50% cut doesn\u0027t help enough","Test faster by assigning more people"],"answer":0,"why":"Cutting testing increases risk of undetected defects reaching customers. The PM should quantify this risk and present the tradeoff â€” not silently comply or refuse.","mindset":"PMI mindset: make risks visible. When quality is compressed, quantify the downstream impact so decision-makers understand what they\u0027re accepting.","tags":["Quality","Risk","Decision Making"],"chapterRef":"Chapter 9 - Control Quality"}]},{"id":10,"title":"Chapter 10: Project Resource Management","summary":"Chapter 10: Project Resource Management","notes":["Chapter 10: Project Resource Management","Resources are the backbone of any project","Resources are generally categorized into two main types: • Physical resources • Human resources","Physical resources generally include: • Materials • Equipment • Facilities","Human resources would be the project team","In this knowledge area, you will be: • Organizing the project team • Leading the project team to complete the project","This is an important knowledge area for the exam • Expect several questions on human resources • Expect questions on conflict management from these processes","Project management deals a lot with managing people","All projects have people, and this may be one of the hardest aspects of project management","A dysfunctional project team is more likely to produce a failed deliverable","One of the project manager’s main jobs: • Ensure the team functions well • Manage conflicts that occur as the project progresses","On an agile project: • The project team usually plays an important role • Team members are usually the main decision-makers and problem-solvers","On agile projects, the project manager is more of a “servant-leader” • Provides the tools the team needs to complete the work","Professional and ethical behaviors must be maintained within project development","The team should: • Be aware of professional and ethical behaviors • Follow those behaviors","The project man  physical resources?","options":["Materials, equipment, and facilities","Sponsors and customers only","Stakeholder expectations","Communication channels"],"answer":0,"why":"Physical resources include materials, equipment, and facilities.","mindset":"Do not limit resources to people only.","chapterRef":"Chapter 10: Physical Resources","tags":["Resource"],"examLike":true,"temptingWrong":"The tempting wrong answers usually jump to command-and-control. PMP prefers servant leadership, training, role clarity, and removing impediments."},{"q":"What is one of the project manager’s main jobs with the team?","options":["Ensure the team functions well and manage conflicts","Avoid all communication","Select only sellers","Create the cost baseline only"],"answer":0,"why":"The PM ensures the team functions well and manages conflicts as the project progresses.","mindset":"Projects succeed through people as much as process.","chapterRef":"Chapter 10: Team Management","tags":["Scenario","Process","Resource"],"examLike":true,"temptingWrong":"The tempting wrong answers usually jump to command-and-control. PMP prefers servant leadership, training, role clarity, and removing impediments."},{"q":"What is the project manager’s role on agile projects according to the notes?","options":["Servant-leader who provides tools and support","Dictator who makes every technical decision","Seller representative","Passive observer"],"answer":0,"why":"On agile projects, the PM is more of a servant-leader who provides the tools the team needs.","mindset":"Servant leadership supports and removes barriers.","chapterRef":"Chapter 10: Agile Resource Management","tags":["Scenario","Agile","Process","Resource"],"examLike":true,"temptingWrong":"The tempting wrong answers usually jump to command-and-control. PMP prefers servant leadership, training, role clarity, and removing impediments."},{"q":"What does Plan Resource Management identify?","options":["Roles, responsibilities, reporting, and how resources are
