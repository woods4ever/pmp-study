r the project."},{"speaker":"Maya","text":"One key point is this: Only assume seller perspective if the question specifically says you are a seller."},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. Agreements and contracts are generally considered the same on the PMP exam."},{"speaker":"Maya","text":"One key point is this: A contract is a legally binding agreement between a buyer and a seller for products, services, or results."},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. A contract is not legal if it is for illegal work (crime) to be performed."},{"speaker":"Maya","text":"One key point is this: A contract can be terminated by both buyer and seller for work not getting done or payments not being made."},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. Contracts generally include the following:"},{"speaker":"Maya","text":"One key point is this: Formal written document"},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. Scope of work to be performed"},{"speaker":"Maya","text":"One key point is this: Roles and responsibilities"},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. How to perform the work, including locations and times"},{"speaker":"Maya","text":"One key point is this: Terms and conditions"},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. Warranties and penalties"},{"speaker":"Maya","text":"One key point is this: Payment terms"},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. Termination clauses"},{"speaker":"Maya","text":"So the big takeaway is not just knowing the definition. You want to ask: what is happening in the scenario, who is impacted, what process should be used, and what should the project manager do next?"},{"speaker":"Jordan","text":"Right. Slow down, do not jump straight to escalation, and use the correct PMP process. That is how this chapter turns into points on the exam."}],"questions":[{"q":"What is procurement management about?","options":["Getting products, services, or results from outside the project team","Managing only internal team conflicts","Calculating float","Creating quality metrics"],"answer":0,"why":"Procurement management is about acquiring products, services, or results from outside the project team.","mindset":"Procurement means outside acquisition.","chapterRef":"Chapter 13: Procurement Management","tags":["Process","Procurement"],"examLike":true,"temptingWrong":"The tempting wrong answers usually ignore buyer/seller risk ownership or use the wrong contract type for the scope clarity."},{"q":"From what perspective are PMP procurement questions generally written?","options":["Buyer","Seller","Auditor only","End user only"],"answer":0,"why":"The notes say PMP procurement questions are generally from the buyer perspective unless stated otherwise.","mindset":"Assume buyer unless the question explicitly says seller.","chapterRef":"Chapter 13: Exam Perspective","tags":["Procurement"],"examLike":true,"temptingWrong":"The tempting wrong answers usually ignore buyer/seller risk ownership or use the wrong contract type for the scope clarity."},{"q":"What is a contract?","options":["A legally binding agreement between buyer and seller","A stakeholder map","A quality metric","A risk category"],"answer":0,"why":"A contract is a legally binding agreement between a buyer and seller for products, services, or results.","mindset":"Agreement and contract are generally considered the same on the PMP exam.","chapterRef":"Chapter 13: Contracts","tags":["Procurement"],"examLike":true,"temptingWrong":"The tempting wrong answers usually ignore buyer/seller risk ownership or use the wrong contract type for the scope clarity."},{"q":"What are the three main contract types?","options":["Fixed price, time and material, cost-reimbursable","Push, pull, interactive","ROM, budget, definitive","Avoid, transfer, accept"],"answer":0,"why":"The notes list fixed price, time and material, and cost-reimbursable as the three main contract types.","mindset":"Contract type drives buyer/seller risk.","chapterRef":"Chapter 13: Contract Types","tags":["Procurement"],"examLike":true,"temptingWrong":"The tempting wrong answers usually ignore buyer/seller risk ownership or use the wrong contract type for the scope clarity."},{"q":"When is a fixed price contract best used?","options":["When scope is well-defined","When scope is unknown","When buyer wants all cost risk","When work is illegal"],"answer":0,"why":"Fixed price works when scope is well-defined and understood.","mindset":"Defined scope supports a fixed price.","chapterRef":"Chapter 13: Fixed Price","tags":["Procurement","Scenario"],"examLike":true,"temptingWrong":"The tempting wrong answers usually ignore buyer/seller risk ownership or use the wrong contract type for the scope clarity."},{"q":"Who takes most cost overrun risk in a fixed price contract?","options":["Seller","Buyer","Project sponsor only","Customer only"],"answer":0,"why":"In fixed price, the seller takes the risk of exceeding cost constraints.","mindset":"Fixed price shifts cost risk to the seller.","chapterRef":"Chapter 13: Fixed Price Risk","tags":["Procurement","Risk"],"examLike":true,"temptingWrong":"The tempting wrong answers usually skip the risk process. PMP wants you to identify, analyze, plan, and monitor risk instead of reacting emotionally."},{"q":"What is Firm Fixed Price?","options":["Price is fixed and cannot be changed","Buyer pays all expenses plus fee","Hourly labor and materia ype for the scope clarity."},{"q":"Who takes more risk in cost-reimbursable contracts?","options":["Buyer","Seller","Auditor","No one"],"answer":0,"why":"The buyer takes risk because they cover cost overruns of work expenses.","mindset":"Buyer must monitor costs carefully.","chapterRef":"Chapter 13: Cost Reimbursable Risk","tags":["Procurement","Risk"],"examLike":true,"temptingWrong":"The tempting wrong answers usually skip the risk process. PMP wants you to identify, analyze, plan, and monitor risk instead of reacting emotionally."},{"q":"What is CPFF?","options":["Cost Plus Fixed Fee","Cost Plus Flexible Funding","Contract Price Final Form","Customer Payment Fixed Funding"],"answer":0,"why":"CPFF means the buyer pays work expense plus a fixed fee to the seller.","mindset":"CPFF is a cost-reimbursable subtype.","chapterRef":"Chapter 13: CPFF","tags":["Concept","Procurement"],"examLike":true,"temptingWrong":"The tempting wrong answers usually ignore buyer/seller risk ownership or use the wrong contract type for the scope clarity."},{"q":"What is CPIF?","options":["Cost Plus Incentive Fee","Cost Price Internal Funding","Contract Plan Incentive Form","Customer Procurement Information File"],"answer":0,"why":"CPIF pays work expense plus an additional fee if a target is met.","mindset":"Incentive fee rewards target achievement.","chapterRef":"Chapter 13: CPIF","tags":["Formula","Procurement"],"examLike":true,"temptingWrong":"The tempting wrong answers usually ignore buyer/seller risk ownership or use the wrong contract type for the scope clarity."},{"q":"When should time and material be used?","options":["When scope is high-level","When scope is fully defined and fixed","Only when no materials exist","Only for internal staff"],"answer":0,"why":"Time and material should be used when scope is high-level.","mindset":"T&M can expose buyer to cost overrun risk.","chapterRef":"Chapter 13: Time and Material","tags":["Concept","Procurement"],"examLike":true,"temptingWrong":"The tempting wrong answers usually ignore buyer/seller risk ownership or use the wrong contract type for the scope clarity."},{"q":"Who takes cost overrun risk in time and material?","options":["Buyer","Seller only","Neither","External auditor"],"answer":0,"why":"The buyer takes cost overrun risk for labor and materials in time and material contracts.","mindset":"Buyer must monitor T&M work closely.","chapterRef":"Chapter 13: Time and Material Risk","tags":["Risk","Procurement"],"examLike":true,"temptingWrong":"The tempting wrong answers usually skip the risk process. PMP wants you to identify, analyze, plan, and monitor risk instead of reacting emotionally."},{"q":"What is Plan Procurement Management used to determine?","options":["What to acquire, how, how much, and when","Only team ground rules","Only quality thresholds","Only stakeholder engagement"],"answer":0,"why":"Plan Procurement determines whether anything needs to be procured and how procurement will be planned.","mindset":"Procurement planning starts with make/acquire decisions.","chapterRef":"Chapter 13: Plan Procurement","tags":["Process","Procurement"],"examLike":true,"temptingWrong":"The tempting wrong answers usually ignore buyer/seller risk ownership or use the wrong contract type for the scope clarity."},{"q":"What is market research used for?","options":["Determining normal industry standards for work","Calculating CPI","Counting stakeholders","Inspecting deliverables"],"answer":0,"why":"Market research determines normal industry standards for the work.","mindset":"Use market research to understand seller/industry options.","chapterRef":"Chapter 13: Market Research","tags":["Concept","Procurement"],"examLike":true,"temptingWrong":"The tempting wrong answers usually ignore buyer/seller risk ownership or use the wrong contract type for the scope clarity."},{"q":"What does make-or-buy analysis decide?","options":["Whether work should be done internally or purchased externally","How many communication c ."},{"q":"What is upward influence?","options":["Senior management","Team members","Vendors","End users"],"answer":0,"why":"Upward influence refers to senior management.","mindset":"Direction of influence classifies stakeholder influence paths.","chapterRef":"Chapter 14: Directions of Influence","tags":["Concept","Stakeholder"],"examLike":true,"temptingWrong":"The tempting wrong answers usually ignore engagement. PMP wants you to identify, analyze, communicate, and engage stakeholders proactively."},{"q":"What is downward influence?","options":["Team members","Senior management","Government","Peers"],"answer":0,"why":"Downward influence refers to team members.","mindset":"Downward = those below or reporting into project work.","chapterRef":"Chapter 14: Directions of Influence","tags":["Concept","Stakeholder"],"examLike":true,"temptingWrong":"The tempting wrong answers usually ignore engagement. PMP wants you to identify, analyze, communicate, and engage stakeholders proactively."},{"q":"What is outward influence?","options":["Vendors, government, public, or end-users","Only team members","Only sponsor","Only other PMs"],"answer":0,"why":"Outward influence includes vendors, government, public, and end-users.","mindset":"Outward stakeholders are outside the core project/team hierarchy.","chapterRef":"Chapter 14: Directions of Influence","tags":["Concept","Stakeholder"],"examLike":true,"temptingWrong":"The tempting wrong answers usually ignore engagement. PMP wants you to identify, analyze, communicate, and engage stakeholders proactively."},{"q":"What should the stakeholder register contain?","options":["Contact info, role, communication requirements, expectations, impact, and power/influence","Only test results","Only BAC and CPI","Only contract incentives"],"answer":0,"why":"The stakeholder register contains stakeholder contact info, role, communication requirements, expectations, impact, and power/influence level.","mindset":"The register is sensitive and should be function speakLine(ch,index){if(!("speechSynthesis" in window)){alert("Your browser does not support text-to-speech.");return} if(index>=ch.podcast.length){isSpeaking=false;isPaused=false;activePodcast=null;podcastIndex=0;lastPodcastId=null;lastPodcastIndex=0;render();return} activePodcast=ch.id;podcastIndex=index;lastPodcastId=ch.id;lastPodcastIndex=index;isSpeaking=true;isPaused=false;render();let line=ch.podcast[index];let u=new SpeechSynthesisUtterance(line.text);u.rate=speechRate;u.pitch=line.speaker==="Host 1"?1.02:.92;u.voice=line.speaker==="Host 1"?voiceA:voiceB;u.onend=()=>{if(isSpeaking&&activePodcast===ch.id&&!isPaused)speakLine(ch,index+1)};u.onerror=()=>{isSpeaking=false;isPaused=false;render()};speechSynthesis.speak(u);}
function playPodcast(id){
  loadVoices();
  let ch=chapters.find(c=>c.id===id);
  if(!("speechSynthesis" in window)){alert("Try Chrome, Edge, or Safari for speech.");return}
  if(isPaused&&activePodcast===id){
    // Browser resume can fail after lock/interruption, so restart the current saved line.
    speechSynthesis.cancel();
    speakLine(ch, lastPodcastIndex || podcastIndex || 0);
    return;
  }
  speechSynthesis.cancel();
  const startIndex = (lastPodcastId===id && lastPodcastIndex>0) ? lastPodcastIndex : 0;
  speakLine(ch,startIndex);
}
function pausePodcast(){if("speechSynthesis" in window&&isSpeaking){lastPodcastId=activePodcast;lastPodcastIndex=podcastIndex;speechSynthesis.pause();isPaused=true;isSpeaking=false;render();}}
function restartPodcast(id){stopPodcast(false);playPodcast(id);}
function stopPodcast(r=true){if("speechSynthesis" in window)speechSynthesis.cancel();isSpeaking=false;isPaused=false;activePodcast=null;podcastIndex=0;lastPodcastId=null;lastPodcastIndex=0;if(r)render();}

function jumpToPodcastLine(id,index){
  loadVoices();
  const ch=chapters.find(c=>c.id===id);
  if(!("speechSynthesis" in window)){alert("Try Chrome, Edge, or Safari for speech.");return}
  speechSynthesis.cancel();
  activePodcast=id;
  podcastIndex=index;
  lastPodcastId=id;
  lastPodcastIndex=index;
  isPaused=false;
  isSpeaking=true;
  speakLine(ch,index);
}


function getAllQuestions(){
  return chapters.flatMap(ch => ch.questions.map(q => ({...q, chapterTitle: ch.title, chapterId: ch.id})));
}

function addToReviewQueue(question, reason){
  const item = {
    id: question.q,
    q: question.q,
    chapterRef: question.chapterRef,
    chapterTitle: question.chapterTitle || "",
    tags: question.tags || [],
    reason,
    due: new Date(Date.now() + 24*60*60*1000).toLocaleDateString()
  };
  if(!reviewQueue.some(x => x.id === item.id)){
    reviewQueue.push(item);
  }
}

function getStats(){
  const attempts = studyHistory.flatMap(s => s.results || []);
  const byChapter = {};
  const byTag = {};
  let confidentWrong = 0, confidentCorrect = 0, unsureCorrect = 0, guessCorrect = 0, guessWrong = 0;
  attempts.forEach(r => {
    const correct = r.selected === r.question.answer;
    const ch = r.question.chapterTitle || r.question.chapterRef || "Unknown";
    if(!byChapter[ch]) byChapter[ch] = {total:0, correct:0, time:0};
    byChapter[ch].total++;
    if(correct) byChapter[ch].correct++;
    byChapter[ch].time += r.timeSpent || 0;
    (r.question.tags || ["Concept"]).forEach(t => {
      if(!byTag[t]) byTag[t] = {total:0, correct:0};
      byTag[t].total++;
      if(correct) byTag[t].correct++;
    });
    if(r.confidence === "confident" && correct) confidentCorrect++;
    if(r.confidence === "confident" && !correct) confidentWrong++;
    if(r.confidence === "unsure" && correct) unsureCorrect++;
    if(r.confidence === "guess" && correct) guessCorrect++;
    if(r.confidence === "guess" && !correct) guessWrong++;
  });
  return {attempts, byChapter, byTag, confidentCorrect, confidentWrong, unsureCorrect, guessCorrect, guessWrong};
}

function weakestChapter(){
  const stats = getStats();
  let weakest = null;
  Object.entries(stats.byChapter).forEach(([name, s]) => {
    if(s.total < 1) return;
    const acc = s.correct / s.total;
    if(!weakest || acc < weakest.acc) weakest = {name, ...s, acc};
  });
  return weakest;
}

function weakestTag(){
  const stats = getStats();
  let weakest = null;
  Object.entries(stats.byTag).forEach(([tag, s]) => {
    if(s.total < 1) return;
    const acc = s.correct / s.total;
    if(!weakest || acc < weakest.acc) weakest = {tag, ...s, acc};
  });
  return weakest;
}

function pmiMindsetFor(question){
  const text = ((question.q || "") + " " + (question.chapterRef || "") + " " + (question.tags||[]).join(" ")).toLowerCase();
  if(text.includes("conflict") || text.includes("team") || text.includes("servant")){
    return "PMI mindset: support the team, understand the issue, coach where needed, and avoid command-and-control unless the situation is severe.";
  }
  if(text.includes("risk")){
    return "PMI mindset: identify and document risks early, analyze probability/impact, plan responses, and monitor continuously.";
  }
  if(text.includes("stakeholder")){
    return "PMI mindset: identify stakeholders early, understand their needs/influence, engage them proactively, and tailor communication.";
  }
  if(text.includes("change") || text.includes("baseline")){
    return "PMI mindset: do not change baselines informally. Analyze impact and follow change control.";
  }
  if(text.includes("contract") || text.includes("procurement")){
    return "PMI mindset: assume buyer perspective unless told otherwise, choose the contract that best fits scope clarity and risk ownership.";
  }
  if(text.includes("communication")){
    return "PMI mindset: communication is not complete until the receiver understands. Tailor the method to urgency, complexity, and stakeholder need.";
  }
  if(text.includes("quality")){
    return "PMI mindset: build quality in through prevention and process improvement; do not rely only on final inspection.";
  }
  return "PMI mindset: analyze first, use the right process, collaborate, avoid knee-jerk escalation, and choose the answer that protects project value.";
}

function trapPatternFor(question){
  const q = question.q || "";
  const traps = ["FIRST","NEXT","BEST","MOST","LEAST","EXCEPT","ALWAYS","NEVER","AVOID","IMMEDIATELY","ONLY","NOT"];
  const found = traps.filter(t => new RegExp("\\b"+t+"\\b","i").test(q));
  return found.length ? "Trap words detected: " + found.join(", ") + ". Slow down and answer exactly what the question asks." : "No major trap words detected. Still check whether the question asks for first, next, best, or exception logic.";
}

function getReadiness(){
  const stats = getStats();
  const attempts = stats.attempts || [];
  const total = attempts.length;
  const correct = attempts.filter(r => r.selected === r.question.answer).length;
  const accuracy = total ? correct / total : 0;
  const avgTime = total ? attempts.reduce((s,r)=>s+(r.timeSpent||0),0)/total : 999;
  const confidentWrongRate = total ? stats.confidentWrong / total : 0;
  const weakTag = weakestTag();
  const weakPenalty = weakTag && weakTag.acc < .65 ? .10 : 0;
  let score = 0;
  score += Math.min(.55, accuracy * .55);
  score += avgTime <= 80 ? .20 : avgTime <= 95 ? .14 : .07;
  score += confidentWrongRate <= .05 ? .15 : confidentWrongRate <= .10 ? .08 : .02;
  score += reviewQueue.length <= 10 ? .10 : reviewQueue.length <= 25 ? .05 : .01;
  score = Math.max(0, Math.min(1, score - weakPenalty));
  const pct = Math.round(score * 100);
  let level = "Not ready yet";
  if(pct >= 85) level = "Exam-ready trend";
  else if(pct >= 70) level = "Close, keep tightening weak areas";
  else if(pct >= 55) level = "Building foundation";
  return {pct, level, accuracy:Math.round(accuracy*100), avgTime:Math.round(avgTime === 999 ? 0 : avgTime), confidentWrong:stats.confidentWrong, total};
}

function readinessViewBlock(){
  const r = getReadiness();
  const cls = r.pct >= 85 ? "readiness-good" : r.pct >= 70 ? "readiness-mid" : "readiness-low";
  return `<div class="readiness-meter"><p>Exam Readiness Score</p><div class="readiness-score ${cls}">${r.pct}%</div><h3>${r.level}</h3><p>Accuracy: ${r.accuracy}% • Avg time: ${r.avgTime}s • Confident+Wrong: ${r.confidentWrong}</p></div>`;
}

function buildExamQuestionSet(){
  let all = getAllQuestions();
  let set = [];
  // Repeat/shuffle existing bank to simulate 180 questions without inventing unsupported content.
  while(set.length < 180){
    set = set.concat(all.sort(()=>Math.random()-.5));
  }
  return set.slice(0,180).map((q,i)=>({...q, examNumber:i+1}));
}

function startExamTimer(){
  if(examTimerInterval) clearInterval(examTimerInterval);
  examTimerInterval = setInterval(()=>{
    if(screen !== "quiz" || quizMode !== "fullExam"){
      clearInterval(examTimerInterval);
      examTimerInterval=null;
      return;
    }
    examElapsed = Math.floor((Date.now() - examStartTime)/1000);
    updateExamTimerUI();
    if(examElapsed >= examDurationSeconds){
      finishExamDueToTime();
    }
  },1000);
}

function updateExamTimerUI(){
  const clock = document.getElementById("examClock");
  const status = document.getElementById("examTimeStatus");
  if(!clock || !status) return;
  const remaining = Math.max(0, examDurationSeconds - examElapsed);
  const h = Math.floor(remaining/3600);
  const m = Math.floor((remaining%3600)/60);
  const s = remaining%60;
  clock.textContent = `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  status.className = remaining < 900 ? "exam-danger" : remaining < 1800 ? "exam-warning" : "";
  status.textContent = remaining < 900 ? "Final push" : remaining < 1800 ? "Watch your pace" : "Exam timer running";
}

function finishExamDueToTime(){
  if(examTimerInterval) clearInterval(examTimerInterval);
  examTimerInterval=null;
  while(quizResults.length < quizQuestions.length){
    const q = quizQuestions[quizResults.length];
    quizResults.push({question:q, selected:-1, confidence:"unanswered", timeSpent:0, eliminated:[]});
  }
  studyHistory.push({date:new Date().toLocaleString(), mode:quizMode, results:quizResults});
  save();
  screen="results";
  render();
}

function nextQuestion(){
  let q=quizQuestions[quizIndex];
  quizResults.push({question:q,selected:selectedOption,confidence,timeSpent:questionElapsed,eliminated:[...eliminatedOptions]});
  const latest = quizResults[quizResults.length-1];
  const isCorrect = latest.selected === latest.question.answer;
  if(!isCorrect) addToReviewQueue(latest.question, "Missed");
  if(latest.confidence === "guess") addToReviewQueue(latest.question, "Guessed");
  if(latest.confidence === "unsure") addToReviewQueue(latest.question, "Low confidence");
  if(latest.confidence === "confident" && !isCorrect) addToReviewQueue(latest.question, "Confident + wrong");

  if(quizIndex>=quizQuestions.length-1){
    if(questionTimerInterval) clearInterval(questionTimerInterval);
    questionTimerInterval = null;
    if(examTimerInterval) clearInterval(examTimerInterval);
    examTimerInterval = null;
    quizResults.filter(r=>r.selected!==r.question.answer||r.confidence==="guess").forEach(r=>{let q=r.question;if(!missed.some(m=>m.q===q.q))missed.push(q)});
    studyHistory.push({date:new Date().toLocaleString(), mode:quizMode, results:quizResults});
    save();
    screen="results";
  }else{
    quizIndex++;
    selectedOption=null;
    confidence=null;
    resetQuestionTools();
  }
  render();
}

const TRAP_WORDS = ["FIRST","NEXT","BEST","MOST","LEAST","EXCEPT","ALWAYS","NEVER","AVOID","IMMEDIATELY","ONLY","INITIAL","PRIMARY","NOT","MOST LIKELY","LEAST LIKELY"];

function resetQuestionTools(){
  eliminatedOptions = [];
  showTrapWords = false;
  questionStartTime = Date.now();
  questionElapsed = 0;
  startQuestionTimer();
}

function startQuestionTimer(){
  if(questionTimerInterval) clearInterval(questionTimerInterval);
  questionTimerInterval = setInterval(() => {
    if(screen !== "quiz"){
      clearInterval(questionTimerInterval);
      questionTimerInterval = null;
      return;
    }
    questionElapsed = Math.floor((Date.now() - questionStartTime) / 1000);
    updateQuestionTimerUI();
  }, 1000);
}

function updateQuestionTimerUI(){
  const secondsEl = document.getElementById("questionSeconds");
  const fill = document.getElementById("timerFill");
  const label = document.getElementById("timerLabel");
  if(!secondsEl || !fill || !label) return;
  secondsEl.textContent = questionElapsed + "s";
  const pct = Math.min(100, (questionElapsed / 90) * 100);
  fill.style.width = pct + "%";
  fill.classList.remove("warn","danger");
  if(questionElapsed >= 90){
    fill.classList.add("danger");
    label.textContent = "Move on soon";
  } else if(questionElapsed >= 75){
    fill.classList.add("warn");
    label.textContent = "Pacing warning";
  } else {
    label.textContent = "On pace";
  }
}

function toggleEliminate(i){
  if(eliminatedOptions.includes(i)){
    eliminatedOptions = eliminatedOptions.filter(x => x !== i);
  } else {
    eliminatedOptions.push(i);
  }
  render();
}

function toggleTrapWords(){
  showTrapWords = !showTrapWords;
  render();
}

function highlightTrapWords(text){
  if(!showTrapWords) return esc(text);
  let safe = esc(text);
  const phrases = ["MOST LIKELY","LEAST LIKELY"];
  phrases.forEach(word => {
    const re = new RegExp("\\b" + word.replace(" ", "\\s+") + "\\b", "gi");
    safe = safe.replace(re, m => `<span class="trap-word">${m}</span>`);
  });
  const singles = TRAP_WORDS.filter(w => !w.includes(" "));
  singles.forEach(word => {
    const re = new RegExp("\\b" + word + "\\b", "gi");
    safe = safe.replace(re, m => `<span class="trap-word">${m}</span>`);
  });
  return safe;
}

  <button class="btn" ${selectedOption===null||confidence===null?'disabled':''} onclick="nextQuestion()">${quizIndex===quizQuestions.length-1?'Finish':'Next'}</button>`;
}

function resultsView(){let correct=quizResults.filter(r=>r.selected===r.question.answer).length,pct=Math.round(correct/quizResults.length*100),low=quizResults.filter(r=>r.confidence!=='confident').length;return `<div class="card" style="background:#020617;color:white;text-align:center;"><p>Score</p><h2 style="font-size:48px;margin:0;">${pct}%</h2><p>${correct} correct • ${quizResults.length-correct} missed • ${low} low-confidence</p><p>Avg time: ${Math.round(quizResults.reduce((sum,r)=>sum+(r.timeSpent||0),0)/quizResults.length)}s/question</p></div><h2>Review</h2>${quizResults.map(r=>{let good=r.selected===r.question.answer;return `<div class="card"><p class="${good?'result-good':'result-bad'}">${good?'Correct':'Missed'} • Confidence: ${r.confidence}</p><h3>${esc(r.question.q)}</h3><p><strong>Your answer:</strong> ${r.selected === -1 ? "Unanswered" : esc(r.question.options[r.selected])}</p>${!good?`<p><strong>Correct answer:</strong> ${esc(r.question.options[r.question.answer])}</p>`:''}<p><strong>Why:</strong> ${esc(r.question.why)}</p><p><strong>PMP mindset:</strong> ${esc(r.question.mindset)}</p><div class="mindset-box"><strong>Why PMI wants this answer:</strong><br>${esc(pmiMindsetFor(r.question))}<br><br><strong>Why the tempting answers are wrong:</strong><br>${esc(r.question.temptingWrong || "The wrong answers may sound partly correct, but they miss the best PMP process or mindset.")}<br><br><strong>Trap pattern:</strong><br>${esc(trapPatternFor(r.question))}</div><p><strong>Read again:</strong> ${esc(r.question.chapterRef)}</p></div>`}).join("")}<button class="btn" onclick="go('home')">Back Home</button>`}
function missedView(){if(!missed.length)return `<h2>Missed / Low Confidence</h2><div class="card"><p class="muted">No missed or guessed questions yet.</p></div>`;return `<h2>Missed / Low Confidence</h2>${missed.map(q=>`<div class="card"><h3>${esc(q.q)}</h3><p class="muted">${esc(q.chapterRef)}</p><p><strong>Mindset:</strong> ${esc(q.mindset)}</p></div>`).join("")}<button class="btn red" onclick="missed=[];save();render()">Clear</button>`}

function isBookmarked(id){return bookmarks.some(b=>b.id===id)} function toggleBookmark(id,title,type){if(isBookmarked(id))bookmarks=bookmarks.filter(b=>b.id!==id);else bookmarks.push({id,title,type,date:new Date().toLocaleDateString()});save();render();}
function bookmarksView(){return `<h2>Saved / Bookmarks</h2>${bookmarks.length?bookmarks.map(b=>`<div class="card"><span class="pill amber">${esc(b.type)}</span><h3>${esc(b.title)}</h3><p class="muted">Saved ${esc(b.date)}</p><button class="btn secondary" onclick="toggleBookmark('${esc(b.id)}','${esc(b.title)}','${esc(b.type)}')">Remove</button></div>`).join(""):`<div class="card"><p class="muted">No bookmarks yet. Tap the star on chapters or questions.</p></div>`}`}

function tutorView(){return `<h2>AI Tutor Mode</h2><div class="card"><p class="muted">This is an offline tutor for the chapters loaded into the app. Type a question like “Explain CPI” or “Manage Quality vs Control Quality.”</p><textarea id="tutorInput" placeholder="Ask about Schedule, Cost, Quality, formulas, mindset, or exam traps..."></textarea><button class="btn purple" onclick="askTutor()">Ask Tutor</button></div><div id="tutorAnswer"></div><h3>Recent Tutor Questions</h3>${tutorHistory.slice(-5).reverse().map(h=>`<div class="card"><strong>Q:</strong> ${esc(h.q)}<br><br><strong>A:</strong> ${esc(h.a)}</div>`).join("")}`}
function askTutor(){let input=document.getElementById("tutorInput").value.trim();if(!input)return;let a=generateTutorAnswer(input);tutorHistory.push({q:input,a});save();document.getElementById("tutorAnswer").innerHTML=`<div class="card"><h3>Tutor Answer</h3><p>${esc(a)}</p></div>`;}
function generateTutorAnswer(q){let s=q.toLowerCase();if(s.includes("cpi"))return "CPI is Cost Performance Index. Formula: EV divided by AC. If CPI is below 1, the project is over budget. If CPI is above 1, the project is under budget. PMP mindset: interpret the number, then analyze the cause before taking corrective action.";if(s.includes("spi"))return "SPI is Schedule Performance Index. Formula: EV divided by PV. Below 1 means behind schedule; above 1 means ahead of schedule. PMP mindset: use schedule data to understand performance before changing the baseline.";if(s.includes("critical"))return "The critical path is the longest path through the network diagram and determines project duration. Critical path activities have no float. If one slips, the project slips unless corrective action is taken.";if(s.includes("crashing")||s.includes("fast"))return "Crashing adds resources to shorten the schedule and increases cost. Fast-tracking overlaps activities and increases risk. Exam trap: adding people or equipment is crashing; doing tasks in parallel is fast-tracking.";if(s.includes("manage quality")||s.includes("control quality"))return "Manage Quality focuses on the processes used to produce deliverables. Control Quality inspects completed deliverables to determine whether they meet standards. Exam shortcut: process = Manage Quality; deliverable inspection = Control Quality.";if(s.includes("reserve"))return "Contingency reserve covers known unknowns and is included in the cost baseline. Management reserve covers unknown unknowns, sits above the baseline, and requires management approval.";if(s.includes("float")||s.includes("slack"))return "Float, or slack, is how long an activity can be delayed without delaying the project. Critical path activities have zero float. Slack can be calculated as LS minus ES or LF minus EF.";if(s.includes("quality"))return "Quality means meeting requirements, not just having fancy features. Grade can be low or high, but quality must be high. PMI favors prevention, clear requirements, process improvement, and objective measurement.";
if(s.includes("raci")||s.includes("accountable"))return "RACI means Responsible, Accountable, Consulted, and Informed. The exam trap is accountability: avoid having more than one accountable person for the same work because it creates confusion and blame.";
if(s.includes("communication channel")||s.includes("channels"))return "Communication channels use N(N-1)/2. N is the number of stakeholders or people. Example: 10 people gives 10×9/2 = 45 channels.";
if(s.includes("stakeholder"))return "Stakeholder management is about identifying stakeholders, understanding their power/interest/influence, planning engagement, managing engagement, and monitoring it. PMP mindset: engage early, tailor communication, and move stakeholders toward the desired engagement level.";
if(s.includes("procurement")||s.includes("contract"))return "For procurement, assume you are the buyer unless the question says otherwise. Fixed price works best when scope is clear and shifts risk to the seller. Cost reimbursable and time/material place more cost risk on the buyer.";
if(s.includes("conflict"))return "For conflict, first understand the source and context. Use servant leadership: facilitate, listen, and help the team reach a constructive solution instead of dictating immediately.";
if(s.includes("emotional intelligence"))return "Emotional intelligence helps the PM read tone, facial expression, and behavior, then adjust responses to de-escalate and support project outcomes.";
if(s.includes("mvp")||s.includes("business value"))return "An MVP gives customers usable minimal functionality sooner so they can realize value and provide feedback earlier. PMP mindset: keep checking whether the project is still delivering expected business value.";
return "Based on the loaded chapters, think like PMI: understand the issue first, use the right process, analyze data, avoid jumping straight to escalation, engage stakeholders, communicate clearly, support the team, and protect baselines through change control when needed."}

function progressView(){return progressDashboardV24();}

function render(){let root=document.getElementById("root"); if(screen==="home")root.innerHTML=home(); if(screen==="chapters")root.innerHTML=chaptersView(); if(screen==="chapterDetail")root.innerHTML=chapterDetail(); if(screen==="quiz")root.innerHTML=quizView(); if(screen==="results")root.innerHTML=resultsView(); if(screen==="missed")root.innerHTML=missedView(); if(screen==="bookmarks")root.innerHTML=bookmarksView(); if(screen==="tutor")root.innerHTML=tutorView(); if(screen==="progress")root.innerHTML=progressView(); if(screen==="reviewQueue")root.innerHTML=reviewQueueView(); if(screen==="dailyPlan")root.innerHTML=dailyPlanView();}
render();

</script>
