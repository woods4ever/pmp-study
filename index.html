Concept"], "chapterRef": "Chapter 7 - Milestones"}, {"q": "What is parametric estimating?", "options": ["Using mathematical formulas with historical data and unit rates", "Using previous similar project data without detailed analysis", "Breaking all work into smallest pieces and summing estimates", "Getting anonymous expert opinions through the Delphi technique"], "answer": 0, "why": "Parametric uses math: unit rate × quantity (e.g., $2/sq ft × 500 sq ft = $1000).", "mindset": "Parametric = formula-based with historical unit rates.", "tags": ["Estimating", "Concept"], "chapterRef": "Chapter 7 - Parametric Estimating"}, {"q": "If a critical path activity slips by 3 days, what happens to the project?", "options": ["The project completion date slips by 3 days unless corrective action is taken", "Nothing happens because critical path activities have built-in buffer time", "Only non-critical activities are affected by the delay on critical path", "The project automatically gets 3 extra days added to management reserve"], "answer": 0, "why": "Critical path has zero float. Any slip directly extends the project unless you take action.", "mindset": "Critical path slip = project slip. No buffer exists.", "tags": ["Critical Path", "Schedule"], "chapterRef": "Chapter 7 - Critical Path Impact"}, {"q": "What does the network diagram show?", "options": ["The sequence of activities and their dependency relationships", "The organizational hierarchy of the project team members", "The cost breakdown of each work package in the WBS", "The probability and impact ranking of all project risks"], "answer": 0, "why": "The network diagram shows activity sequences and dependencies — it's used for critical path analysis.", "mindset": "Network diagram = visual sequence of work.", "tags": ["Schedule", "Network Diagram"], "chapterRef": "Chapter 7 - Network Diagram"}, {"q": "Your critical path has zero float on 5 activities. A team member finishes one activity 2 days early. What happens?", "options": ["The project could finish early but you must recalculate since the critical path may shift", "The project will definitely finish exactly 2 days earlier than originally planned", "Nothing changes because float is permanently zero on all critical path activities", "You should add the 2 saved days as buffer to another activity on the path"], "answer": 0, "why": "Finishing early creates potential but the critical path must be recalculated — it may have shifted.", "mindset": "PMI mindset: critical path is dynamic. Don't assume local gains translate globally.", "tags": ["Critical Path", "Float"], "chapterRef": "Chapter 7 - Critical Path"}, {"q": "Your project is 3 weeks behind schedule. The sponsor demands you crash. What should you consider FIRST?", "options": ["Identify which critical path activities can be crashed at lowest incremental cost", "Add resources to every activity equally regardless of whether they're on critical path", "Fast-track everything by running all sequential activities in parallel immediately", "Tell the sponsor that crashing won't help and nothing can be done at this point"], "answer": 0, "why": "Crashing only helps on critical path. Adding resources elsewhere wastes money without schedule benefit.", "mindset": "PMI mindset: crashing targets critical path at lowest cost. Analyze first.", "tags": ["Schedule Compression", "Crashing"], "chapterRef": "Chapter 7 - Schedule Compression"}, {"q": "A team lead suggests fast-tracking to recover the schedule. What risk should you communicate?", "options": ["Parallel activities may create rework if earlier work produces unexpected outputs", "Fast-tracking has no additional risks compared to the original sequential plan", "Fast-tracking always works perfectly and has no potential downsides at all", "Fast-tracking is the same thing as crashing with extra resources added"], "answer": 0, "why": "Fast-tracking overlaps activities meant to be sequential — rework risk increases if assumptions fail.", "mindset": "PMI mindset: fast-tracking trades risk for time. Communicate the tradeoff.", "tags": ["Fast-Tracking", "Risk"], "chapterRef": "Chapter 7 - Fast-Tracking"}, {"q": "You used three-point estimating: O=4, M=7, P=16. The stakeholder asks for 'the estimate.' What should you provide?", "options": ["The PERT expected duration of 8 days along with the range and confidence level", "Just the optimistic estimate of 4 days to make the stakeholder happy", "Use the pessimistic estimate of 16 days to be as safe as possible", "Give only the most likely estimate of 7 days without any context or range"], "answer": 0, "why": "PERT = (4+28+16)/6 = 8. But also communicate the range — a single number misleads.", "mindset": "PMI mindset: communicate uncertainty honestly. Ranges are more useful than false precision.", "tags": ["Estimating", "PERT"], "chapterRef": "Chapter 7 - Three-Point"}, {"q": "Resource leveling extends your schedule by 4 weeks. The sponsor won't accept the delay. What are your options?", "options": ["Present tradeoff options: accept delay, add resources, reduce scope, or accept over-allocation risk", "Level the resources anyway and hide the schedule extension from the sponsor", "Remove resource leveling entirely and accept that resources will be over-allocated", "Tell the sponsor there is absolutely no solution available for this situation"], "answer": 0, "why": "When leveling causes unacceptable delays, present options with clear tradeoffs.", "mindset": "PMI mindset: present options, don't hide impacts or give up.", "tags": ["Resource Leveling", "Tradeoffs"], "chapterRef": "Chapter 7 - Resource Optimization"}, {"q": "A dependency has a 5-day lag. A stakeholder asks you to remove it to shorten the schedule. What should you do?", "options": ["Investigate why the lag exists — removing a real constraint could cause quality issues", "Remove the lag immediately since the stakeholder made a direct request for it", "Change the dependency from Finish-to-Start to Start-to-Finish instead", "Add a 5-day lead to a different activity to compensate for the lag"], "answer": 0, "why": "Lags usually represent real constraints (curing time, approval wait). Understand before removing.", "mindset": "PMI mindset: understand constraints before eliminating them.", "tags": ["Dependencies", "Leads and Lags"], "chapterRef": "Chapter 7 - Sequence Activities"}, {"q": "Your team used analogous estimating but the project is much more complex than expected. What should you have done?", "options": ["Used analogous as a starting point then refined with bottom-up as details emerged", "Analogous was perfectly fine and the complexity was completely unforeseeable", "Used only bottom-up estimating from the very start before any planning began", "Padded the analogous estimate by 50 percent to account for unknown complexity"], "answer": 0, "why": "Analogous is rough. For complex work, supplement with more detailed techniques as info becomes available.", "mindset": "PMI mindset: match technique to information. Refine estimates as you learn more.", "tags": ["Estimating", "Progressive Elaboration"], "chapterRef": "Chapter 7 - Estimation Techniques"}, {"q": "A milestone has been missed. The sponsor asks what you're going to do. What is the BEST first response?", "options": ["Analyze the root cause and downstream impact before proposing corrective action", "Immediately crash the next set of activities without any analysis first", "Blame the team for not working hard enough to meet the milestone date", "Move the milestone to a future date without investigating what went wrong"], "answer": 0, "why": "Before acting, understand why it was missed. Root cause informs the right corrective action.", "mindset": "PMI mindset: analyze before acting. Understanding comes before solutions.", "tags": ["Schedule Control", "Root Cause Analysis"], "chapterRef": "Chapter 7 - Control Schedule"}, {"q": "Your network diagram shows two parallel critical paths. What does this mean for schedule risk?", "options": ["Risk is higher because a delay on either path will delay the entire project", "Risk is lower because having two paths provides redundancy and backup options", "It means the estimate is wrong and one path must actually be longer", "Parallel critical paths are technically impossible in network diagrams"], "answer": 0, "why": "Multiple critical paths = more activities with zero float = higher probability of delay.", "mindset": "PMI mindset: more critical activities = more risk. Monitor both closely.", "tags": ["Critical Path", "Risk"], "chapterRef": "Chapter 7 - Schedule Risk"}, {"q": "The team wants to add 20% padding to all duration estimates 'just to be safe.' What is the problem?", "options": ["Padding hides risk instead of managing it — use contingency reserve based on analysis", "There is no problem at all since padding is a widely accepted best practice", "Only 10 percent padding is acceptable according to PMI standards", "Let the team pad their estimates since they know their own work best"], "answer": 0, "why": "Individual padding inflates schedules and hides truth. Manage risk transparently through reserves.", "mindset": "PMI mindset: risks should be visible and managed, not hidden in inflated estimates.", "tags": ["Estimating", "Risk Management"], "chapterRef": "Chapter 7 - Duration Estimating"}]},{"id":8,"title":"Chapter 8: Cost Management","summary":"Cost management focuses on creating the cost baseline, managing the project budget, and using earned value formulas to interpret performance.","notes":["Cost management is about creating the cost baseline and ensuring the project stays on budget.","Cost types include variable, fixed, direct, indirect, sunk, and value engineering.","The four cost processes are Plan Cost Management, Estimate Costs, Determine Budget, and Control Costs.","Traditional project budgeting is done upfront; agile project funding is done incrementally.","Contingency reserves cover known unknowns and are included in the cost baseline.","Management reserves cover unknown unknowns and require management approval.","Earned Value Management includes BAC, PV, EV, AC, CV, CPI, SV, SPI, EAC, ETC, VAC, and TCPI.","Negative CV means over budget. Negative SV means behind schedule. CPI or SPI below 1 is unfavorable."],"examples":["If EV is 75 and AC is 70, CV is +5, meaning the project is under budget.","If EV is 75 and PV is 60, SV is +15, meaning the project is ahead of schedule.","If CPI is 0.80, the project is getting 80 cents of value for every dollar spent.","Contingency reserve is for identified risks; management reserve is for unforeseen risks."],"podcast":[{"speaker":"Host 1","text":"Let’s dig into Chapter 8, Cost Management. This chapter matters because it combines basic cost concepts, budgeting process flow, reserves, and earned value management."},{"speaker":"Host 2","text":"And earned value is one of those areas where students might memorize formulas but still miss questions because they do not understand what the numbers actually mean."},{"speaker":"Host 1","text":"The big goal of cost management is creating the cost baseline, which is the project budget, and then ensuring the project stays on budget."},{"speaker":"Host 2","text":"Start with cost types. Variable costs change as the project progresses. Fixed costs stay the same. Direct costs are directly tied to project work and are included in the cost baseline. Indirect costs are not included in the project budget."},{"speaker":"Host 1","text":"Sunk cost is money already spent. Value engineering, also called value analysis, is finding a less costly way to achieve the same goal or scope."},{"speaker":"Host 2","text":"And the PMP mindset is important here. Value engineering is not cutting quality or removing requirements. It is finding a less costly way to achieve the required outcome."},{"speaker":"Host 1","text":"The four cost management processes are Plan Cost Management, Estimate Costs, Determine Budget, and Control Costs."},{"speaker":"Host 2","text":"Plan Cost Management creates the cost management plan. That plan guides how activity costs will be estimated, how the budget will be created, and how project costs will be monitored and controlled."},{"speaker":"Host 1","text":"Estimate Costs assigns a cost to each activity. Costs can include labor, materials, equipment, services, facilities, inflation, and reserves for risk."},{"speaker":"Host 2","text":"Know the estimate ranges. Rough Order of Magnitude is the least accurate and is usually minus 25 percent to plus 75 percent. Budget estimate is around minus 10 to plus 25. Definitive estimate is the most accurate, around minus 5 to plus 10."},{"speaker":"Host 1","text":"Analogous estimating is top-down. It uses previous similar projects. It is quick, but can be inaccurate if the previous work is not very similar."},{"speaker":"Host 2","text":"Bottom-up estimating is the opposite. It breaks work into smaller pieces, estimates each part, and aggregates the total. It is time-consuming but very accurate."},{"speaker":"Host 1","text":"Parametric estimating uses math and historical data. For example, if painting costs two dollars per square foot, then five hundred square feet costs one thousand dollars."},{"speaker":"Host 2","text":"Reserve analysis is a big exam topic. Contingency reserves cover known unknowns. That means identified risks. They are included in the cost baseline and the project manager can usually use them without additional approval."},{"speaker":"Host 1","text":"Management reserves cover unknown unknowns. These are unforeseen events management did not identify earlier. Management reserves are above the cost baseline and require management approval."},{"speaker":"Host 2","text":"That distinction is critical. Contingency equals known unknown and included in baseline. Management equals unknown unknown and above baseline."},{"speaker":"Host 1","text":"Determine Budget aggregates cost estimates to create the project budget. Cost aggregation rolls up activity cost estimates and work packages into the total project cost."},{"speaker":"Host 2","text":"The cost baseline includes project work and contingency reserve, but not management reserve. It can be shown as an S-curve because spending is often lower at the start, highest in the middle, and lower at the end."},{"speaker":"Host 1","text":"Control Costs is where the project manager monitors cost performance. The PM compares planned work to actual work, identifies variances, determines why they happened, and decides corrective action."},{"speaker":"Host 2","text":"Now earned value. BAC is Budget at Completion, the total planned budget. PV is Planned Value, the cost of work planned to be completed. EV is Earned Value, the value of work actually completed. AC is Actual Cost, the amount actually spent."},{"speaker":"Host 1","text":"Cost Variance is EV minus AC. If CV is positive, the project is under budget. If CV is negative, the project is over budget."},{"speaker":"Host 2","text":"Cost Performance Index is EV divided by AC. CPI tells how efficiently the project is spending money. CPI above 1 is good. CPI below 1 is bad."},{"speaker":"Host 1","text":"So if CPI is point eight, that means for every dollar spent, the project only gets eighty cents of value. That is over budget."},{"speaker":"Host 2","text":"Schedule Variance is EV minus PV. If SV is positive, the project is ahead of schedule. If SV is negative, the project is behind schedule."},{"speaker":"Host 1","text":"Schedule Performance Index is EV divided by PV. SPI above 1 means ahead of schedule. SPI below 1 means behind schedule."},{"speaker":"Host 2","text":"Estimate at Completion is BAC divided by CPI. This is the forecasted final project cost if the project continues at the current spending rate."},{"speaker":"Host 1","text":"Estimate to Complete is EAC minus AC. That tells how much more money is needed to finish the project."},{"speaker":"Host 2","text":"Variance at Completion is BAC minus EAC. Positive VAC means money left over. Negative VAC means more money is needed."},{"speaker":"Host 1","text":"TCPI is the To-Complete Performance Index. It tells the efficiency needed to finish within budget. If TCPI is higher than 1, the project team must work more efficiently to finish within budget."},{"speaker":"Host 2","text":"The exam may give numbers and ask you to calculate, but the real skill is interpretation. If CPI is less than 1, cost is bad. If SPI is less than 1, schedule is bad. If CV is negative, over budget. If SV is negative, behind schedule."},{"speaker":"Host 1","text":"Agile budgeting is also different. Traditional projects calculate the entire budget during planning. Agile projects are often funded incrementally as iterations are completed."},{"speaker":"Host 2","text":"Agile can use a burn rate approach. For example, number of people times hourly cost times hours worked gives cost per week. Then multiply by iteration length and number of iterations."},{"speaker":"Host 1","text":"Final mindset: when cost issues appear, the project manager should analyze the data, understand the variance, determine corrective action, and use change control when budget changes are needed."},{"speaker":"Host 2","text":"Do not just ask for more money. Do not ignore the variance. Do not change the budget informally. Analyze, forecast, communicate, and follow the process."}],"questions":[{"q": "What is the main purpose of cost management?", "options": ["Creating the cost baseline and keeping the project on budget", "Creating the stakeholder register and engagement plan", "Defining quality metrics and inspection procedures", "Closing all procurement contracts with external sellers"], "answer": 0, "why": "Cost management focuses on creating the cost baseline and ensuring the project stays on budget.", "mindset": "Cost management = budget creation + cost control.", "tags": ["Cost", "Process"], "chapterRef": "Chapter 8 - Cost Management"}, {"q": "What is a variable cost?", "options": ["A cost that changes as the project progresses over time", "A cost that stays exactly the same throughout the project", "Money already spent that cannot be recovered now", "A cost included only in the management reserve"], "answer": 0, "why": "Variable costs change with project conditions or usage — they vary over time.", "mindset": "Variable = changes. Fixed = stays same.", "tags": ["Cost", "Concept"], "chapterRef": "Chapter 8 - Cost Types"}, {"q": "What is a fixed cost?", "options": ["A cost that stays the same regardless of project progress", "A cost that changes every day as work is performed", "Money already spent that cannot be recovered now", "The contingency reserve for identified project risks"], "answer": 0, "why": "Fixed costs remain stable throughout the project.", "mindset": "Fixed = constant. Variable = fluctuates.", "tags": ["Cost", "Concept"], "chapterRef": "Chapter 8 - Cost Types"}, {"q": "What is a sunk cost?", "options": ["Money already spent on the project that cannot be recovered", "Money held in reserve for future unknown risks", "A variable cost that changes with project activities", "The total budget approved at project completion"], "answer": 0, "why": "Sunk costs are already spent — they should not influence future decisions.", "mindset": "Don't let sunk costs drive future decisions.", "tags": ["Cost", "Concept"], "chapterRef": "Chapter 8 - Sunk Cost"}, {"q": "What is value engineering?", "options": ["Finding a less costly way to achieve the same scope and quality", "Increasing scope without formal approval from the sponsor", "Removing quality requirements to reduce project expenses", "Adding management reserve to cover unknown future risks"], "answer": 0, "why": "Value engineering finds cheaper ways to achieve the same goal without sacrificing quality.", "mindset": "Same quality for less cost = value engineering.", "tags": ["Cost", "Concept"], "chapterRef": "Chapter 8 - Value Engineering"}, {"q": "Which estimate type is LEAST accurate?", "options": ["Rough Order of Magnitude (ROM) with wide range of variance", "Definitive estimate with tight accuracy range", "Bottom-up estimate built from work package details", "Budget estimate done during mid-stage planning"], "answer": 0, "why": "ROM is the least accurate — typically -25% to +75%.", "mindset": "ROM = early and rough. Definitive = late and accurate.", "tags": ["Cost", "Estimating"], "chapterRef": "Chapter 8 - Estimate Ranges"}, {"q": "Which estimate type is MOST accurate?", "options": ["Definitive estimate with approximately ±5-10% accuracy", "Rough Order of Magnitude done at project initiation", "Analogous estimate based on previous similar projects", "Expert judgment from a single senior team member"], "answer": 0, "why": "Definitive is the most accurate estimate, usually done later when more details are known.", "mindset": "More detail available = more accurate estimate.", "tags": ["Cost", "Estimating"], "chapterRef": "Chapter 8 - Estimate Ranges"}, {"q": "What does contingency reserve cover?", "options": ["Known unknowns — identified risks that may or may not occur", "Unknown unknowns — unforeseen events not previously identified", "Only the project manager's travel and training expenses", "Only the cost of the project charter development"], "answer": 0, "why": "Contingency = identified risks (known unknowns). Included in the cost baseline.", "mindset": "Contingency = known risks. Management reserve = unknown risks.", "tags": ["Cost", "Reserves"], "chapterRef": "Chapter 8 - Reserve Analysis"}, {"q": "What does management reserve cover?", "options": ["Unknown unknowns — unforeseen events that require management approval", "Known unknowns — risks already identified in the risk register", "Only the project team's overtime compensation costs", "Only the procurement contract penalties and fees"], "answer": 0, "why": "Management reserve covers unforeseen risks. It's above the baseline and needs management approval.", "mindset": "Management reserve = above baseline = needs approval.", "tags": ["Cost", "Reserves"], "chapterRef": "Chapter 8 - Reserve Analysis"}, {"q": "Is management reserve included in the cost baseline?", "options": ["No — it sits above the cost baseline and requires approval to use", "Yes — it is always included as part of the cost baseline", "Only on agile projects is it included in the baseline", "Only during the closing phase is it added to the baseline"], "answer": 0, "why": "The cost baseline includes project work + contingency reserve, but NOT management reserve.", "mindset": "Cost baseline = work + contingency. Management reserve is extra above.", "tags": ["Cost", "Baseline"], "chapterRef": "Chapter 8 - Cost Baseline"}, {"q": "What is BAC?", "options": ["Budget at Completion — the total approved project budget", "The actual cost of work already completed to date", "The earned value of work performed so far", "The forecasted final cost at project completion"], "answer": 0, "why": "BAC is the total planned budget for the project — the anchor for EVM calculations.", "mindset": "BAC = what you planned to spend total.", "tags": ["EVM", "Formula"], "chapterRef": "Chapter 8 - EVM Basics"}, {"q": "What is the formula for Cost Variance (CV)?", "options": ["CV = EV - AC", "CV = EV / AC", "CV = EV - PV", "CV = BAC / CPI"], "answer": 0, "why": "CV = Earned Value minus Actual Cost. Negative = over budget.", "mindset": "CV: negative is bad (over budget).", "tags": ["EVM", "Formula"], "chapterRef": "Chapter 8 - Cost Variance"}, {"q": "What is the formula for CPI?", "options": ["CPI = EV / AC", "CPI = EV - AC", "CPI = EV / PV", "CPI = BAC - EAC"], "answer": 0, "why": "CPI = Earned Value divided by Actual Cost. Below 1 = over budget.", "mindset": "CPI below 1 = getting less than a dollar of value per dollar spent.", "tags": ["EVM", "Formula"], "chapterRef": "Chapter 8 - CPI"}, {"q": "If CPI is 0.80, what does that mean?", "options": ["The project is over budget — getting 80 cents of value per dollar spent", "The project is under budget — getting bonus value for each dollar", "The project is ahead of schedule by 20 percent", "The project has no variance from the planned budget"], "answer": 0, "why": "CPI of 0.80 means only 80 cents of value for every dollar spent — over budget.", "mindset": "CPI < 1 = bad. CPI > 1 = good.", "tags": ["EVM", "Interpretation"], "chapterRef": "Chapter 8 - CPI Interpretation"}, {"q": "What is the formula for Schedule Variance (SV)?", "options": ["SV = EV - PV", "SV = EV - AC", "SV = EV / PV", "SV = BAC / SPI"], "answer": 0, "why": "SV = Earned Value minus Planned Value. Negative = behind schedule.", "mindset": "SV: negative = behind schedule.", "tags": ["EVM", "Formula"], "chapterRef": "Chapter 8 - Schedule Variance"}, {"q": "What is the formula for SPI?", "options": ["SPI = EV / PV", "SPI = EV / AC", "SPI = BAC / CPI", "SPI = BAC - EAC"], "answer": 0, "why": "SPI = Earned Value divided by Planned Value. Below 1 = behind schedule.", "mindset": "SPI < 1 = behind. SPI > 1 = ahead.", "tags": ["EVM", "Formula"], "chapterRef": "Chapter 8 - SPI"}, {"q": "What does EAC forecast?", "options": ["The estimated total project cost at completion based on current performance", "The original planned budget before any work began", "The amount of float remaining on the critical path", "The number of communication channels on the project"], "answer": 0, "why": "EAC forecasts what the project will cost at the end based on how it's performing now.", "mindset": "EAC = forecasted final cost.", "tags": ["EVM", "Formula"], "chapterRef": "Chapter 8 - EAC"}, {"q": "What is the EAC formula when current performance is expected to continue?", "options": ["EAC = BAC / CPI", "EAC = AC + BAC - EV", "EAC = AC + ETC", "EAC = BAC - VAC"], "answer": 0, "why": "EAC = BAC / CPI is used when current cost performance is expected to continue.", "mindset": "This is the most common EAC formula on the exam.", "tags": ["EVM", "Formula"], "chapterRef": "Chapter 8 - EAC Formula"}, {"q": "What is ETC?", "options": ["Estimate to Complete — how much more money is needed to finish", "Estimate at Completion — the total forecasted final cost", "Earned Technical Credit — value of technical work done", "External Transfer Cost — fees paid to outside sellers"], "answer": 0, "why": "ETC = EAC - AC. It tells you how much more you'll spend from this point forward.", "mindset": "ETC = remaining money needed.", "tags": ["EVM", "Formula"], "chapterRef": "Chapter 8 - ETC"}, {"q": "What is VAC?", "options": ["Variance at Completion — whether the project will be over or under budget at the end", "Variance at Current — the current budget position today", "Value Added Cost — the value gained from spending money", "Variable Activity Cost — costs that change daily"], "answer": 0, "why": "VAC = BAC - EAC. Positive = money left over. Negative = will exceed budget.", "mindset": "VAC tells you end-state budget position.", "tags": ["EVM", "Formula"], "chapterRef": "Chapter 8 - VAC"}, {"q": "What does TCPI tell you?", "options": ["The efficiency needed on remaining work to finish within budget", "The total cost of the project from start to finish", "The time needed to complete all critical path activities", "The number of team members needed for the next phase"], "answer": 0, "why": "TCPI = efficiency required on remaining work. Above 1 means harder road ahead.", "mindset": "TCPI > 1 = need above-average performance to hit budget.", "tags": ["EVM", "Formula"], "chapterRef": "Chapter 8 - TCPI"}, {"q": "What is analogous estimating in cost management?", "options": ["Top-down estimating using data from previous similar projects", "Bottom-up estimating that sums detailed component costs", "Parametric estimating using mathematical unit rate formulas", "Reserve analysis that determines contingency amounts"], "answer": 0, "why": "Analogous is top-down, using historical data from similar past work. Quick but less accurate.", "mindset": "Analogous = quick, rough, historical.", "tags": ["Cost", "Estimating"], "chapterRef": "Chapter 8 - Analogous Estimating"}, {"q": "What is bottom-up estimating in cost management?", "options": ["Breaking work into smallest components and summing their individual estimates", "Using historical data from one similar past project only", "Applying a mathematical formula with unit rates", "Getting a single expert's opinion on total project cost"], "answer": 0, "why": "Bottom-up breaks everything into small pieces, estimates each, then aggregates. Most accurate.", "mindset": "Bottom-up = most accurate but most time-consuming.", "tags": ["Cost", "Estimating"], "chapterRef": "Chapter 8 - Bottom-Up Estimating"}, {"q": "What is the cost baseline shown as on a graph?", "options": ["An S-curve showing cumulative spending over time", "A straight horizontal line at the BAC amount", "A vertical bar chart of monthly costs only", "A pie chart of cost categories"], "answer": 0, "why": "The cost baseline is typically shown as an S-curve — spending starts low, peaks mid-project, then decreases.", "mindset": "S-curve = slow start, heavy middle, tapering end.", "tags": ["Cost", "Baseline"], "chapterRef": "Chapter 8 - Cost Baseline"}, {"q": "What are the four cost management processes?", "options": ["Plan Cost Management, Estimate Costs, Determine Budget, Control Costs", "Plan Cost, Manage Cost, Control Cost, Close Cost", "Identify Cost, Analyze Cost, Respond to Cost, Monitor Cost", "Initiate Cost, Plan Cost, Execute Cost, Close Cost"], "answer": 0, "why": "The four processes: Plan, Estimate, Determine Budget, and Control Costs.", "mindset": "Plan → Estimate → Budget → Control.", "tags": ["Cost", "Process"], "chapterRef": "Chapter 8 - Cost Processes"}, {"q": "Your CPI is 0.85 and SPI is 0.92. The sponsor asks if the project can recover. What is the MOST accurate response?", "options": ["CPI rarely recovers once established — we should reforecast and discuss options now", "The team will work harder next month and bring CPI back above one point zero", "CPI always recovers naturally in later project phases without intervention needed", "These metrics don't matter because only the final cost at completion matters"], "answer": 0, "why": "Research shows CPI typically doesn't improve once established. It's a leading indicator for replanning.", "mindset": "PMI mindset: CPI is a predictor. Once set, it rarely improves. Use it to reforecast.", "tags": ["EVM", "CPI"], "chapterRef": "Chapter 8 - EVM"}, {"q": "BAC is $500K, AC is $200K, EV is $180K. The sponsor asks for EAC using current performance. What is it?", "options": ["EAC = $500K / 0.90 = $555,556 — trending ~$55K over budget at current performance", "EAC equals $500K because the original budget never changes regardless of performance", "EAC equals $200K plus remaining budget which gives exactly $500K total", "EAC equals AC plus BAC minus EV which equals $520K using atypical formula"], "answer": 0, "why": "CPI = 180/200 = 0.90. EAC = BAC/CPI = 500K/0.90 = $555,556. Current performance continues.", "mindset": "PMI mindset: BAC/CPI assumes current variances will continue — most common exam formula.", "tags": ["EVM", "EAC", "Formulas"], "chapterRef": "Chapter 8 - EAC"}, {"q": "Management asks you to cut the budget by 15% with no scope reduction. What should you do?", "options": ["Present an impact analysis showing what tradeoffs result from the cut — let them decide", "Accept the cut silently and figure out how to make it work without telling anyone", "Refuse entirely since cutting budget without cutting scope is completely impossible", "Cut quality controls and testing to save the 15% without informing stakeholders"], "answer": 0, "why": "Budget cuts with fixed scope create tradeoffs. The PM makes tradeoffs visible for informed decisions.", "mindset": "PMI mindset: never silently accept impossible constraints. Present tradeoffs clearly.", "tags": ["Cost Management", "Constraints"], "chapterRef": "Chapter 8 - Plan Cost Management"}, {"q": "Bottom-up estimating gives a total 30% higher than the sponsor's budget expectation. What should you do?", "options": ["Present the detailed estimate with supporting data and work with sponsor to reconcile", "Reduce your estimates by 30% to match what the sponsor wants to see", "Switch to analogous estimating instead since it will produce a lower number", "Submit the lower number the sponsor wants and manage the inevitable overrun later"], "answer": 0, "why": "Bottom-up is the most accurate. If it exceeds budget, the gap is real. Discuss honestly.", "mindset": "PMI mindset: never manipulate estimates to fit a budget. Present reality.", "tags": ["Estimating", "Budget"], "chapterRef": "Chapter 8 - Estimate Costs"}, {"q": "A known risk materializes costing $40K. You have $50K contingency and $30K management reserve. Which do you use?", "options": ["Contingency reserve — it covers identified risks and is within your authority to use", "Management reserve since it's available and covers any type of problem", "Neither — submit a change request for completely new funding from the sponsor", "Split the cost between both reserves equally at $20K from each one"], "answer": 0, "why": "Contingency = known risks = PM authority. Management reserve = unknown unknowns = needs approval.", "mindset": "PMI mindset: know which reserve to use and when.", "tags": ["Reserves", "Risk Response"], "chapterRef": "Chapter 8 - Reserve Analysis"}, {"q": "TCPI based on BAC is 1.35. What does this tell you?", "options": ["The team must perform at 135% efficiency on remaining work — likely unrealistic", "The project is performing well since the number is above one point zero", "TCPI doesn't provide any useful information for project management decisions", "The team needs to work 35% fewer hours to finish within the approved budget"], "answer": 0, "why": "TCPI > 1.0 means above-average performance needed. 1.35 is extremely aggressive — BAC is likely unachievable.", "mindset": "PMI mindset: TCPI far above 1 = red flag. Original budget probably needs revision.", "tags": ["EVM", "TCPI"], "chapterRef": "Chapter 8 - TCPI"}, {"q": "EV=$300K, PV=$350K, AC=$320K. Are you over budget, behind schedule, or both?", "options": ["Both — SV is -$50K (behind schedule) and CV is -$20K (over budget)", "Only behind schedule because SV is negative at minus fifty thousand", "Only over budget because you've spent $320K which is more than planned", "Neither — the project is fine since spending is within the total BAC"], "answer": 0, "why": "SV = EV-PV = -50K (behind). CV = EV-AC = -20K (over budget). Both are negative.", "mindset": "PMI mindset: EVM gives objective status. Report both clearly.", "tags": ["EVM", "Interpretation"], "chapterRef": "Chapter 8 - Earned Value"}, {"q": "Finance wants funding spread evenly but your project spends heavily in Q2-Q3. What tool addresses this?", "options": ["Funding limit reconciliation — match spending plan to funding availability", "Ignore finance and spend exactly according to your project cost baseline", "Move all expensive work to Q4 when more funding theoretically becomes available", "Reduce project scope specifically to flatten the spending curve across quarters"], "answer": 0, "why": "Funding limit reconciliation matches planned spending against available funding timing.", "mindset": "PMI mindset: budget planning considers WHEN money is available, not just total amount.", "tags": ["Budget", "Funding Limits"], "chapterRef": "Chapter 8 - Determine Budget"}, {"q": "A vendor invoices $75K but earned value for their work is only $50K based on percent complete. What should you do?", "options": ["Investigate the discrepancy — the vendor may be billing ahead of actual progress", "Pay the full invoice immediately since the vendor officially submitted it", "Refuse all payment entirely until every piece of contracted work is done", "Pay exactly $50K and dispute the remaining $25K through legal channels later"], "answer": 0, "why": "Invoice exceeding EV suggests billing ahead of progress. Verify actual completion before paying.", "mindset": "PMI mindset: EV is an objective check. Don't pay based on billing alone.", "tags": ["Cost Control", "Procurement"], "chapterRef": "Chapter 8 - Control Costs"}, {"q": "A team member asks why you track cost of quality. What is the BEST explanation?", "options": ["Prevention investment costs less than paying for failures like rework and warranty claims", "We track it only because PMI requires it as part of the certification process", "Cost of quality is purely an accounting exercise with no practical project value", "It's only relevant for manufacturing projects and doesn't apply to our work"], "answer": 0, "why": "CoQ shows that prevention is cheaper than failure. It justifies quality investment with data.", "mindset": "PMI mindset: quality is investment, not just cost. Prevention beats correction.", "tags": ["Cost of Quality", "Quality"], "chapterRef": "Chapter 8 - Cost of Quality"}]},{"id":9,"title":"Chapter 9: Project Quality Management","summary":"Quality management focuses on planning quality, managing quality processes, and controlling deliverable quality.","notes":["Quality is the degree to which inherent characteristics fulfill requirements.","Quality must always be high, while grade can be low or high.","Continuous improvement is also known as Kaizen and focuses on small improvements to quality and processes.","Prevention is generally more cost-effective than inspection.","The three quality processes are Plan Quality Management, Manage Quality, and Control Quality.","Manage Quality focuses on processes used to produce deliverables.","Control Quality inspects deliverables to determine whether they meet quality standards and requirements.","Quality tools include flowcharts, checklists, check sheets, fishbone diagrams, histograms, audits, control charts, and testing."],"examples":["A basic TV can be low grade but high quality if it meets requirements.","A high-grade TV can still be low quality if it breaks often or has poor display quality.","A checklist confirms required items were reviewed; a check sheet counts defects.","A fishbone diagram helps identify possible causes of defects."],"podcast":[{"speaker":"Host 1","text":"Chapter 9 is Project Quality Management, and this chapter is very PMP mindset heavy. It is not just about inspecting work at the end. It is about understanding requirements, preventing defects, improving processes, and confirming deliverables meet standards."},{"speaker":"Host 2","text":"Exactly. Quality is defined as the degree to which a set of inherent characteristics fulfill requirements. So if requirements are unclear, quality becomes hard to prove."},{"speaker":"Host 1","text":"That is why collecting requirements correctly matters. If the project team does not understand what quality means for the stakeholder, the deliverable may fail even if the team thinks it did good work."},{"speaker":"Host 2","text":"Grade and quality are different. Grade is the category or level of features. Quality is whether the product meets requirements."},{"speaker":"Host 1","text":"A low-grade product can be high quality if it meets requirements. A high-grade product can be low quality if it fails, breaks, or does not meet requirements."},{"speaker":"Host 2","text":"The exam tip is simple: quality must always be high, while grade can be low or high."},{"speaker":"Host 1","text":"Just-in-time is also mentioned. It is where a product-based company maintains very low or no inventory and obtains latest products, helping with inventory quality and lower inventory cost."},{"speaker":"Host 2","text":"Plan-Do-Check-Act is another major quality theory. Plan means design or revise the process. Do means implement the plan and measure performance. Check means assess the measurements. Act means decide what changes are needed to improve the process."},{"speaker":"Host 1","text":"Continuous improvement, also called Kaizen, focuses on small changes to improve processes and quality. The key idea is that products and services become outdated if they are not continuously improved."},{"speaker":"Host 2","text":"And everyone is responsible for quality. Customers, project managers, team members, sponsors, and senior management all play a role."},{"speaker":"Host 1","text":"Prevention over inspection is a huge PMP mindset concept. It is generally more cost-effective to prevent defects than inspect after deliverables are already made."},{"speaker":"Host 2","text":"Prevention can include better planning, better materials, knowledgeable team members, and better equipment. The more prevention you build in, the fewer defects you should have later."},{"speaker":"Host 1","text":"Six Sigma focuses on improving processes to reduce defects. You do not need sigma calculations for the exam, but you do need to understand the theory."},{"speaker":"Host 2","text":"Now let’s separate attribute sampling and variable sampling. Attribute sampling is about presence or absence of characteristics. Good or bad. Yes or no. One or zero."},{"speaker":"Host 1","text":"Variable sampling measures degree. Something can be okay, good, very good, bad, or very bad. So attribute is binary, variable is degree."},{"speaker":"Host 2","text":"The three quality processes are Plan Quality Management, Manage Quality, and Control Quality."},{"speaker":"Host 1","text":"Plan Quality Management identifies quality requirements and documents how the project will meet them. The main outputs are the quality management plan and quality metrics."},{"speaker":"Host 2","text":"Quality metrics are used to measure deliverables and processes against quality standards. Examples include program load speed, software test coverage, and process improvements."},{"speaker":"Host 1","text":"Manage Quality is about executing the activities in the quality management plan. This is where quality assurance appears."},{"speaker":"Host 2","text":"Quality assurance ensures the correct processes are followed and processes are improved. Manage Quality focuses on the processes used to produce deliverables."},{"speaker":"Host 1","text":"Control Quality is different. Control Quality inspects completed deliverables to determine whether they meet quality standards and requirements."},{"speaker":"Host 2","text":"That is one of the biggest exam distinctions. Process focus equals Manage Quality. Deliverable inspection equals Control Quality."},{"speaker":"Host 1","text":"Now let’s talk tools. Benchmarking compares project quality requirements to other projects’ quality requirements. Cost-benefit analysis compares the benefits of meeting quality requirements against the cost of meeting them."},{"speaker":"Host 2","text":"Cost of quality includes cost of conformance and cost of nonconformance. Conformance includes prevention and appraisal costs. Nonconformance includes internal and external failure costs."},{"speaker":"Host 1","text":"A flowchart shows the process and room for improvement. If you want to make sure the team follows a process correctly, think flowchart."},{"speaker":"Host 2","text":"A checklist helps verify that deliverable components are checked correctly. A check sheet keeps a running total or tally of defects."},{"speaker":"Host 1","text":"A cause-and-effect diagram, also called a fishbone or Ishikawa diagram, identifies causes of defects and root causes of potential defects."},{"speaker":"Host 2","text":"Histograms are bar charts showing distribution of numerical data. They can show frequency of defects."},{"speaker":"Host 1","text":"Audits make sure the project follows organizational quality policies, processes, and procedures. They can also verify that approved change requests were implemented."},{"speaker":"Host 2","text":"Control charts show whether a process is in control. The mean is represented by the center line, and upper and lower control limits are typically three standard deviations from the mean."},{"speaker":"Host 1","text":"The rule of seven says if seven consecutive points fall on one side of the mean, the process must be inspected."},{"speaker":"Host 2","text":"Testing and product evaluations are used to verify that deliverables meet requirements. In software, examples include unit testing and integration testing."},{"speaker":"Host 1","text":"Final mindset for Chapter 9: quality is planned in, built through good processes, and confirmed through inspection and testing."},{"speaker":"Host 2","text":"Exactly. PMP wants the project manager to prevent defects, improve processes, understand requirements, use objective metrics, and confirm deliverables meet quality standards."}],"questions":[{"q": "How is quality defined in project management?", "options": ["The degree to which inherent characteristics fulfill requirements", "The number of features included in the final product", "The total cost of all testing and inspection activities", "The project manager's personal opinion of work quality"], "answer": 0, "why": "Quality = degree to which characteristics fulfill requirements.", "mindset": "Quality starts with clear requirements.", "tags": ["Quality", "Concept"], "chapterRef": "Chapter 9 - Quality Definition"}, {"q": "What is the difference between grade and quality?", "options": ["Grade is category of features; quality is meeting requirements", "They mean exactly the same thing in project management", "Quality is always lower than grade on every project", "Grade only applies to agile projects and nothing else"], "answer": 0, "why": "Grade = feature level/category. Quality = conformance to requirements. Different concepts.", "mindset": "Low grade can be high quality if it meets requirements.", "tags": ["Quality", "Concept"], "chapterRef": "Chapter 9 - Grade vs Quality"}, {"q": "Which statement about grade and quality is correct?", "options": ["Quality must always be high; grade can be low or high", "Grade must always be high; quality can be low", "Both must always be high on every project", "Both can be low without affecting project success"], "answer": 0, "why": "Quality must always be high. Grade is acceptable at any level as long as quality requirements are met.", "mindset": "Never accept low quality. Low grade is fine if appropriate.", "tags": ["Quality", "Exam Trap"], "chapterRef": "Chapter 9 - Quality Rule"}, {"q": "What is Plan-Do-Check-Act (PDCA)?", "options": ["A process improvement cycle for continuous quality improvement", "A procurement selection method for choosing sellers", "A formula for calculating schedule performance index", "A technique for identifying project stakeholders"], "answer": 0, "why": "PDCA is a quality improvement cycle: plan the change, do it, check results, act on findings.", "mindset": "PDCA drives iterative process improvement.", "tags": ["Quality", "Process"], "chapterRef": "Chapter 9 - PDCA"}, {"q": "What is continuous improvement also called?", "options": ["Kaizen — focusing on small ongoing improvements", "Crashing — adding resources to speed up work", "Fast-tracking — overlapping sequential activities", "Gold plating — adding extras beyond scope"], "answer": 0, "why": "Continuous improvement = Kaizen. Small, ongoing improvements to processes and quality.", "mindset": "Kaizen = small constant improvements.", "tags": ["Quality", "Concept"], "chapterRef": "Chapter 9 - Continuous Improvement"}, {"q": "What is the principle of prevention over inspection?", "options": ["It's cheaper to prevent defects than to inspect and fix them after the fact", "Inspection should completely replace all prevention activities", "Defects should be ignored until the project closing phase", "Only customers are responsible for finding quality problems"], "answer": 0, "why": "Prevention (training, better tools, better processes) costs less than finding and fixing defects later.", "mindset": "PMI prefers proactive quality planning over reactive inspection.", "tags": ["Quality", "Mindset"], "chapterRef": "Chapter 9 - Prevention vs Inspection"}, {"q": "What are the three quality management processes?", "options": ["Plan Quality Management, Manage Quality, and Control Quality", "Identify Quality, Rank Quality, and Transfer Quality", "Estimate Quality, Budget Quality, and Close Quality", "Plan Quality, Execute Quality, and Archive Quality"], "answer": 0, "why": "Three processes: Plan Quality, Manage Quality, Control Quality.", "mindset": "Plan it, ensure good process, inspect the output.", "tags": ["Quality", "Process"], "chapterRef": "Chapter 9 - Quality Processes"}, {"q": "What does Manage Quality focus on?", "options": ["The processes used to produce deliverables (quality assurance)", "Inspecting completed deliverables for defects and issues", "Closing the project and transitioning the final product", "Selecting sellers through the procurement bidding process"], "answer": 0, "why": "Manage Quality = quality assurance = ensuring correct processes are followed.", "mindset": "Process focus = Manage Quality.", "tags": ["Quality", "Process"], "chapterRef": "Chapter 9 - Manage Quality"}, {"q": "What does Control Quality focus on?", "options": ["Inspecting completed deliverables to verify they meet requirements", "Ensuring the correct processes are followed during execution", "Creating the quality management plan during project planning", "Identifying stakeholders and their quality expectations"], "answer": 0, "why": "Control Quality inspects deliverables to determine if they meet standards.", "mindset": "Deliverable inspection = Control Quality.", "tags": ["Quality", "Process"], "chapterRef": "Chapter 9 - Control Quality"}, {"q": "What is attribute sampling?", "options": ["Measuring whether a characteristic is present or absent (yes/no)", "Measuring the degree of conformity on a continuous scale", "Calculating the cost performance index for the project", "Determining the critical path through the network diagram"], "answer": 0, "why": "Attribute sampling = binary (present/absent, pass/fail, yes/no).", "mindset": "Attribute = binary. Variable = degree.", "tags": ["Quality", "Concept"], "chapterRef": "Chapter 9 - Sampling"}, {"q": "What is variable sampling?", "options": ["Measuring degree of conformity on a continuous scale (how much)", "Measuring only presence or absence of a characteristic", "Calculating earned value management formulas", "Estimating activity durations using three-point method"], "answer": 0, "why": "Variable sampling measures degree — okay, good, very good, etc.", "mindset": "Variable = spectrum/degree. Attribute = binary.", "tags": ["Quality", "Concept"], "chapterRef": "Chapter 9 - Sampling"}, {"q": "What is a fishbone diagram also called?", "options": ["Ishikawa diagram or cause-and-effect diagram", "Gantt chart or bar chart", "RACI chart or responsibility matrix", "Burndown chart or velocity tracker"], "answer": 0, "why": "Fishbone = Ishikawa = cause-and-effect diagram. Used to identify root causes of defects.", "mindset": "Use fishbone when you need to find WHY a defect occurs.", "tags": ["Quality", "Tools"], "chapterRef": "Chapter 9 - Quality Tools"}, {"q": "What does the Rule of Seven indicate on a control chart?", "options": ["Seven consecutive points on one side of the mean requires process investigation", "Seven defects means the project should be immediately cancelled", "Seven stakeholders means twenty-one communication channels exist", "Seven activities in sequence always form the critical path"], "answer": 0, "why": "Rule of 7: if 7 consecutive data points fall on one side of the mean, the process needs inspection.", "mindset": "Rule of 7 = possible process issue. Investigate.", "tags": ["Quality", "Tools"], "chapterRef": "Chapter 9 - Control Charts"}, {"q": "What is a checklist used for in quality?", "options": ["Verifying that required items were reviewed or completed correctly", "Counting the total number of defects found over time", "Showing the distribution of numerical data in categories", "Identifying all possible root causes of a quality problem"], "answer": 0, "why": "Checklists verify that required items are checked. They help ensure nothing is missed.", "mindset": "Checklist = verify items. Check sheet = count defects.", "tags": ["Quality", "Tools"], "chapterRef": "Chapter 9 - Checklists"}, {"q": "What is a check sheet used for?", "options": ["Keeping a running tally or count of defects found", "Verifying that all required deliverable items were completed", "Drawing the process flow for continuous improvement", "Showing reporting relationships between team members"], "answer": 0, "why": "Check sheets gather data and keep running totals of defects.", "mindset": "Check sheet = counting/tallying defects over time.", "tags": ["Quality", "Tools"], "chapterRef": "Chapter 9 - Check Sheets"}, {"q": "What is a histogram?", "options": ["A bar chart showing the frequency distribution of numerical data", "A line chart showing project schedule progress over time", "A network diagram showing activity dependencies and sequence", "A matrix showing stakeholder power and interest levels"], "answer": 0, "why": "Histograms display frequency/distribution of data — useful for seeing defect patterns.", "mindset": "Histogram = frequency visualization.", "tags": ["Quality", "Tools"], "chapterRef": "Chapter 9 - Histograms"}, {"q": "What is a quality audit used for?", "options": ["Ensuring the project follows organizational quality policies and procedures", "Calculating the project's cost performance index", "Selecting the best seller from procurement proposals", "Creating the project charter for sponsor approval"], "answer": 0, "why": "Audits verify compliance with quality policies, processes, and procedures.", "mindset": "Audit = process compliance check.", "tags": ["Quality", "Process"], "chapterRef": "Chapter 9 - Audits"}, {"q": "What do control charts show?", "options": ["Whether a process is stable and in control over time", "The total project budget consumption per month", "The critical path activities and their float values", "The stakeholder engagement levels current vs desired"], "answer": 0, "why": "Control charts show process stability — data points relative to mean and control limits.", "mindset": "Control chart = process stability over time.", "tags": ["Quality", "Tools"], "chapterRef": "Chapter 9 - Control Charts"}, {"q": "What does Six Sigma focus on?", "options": ["Improving processes to reduce defects to near-zero levels", "Counting communication channels between stakeholders", "Calculating earned value management formulas accurately", "Selecting the appropriate contract type for procurement"], "answer": 0, "why": "Six Sigma focuses on process improvement to reduce defects.", "mindset": "Six Sigma = reduce defects through process improvement.", "tags": ["Quality", "Concept"], "chapterRef": "Chapter 9 - Six Sigma"}, {"q": "What are the two main components of cost of quality?", "options": ["Cost of conformance (prevention + appraisal) and cost of nonconformance (failures)", "Only prevention costs and nothing else matters", "Only external failure costs after customer delivery", "Only the project manager's salary and training costs"], "answer": 0, "why": "CoQ = conformance (prevention + appraisal) + nonconformance (internal + external failures).", "mindset": "Invest in conformance to reduce nonconformance costs.", "tags": ["Quality", "Cost"], "chapterRef": "Chapter 9 - Cost of Quality"}, {"q": "What does Just-in-Time (JIT) mean?", "options": ["Maintaining very low or no inventory by obtaining materials when needed", "Ordering maximum inventory months in advance of any need", "Only delivering the project at the very last possible moment", "Skipping all quality checks to save time on the schedule"], "answer": 0, "why": "JIT = low/no inventory, obtain latest products as needed. Reduces inventory costs.", "mindset": "JIT = get what you need when you need it.", "tags": ["Quality", "Concept"], "chapterRef": "Chapter 9 - JIT"}, {"q": "Who is responsible for quality?", "options": ["Everyone — customers, PM, team, sponsors, and senior management all play a role", "Only the quality department is responsible for quality", "Only the project manager owns all quality responsibilities", "Only the customer decides whether quality is acceptable"], "answer": 0, "why": "Everyone is responsible for quality — it's a shared responsibility across all stakeholders.", "mindset": "Quality is everyone's job, not just one department's.", "tags": ["Quality", "Mindset"], "chapterRef": "Chapter 9 - Quality Responsibility"}, {"q": "What are quality metrics used for?", "options": ["Measuring deliverables and processes against defined quality standards", "Selecting sellers during the procurement bidding process", "Calculating the number of communication channels needed", "Determining the critical path through the schedule network"], "answer": 0, "why": "Quality metrics provide objective measurement of whether deliverables and processes meet standards.", "mindset": "Metrics make quality objective and measurable.", "tags": ["Quality", "Tools"], "chapterRef": "Chapter 9 - Quality Metrics"}, {"q": "What is the output of Plan Quality Management?", "options": ["Quality management plan and quality metrics", "Verified deliverables and accepted deliverables", "Work performance reports and change requests", "Project charter and stakeholder register"], "answer": 0, "why": "Plan Quality Management creates the quality management plan and quality metrics.", "mindset": "Planning defines what quality means and how to measure it.", "tags": ["Quality", "ITTO"], "chapterRef": "Chapter 9 - Plan Quality"}, {"q": "What does Control Quality produce as output?", "options": ["Verified deliverables that then go to Validate Scope for acceptance", "The quality management plan for the project", "The project charter signed by the sponsor", "The final project report and lessons learned"], "answer": 0, "why": "Control Quality outputs verified deliverables — checked for quality, ready for formal acceptance.", "mindset": "Control Quality → verified deliverables → Validate Scope → accepted deliverables.", "tags": ["Quality", "ITTO"], "chapterRef": "Chapter 9 - Control Quality Output"}, {"q": "A defect is found during final testing. The team says they'll fix it in a patch after release. Deadline is tomorrow. What should you do?", "options": ["Assess defect severity and customer impact — if critical, delay release to fix it properly", "Release on time with the known defect since meeting the deadline is most important", "Let the customer decide whether they want to accept the product with the defect", "Fix it immediately without any testing since there isn't enough time for both"], "answer": 0, "why": "Quality is non-negotiable. Assess severity first — knowingly releasing critical defects damages trust.", "mindset": "PMI mindset: schedule pressure doesn't justify shipping known-defective products.", "tags": ["Quality Control", "Decision Making"], "chapterRef": "Chapter 9 - Control Quality"}, {"q": "Your team spends 30% of their time on rework. A stakeholder says that's normal for your industry. What should you recommend?", "options": ["Investigate root causes and implement prevention activities to reduce rework rate", "Accept it as normal since an experienced stakeholder confirmed it's industry standard", "Add a 30% buffer to all future estimates to account for the expected rework", "Hire more people specifically to handle the volume of rework being generated"], "answer": 0, "why": "30% rework = process failure. PMI emphasizes prevention over acceptance of waste.", "mindset": "PMI mindset: don't normalize waste. Invest in prevention to fix root causes.", "tags": ["Quality", "Prevention"], "chapterRef": "Chapter 9 - Manage Quality"}, {"q": "A quality audit reveals the team isn't following documented processes but outputs meet specifications. What should you do?", "options": ["Investigate why — the process may be outdated. Update it or enforce compliance.", "Ignore the gap since the outputs are meeting all quality specifications", "Force immediate compliance with no discussion about why the process is ignored", "Eliminate the documented process entirely since it's clearly not needed"], "answer": 0, "why": "Process non-compliance is a governance issue. Good outputs today don't guarantee good outputs tomorrow.", "mindset": "PMI mindset: process provides consistency. Investigate gaps rather than ignoring them.", "tags": ["Quality Audit", "Process Compliance"], "chapterRef": "Chapter 9 - Quality Audits"}, {"q": "Your project has high failure costs (rework, scrap). Where should you invest to reduce total cost of quality?", "options": ["More prevention activities like training, better tools, and process improvement", "Less inspection to reduce appraisal costs and save project budget", "Accept failures as unavoidable and budget for them going forward", "Faster rework processes so failures are corrected more quickly"], "answer": 0, "why": "Prevention is the cheapest quality cost category. Every prevention dollar saves multiple failure dollars.", "mindset": "PMI mindset: prevention > inspection > failure. Invest upstream.", "tags": ["Cost of Quality", "Prevention"], "chapterRef": "Chapter 9 - Cost of Quality"}, {"q": "A team member says you're over-engineering because the customer didn't ask for that level of quality. What should you do?", "options": ["Review quality requirements — building beyond spec is gold-plating which wastes resources", "Always build to the highest possible quality regardless of what requirements state", "Let the team decide their own quality standards independent of customer requirements", "Lower quality below specifications to save money and time on the project"], "answer": 0, "why": "Gold-plating adds unrequested quality. Build to requirements — no more, no less.", "mindset": "PMI mindset: quality = conformance to requirements, not personal excellence standards.", "tags": ["Gold-Plating", "Quality"], "chapterRef": "Chapter 9 - Quality Requirements"}, {"q": "Defects cluster around one specific module. What quality tool would BEST identify the root cause?", "options": ["Cause-and-effect (fishbone) diagram to explore potential causes across categories", "A Gantt chart to determine if the module work was scheduled too tightly", "A RACI matrix to identify who is responsible for the defective module", "A stakeholder register to find out who owns the problematic module"], "answer": 0, "why": "Fishbone diagrams systematically decompose causes into categories for root cause analysis.", "mindset": "PMI mindset: use the right tool. Root cause = fishbone/Ishikawa.", "tags": ["Quality Tools", "Root Cause"], "chapterRef": "Chapter 9 - Fishbone Diagram"}, {"q": "The project delivered on time and budget but the customer reports production issues. All your quality metrics passed. What went wrong?", "options": ["Quality metrics may have measured specifications but not actual fitness for real-world use", "Nothing went wrong since post-delivery issues are not the project's responsibility", "The customer is using the product incorrectly and needs better user training", "The testing team failed and should be held personally accountable for the issues"], "answer": 0, "why": "Passing internal tests isn't enough if the product fails in use. Metrics may have missed real-world scenarios.", "mindset": "PMI mindset: quality = fitness for purpose, not just passing tests.", "tags": ["Quality", "Customer Satisfaction"], "chapterRef": "Chapter 9 - Quality Planning"}, {"q": "Management wants to cut the testing phase by 50% to meet a deadline. What should you communicate?", "options": ["Present the risk — reduced testing means more defects reach customers, increasing costs later", "Agree to the cut since management has the authority to make that decision directly", "Cut testing to zero since a 50% cut doesn't make enough difference anyway", "Assign more people to testing so it finishes in half the time without risk"], "answer": 0, "why": "Cutting testing increases undetected defect risk. Quantify downstream impact for informed decisions.", "mindset": "PMI mindset: make risks visible. Let decision-makers understand what they're accepting.", "tags": ["Quality", "Risk"], "chapterRef": "Chapter 9 - Control Quality"}, {"q": "The quality team wants to inspect 100% of 10,000 units. What should you recommend?", "options": ["Statistical sampling — inspect a representative sample to draw valid conclusions", "Inspect all 10,000 units regardless of the cost and time required", "Skip inspection entirely to save both time and project budget", "Inspect only the first unit and the last unit produced"], "answer": 0, "why": "100% inspection is rarely practical at scale. Statistical sampling provides confidence at reasonable cost.", "mindset": "PMI mindset: use appropriate tools for the scale of work.", "tags": ["Quality Control", "Sampling"], "chapterRef": "Chapter 9 - Statistical Sampling"}, {"q": "What is the key distinction between Manage Quality and Control Quality?", "options": ["Manage Quality focuses on processes; Control Quality inspects completed deliverables", "They are the same process with two different names in the PMBOK", "Manage Quality is only for the PM; Control Quality is only for the team", "Control Quality must always be performed before Manage Quality in sequence"], "answer": 0, "why": "Manage Quality = are we using good processes? Control Quality = does the output meet specs?", "mindset": "PMI mindset: good process leads to good output. Process first, inspection second.", "tags": ["Quality", "Process"], "chapterRef": "Chapter 9 - Quality Processes"}]},{"id":10,"title":"Chapter 10: Project Resource Management","summary":"Chapter 10: Project Resource Management","notes":["Chapter 10: Project Resource Management","Resources are the backbone of any project","Resources are generally categorized into two main types: • Physical resources • Human resources","Physical resources generally include: • Materials • Equipment • Facilities","Human resources would be the project team","In this knowledge area, you will be: • Organizing the project team • Leading the project team to complete the project","This is an important knowledge area for the exam • Expect several questions on human resources • Expect questions on conflict management from these processes","Project management deals a lot with managing people","All projects have people, and this may be one of the hardest aspects of project management","A dysfunctional project team is more likely to produce a failed deliverable","One of the project manager’s main jobs: • Ensure the team functions well • Manage conflicts that occur as the project progresses","On an agile project: • The project team usually plays an important role • Team members are usually the main decision-makers and problem-solvers","On agile projects, the project manager is more of a “servant-leader” • Provides the tools the team needs to complete the work","Professional and ethical behaviors must be maintained within project development","The team should: • Be aware of professional and ethical behaviors • Follow those behaviors","The project manager should influence the project team, including: • Managing the environment • Communications • Cultural issues","Plan Resource Management • Process Group: Planning • Main Outputs: • Resource Management Plan • Team Charter","Estimate Activity Resources • Process Group: Planning • Main Outputs: • Resource Requirements • Resource Breakdown Structure • Basis of Estimates","Acquire Resources • Process Group: Executing • Main Outputs: • Physical Resource Assignments • Project Team Assignments • Resource Calendar","Develop Team • Process Group: Executing • Main Outputs: • Team Performance Assessments • Change Requests","Manage Team • Process Group: Executing • Main Outputs: • Change Requests","Control Resources • Process Group: Monitoring and Controlling • Main Outputs: • Work Performance Information • Change Requests"],"examples":["Resources are the backbone of any project","Resources are generally categorized into two main types: • Physical resources • Human resources","Physical resources generally include: • Materials • Equipment • Facilities","Human resources would be the project team"],"podcast":[{"speaker":"Maya","text":"Alright, let’s study Chapter 10: Project Resource Management. This is one of those PMP areas where you want to understand both the terminology and the project manager mindset behind it."},{"speaker":"Jordan","text":"Exactly. The PMP rarely rewards memorizing words only. It wants you to recognize the situation, identify what process or principle is being tested, and choose the next best action."},{"speaker":"Maya","text":"One key point is this: Chapter 10: Project Resource Management"},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. Resources are the backbone of any project"},{"speaker":"Maya","text":"One key point is this: Resources are generally categorized into two main types: • Physical resources • Human resources"},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. Physical resources generally include: • Materials • Equipment • Facilities"},{"speaker":"Maya","text":"One key point is this: Human resources would be the project team"},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. In this knowledge area, you will be: • Organizing the project team • Leading the project team to complete the project"},{"speaker":"Maya","text":"One key point is this: This is an important knowledge area for the exam • Expect several questions on human resources • Expect questions on conflict management from these processes"},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. Project management deals a lot with managing people"},{"speaker":"Maya","text":"One key point is this: All projects have people, and this may be one of the hardest aspects of project management"},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. A dysfunctional project team is more likely to produce a failed deliverable"},{"speaker":"Maya","text":"One key point is this: One of the project manager’s main jobs: • Ensure the team functions well • Manage conflicts that occur as the project progresses"},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. On an agile project: • The project team usually plays an important role • Team members are usually the main decision-makers and problem-solvers"},{"speaker":"Maya","text":"One key point is this: On agile projects, the project manager is more of a “servant-leader” • Provides the tools the team needs to complete the work"},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. Professional and ethical behaviors must be maintained within project development"},{"speaker":"Maya","text":"One key point is this: The team should: • Be aware of professional and ethical behaviors • Follow those behaviors"},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. The project manager should influence the project team, including: • Managing the environment • Communications • Cultural issues"},{"speaker":"Maya","text":"One key point is this: Plan Resource Management • Process Group: Planning • Main Outputs: • Resource Management Plan • Team Charter"},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. Estimate Activity Resources • Process Group: Planning • Main Outputs: • Resource Requirements • Resource Breakdown Structure • Basis of Estimates"},{"speaker":"Maya","text":"So the big takeaway is not just knowing the definition. You want to ask: what is happening in the scenario, who is impacted, what process should be used, and what should the project manager do next?"},{"speaker":"Jordan","text":"Right. Slow down, do not jump straight to escalation, and use the correct PMP process. That is how this chapter turns into points on the exam."}],"questions":[{"q": "What are the two main categories of project resources?", "options": ["Physical resources and human resources (the project team)", "Only financial resources and nothing else matters", "Only external contractors and internal employees", "Only equipment and software tools for the project"], "answer": 0, "why": "Resources are categorized as physical (materials, equipment, facilities) and human (the team).", "mindset": "Resources = things + people.", "tags": ["Resource", "Concept"], "chapterRef": "Chapter 10 - Resource Types"}, {"q": "What are examples of physical resources?", "options": ["Materials, equipment, and facilities needed for the project", "Only the project team members and their skills", "Only the project manager and the sponsor", "Only the stakeholder register and communication plan"], "answer": 0, "why": "Physical resources include materials, equipment, and facilities.", "mindset": "Physical = tangible things, not people.", "tags": ["Resource", "Concept"], "chapterRef": "Chapter 10 - Physical Resources"}, {"q": "What is one of the PM's main jobs regarding the team?", "options": ["Ensure the team functions well and manage conflicts as they arise", "Avoid all communication with team members entirely", "Only track cost and ignore team performance issues", "Only write contracts with external sellers"], "answer": 0, "why": "The PM ensures the team functions well and manages conflicts as the project progresses.", "mindset": "People are the hardest part of PM â€” and the most important.", "tags": ["Resource", "PM Role"], "chapterRef": "Chapter 10 - Team Management"}, {"q": "What is the PM's role on agile projects?", "options": ["Servant-leader who provides tools and removes impediments for the team", "Dictator who makes every technical decision for the team", "Passive observer who watches but never intervenes in any way", "Customer representative who prioritizes all backlog items"], "answer": 0, "why": "On agile projects, the PM is a servant-leader providing support, not commanding.", "mindset": "Servant leader = support and enable, don't command.", "tags": ["Agile", "Resource"], "chapterRef": "Chapter 10 - Agile PM Role"}, {"q": "What does RACI stand for?", "options": ["Responsible, Accountable, Consulted, Informed", "Risk, Action, Cost, Issue", "Review, Approve, Control, Inspect", "Resource, Agile, Charter, Influence"], "answer": 0, "why": "RACI = Responsible, Accountable, Consulted, Informed.", "mindset": "RACI clarifies who does what for each work package.", "tags": ["Resource", "Concept"], "chapterRef": "Chapter 10 - RACI"}, {"q": "What is the important rule about accountability in RACI?", "options": ["Never have more than one person accountable for the same deliverable", "Everyone should be accountable for every deliverable equally", "Only the sponsor can ever be listed as accountable", "Accountability should be left blank to avoid blame"], "answer": 0, "why": "Only one person can be accountable â€” multiple A's creates confusion and blame-shifting.", "mindset": "One A per deliverable. Period.", "tags": ["Resource", "Exam Trap"], "chapterRef": "Chapter 10 - RACI Rule"}, {"q": "What is a team charter?", "options": ["A document outlining acceptable team behavior and ground rules", "A seller invoice for contracted project work", "The project cost baseline approved by the sponsor", "An agile burndown chart tracking sprint progress"], "answer": 0, "why": "The team charter outlines acceptable behavior, ground rules, and team agreements.", "mindset": "Team-created rules get better buy-in than imposed rules.", "tags": ["Resource", "Team"], "chapterRef": "Chapter 10 - Team Charter"}, {"q": "Who should create the team charter?", "options": ["The project team themselves for better ownership and buy-in", "Only the sponsor without any team input at all", "Only the procurement department for contract reasons", "Only external auditors reviewing the project governance"], "answer": 0, "why": "The team charter is best created BY the team FOR the team â€” they own what they create.", "mindset": "People follow rules they help create.", "tags": ["Resource", "Team"], "chapterRef": "Chapter 10 - Team Charter"}, {"q": "What are Tuckman's stages of team development?", "options": ["Forming, Storming, Norming, Performing, Adjourning", "Planning, Executing, Monitoring, Controlling, Closing", "Initiating, Planning, Executing, Monitoring, Closing", "Identifying, Analyzing, Responding, Monitoring, Closing"], "answer": 0, "why": "Tuckman's model: Forming â†’ Storming â†’ Norming â†’ Performing â†’ Adjourning.", "mindset": "Teams naturally progress through these stages.", "tags": ["Resource", "Team Development"], "chapterRef": "Chapter 10 - Tuckman Model"}, {"q": "What happens during the Storming stage?", "options": ["Team members challenge each other and conflicts emerge as roles clarify", "The team works at peak efficiency with minimal conflict", "Team members first meet and learn about the project", "The project ends and the team is released to other work"], "answer": 0, "why": "Storming = conflicts, power struggles, and challenges as the team finds its footing.", "mindset": "Storming is normal and necessary for growth.", "tags": ["Resource", "Team Development"], "chapterRef": "Chapter 10 - Storming"}, {"q": "What happens during the Performing stage?", "options": ["The team works efficiently with minimal oversight needed from the PM", "Team members first meet and are introduced to each other", "Conflicts are frequent as team members challenge approaches", "The team is disbanded and released from project duties"], "answer": 0, "why": "Performing = high efficiency, trust established, team self-manages well.", "mindset": "Performing is the goal â€” the team is at peak productivity.", "tags": ["Resource", "Team Development"], "chapterRef": "Chapter 10 - Performing"}, {"q": "What is pre-assignment?", "options": ["Team members selected before the project officially starts", "Team members fired after the project completes", "Stakeholders who refuse to engage with the project", "Sellers who are eliminated during procurement bidding"], "answer": 0, "why": "Pre-assignment = people chosen for the project before it begins (common in functional orgs).", "mindset": "Pre-assigned resources may come from prior commitments.", "tags": ["Resource", "Concept"], "chapterRef": "Chapter 10 - Pre-Assignment"}, {"q": "What is a Resource Breakdown Structure?", "options": ["A hierarchical breakdown of resources by category and type", "A list of all project risks ranked by probability", "A contract type used for procurement management", "A formula for calculating schedule performance"], "answer": 0, "why": "RBS organizes resources hierarchically by category and type for tracking and management.", "mindset": "RBS helps organize and visualize resource allocation.", "tags": ["Resource", "Concept"], "chapterRef": "Chapter 10 - RBS"}, {"q": "What is a challenge of virtual teams?", "options": ["Communication, language, cultural, technology, or isolation issues", "No access to global talent pools of any kind", "Inability to use any collaboration tools whatsoever", "Virtual teams always perform worse than co-located teams"], "answer": 0, "why": "Virtual teams face communication, language, cultural, tech, and isolation challenges.", "mindset": "Virtual teams need intentional engagement and tool support.", "tags": [
