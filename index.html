er becomes available again", "Assume the PO role yourself and reprioritize the backlog based on your judgment"], "answer": 0, "why": "PO absence is an impediment. Escalate while ensuring the team isn't blocked — use existing priority.", "mindset": "PMI mindset: remove impediments. Don't let the team sit idle or overstep into the PO role.", "tags": ["Agile", "Product Owner", "Impediment Removal"], "chapterRef": "Chapter 4 - Scrum Roles"}, {"q": "Your team delivered working software per acceptance criteria but the stakeholder says it's not what they wanted. What should you do?", "options": ["Schedule demos earlier next sprint and involve the stakeholder more in refinement sessions", "Blame the stakeholder for approving the acceptance criteria that were clearly documented", "Refuse to make changes since the user stories were completed exactly per written criteria", "Add all rework to the next sprint backlog without discussing the disconnect with anyone"], "answer": 0, "why": "Acceptance criteria can be technically correct but miss intent. Shorten the feedback loop.", "mindset": "PMI mindset: delivering to spec but not satisfaction is still a failure. Tighten feedback.", "tags": ["Agile", "Stakeholder Feedback"], "chapterRef": "Chapter 4 - Sprint Review"}, {"q": "Your team wants to skip the retrospective because everything is going fine. What should you do?", "options": ["Explain that retrospectives drive continuous improvement even when things are going well", "Cancel the retrospective since the team is performing well and sees no issues", "Make the retro mandatory but only discuss negative items and what went wrong", "Hold the retro but let only the PM speak about what the team should change"], "answer": 0, "why": "Retros aren't just for problems — they're how good teams become great.", "mindset": "PMI mindset: continuous improvement is always possible. Don't skip inspect-and-adapt.", "tags": ["Agile", "Retrospective", "Continuous Improvement"], "chapterRef": "Chapter 4 - Retrospectives"}, {"q": "Management wants to measure your agile team using individual metrics like lines of code per person. What should you recommend?", "options": ["Recommend team-level metrics like velocity and cycle time instead of individual measures", "Implement the individual metrics exactly as management requested without discussion", "Track individual metrics secretly without informing the team about the measurement", "Refuse to track any metrics at all since agile doesn't believe in measurement"], "answer": 0, "why": "Individual metrics damage collaboration. Team metrics encourage working together toward shared goals.", "mindset": "PMI mindset: measure team outcomes, not individual output.", "tags": ["Agile", "Metrics", "Team Performance"], "chapterRef": "Chapter 4 - Agile Metrics"}, {"q": "A stakeholder asks when a specific feature will be delivered. Your agile project has no fixed feature-to-sprint mapping. What should you say?", "options": ["Provide a range based on current velocity and state that priority changes could shift it", "Tell them agile cannot predict anything and they should stop asking for dates", "Commit to a specific sprint date even though you have no certainty it will happen", "Ignore the question since stakeholders shouldn't ask about timelines in agile"], "answer": 0, "why": "Agile can forecast using velocity. Provide ranges with caveats, not refusals or false certainty.", "mindset": "PMI mindset: agile isn't unpredictable. Use data to forecast with appropriate uncertainty.", "tags": ["Agile", "Forecasting", "Communication"], "chapterRef": "Chapter 4 - Agile Planning"}]},{"id":5,"title":"Chapter 5: Integration Management","summary":"Integration management, including the project charter, business documents, project management plan, direct and manage project work, project knowledge, work performance flow, integrated change control, and close project or phase.","notes":["Page 1 – Chapter 5: Integration Management","Integration management is the unification of all of the other knowledge areas.","It could be thought of as the combination or summary of the other nine knowledge areas.","In order to develop the project management plan, you will need to perform the other 23 planning processes.","By doing the other 23 processes, their outputs become the main input to the project management plan.","The processes listed under the integration knowledge area roll up to create the integration knowledge area.","In the integration executing process of “direct and manage project work,” you would need to complete the other nine processes listed under it.","This knowledge area is probably the most important of the 10 knowledge areas, as it incorporates and summarizes all of the work the project manager will need to do in order to successfully complete each phase of a project.","The project manager’s main job is to perform integration.","Integration means integrating all of the other knowledge areas such as scope, time, cost, and quality.","Different knowledge areas may be integrated in different sequences depending on the project.","Information gathered from the project scope may be used to create the schedule and budget.","On an agile project, the concept of managing a project in this knowledge area will not change.","The project manager will still be in charge of initiating, planning, executing, monitoring and controlling, and closing.","On agile projects, the project team will be more involved and make more decisions than the project manager.","In a traditional project, the project manager plays more of a central role with the project team reporting to them.","On agile and hybrid projects, the project manager plays more of a servant role and supports team members in conducting many of the processes listed in this knowledge area.","In agile, expect more changes throughout each phase and the project as a whole.","Expect exam questions on the processes covered in this chapter.","It is important to understand:","Why an input is needed.","How a tool can be used in a process.","The main outputs from each process.","Page 86 – Integration Management Processes","Develop Project Charter","Process Group: Initiating","Main Output:","Project Charter","Assumption Log","Develop Project Management Plan","Process Group: Planning","Main Output:","Project Management Plan","Direct and Manage Project Work","Process Group: Executing","Main Output:","Deliverables","Work Performance Data","Issue Log","Change Request","Manage Project Knowledge","Process Group: Executing","Main Output:","Lessons Learned Register","Monitor and Control Project Work","Process Group: Monitoring and Controlling","Main Output:","Work Performance Reports","Change Requests","Perform Integrated Change Control","Process Group: Monitoring and Controlling","Main Output:","Approved Change Request","Close Project or Phase","Process Group: Closing","Main Output:","Final Product, Service, or Result Transition","Final Report","Page 87 – Develop Project Charter","Develop Project Charter is the process of developing a document that formally authorizes the project or phase and documents initial requirements to satisfy the stakeholders.","The project charter establishes the partnership between the performing organization and the requesting organization.","This process is performed at the very beginning of a project or phase.","The charter is senior management written approval to start the project.","Think of the project charter as the authorization of the project manager and the project itself.","The charter is usually developed by the project sponsor while working with the project manager.","The charter contains high-level information that senior management will review in order to determine if the project should proceed.","The information collected to create the charter outlines the:","Cost","Schedule","Scope","Benefits","Once the project charter is approved, the next step is to identify stakeholders and begin planning the project.","Complete the two initiating processes of:","Develop project charter","Identify stakeholders","These should be completed before planning the project.","Agile and hybrid projects also have a project charter.","The project charter may not be as detailed as it would be in a traditional project.","It will still contain some of the high-level requirements so the project can be authorized.","An agile project charter generally contains a very high-level scope since most of the project will be unknown when the charter is being written.","Page 87 – Inputs: Business Documents","Business documents contain specific information as to why a project should be initiated.","There are two main documents:","Business case","Benefits management plan","Page 87 – Business Case","A business case basically says why a business should do this project.","Businesses usually do a cost-benefit analysis to justify the money being spent on the project.","Reasons companies initiate a project include:","Market demand, such as introducing a new product to the market that has a need.","Organizational need, such as reducing overhead to improve profits.","Customer request, such as improving a product to meet a customer request.","Technological advance, such as installing the latest operating system for better security.","Legal requirement, such as new regulations that a business needs to implement.","Environmental impacts, such as cleaning up toxic waste sites.","Social need, such as a project to reduce crime in certain areas.","Page 88 – Project Selection Methods","Selecting a project can be a complex task.","Methods that can be used to select a project include:","Benefit-Cost Ratio (BCR)","Ratio of benefit to cost.","Example:","Project returns $5,000 but costs $2,000.","$5,000 ÷ $2,000 = 2.5.","You are making $5 for every $2 that you spend.","The larger the ratio, the better the project.","Internal Rate of Return (IRR)","Looks at the return of the project investment as an interest rate.","The bigger the interest rate, the better the project.","An IRR of 20% is better than an IRR of 10%.","Opportunity Cost","An economic term that represents the value of what you choose not to do in order to do something else.","Example:","Project A will return $20,000.","Project B will return $30,000.","Selecting project B results in an opportunity cost of $20,000.","We give up option A to pursue option B.","Payback Period","How long it will take to return the investment capital in the project.","The shorter, the better.","The faster the business gets its money back, the faster it can start another project.","Economic Value Add (EVA)","Looks at the net value of a company over a period of time.","Equal to profits after tax minus the average cost of capital.","A business is only profitable if it creates value for its shareholders.","A formula is not needed for the PMP exam; you just need to understand it.","Present Value (PV) and Net Present Value (NPV)","Means money will lose value over time due to inflation.","$10 now will not be worth $10 in the next 5 years.","The NPV includes the expenses of the project.","The bigger the PV or NPV, the better.","Return on Investment (ROI)","A percentage that shows how much money you will get back on the project.","Example:","Company invests $1 million.","ROI is 10%.","Return will be $100,000.","The bigger the ROI, the better.","Page 89 – Project Benefits Management Plan","A project benefits management plan is used to describe the main benefits that the project will produce once it is completed.","The project benefit could be the product, service, or result that the organization is looking to obtain after the project is done.","This benefit would help to grow the organization.","Senior management will want to know the benefits this project will bring to the organization.","Most of the time, this is expressed in financial terms, such as:","How much money the company can gain by selling a particular product that the project is creating.","How it can reduce some of the organization’s risk.","It can also show how the output of the project is aligned with the strategic goals of the business.","Example:","It can show how the project deliverable will help to meet the organization’s long-term goal of increasing its revenue by 50%.","This benefits management plan is generally created by doing a cost-benefit analysis of whether a project should proceed or not and using the different business cases as to why a project is needed.","This document must be continually maintained because as the project is progressing and more benefits are realized, the plan should be updated accordingly.","The business case and the benefits management plan lead to the creation of the project charter, which then leads to the creation of the project management plan.","Page 89 – Agreements","An agreement is another word for a contract.","If this project is being done for an external customer, then an agreement will be needed to start the project for the contractor.","The agreement should be signed before the project starts.","Other forms of agreement can include:","Memorandums of understanding","Service level agreements","Letters of intent","Verbal agreements","Written agreements","Page 89 – Flow","Business Case ↔ Project Benefits Management Plan","Business Case / Project Benefits Management Plan → Project Charter","Project Charter → Project Management Plan","Page 89 – Inputs","Enterprise Environment Factors – Covered in Chapter 3","Organizational Process Assets – Covered in Chapter 3","Page 89 – Tools and Techniques","Expert Judgment – Covered in Chapter 3","Page 90 – Data Gathering","Gathering data to create the project charter can include techniques such as:","Brainstorming","Focus groups","Interviews","The objective is to gather the main requirements needed for the project.","This can include requirements for:","Scope","Cost","Schedule","Page 90 – Interpersonal and Team Skills","Expect to be doing a lot of facilitation among stakeholders while working to create the project charter.","Meeting management techniques will be needed in order to ensure meetings are run properly.","Page 90 – Meetings","Covered in Chapter 3","Page 90 – Outputs: Project Charter","The project charter is a document that officially authorizes the project to get started.","The project charter includes:","Project justification and purpose.","Name of the project manager.","Assignment of authority to the project manager.","Signature of the sponsor or others authorizing the project.","High-level requirements, including scope, budget, and milestones view of the project schedule.","High-level risks.","Stakeholder list.","Exit criteria (things that might cause the project to be canceled).","Page 90 – Assumption Log","The assumption log is a log of all the assumptions and constraints that are identified throughout the project.","Assumptions are things that you perceive to be true.","Constraints are things that might constrain the project.","Example:","A project manager may assume that the project does not need to upgrade any of the computer hardware in order to install a new application.","The project manager would write this assumption of no hardware upgrades in the assumption log.","Example:","A project may be constrained as to time because the work that is required may be too much for a short project schedule.","The project manager would list a constraint of time in the assumption log.","The assumption log is continuously updated throughout the entire phase or project.","Page 91 – Develop Project Management Plan","Develop Project Management Plan is the process of creating the project management plan that includes all the subsidiary plans and baselines.","The project management plan says how we will execute, monitor and control, and close the project.","The project management plan includes:","All the baselines (scope, time, and cost).","All of the management plans needed to manage each of the additional nine knowledge areas.","As you are doing the other planning processes, you will be creating many different types of documents that will be stored in this plan.","The whole objective of all 24 planning processes is to create this plan.","Without this plan, we will not know how to execute, monitor and control, and close the project.","Once the plan is completed, it will need to get baselined, which generally means getting it approved by the project sponsor.","While doing planning processes and changing or updating different components of the plan, there is no need for a change request because it has not been baselined.","Once the plan is completed and baselined, only an approved change request that has gone through the process of “perform integrated change control” can be used to update the plan.","Exam Tip: Only an approved change request can change a plan once it has been approved.","On agile and hybrid projects, this plan may not be as detailed as it would be on a traditional project.","While many of the components below mostly apply to a traditional project, agile projects can still use some of them.","In many traditional projects, these plans may be given to the project manager from the PMO.","On agile projects, the team will create them to best suit their needs.","Page 91 – Inputs","Project Charter","See the earlier process.","Outputs from Other Processes","There are 23 other planning processes.","Each planning process yields specific plans and baselines needed to create the project management plan.","The output of the other planning processes serves as the input to this high-level process.","Enterprise Environment Factors","Covered in Chapter 3.","Organizational Process Assets","Covered in Chapter 3.","Page 91 – Tools and Techniques","Expert Judgment","Covered in Chapter 3.","Data Gathering","Covered in Chapter 3.","Interpersonal and Team Skills","Covered in Chapter 3.","Meetings","While the project is being planned, expect to attend lots of meetings.","Utilize meeting management techniques in interpersonal and team skills.","One meeting to be aware of is the project kick-off meeting.","A project kick-off meeting is usually done... (continued on next page).","Page 92 – Outputs: Project Management Plan","Project Management Plan","The project management plan is a formal document that is used to describe how the project is executed, monitored and controlled, and closed.","This plan will be very important to the success of the project.","Exam Tip: The project management plan is an input to all executing, monitoring and controlling, and closing processes since it describes how to do those process groups.","Some important exam points about the project management plan:","This is a document with 18 parts: 4 baselines and 14 subsidiary plans.","This can be either summary or detailed; the more detailed, the better.","Smaller projects might need a very simple plan in contrast to a large project, which might need a very complex plan.","Once the project management plan is baselined, it may only be changed when a change request is generated and approved through the “perform integrated change control” process.","Components of the Project Management Plan and Process Where Made","Scope Management Plan","Plan Scope Management","Requirement Management Plan","Plan Scope Management","Schedule Management Plan","Plan Schedule Management","Cost Management Plan","Plan Cost Management","Quality Management Plan","Plan Quality Management","Resource Management Plan","Plan Resource Management","Communication Management Plan","Plan Communications Management","Risk Management Plan","Plan Risk Management","Procurement Management Plan","Plan Procurement Management","Stakeholder Management Plan","Plan Stakeholder Management","Change Management Plan","Develop Project Management Plan","Configuration Management Plan","Develop Project Management Plan","Scope Baseline","Create WBS","Schedule Baseline","Develop Schedule","Cost Baseline","Determine Budget","Performance Measurement Baseline","Develop Project Management Plan","Project Life Cycle Description","Develop Project Management Plan","Development Approach","Develop Project Management Plan","The project management plan is broken into two components:","Management plans","Baselines","A management plan is a plan that is used to describe how to do a particular component of a project.","Page 93 – Project Management Plan Components","The scope management plan describes:","How to write the scope.","Baseline the scope.","Validate the scope.","Ensure the project stays on the scope.","A management plan is really a “how-to.”","A management plan explains how you’re going to manage that section of the project.","A baseline is used to track the performance of the project.","The schedule baseline tells you the planned schedule.","The cost baseline tells you the planned budget of the project.","Most plans and baselines are created in other planning processes.","There are a few plans created in this process that you should know about.","Page 93 – Change Management Plan","The change management plan outlines:","How change requests will be collected.","How change requests will be assessed.","How change requests will be authorized.","How change requests will be incorporated into the project.","Page 93 – Configuration Management Plan","The configuration management plan outlines how the various components of a project can be configured.","Example:","When installing a large software package across many computers, a plan is needed that describes how to configure each computer to ensure the software works correctly.","Page 93 – Performance Measurement Baseline","The performance measurement baseline is used to check the performance of the project as it is being executed.","Anytime you see the word “baseline,” think of what to measure against.","The performance measurement baseline integrates:","Scope","Schedule","Costs","These are integrated into a single baseline used to track project performance.","Page 93 – Project Lifecycle Description","The project lifecycle description outlines what type of lifecycle the project will be following.","For an agile project, use more of an adaptive lifecycle.","For a traditional project, use a more predictive lifecycle.","This document outlines which lifecycle will be used on the project.","Page 93 – Development Approach","The development approach is a document that outlines how the product will be developed.","On an agile project:","Development may be more iterative.","Development may occur in small increments.","On a traditional project using a more predictive approach:","The entire product is developed in one shot.","The other parts of the project management plan will be covered in more detail as the processes where they are created are reviewed.","Page 94 – Direct and Manage Project Work","Direct and Manage Project Work is the process of performing the work defined in the project management plan to create the project deliverables.","The project manager leads the project team to actually build the deliverables and incorporate all approved changes.","This is an integration process and represents the rollup of the other nine executing processes.","Since this is an executing process, you are expected to do the project work as defined in the project management plan.","The project manager will be training and managing the project team assigned to the project to ensure the deliverable is built according to the plan.","As the project manager performs this process, he/she is also collecting data on the work being performed.","This collected data is the work performance data.","Work performance data is output here but is used as input to all monitoring and controlling processes.","On agile and hybrid projects, this is when the sprint starts and the project team begins to work.","On an agile project, this process usually lasts for a short time, anywhere from 1 to 4 weeks, as the team creates that increment of the product.","In a traditional project, this process can last for the entire duration it takes to build the actual deliverable.","In a traditional project, this process can take months to years.","Page 94 – Inputs","Project Management Plan","The project management plan describes the steps needed to build the deliverable.","The plan tells the project manager:","How to execute.","How to monitor and control.","How to close the project.","The more detailed the plan, the more successful the project execution will be.","Project Documents","While executing a project, the project manager will use many different project documents to ensure that the deliverable is getting created according to the plan.","Documents can include:","Project schedule","Risk register","Risk report","Milestones","Approved Change Requests","If a change is formally approved, the project manager will execute that change in this process.","An approved change request can be:","A customer request for a change.","A corrective action.","A preventive action.","Example:","If a customer requests a change to the color of paint in a room on a renovation project and the change is approved, the project manager should execute that change by changing the paint color in this process.","Approved change requests are outputs of the process “perform integrated change control.”","Enterprise Environmental Factors","Covered in Chapter 3.","Organizational Process Assets","Covered in Chapter 3.","Page 94 – Tools & Techniques","Expert Judgment","Covered in Chapter 3.","Project Management Information System","Covered in Chapter 3.","Meetings","Covered in Chapter 3.","Page 95 – Outputs","Deliverables","The most important output of this process is the deliverables.","Deliverables are the products or parts of the products that are given to the customer for acceptance.","When the project team has completed the execution of the project, they should have a deliverable.","Example:","On a “paint the room” project, the deliverable would be a completed painted room.","The deliverable becomes the input to the process, “control quality.”","From there, it is checked for quality requirements.","It is then passed to the “validate scope” process to be given formal acceptance by the stakeholders.","After it has been formally accepted, the project may move on to the “close project or phase” process.","Work Performance Data","Work performance data is the raw information about the work that was performed.","It can include things like:","How long the work took.","How much it cost.","This output is obtained continuously as the project is being executed.","The project manager analyzes the data alongside the plan to create work performance information.","Work performance information provides the project manager the status of the project.","Work performance data is used as an input to many monitoring and controlling processes.","Issue Log","As a project is being executed, expect to encounter a variety of problems, conflicts, and issues.","An issue log is where the list of all issues on a project is kept.","As issues arise, add them to the log.","The issue log helps ensure that issues are:","Described","Assigned","Prioritized","Addressed","The issue log also keeps track of:","Who raised the issue","When they raised it","The issue log must be updated continuously throughout the project.","Change Requests","As a project is being executed, expect to have changes throughout the project.","Changes can come from:","Customers","Sponsors","Team members","Senior management","Changes can also be requested because of:","Preventive actions","Corrective actions","Defect repairs","Once a change has been requested, it is passed to the process “perform integrated change control,” where it is assessed.","Project Management Plan Updates","Covered in Chapter 3.","Project Document Updates","Covered in Chapter 3.","Organizational Process Assets Updates","Covered in Chapter 3.","Page 96 – Manage Project Knowledge","Manage Project Knowledge is a process that ensures the knowledge that is gained before, during, and after the project is used for the organization’s benefit.","Knowledge is power, and if utilized correctly, can greatly benefit an organization.","Knowledge management allows the project manager to use the knowledge gained throughout the project for the benefit of the project and organization.","Explicit and Tacit Knowledge","Knowledge can be either explicit or tacit.","Explicit Knowledge","Has a tangible form.","Includes:","Documents","Procedures","Manuals","Textbooks are good places to get explicit knowledge.","Tacit Knowledge","Difficult to transfer between people by just speaking to them.","Gained by doing the work.","Sometimes referred to as “know-how.”","The project manager will try to ensure that both explicit and tacit knowledge are managed correctly for the benefit of the project.","The project manager must ensure that knowledge gained from the project is used correctly with stakeholders to ensure the project is successful.","The main output of the lessons learned register is where the project manager keeps a repository of all the main knowledge learned throughout the project.","On agile and hybrid projects, the team conducts a retrospective at the end of the sprint to capture project knowledge and other lessons learned during the sprint.","These lessons are then used to enhance performance during the next sprint.","Page 96 – Inputs","Project Management Plan","Covered in Chapter 3.","Project Documents","Covered in Chapter 3.","Deliverables","Deliverables are the products or parts of the products that are given to the customer for acceptance.","When the project team has completed the execution of the project, they should have a deliverable.","Deliverables are the objectives of the project.","Enterprise Environmental Factors","Covered in Chapter 3.","Organizational Process Assets","Covered in Chapter 3.","Page 96 – Tools & Techniques","Expert Judgment","Covered in Chapter 3.","Knowledge Management","Knowledge management is about the sharing of generally tacit knowledge between stakeholders on a project.","Each project is different, and the interaction between stakeholders might change from project to project.","It is up to the project manager to ensure that stakeholders are sharing knowledge with each other.","Methods can include:","Networking","Meetings","Discussions","Seminars","Workshops","Training","The method chosen will be dependent upon the project and the people working on the project.","Page 97 – Information Management","Information management is about ensuring that information is available to the stakeholders when needed.","While projects are unique, most will use a similar method to get information to stakeholders.","Methods can include:","Websites","Libraries","Articles","Documents","It is important that the project manager works to ensure that information is widely available to his/her team as the project is progressing.","Page 97 – Interpersonal and Team Skills","Covered in Chapter 3.","Page 97 – Outputs","Lessons Learned Register","The moment a project executes, the project manager should start to gather the lessons learned.","Lessons learned are gathered throughout the project, not just at the end.","The lessons learned register is where the project manager stores all of the lessons learned as the project is being executed.","This is a living document that will be consistently updated every time new knowledge is recognized within the project.","Example:","If a team member discovers a new method to code faster, the project manager should add that method to the lessons learned register.","When the phase or project is completed, the lessons learned register is given to the organization’s PMO.","The PMO stores it in the lessons learned repository for use on future projects within the organization.","Project Management Plan Updates","Covered in Chapter 3.","Organizational Process Assets Updates","Covered in Chapter 3.","Page 98 – Monitor and Control Project Work","Monitor and Control Project Work is the process of tracking, reviewing, and reporting the progress of the project work.","The goal of this process is to keep the project on plan.","As the project is executed, it is the responsibility of the project manager to ensure that the project is on plan.","If the project is falling behind schedule or budget, corrective or preventive actions in the form of a Change Request may be needed.","Monitoring and controlling a project includes looking at the work that was done and comparing it to the plan to see if they line up.","If they do not line up, necessary changes must be implemented to fix it.","The monitoring and controlling processes are performed in parallel to the executing processes.","The main outputs of this process are the work performance reports (status report).","Work performance reports give stakeholders an understanding of:","What is currently happening on the project.","Whether the project needs any correction or repairs through a change request.","On agile and hybrid projects, monitor and control project work is generally done by the team themselves.","In traditional projects, the project manager takes on the role of monitoring the work and ensuring it gets done according to the plan.","Monitor and control project work is generally done throughout the sprint on an agile or hybrid project.","Page 98 – Inputs","Project Management Plan","Covered in Chapter 3.","Project Documents","Covered in Chapter 3.","Work Performance Information","Work performance information is information on the performance of the work that was done on the project.","It provides the status of the deliverables.","It is made by comparing work performance data with the project management plan.","Work performance information is the output of all “Control” processes, such as:","Control Scope","Control Schedule","Etc.","Agreements","An agreement is usually a contract between a buyer and a seller for work.","It generally includes:","Work that needs to get done","Terms","Conditions","Pricing","Penalties","Agreements are used in this process by the project manager to monitor the contractor’s work while the project is being executed.","More specifics about agreements will be discussed in the procurement management chapter.","Enterprise Environmental Factors","Covered in Chapter 3.","Organizational Process Assets","Covered in Chapter 3.","Page 98 – Tools and Techniques","Expert Judgment","Covered in Chapter 3.","Data Analysis","Covered in Chapter 3.","Decision Making","Covered in Chapter 3.","Meetings","Covered in Chapter 3.","Page 99 – Outputs","Work Performance Reports","While monitoring and controlling the project, reports are created on the status of the project, such as whether it is on schedule or budget.","Work performance reports are sometimes called status reports.","The work performance report is used to update stakeholders on the progress of the project.","The input to this process is the work performance information.","The output of this process is the work performance report.","Change Requests","While monitoring and controlling the project, the project manager may need to implement:","Corrective actions","Preventive actions","Defect repairs","Example:","If the project is 20% over budget, the project manager will need to get a change request for additional funds to complete the project (corrective action).","Once the project manager has initiated a change request, he/she follows the process of “perform integrated change control” to get that change approved.","Project Management Plan Updates","Covered in Chapter 3.","Project Documents Updates","Covered in Chapter 3.","Page 100 – Perform Integrated Change Control","Perform Integrated Change Control is the process of reviewing all change requests and approving or rejecting them.","Once a project management plan is approved, any subsequent changes to it must go through this process to be updated.","Changes may be requested by any stakeholder.","Examples:","A sponsor may want the project finished faster or more cheaply.","A customer may want to add something new to the scope.","The project needs a system to document and manage changes throughout the project.","This is done using the:","Change management plan","Configuration management plan","These plans specify the steps to manage changes.","All documented change requests need to be approved or denied by the correct authority.","All changes need to be evaluated and approved correctly.","Changes can be authorized by:","Project manager","Sponsor","Change control board (CCB)","A change control board (CCB) can be used to:","Review changes","Evaluate changes","Approve changes","Reject changes","The project manager should influence the factors that affect change in order to prevent unnecessary changes.","This process is a key topic for the exam.","Questions may focus on:","What to do first when a change is requested.","What to do next when a change is requested.","Change Management Process","Record Change Request","Assess Change Requests (Impact on Project)","Approve or Disapprove Change Requests","First assess the change and determine how it impacts the overall project.","Then develop options for implementing the change.","Next, get the change approved.","Once approved, execute the change.","If a change request is rejected, the project manager should communicate back to the original stakeholder that the change will not be implemented.","Do not approve or deny a change without assessing the actual change.","Exam Tip:","Never take action without an assessment and never reject a change without an assessment on a traditional project.","The diagram mostly applies to a traditional project where there is a well-documented change management process.","On a traditional project, no changes should be made to any project management plans without submitting a change request and getting it approved.","Agile and Hybrid Projects","On agile and hybrid projects, change management is less process-oriented and more welcoming.","When a stakeholder wants to add a feature to an agile project, it is generally added to the product backlog.","The product backlog is then re-prioritized based on value to incorporate the new feature.","The product owner is responsible for re-prioritizing the product backlog and determining if the item should be added.","Most change management power on an agile project is given to the product owner and not the change control board.","Agile projects do not have the same well-documented change management processes as traditional projects.","Exam Tip:","On an Agile project, changes are generally added to the product backlog that is then re-prioritized by the product owner.","Page 101 – Inputs","Project Management Plan","The project management plan contains details about how to process, monitor, and control changes in a project.","Project Documents","Covered in Chapter 3.","Work Performance Reports","Covered in Chapter 3.","Change Requests","A change request is an output of most of the executing and monitoring and controlling processes.","Change requests are evaluated in this process.","Enterprise Environmental Factors","Covered in Chapter 3.","Organizational Process Assets","Covered in Chapter 3.","Page 101 – Tools and Techniques","Expert Judgment","Covered in Chapter 3.","Change Control Tools","Change control tools are manual or automated tools used to manage change requests.","These tools help to:","Identify changes","Document changes","Track changes","The main objective of the tools is to help the CCB make a decision on whether to approve or disapprove the change.","Data Analysis","Covered in Chapter 3.","Decision Making","Covered in Chapter 3.","Meetings","Covered in Chapter 3.","Page 101 – Outputs","Approved Change Requests","Once a change has been approved, it becomes an input to the “direct and manage project work” process.","This is where the approved change request is executed.","Example:","Someone requests a change to the color of paint on a renovation project.","The change is submitted to the change control board.","The change control board approves the change.","The approved change request is passed to the “direct and manage project work” process.","The painters implement the change by changing the paint color.","An approved change request triggers the project manager to update the project management plan and its associated project documents.","Project Management Plan Updates","Once a change has been approved, the project management plan should be updated.","Any of the 18 plan components can be updated with an approved change request.","Example:","Stakeholders request that the project be completed faster.","The change is approved.","The project manager updates the schedule baseline to reflect the earlier finish date.","The cost baseline may also be updated to reflect the additional costs associated with finishing the project sooner.","Page 102 – Project Documents Updates","As with the project management plan, any of the additional 33 project documents could be updated with an approved change request.","One document that would need to be updated is the change log.","The change log records the status of changes throughout the project.","The change log can include whether the change was:","Approved","Disapproved","Example:","Stakeholders request more work to be added to the scope.","The change is approved.","The project manager updates the change log to reflect the newly identified change to the project.","Page 103 – Close Project or Phase","Close Project or Phase is the process of formalizing all activities and overall project management process groups to formally complete the project, phase, or contract.","This process establishes a process to investigate and document the reasons a project is terminated early.","The project manager reviews the scope baseline and completed work to ensure all work was in scope and done correctly.","The project manager will:","Transfer the deliverable to productions or operations.","Successfully capture lessons learned.","Release the project team.","Updating templates and knowledge bases is also done in this phase.","Closing a Contract","Closing a contract can include:","Seller sign-off that all fees were paid.","Buyer sign-off that all work was completed.","Even if the contract is not successfully completed, it must still be formally closed in this process.","Project Termination","If a project is terminated before completion, the project manager must still formally close the project.","Exam questions may state that a project was terminated before completion and ask what should be done next.","The answer is to follow the closing procedures.","All projects must be formally closed before moving on to the next phase or project.","If a project is closed and customers want to add new requirements, a new project may need to be started.","Agile and Hybrid Projects","On agile and hybrid projects, project closure is generally done when the work in the product backlog has been completed.","The team needs to:","Tie up loose ends.","Hand over the product to operations.","Ensure documents and tools are archived.","Organize documents for future use on other projects.","Ensure the product is correctly handed over to operations for maintenance.","Conduct a final retrospective focused on lessons learned from all sprints.","Then finally, celebrate.","Page 103 – Inputs","Project Charter","The project charter is created in the initiating section of the project.","It is used to authorize the project and the project manager.","The project manager may refer to the project charter to ensure that all components of its scope were accomplished in the project or phase.","Project Management Plan","Use the entire project management plan to close a project.","All 18 components are generally used to ensure the project is successfully closed down.","Project Documents","Most of the 33 project documents are generally used in this process to ensure the project is closed successfully.","Accepted Deliverables","Before a project or phase can be closed, the sponsor or customer must formally accept the deliverables.","Deliverables are formally accepted in the “validate scope” process, which is covered in the chapter “Scope Management.”","Page 104 – Inputs","Business Documents","The two main business documents that the PMBOK® Guide usually refers to are:","Business case","Benefits management plan","The project manager may want to look back at these two documents to ensure that the project will benefit the business and that it was cost-efficient.","Agreements","An agreement is usually a contract between a buyer and a seller for work.","It generally includes:","Work that needs to get done","Terms","Conditions","Pricing","Penalties","It is used in this process by the project manager to monitor the contractor’s work while the project is being executed.","More specifics about agreements are discussed in the procurement management chapter.","Procurement Documentation","Procurement documentation refers to the documents used to bid on a project, such as:","RFP","Procurement statement of work","Contract","Source selection criteria","The specifics of these documents are covered in the procurement management chapter.","In this process, the project manager collects these documents to be indexed and filed.","This is part of closing out a contract.","Organizational Process Assets","Covered in Chapter 3.","Page 104 – Tools and Techniques","Expert Judgment","Covered in Chapter 3.","Data Analysis","Covered in Chapter 3.","Meetings","Covered in Chapter 3.","Page 104 – Outputs","Final Product, Service, or Result Transition","This is the transition of the final output of the project or phase.","After a deliverable has been accepted by the customer or sponsor, it is given over to them in this output.","Example:","Handing over the keys of a newly painted room to the customer.","Another example:","Programmers handing over the completed application to system administrators to install on all company computers.","Final Report","The final report provides the overall performance of the project and is filed with the organization.","It gives a summary of what took place on the project and how successful the project was.","The final report should include:","High-level description of the project or phase.","The objectives (scope) of the project and whether they were accomplished.","The techniques that were used to measure the quality requirements and whether the requirements were met.","The budget of the project, how it was measured, and whether there were any variations.","Whether the project accomplished its real-world problems that it had set out to achieve and the benefits of this project to the organization.","Page 105 – Project Documents Updates","When a project or contract closes, many of the 33 project documents can be expected to get updated.","One document in particular is the lessons learned register.","The lessons learned register documents all of the lessons learned that were accumulated during the project or phase.","The lessons learned register is then passed on to the organization to be added to the lessons learned repository.","Page 105 – Organizational Process Assets Updates","Upon closing the project, the project manager updates many of the organizational process assets.","Organizational process assets that may be updated include:","Templates","Knowledge bases","Lessons learned","These updates help with future projects or phases."],"examples":["The project manager’s main job is to perform integration.","The business case and benefits management plan lead to the project charter, which leads to the project management plan.","Only an approved change request can change a plan once it has been approved.","Work performance data is raw information about the work that was performed.","On Agile projects, changes are generally added to the product backlog and re-prioritized by the product owner."],"podcast":[{"speaker":"Maya","text":"Welcome to Chapter 5: Integration Management. This chapter pulls together the other knowledge areas and shows how the project manager keeps the whole project connected."},{"speaker":"Jordan","text":"Exactly. The notes say the project manager’s main job is to perform integration, so think connection, coordination, and control across the full project."},{"speaker":"Maya","text":"The chapter starts with Develop Project Charter. The charter formally authorizes the project or phase and gives senior management approval to start."},{"speaker":"Jordan","text":"And once the charter is approved, the next step is to identify stakeholders and begin planning the project."},{"speaker":"Maya","text":"The business case explains why the business should do the project, and the benefits management plan describes the benefits the project should produce once completed."},{"speaker":"Jordan","text":"Those business documents feed the project charter, and the project charter leads into the project management plan."},{"speaker":"Maya","text":"For project selection, remember the basic direction: bigger BCR, IRR, PV, NPV, and ROI are better. Shorter payback period is better."},{"speaker":"Jordan","text":"Opportunity cost is what you give up when you choose one project over another."},{"speaker":"Maya","text":"Develop Project Management Plan creates the formal document that explains how the project will be executed, monitored and controlled, and closed."},{"speaker":"Jordan","text":"Once the plan is baselined, only an approved change request through perform integrated change control can update it."},{"speaker":"Maya","text":"The project management plan has management plans and baselines. The notes describe it as 18 parts: 4 baselines and 14 subsidiary plans."},{"speaker":"Jordan","text":"Direct and Manage Project Work is where the team performs the work defined in the plan and creates deliverables."},{"speaker":"Maya","text":"That process also produces work performance data, which is raw information about the work performed."},{"speaker":"Jordan","text":"Manage Project Knowledge focuses on using explicit and tacit knowledge for the benefit of the project and organization."},{"speaker":"Maya","text":"Explicit knowledge is tangible, like documents and manuals. Tacit knowledge is know-how gained by doing the work."},{"speaker":"Jordan","text":"Lessons learned are gathered throughout the project, not just at the end. They go into the lessons learned register."},{"speaker":"Maya","text":"Monitor and Control Project Work compares the work being done to the plan and produces work performance reports."},{"speaker":"Jordan","text":"Perform Integrated Change Control reviews change requests and approves or rejects them. On traditional projects, assess before action."},{"speaker":"Maya","text":"On agile projects, change is generally added to the product backlog and re-prioritized by the product owner."},{"speaker":"Jordan","text":"Close Project or Phase formally completes the project, phase, or contract, transfers the final output, captures lessons learned, and updates organizational process assets."}],"questions":[{"q": "What is Integration Management?", "options": ["The unification of all other knowledge areas into a coordinated whole", "Only the process of creating the project schedule baseline", "Only the management of procurement contracts with sellers", "Only the identification of project stakeholders and risks"], "answer": 0, "why": "Integration management unifies all knowledge areas — it's the combination/summary of the other nine.", "mindset": "Integration = pulling everything together.", "tags": ["Integration", "Concept"], "chapterRef": "Chapter 5 - Integration Management"}, {"q": "What is the project manager's main job according to this chapter?", "options": ["To perform integration across all knowledge areas", "To only write the business case for the project", "To only approve every agile product backlog item", "To only manage the procurement process with sellers"], "answer": 0, "why": "The notes directly state the PM's main job is to perform integration.", "mindset": "PM = integrator. Connects scope, time, cost, quality, etc.", "tags": ["Integration", "PM Role"], "chapterRef": "Chapter 5 - PM Role"}, {"q": "What process formally authorizes the project to start?", "options": ["Develop Project Charter", "Develop Project Management Plan", "Direct and Manage Project Work", "Close Project or Phase"], "answer": 0, "why": "Develop Project Charter creates the document that formally authorizes the project.", "mindset": "Charter = authorization to begin.", "tags": ["Initiating", "ITTO"], "chapterRef": "Chapter 5 - Develop Project Charter"}, {"q": "Who usually develops the project charter?", "options": ["The project sponsor while working with the project manager", "The change control board during the planning phase", "The product owner during the first sprint planning session", "The project team during the execution phase kick-off"], "answer": 0, "why": "The charter is usually developed by the sponsor while working with the PM.", "mindset": "Sponsor authorizes; PM helps shape it.", "tags": ["Initiating", "Roles"], "chapterRef": "Chapter 5 - Project Charter"}, {"q": "What are the two main business documents that input to the charter?", "options": ["Business case and benefits management plan", "Issue log and change log", "Final report and procurement documentation", "Scope baseline and cost baseline"], "answer": 0, "why": "The business case and benefits management plan are the two main business documents.", "mindset": "Business docs explain WHY the project should exist.", "tags": ["Initiating", "ITTO"], "chapterRef": "Chapter 5 - Business Documents"}, {"q": "What does a business case explain?", "options": ["Why a business should do this project", "How to close the project team and release resources", "Which change requests have been approved by the CCB", "How the sprint backlog is prioritized by the PO"], "answer": 0, "why": "A business case says why a business should do this project — it's the justification.", "mindset": "Business case = project justification.", "tags": ["Business", "Initiating"], "chapterRef": "Chapter 5 - Business Case"}, {"q": "For project selection, what does a larger Benefit-Cost Ratio mean?", "options": ["The project is a better investment choice", "The project is a worse investment choice", "The payback period is much longer", "The opportunity cost is much higher"], "answer": 0, "why": "The larger the BCR, the better the project — you get more benefit per dollar of cost.", "mindset": "BCR: bigger is better.", "tags": ["Selection", "Business"], "chapterRef": "Chapter 5 - Project Selection"}, {"q": "What does opportunity cost represent?", "options": ["The value of what you give up to pursue the selected project", "The total budget approved by the project sponsor", "The amount already spent that cannot be recovered", "The cost baseline after formal approval and sign-off"], "answer": 0, "why": "Opportunity cost is the value of what you choose not to do in order to do something else.", "mindset": "Opportunity cost = what you give up.", "tags": ["Selection", "Business"], "chapterRef": "Chapter 5 - Opportunity Cost"}, {"q": "What is the project management plan?", "options": ["The document defining how the project is executed, monitored/controlled, and closed", "A stakeholder list with only contact information", "Raw work data collected during project execution", "The final project closure report and lessons learned"], "answer": 0, "why": "The PM plan describes how the project is executed, monitored and controlled, and closed.", "mindset": "The plan is the master guide for everything after planning.", "tags": ["Planning", "ITTO"], "chapterRef": "Chapter 5 - PM Plan"}, {"q": "How many parts does the project management plan have?", "options": ["18 parts: 4 baselines and 14 subsidiary plans", "10 parts: one for each knowledge area only", "33 project documents and nothing else", "2 parts: business case and benefits management plan"], "answer": 0, "why": "The PM plan has 18 parts: 4 baselines and 14 subsidiary plans.", "mindset": "Remember: 18 components total.", "tags": ["Planning", "Exam Trap"], "chapterRef": "Chapter 5 - PM Plan Components"}, {"q": "What happens to the PM plan once it is baselined?", "options": ["Only an approved change request can modify it", "It can be changed freely by the project manager", "It is deleted and replaced by the issue log", "It no longer applies to any monitoring activities"], "answer": 0, "why": "Once baselined, only an approved change request through integrated change control can update it.", "mindset": "Baselined = controlled changes only.", "tags": ["Baseline", "Change Control"], "chapterRef": "Chapter 5 - Baselined Plan"}, {"q": "What does the change management plan outline?", "options": ["How change requests are collected, assessed, authorized, and incorporated", "How final deliverables are formally accepted by the sponsor", "How project benefits are calculated before the charter", "How project team members are released after closing"], "answer": 0, "why": "The change management plan outlines the steps for managing changes throughout the project.", "mindset": "Change management plan = how changes flow through the system.", "tags": ["Change Control", "Planning"], "chapterRef": "Chapter 5 - Change Management Plan"}, {"q": "What is the main output of Direct and Manage Project Work?", "options": ["Deliverables produced by the project team", "The final closure report for the sponsor", "The business case for project justification", "The approved change request from the CCB"], "answer": 0, "why": "The most important output is deliverables — the actual products of the project work.", "mindset": "Executing creates deliverables.", "tags": ["Executing", "ITTO"], "chapterRef": "Chapter 5 - Direct and Manage"}, {"q": "What is work performance data?", "options": ["Raw information about work performed with no analysis applied", "Analyzed status compared against the project management plan", "A compiled project report distributed to all stakeholders", "A final closure document signed by the sponsor"], "answer": 0, "why": "Work performance data is raw information — it hasn't been analyzed yet.", "mindset": "Data = raw. Information = analyzed. Reports = compiled.", "tags": ["ITTO", "Monitoring"], "chapterRef": "Chapter 5 - Work Performance Data"}, {"q": "What is explicit knowledge?", "options": ["Knowledge with tangible form like documents, manuals, and procedures", "Knowledge gained only by doing the work hands-on over time", "The project manager's gut feeling about project status", "Informal conversations between team members at lunch"], "answer": 0, "why": "Explicit knowledge has tangible form — documents, procedures, manuals, textbooks.", "mindset": "Explicit = documented and transferable.", "tags": ["Knowledge", "Executing"], "chapterRef": "Chapter 5 - Knowledge Types"}, {"q": "What is tacit knowledge?", "options": ["Know-how gained by doing the work that is difficult to transfer", "Documents, procedures, and manuals stored in a repository", "The project charter signed by the sponsor", "Formal training courses available to all team members"], "answer": 0, "why": "Tacit knowledge is know-how gained through experience — hard to document or transfer by just speaking.", "mindset": "Tacit = experiential, learned by doing.", "tags": ["Knowledge", "Executing"], "chapterRef": "Chapter 5 - Knowledge Types"}, {"q": "When should lessons learned be gathered?", "options": ["Throughout the entire project, not just at the end", "Only at the very end after all deliverables are accepted", "Only when the project fails and needs a post-mortem", "Only during the initiation phase before planning starts"], "answer": 0, "why": "Lessons learned are gathered throughout the project — it's a living document.", "mindset": "Continuous learning, not just end-of-project.", "tags": ["Knowledge", "Process"], "chapterRef": "Chapter 5 - Lessons Learned"}, {"q": "What does Monitor and Control Project Work produce?", "options": ["Work performance reports and change requests", "The project charter and stakeholder register", "Deliverables and work performance data", "The final product transition and final report"], "answer": 0, "why": "M&C produces work performance reports (status reports) and change requests when variances are found.", "mindset": "M&C compares plan vs actual and reports status.", "tags": ["Monitoring", "ITTO"], "chapterRef": "Chapter 5 - Monitor and Control"}, {"q": "In traditional change control, what must happen BEFORE approving or denying a change?", "options": ["Assess the change and determine its impact on the project", "Immediately execute the change without any documentation", "Immediately reject it because the plan is already approved", "Archive all project documents before reviewing the request"], "answer": 0, "why": "Never approve or deny a change without assessing its actual impact first.", "mindset": "PMI: assess before action. Always.", "tags": ["Change Control", "Exam Trap"], "chapterRef": "Chapter 5 - Integrated Change Control"}, {"q": "On an agile project, how are changes generally handled?", "options": ["Added to the product backlog and reprioritized by the product owner", "Always sent to a change control board for formal review first", "Always rejected after the project charter has been approved", "Require the final report before any review can take place"], "answer": 0, "why": "On agile projects, changes are added to the backlog and reprioritized by the PO.", "mindset": "Agile welcomes change through backlog management.", "tags": ["Agile", "Change Control"], "chapterRef": "Chapter 5 - Agile Change"}, {"q": "Who can authorize changes to the project?", "options": ["Project manager, sponsor, or change control board depending on authority", "Only the team members who do the actual technical work", "Only the customer who is paying for the project deliverables", "Only the PMO director regardless of project size or type"], "answer": 0, "why": "Changes can be authorized by the PM, sponsor, or CCB depending on the authority level defined.", "mindset": "Authority to approve depends on change impact and governance structure.", "tags": ["Change Control", "Governance"], "chapterRef": "Chapter 5 - Change Authority"}, {"q": "What happens after a change request is approved?", "options": ["The PM updates the plan and executes the change in Direct and Manage Project Work", "The change is filed and forgotten about permanently", "The PM asks the CCB to reconsider their approval decision", "The project is immediately closed and a new one started"], "answer": 0, "why": "Approved changes trigger plan updates and are executed in Direct and Manage Project Work.", "mindset": "Approved → update plan → execute change.", "tags": ["Change Control", "Process"], "chapterRef": "Chapter 5 - Approved Changes"}, {"q": "What does Close Project or Phase formalize?", "options": ["Completion of all activities and transition of the final deliverable", "The beginning of project planning and requirement collection", "The first sprint in an agile project development cycle", "The procurement bidding process with potential sellers"], "answer": 0, "why": "Close Project or Phase formalizes all activities and transitions the final output.", "mindset": "Closing transfers deliverables, captures lessons, releases team.", "tags": ["Closing", "Process"], "chapterRef": "Chapter 5 - Close Project"}, {"q": "What must happen even if a project is terminated before completion?", "options": ["It must still be formally closed following closing procedures", "Nothing — terminated projects don't need any formal closure", "Only the budget needs to be reconciled with finance", "Only the team needs to be notified via informal email"], "answer": 0, "why": "Even terminated projects must be formally closed — follow the closing procedures regardless.", "mindset": "All projects get formal closure, successful or not.", "tags": ["Closing", "Exam Trap"], "chapterRef": "Chapter 5 - Project Termination"}, {"q": "What is the performance measurement baseline used for?", "options": ["Checking project performance as it is being executed", "Only authorizing the project manager to begin work", "Only storing lessons learned at the very end", "Only selecting the contract type for procurement"], "answer": 0, "why": "The PMB integrates scope, schedule, and cost baselines to track overall project performance.", "mindset": "PMB = what you measure against during execution.", "tags": ["Baseline", "Monitoring"], "chapterRef": "Chapter 5 - Performance Measurement Baseline"}, {"q": "A team member makes a change to a deliverable without going through change control. The change improved the product. What should you do?", "options": ["Acknowledge the improvement but coach them that all changes must go through change control", "Punish the team member for violating the documented change management process", "Ignore the bypass since the outcome was positive and no harm was done", "Remove the improvement and revert the deliverable to its original approved state"], "answer": 0, "why": "Even beneficial changes need documentation for traceability. Coach the behavior, don't punish good results.", "mindset": "PMI mindset: process exists for traceability. Good outcomes don't justify bypassing governance.", "tags": ["Change Control", "Integration"], "chapterRef": "Chapter 5 - Integrated Change Control"}, {"q": "Multiple changes are approved simultaneously. The team is confused about which plan version is current. What tool should you implement?", "options": ["Configuration management system to track document versions and ensure single source of truth", "A shared folder where everyone saves their own updates to the plan documents", "Email the latest version to all team members after every single change is approved", "Let each team member maintain their own personal copy of the project plan"], "answer": 0, "why": "Configuration management prevents version chaos and ensures everyone works from the same baseline.", "mindset": "PMI mindset: configuration management maintains document integrity.", "tags": ["Configuration Management", "Integration"], "chapterRef": "Chapter 5 - Configuration Management"}, {"q": "A stakeholder requests a scope change that adds 3 weeks and $50K. They say 'Just absorb it.' What should you do?", "options": ["Present the impact analysis to the CCB and let them make an informed decision", "Absorb the cost and schedule impact to maintain the stakeholder relationship", "Reject the change outright because it negatively impacts schedule and budget", "Implement the change and quietly adjust the baseline without formal approval"], "answer": 0, "why": "Baseline changes require formal approval. The PM assesses impact; decision authority belongs to CCB/sponsor.", "mindset": "PMI mindset: PM doesn't approve baseline changes — they assess and present.", "tags": ["Change Control", "Baselines"], "chapterRef": "Chapter 5 - Change Control"}, {"q": "Your project is closing. A team member asks why you're spending time on lessons learned. What is the BEST explanation?", "options": ["Lessons learned benefit future projects so the organization doesn't repeat mistakes", "You agree it's pointless and decide to skip the lessons learned process entirely", "Lessons learned are only done when the project failed and needs a post-mortem", "It's a PMO administrative requirement that has no real practical value"], "answer": 0, "why": "Lessons learned feed organizational process assets and enable continuous improvement.", "mindset": "PMI mindset: knowledge doesn't die with the project. Capture and share it.", "tags": ["Closing", "Lessons Learned"], "chapterRef": "Chapter 5 - Close Project"}, {"q": "Two work streams built conflicting solutions because they weren't aware of each other's work. What process failed?", "options": ["Direct and Manage Project Work — the PM failed to coordinate and integrate across teams", "The technical team is incompetent and should be replaced with better resources", "Planning was too detailed which caused confusion between the two work streams", "Monitoring and controlling caught it eventually so no process actually failed"], "answer": 0, "why": "Integration is the PM's core responsibility. Conflicting work streams means coordination failed.", "mindset": "PMI mindset: the PM owns connections between all parts of the project.", "tags": ["Integration", "PM Role"], "chapterRef": "Chapter 5 - Direct and Manage"}, {"q": "The CCB approves a change request. What should you do NEXT?", "options": ["Update the project management plan and baselines, then communicate to affected stakeholders", "Start implementing the change immediately without updating any documentation first", "File the change request in the archive and forget about it permanently", "Ask the CCB to reconsider their decision because you disagree with it"], "answer": 0, "why": "Approved changes must be reflected in the plan and baselines before execution.", "mindset": "PMI mindset: approval → update plan → communicate → implement.", "tags": ["Change Control", "Communication"], "chapterRef": "Chapter 5 - Approved Changes"}, {"q": "Your project depends on another project that's behind schedule, impacting your critical path. What should you do FIRST?", "options": ["Assess the impact on your schedule and escalate to the program-level governance body", "Wait and hope the other project team catches up before it affects your work", "Adjust your own schedule without telling anyone about the dependency issue", "Blame the other project team in your weekly status report to stakeholders"], "answer": 0, "why": "Cross-project dependencies are managed at program level. Assess your impact, then escalate.", "mindset": "PMI mindset: assess impact first, then escalate appropriately.", "tags": ["Integration", "Dependencies"], "chapterRef": "Chapter 5 - Monitor and Control"}, {"q": "Your sponsor wants execution to start before planning is complete. 'Figure it out as we go.' What should you do?", "options": ["Explain the risks and propose rolling wave planning where near-term work is fully planned", "Refuse to start any work until every single detail of the plan is completely finished", "Start executing immediately exactly as the sponsor directed without any pushback", "Plan everything in secret while telling the sponsor you've already started executing"], "answer": 0, "why": "Rolling wave planning is the compromise — start near-term work with confidence, plan future work later.", "mindset": "PMI mindset: don't be rigidly sequential. Rolling wave balances action with planning.", "tags": ["Planning", "Rolling Wave"], "chapterRef": "Chapter 5 - PM Plan"}, {"q": "You discover a decision from three months ago was based on wrong assumptions. Work based on it is complete but flawed. What should you do?", "options": ["Submit a change request to assess impact and determine corrective action options", "Redo all the flawed work immediately without telling anyone about the original mistake", "Ignore it since the work is already complete and moving backward wastes time", "Blame whoever made the original incorrect assumption and document it publicly"], "answer": 0, "why": "Discovered errors require change control to assess impact and determine the right path forward.", "mindset": "PMI mindset: when you find a problem, use the process. Don't hide or panic-fix.", "tags": ["Change Control", "Corrective Action"], "chapterRef": "Chapter 5 - Change Control"}, {"q": "You're managing the project AND doing technical work because the team is understaffed. Both are suffering. What should you do?", "options": ["Raise the resource constraint to the sponsor since the PM role requires dedicated focus", "Work longer personal hours to adequately cover both PM and technical responsibilities", "Deprioritize PM coordination duties and focus entirely on technical execution work", "Stop doing technical work and let those tasks sit unassigned until someone volunteers"], "answer": 0, "why": "The PM's value is integration and coordination. When they're split, both suffer. This is a resource issue to escalate.", "mindset": "PMI mindset: the PM role is coordination. If that's compromised, escalate the constraint.", "tags": ["PM Role", "Resource Management"], "chapterRef": "Chapter 5 - PM Responsibilities"}]},{"id":6,"title":"Chapter 6: Project Scope Management","summary":"Scope management, product scope versus project scope, requirements, scope statement, WBS, scope baseline, validate scope, control scope, and agile scope concepts.","notes":["Page 115 – Project Scope Management","This knowledge area is very important, not just for your exam but also in actual real-life project management.","The scope is what the project will actually accomplish.","The scope should include the work required and only the work required to complete the project.","As a project manager, you should avoid doing extra work that is not in the scope baseline.","This is called “gold plating.”","Gold plating is not allowed in project management because it could increase risk, cost, schedule problems, and quality problems.","Product scope","Features and functions that characterize a product, service, or result.","The product scope is the requirements for the product.","Example: A Microsoft exchange server that allows you to send e-mails, receive e-mails, and synchronize contacts and calendars.","Does not tell you what the project is about; it tells you what the product can actually do.","Project scope","The work that is needed to deliver a product, service, or result with specified features and functions.","The project scope will actually tell you what the project is about.","Example: Installing a Microsoft exchange server and updating all user accounts and all user workstations.","Focuses on what the project is trying to accomplish versus what the product is trying to accomplish.","That is the main difference between the two.","Processes and Main Outputs","Plan Scope Management","Process Group: Planning","Main Output:","Scope Management Plan","Requirement Management Plan","Collect Requirements","Process Group: Planning","Main Output:","Requirement Documentation","Requirement Traceability Matrix","Define Scope","Process Group: Planning","Main Output:","Project Scope Statement","Create WBS","Process Group: Planning","Main Output:","Scope Baseline","Validate Scope","Process Group: Monitoring and Controlling","Main Output:","Accepted Deliverables","Work Performance Information","Control Scope","Process Group: Monitoring and Controlling","Main Output:","Change Request","Work Performance Information","Agile / Hybrid Projects","Expect the scope to change as the project evolves.","Agile tries to get work done as quickly as possible.","Agile plans and gathers requirements throughout the project.","Scope frequently changes as more of the product is understood.","Agile Scope Planning","The team will need to determine the number of iterations or sprints it will take to complete the project.","Two main types of planning:","Sprint planning","Release planning","Sprint Planning","The agile team determines what features will get done in what sprint.","Example:","First sprint may create 60% of the user interface.","Next sprint creates the remaining 40% of the user interface.","Page 116 – Project Scope Management","Release Planning","Determines what features will be released to the customers.","Generally includes multiple sprints.","Example:","A team that completed one sprint with just half of the user interface may not be able to push that to the customers.","It is only after two or three sprints that they will be able to release that particular feature to the customer.","Product Roadmap","Another important concept to know about an agile project.","The product roadmap is more of a high-level document that outlines what would be expected of the actual product itself.","The product roadmap will generally outline all of the different releases of the project.","Page 117 – Plan Scope Management","Plan Scope Management","Creates scope and requirement management plans.","These plans will document how the project will collect the requirements, as well as define, validate, and control the scope.","The project manager will document the steps needed to do the next 5 processes in this knowledge area.","This process involves outputs that are inputs to the project management plan.","The project management plan is an input to this process, but the output is an input to the project management plan.","These processes are iterations.","The project management plan is here as input even though it is not finished.","It could still be used to help create the scope and requirement management plans.","On agile or hybrid projects, this process could be done to help build the product backlog and to help determine the methods by which the product backlog could be populated by the product owner.","It can also outline that the product owner would prioritize the product backlog.","On a hybrid project, there is no right or wrong way to conduct the management of the product backlog since they incorporate both traditional and agile methods.","Inputs","Project Charter","Officially authorizes the project or phase to start.","Will have high-level requirements that may help to create the scope and requirement management plans.","Project Management Plan","The project management plan is an input, although it is not completed.","The plan may have other parts that will be helpful in creating the scope and requirements management plan.","Enterprise Environmental Factors","Covered in Chapter 3.","Organizational Process Assets","Covered in Chapter 3.","Tools and Techniques","Expert Judgment","Covered in Chapter 3.","Data Analysis","Covered in Chapter 3.","Meetings","Covered in Chapter 3.","Outputs","Scope Management Plan","Documents how you are going to write the scope statement.","Documents how you are going to baseline the scope.","Documents how you are going to control the scope.","Documents how you will get the scope accepted (validated).","This plan is part of the project management plan.","Requirements Management Plan","Shows the requirements to be collected, analyzed, documented, and managed.","This plan is part of the project management plan.","Page 118 – Plan Scope Management","Exam Tip","All management plans are “how tos.”","They all basically give the steps needed to manage that section of the project.","Example:","The scope management plan states how to manage the scope.","The cost management plan states how to manage the budget.","The quality management plan states how to manage the quality processes.","Exam Tip","An easy way to memorize a few of the outputs for the planning process is by looking at the process name to get the outputs.","Look at all the processes like “plan knowledge area management”; its output is the “knowledge area” management plan.","Example:","“Plan Scope Management”: output is the Scope management plan.","“Plan Schedule Management”: output is the schedule management plan.","In other words:","Put the word “Plan” at the start of the process.","Put the word “Plan” at the end for the output.","Page 119 – Collect Requirements","Collect Requirements","Process of defining and documenting stakeholders’ needs to meet the project objectives.","Very important at the beginning of the planning section of the project.","Process where you go out and interact with the stakeholders to gather the requirements they would like to see in the project.","Collecting requirements from stakeholders is vitally important to ensure the project is successful and actually meets the needs of the stakeholders.","If you do not gather the correct requirements from your stakeholders, you can end up making a product, service, or result th
