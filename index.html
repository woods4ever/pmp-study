function shuffleOptions(q){
  var indices = q.options.map(function(_,i){return i});
  for(var i=indices.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var temp=indices[i];indices[i]=indices[j];indices[j]=temp;
  }
  var shuffled={};for(var k in q)shuffled[k]=q[k];
  shuffled.options=indices.map(function(idx){return q.options[idx]});
  shuffled.answer=indices.indexOf(q.answer);
  return shuffled;
}

const chapters = [{"id":2,"title":"Chapter 2: Key Project Management Terms","summary":"Key PMP terms including projects, operations, progressive elaboration, life cycles, baselines, PMO types, stakeholders, organizational structures, constraints, and success.","notes":["Page 21 – Key Project Management Terms","PMBOK® Guide and Agile Practice Guide","Originally published in 1996, the PMBOK® Guide is currently in its 6th edition.","It has been consistently updated every four to five years.","When you get certified in one PMBOK® Guide, you do not need to be certified in another if all you have to do is maintain that certification.","The PMBOK® Guide was written by a large body of individuals who came together to write common standards for project management.","The PMBOK® Guide provides a standard set of processes that standardize the way a project is managed across different industries.","The goal of the PMBOK® Guide is to answer questions about whether all projects follow a standard set of processes and what those processes are.","The Agile Practice Guide is another guide used heavily on the exam.","The Agile Practice Guide outlines agile concepts, processes, and terminology needed for the exam.","Although 50% of the exam is still based on the PMBOK® Guide, questions on agile practices should also be expected.","Review the dedicated Agile chapter to learn more about the guide and the terms needed to understand Agile.","Project","A temporary endeavor to create a unique product, service, or result.","A project is temporary; it can be either short or long.","Projects can range from tasks lasting a few days to efforts requiring multiple years to complete.","All projects must:","Be temporary.","Have a start date and an end date.","Produce a unique output.","Be unique to the customer.","Even though a project is temporary, the output or main deliverable may exist for a very long time.","Examples of projects can include:","Building a house.","Creating new software.","Installing a new computer network.","Redesigning a process in a company.","Merging different organizations.","Operations","Operations are the opposite of projects.","Operations deal with the day-to-day work of a business.","One of the main differences between projects and operations is that projects are temporary while operations are ongoing.","Operations have no start date or end date.","Sales is an example of an operation because it is performed every day and is never finished.","Providing IT support is also an operation.","Page 22 – Key Project Management Terms","Operations (continued)","Building cars on an assembly line is also an operation because the output is not unique, and there is no start or end date.","Main difference for the exam:","Projects are temporary and unique.","Operations have no start date, no end date, and are not unique.","Progressive Elaboration","Progressive elaboration involves discovering greater levels of detail as the project moves toward completion.","Also known as “rolling wave planning.”","As time progresses, things get more detailed.","At the beginning of a project, you may not know the specific details of what you want to do.","Initially, only high-level information may be known, such as an approximate cost.","As the project progresses, details become more elaborated.","Over time, more specific information becomes known about the project outcome.","Project Management","Project management is the application of knowledge, skills, tools, and techniques to meet the project requirements.","It is about managing people to accomplish the scope of the project within the constraints of time and costs.","All projects are limited as to time, cost, and scope.","In project management, the goal is to get work done within a specific budget and a specific timeframe.","Accomplishing project activities results in completing the actual project requirements.","Three Approaches to Managing a Project","Predictive","Also known as traditional waterfall or plan-driven.","Much of the planning is done upfront at the beginning of the project.","The remainder of the project focuses on executing the plan to complete the work.","More of a traditional project approach.","Planning is completed first, followed by execution with very few changes throughout the project.","Agile","Also known as adaptive or change-driven.","Product is built in small increments instead of all at once.","Allows more customer interactions as increments are being built.","Users can begin using portions of the product and provide feedback.","Supports changes throughout the entire project.","Allows customers to add requirements without going through a change management process as in a traditional project.","Hybrid"],"examples":["The PMBOK® Guide was written by a large body of individuals who came together to write common standards for project management.","The PMBOK® Guide provides a standard set of processes that standardize the way a project is managed across different industries.","The goal of the PMBOK® Guide is to answer questions about whether all projects follow a standard set of processes and what those processes are.","The Agile Practice Guide is another guide used heavily on the exam.","The Agile Practice Guide outlines agile concepts, processes, and terminology needed for the exam."],"podcast":[{"speaker":"Maya","text":"Welcome to Chapter 2: Key Project Management Terms. This chapter is foundational, so the goal is to understand the PMP meaning of each term."},{"speaker":"Jordan","text":"Exactly. These concepts show up everywhere else in the exam, so this is about building clean mental hooks."},{"speaker":"Maya","text":"PMBOK® Guide and Agile Practice Guide"},{"speaker":"Jordan","text":"Originally published in 1996, the PMBOK® Guide is currently in its 6th edition."},{"speaker":"Maya","text":"It has been consistently updated every four to five years."},{"speaker":"Jordan","text":"When you get certified in one PMBOK® Guide, you do not need to be certi  usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"What is project management?","options":["Applying knowledge, skills, tools, and techniques to meet project requirements","Managing operations forever","Only creating the schedule","Only controlling cost"],"answer":0,"why":"Project management applies knowledge, skills, tools, and techniques to meet requirements.","mindset":"It balances people, scope, cost, and time.","chapterRef":"Chapter 2: Project Management","tags":["Concept","Foundation"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"Which approach is also known as waterfall or plan-driven?","options":["Predictive","Agile","Hybrid","Adaptive"],"answer":0,"why":"Predictive is traditional waterfall or plan-driven.","mindset":"Predictive uses more upfront planning.","chapterRef":"Chapter 2: Predictive","tags":["Lifecycle","Concept"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"Which approach builds in small increments and supports changes?","options":["Agile","Predictive","Operations","Portfolio"],"answer":0,"why":"Agile builds in increments and supports changes throughout the project.","mindset":"Agile is adaptive/change-driven.","chapterRef":"Chapter 2: Agile","tags":["Agile","Lifecycle"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"What is a hybrid approach?","options":["Combining predictive and agile methods","Using no project life cycle","Only doing operations","Only using a PMO"],"answer":0,"why":"Hybrid combines predictive and agile methods.","mindset":"Hybrid blends approaches depending on project needs.","chapterRef":"Chapter 2: Hybrid","tags":["Agile","Lifecycle"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"Why do companies do projects?","options":["To derive value from the output","To avoid all change","To maintain daily operations only","To create paperwork only"],"answer":0,"why":"Companies do projects to gain value from the output.","mindset":"Projects should deliver business value.","chapterRef":"Chapter 2: Value","tags":["Business","Value"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"What does ITTO stand for?","options":["Inputs, Tools and Techniques, Outputs","Initiating, Testing, Tracking, Operations","Integration, Time, Team, Outputs","Issues, Tools, Teams, Outcomes"],"answer":0,"why":"ITTO stands for Inputs, Tools and Techniques, Outputs.","mindset":"Every process has ITTOs.","chapterRef":"Chapter 2: ITTO","tags":["Process","Foundation"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"What is a phase?","options":["A division within the project where extra control is needed to manage deliverables","A permanent operation","A contract type","A stakeholder role"],"answer":0,"why":"A phase is a project division used for extra control, usually ending with deliverable acceptance.","mindset":"Phases help manage deliverables.","chapterRef":"Chapter 2: Phase","tags":["Lifecycle","Process"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"What happens at phase gates?","options":["A review determines whether the project is meeting goals and should continue","The project automatically ends","All scope is removed","The sponsor always rejects deliverables"],"answer":0,"why":"Phase gates review progress and decide whether the project should continue.","mindset":"Phase gate = stage gate/kill point/review.","chapterRef":"Chapter 2: Phase Gates","tags":["Process","Exam Trap"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"What is a deliverable?","options":["A part of the product presented for acceptance","A PMO type","A stakeholder role","An operational activity"],"answer":0,"why":"A deliverable is presented to customers/stakeholders for acceptance.","mindset":"Deliverables are accepted by customers or sponsors.","chapterRef":"Chapter 2: Deliverable","tags":["Scope","Concept"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"What is a process group?","options":["A grouping of processes the PM may do at a certain time","A project phase","A life cycle stage","A product deliverable"],"answer":0,"why":"A process group groups processes that may be performed at a certain time.","mindset":"Process groups are not phases.","chapterRef":"Chapter 2: Process Group","tags":["Process","Exam Trap"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"Which statement is true about phases and process groups?","options":["All phases contain the five process groups","Process groups and phases are the same","Only closing is a process group","Only agile projects have process groups"],"answer":0,"why":"All phases contain initiating, planning, executing, monitoring/controlling, and closing.","mindset":"Do not confuse phases with process groups.","chapterRef":"Chapter 2: Process Groups vs Phases","tags":["Process","Exam Trap"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"What are the three baselines?","options":["Scope, schedule/time, and cost","Quality, risk, and procurement","Stakeholder, resource, and communication","Program, portfolio, and product"],"answer":0,"why":"The notes list scope, time/schedule, and cost as the three baselines.","mindset":"Performance is measured against baselines.","chapterRef":"Chapter 2: Baselines","tags":["Baseline","Process"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"What is a baseline?","options":["The original plan plus approved changes","Only the first rough idea","Any informal sponsor request","A lesson learned"],"answer":0,"why":"A baseline is the original plan plus approved changes.","mindset":"Approved changes update baselines.","chapterRef":"Chapter 2: Baselines","tags":["Baseline","Change Control"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"What should happen when a sponsor requests added scope?","options":["Submit a formal change request and assess impacts","Add the work immediately","Ignore the sponsor","Close the phase"],"answer":0,"why":"Added scope requires a formal change request and impact assessment before approval.","mindset":"Scope changes affect time and cost.","chapterRef":"Chapter 2: Baseline Example","tags":["Change Control","Exam Trap"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"What does a supportive PMO provide?","options":["Templates and training with low authority","Full control of the project","Moderate mandatory framework only","Only product ownership"],"answer":0,"why":"A supportive PMO provides support, templates, and training with low authority.","mindset":"Supportive PMO = low authority.","chapterRef":"Chapter 2: PMO Types","tags":["PMO","Organization"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"Which PMO type has high authority and directs the PM?","options":["Directive PMO","Supportive PMO","Controlling PMO","Virtual PMO"],"answer":0,"why":"A directive PMO directs the PM and has high authority.","mindset":"Directive = high authority/control.","chapterRef":"Chapter 2: PMO Types","tags":["PMO","Exam Trap"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"You are managing a project to build a new warehouse. Six months into the project, the operations team asks you to also manage the daily maintenance of the completed facility. What should you do?","options":["Explain that maintenance is an operation, not part of the project scope, and suggest they assign an operations manager","Add the maintenance work to the project scope since you\u0027re already involved","Ask your sponsor if you can extend the project indefinitely to include maintenance","Create a change request to include maintenance in the project"],"answer":0,"why":"Projects are temporary with defined end dates. Ongoing maintenance is operations work and should not be included in a project. The PM should clarify this boundary.","mindset":"PMI mindset: understand the difference between projects (temporary, unique) and operations (ongoing, repetitive). Don\u0027t scope-creep into operations.","tags":["Projects vs Operations","Scope"],"chapterRef":"Chapter 2 - Projects vs Operations"},{"q":"Your project has been running for three months. A new stakeholder joins and asks why the project plan has changed since the original version. You explain that the project uses progressive elaboration. What does this mean?","options":["The plan becomes more detailed as more information becomes available throughout the project","The project team progressively works longer hours as deadlines approach","Requirements are locked at the beginning and never change","The project scope is reduced over time to meet budget"],"answer":0,"why":"Progressive elaboration means the project plan is refined and becomes more detailed as the team learns more. This is normal and expected.","mindset":"PMI mindset: planning is iterative. You don\u0027t know everything upfront, and the plan evolves as understanding deepens.","tags":["Progressive Elaboration","Planning"],"chapterRef":"Chapter 2 - Progressive Elaboration"},{"q":"You are a PM in a projectized organization. A functional manager from another department wants one of your team members to work on their initiative for two weeks. What is MOST likely true about your authority in this situation?","options":["You have full authority over your team resources and can decline the request","You must share the resource because functional managers have equal authority","You need to escalate to the PMO for a decision","The functional manager\u0027s request automatically takes priority"],"answer":0,"why":"In a projectized organization, the PM has full authority over project resources. Functional managers have limited influence over project team members.","mindset":"PMI mindset: organizational structure determines PM authority. In projectized orgs, the PM controls resources.","tags":["Organizational Structure","Authority"],"chapterRef":"Chapter 2 - Organizational Structures"},{"q":"A sponsor asks you to start a project but tells you the high-level scope is unclear and will be defined as the project progresses. The sponsor wants a fixed budget and end date. What should you do FIRST?","options":["Explain the risks of fixing budget and date without clear scope, and recommend a phased approach with decision gates","Refuse the project because the triple constraint cannot be met","Accept the constraints and begin planning with what you know","Ask the sponsor to define all requirements before you begin"],"answer":0,"why":"The PM should educate the sponsor about the relationship between scope, time, and cost. A phased approach with gates allows progressive elaboration while managing expectations.","mindset":"PMI mindset: communicate constraints honestly. Don\u0027t just accept impossible conditions or refuse outright â€” propose a path forward.","tags":["Triple Constraint","Stakeholder Management"],"chapterRef":"Chapter 2 - Constraints"},{"q":"During a project meeting, a team member asks what the difference is between a program and a portfolio. Which response is MOST accurate?","options":["A program is a group of related projects managed together for benefits not available individually; a portfolio is a collection of projects, programs, and operations managed to achieve strategic objectives","A program is larger than a portfolio","A portfolio only contains projects, never programs","Programs and portfolios are the same thing at different organizational levels"],"answer":0,"why":"Programs group related projects for coordinated benefits. Portfolios are the highest level, aligning all work (projects, programs, operations) to strategic goals.","mindset":"PMI mindset: understand the hierarchy â€” projects feed into programs, which feed into portfolios, which align to organizational strategy.","tags":["Programs","Portfolios","Organizational Strategy"],"chapterRef":"Chapter 2 - Programs and Portfolios"},{"q":"You are assigned as PM for a project. During initiation, you discover there is no PMO in the organization. What impact does this MOST likely have?","options":["You will need to establish your own project management standards, templates, and governance for this project","The project cannot proceed without a PMO","You must create a PMO before starting the project","The lack of a PMO means there are no constraints on how you manage the project"],"answer":0,"why":"Without a PMO, there are no standardized templates or governance. The PM needs to establish their own approach while still following sound PM practices.","mindset":"PMI mindset: a PMO provides support but isn\u0027t required. The PM is still responsible for applying appropriate processes.","tags":["PMO","Governance"],"chapterRef":"Chapter 2 - PMO Types"},{"q":"Your project is in execution when you receive a request to add a feature that was not in the original scope. The stakeholder says it\u0027s critical. What should you do FIRST?","options":["Evaluate the impact of the change on scope, schedule, cost, and quality before making any decision","Add the feature immediately since the stakeholder says it\u0027s critical","Reject the change because it wasn\u0027t in the original plan","Escalate to the sponsor for a decision without analysis"],"answer":0,"why":"Before accepting or rejecting any change, the PM must assess its impact on all project constraints. This is the foundation of integrated change control.","mindset":"PMI mindset: never accept or reject changes without impact analysis first. Assess, then decide through the change control process.","tags":["Change Control","Impact Analysis"],"chapterRef":"Chapter 2 - Baselines and Change"},{"q":"A new team member asks you why the project charter is important since they already know what work needs to be done. What is the BEST explanation?","options":["The charter formally authorizes the project, names the PM, and gives authority to apply organizational resources â€” without it, the project has no official standing","The charter is just documentation that nobody reads after kickoff","The charter replaces the project plan","The charter is only needed for large projects"],"answer":0,"why":"The project charter is the foundational document that formally authorizes the project and establishes the PM\u0027s authority. It\u0027s essential regardless of project size.","mindset":"PMI mindset: the charter establishes legitimacy and authority. It\u0027s not optional paperwork â€” it\u0027s the PM\u0027s mandate.","tags":["Project Charter","Initiation"],"chapterRef":"Chapter 2 - Project Charter"},{"q":"You are managing a project where the customer keeps changing requirements every sprint. Your team is frustrated. You are using a hybrid approach. What should you do?","options":["Review and tighten the definition of done and change process while still allowing appropriate flexibility through the backlog","Switch to pure waterfall to lock requirements","Tell the customer no more changes are allowed","Let the team decide how to handle changes without your involvement"],"answer":0,"why":"In hybrid, you balance flexibility with control. Tightening DoD and ensuring changes go through proper backlog grooming maintains agility while reducing chaos.","mindset":"PMI mindset: don\u0027t abandon process, but don\u0027t be rigid either. Use appropriate controls that match the project approach.","tags":["Hybrid","Change Management","Agile"],"chapterRef":"Chapter 2 - Life Cycles"},{"q":"A project sponsor tells you they want a project completed in 6 months with a fixed team of 5. The scope requires 12 months of effort with that team size. What constraint is MOST impacted?","options":["Scope must be reduced, or quality will suffer, since time and resources are fixed","There is no issue â€” the team can just work harder","Budget should be increased to hire more people","The schedule constraint is the only one affected"],"answer":0,"why":"With fixed time and resources, the only flexible constraints are scope and quality. The PM must communicate this tradeoff to the sponsor.","mindset":"PMI mindset: constraints are interconnected. If you fix time and resources, scope or quality must flex. Communicate this reality.","tags":["Triple Constraint","Communication"],"chapterRef":"Chapter 2 - Project Constraints"},{"q":"You\u0027re in a matrix organization and one of your project team members reports to both you and a functional manager. The functional manager assigns your team member to another task during a critical project phase. What should you do FIRST?","options":["Discuss the conflict with the functional manager to negotiate priorities and find a resolution","Escalate immediately to the sponsor","Tell the team member to ignore the functional manager","Accept the situation and adjust your project schedule"],"answer":0,"why":"In a matrix organization, resource conflicts are common. The first step is to negotiate directly with the functional manager before escalating.","mindset":"PMI mindset: resolve conflicts at the lowest level possible first. Escalation is a last resort, not a first response.","tags":["Matrix Organization","Conflict Resolution","Resource Management"],"chapterRef":"Chapter 2 - Organizational Structures"},{"q":"A team member says \u0027This project will never end â€” we keep finding new things to do.\u0027 What concept does this BEST relate to?","options":["The project lacks a clear definition of done and may be suffering from scope creep â€” projects must be temporary with defined endpoints","This is normal progressive elaboration","The team member needs motivation coaching","The project should be converted to an operation"],"answer":0,"why":"Projects are temporary. If work keeps expanding without end, the scope boundaries aren\u0027t being enforced. This is scope creep, not progressive elaboration.","mindset":"PMI mindset: projects have endpoints. Protect the scope baseline through change control. Endless expansion is a project management failure.","tags":["Scope Creep","Project Definition"],"chapterRef":"Chapter 2 - Project Definition"},{"q":"During planning, your team identifies that they need clarification on several requirements. The stakeholder is unavailable for two weeks. What should you do?","options":["Document the assumptions you\u0027re making, continue planning with what you know, and validate assumptions when the stakeholder returns","Stop all planning until the stakeholder is available","Make final decisions on requirements without stakeholder input","Skip those requirements and plan around them"],"answer":0,"why":"Projects use assumptions when information is unavailable. Document them, proceed, and validate later. Don\u0027t stop progress or make permanent decisions without input.","mindset":"PMI mindset: assumptions are necessary when information is incomplete. Document them so they can be validated. Don\u0027t let unknowns paralyze the project.","tags":["Assumptions","Planning"],"chapterRef":"Chapter 2 - Project Constraints"},{"q":"You discover that your organization has three types of PMOs â€” supportive, controlling, and directive. Your PMO reviews all project documents and requires specific templates. What type is this?","options":["Controlling â€” it provides frameworks and templates that projects must follow, with moderate control","Directive â€” it directly manages the projects","Supportive â€” it only offers guidance when asked","This is not a real PMO classification"],"answer":0,"why":"A controlling PMO establishes standards and templates that projects are required to use. It has moderate authority â€” more than supportive but less than directive.","mindset":"PMI mindset: know the three PMO types and their level of control. Controlling PMOs enforce compliance with standards.","tags":["PMO Types","Governance"],"chapterRef":"Chapter 2 - PMO Types"},{"q":"A project has been approved and you\u0027ve been assigned as PM. Before you begin planning, what document should already exist?","options":["The project charter â€” it formally authorizes the project and your role as PM","The detailed project plan","The work breakdown structure","The risk register"],"answer":0,"why":"The charter is created during initiation, before planning begins. It authorizes the project and the PM. All other documents are created during planning.","mindset":"PMI mindset: the charter comes first. You cannot plan a project that hasn\u0027t been formally authorized.","tags":["Project Charter","Process Groups"],"chapterRef":"Chapter 2 - Project Charter"},{"q":"Your sponsor asks you to estimate the project cost before requirements are fully defined. What type of estimate is MOST appropriate?","options":["A rough order of magnitude (ROM) estimate, typically -25% to +75% accuracy, which is appropriate for early-stage estimates","A definitive estimate with Â±5% accuracy","A bottom-up estimate based on work packages","No estimate should be given until all requirements are defined"],"answer":0,"why":"ROM estimates are appropriate when limited information is available. They acknowledge uncertainty while still providing a range for decision-making.","mindset":"PMI mindset: estimate accuracy corresponds to available information. Early = rough. Don\u0027t refuse to estimate, but communicate the confidence level.","tags":["Estimating","Planning"],"chapterRef":"Chapter 2 - Key Terms"},{"q":"You are managing a predictive project when stakeholders ask if they can see working deliverables earlier rather than waiting until the end. What is the BEST approach?","options":["Propose a phased delivery approach with incremental releases while maintaining the overall predictive framework","Tell stakeholders they must wait for the final delivery","Switch the entire project to agile immediately","Deliver incomplete work just to satisfy the request"],"answer":0,"why":"You can incorporate incremental delivery within a predictive framework. This doesn\u0027t require abandoning the approach â€” it\u0027s adapting to stakeholder needs.","mindset":"PMI mindset: be flexible within your approach. You can deliver incrementally without fully switching methodologies.","tags":["Delivery Approach","Stakeholder Engagement"],"chapterRef":"Chapter 2 - Life Cycles"},{"q":"A team member asks why they need to follow the defined project processes when they could just start building immediately. What is the BEST response?","options":["Processes provide structure that reduces rework, manages risk, and ensures all stakeholders are aligned â€” skipping them typically costs more time later","Processes are bureaucracy and you agree they should start building","Processes are only for the PM, not the team","Tell them to follow processes without explaining why"],"answer":0,"why":"Project management processes exist to prevent common failures. The PM should explain the value rather than just enforce compliance.","mindset":"PMI mindset: processes serve the project, not the other way around. Help the team understand the why, not just the what.","tags":["Process","Team Leadership"],"chapterRef":"Chapter 2 - PMBOK Guide"},{"q":"You\u0027re reviewing a business case for a new project. The expected benefits are marginal and the risks are high. What should you recommend?","options":["Present your analysis to the sponsor showing that risks outweigh benefits, and recommend either not proceeding or finding ways to reduce risks before committing","Proceed with the project since it was already proposed","Reject the project on your own authority","Ignore the risks since all projects have them"],"answer":0,"why":"The PM should provide honest analysis to decision-makers. If the business case is weak, that needs to be communicated â€” but the go/no-go decision belongs to the sponsor.","mindset":"PMI mindset: PMs advise based on analysis. They don\u0027t unilaterally kill projects, but they don\u0027t hide unfavorable data either.","tags":["Business Case","Decision Making"],"chapterRef":"Chapter 2 - Business Case"},{"q":"You are assigned to a project where a previous PM already created the charter. Upon review, you notice the charter doesn\u0027t mention key stakeholders or success criteria. What should you do?","options":["Request that the charter be updated to include missing elements before moving forward with planning","Ignore it since the charter is already signed","Create a new charter from scratch","Proceed to planning and address the gaps in the project plan instead"],"answer":0,"why":"A charter with missing critical elements creates risk. The PM should request updates to ensure proper authorization and clarity exist before planning.","mindset":"PMI mindset: don\u0027t inherit broken foundations. If critical elements are missing from the charter, get them fixed before building on top of them.","tags":["Project Charter","Initiation"],"chapterRef":"Chapter 2 - Project Charter"}]},{"id":3,"title":"Chapter 3: Project Management Processes and Role of the Project Manager","summary":"Process groups, knowledge areas, common ITTOs, work performance flow, and the role/skills of the project manager.","notes":["Page 42 – 49 Project Management Processes","Process Groups","Initiating (2)","Planning (24)","Executing (10)","Monitoring & Controlling (12)","Closing (1)","Integration Management (7)","Develop Project Charter","Develop Project Management Plan","Direct & Manage Project Work","Manage Project Knowledge","Monitor & Control Project Work","Perform Integrated Change Control","Close Project or Phase","Scope Management (6)","Plan Scope Management","Collect Requirements","Define Scope","Create WBS","Validate Scope","Control Scope","Schedule Management (6)","Plan Schedule Management","Define Activities","Sequence Activities","Estimate Activity Durations","Develop Schedule","Control Schedule","Cost Management (4)","Plan Cost Management","Estimate Costs","Determine Budget","Control Costs","Quality Management (3)","Plan Quality Management","Manage Quality","Control Quality","Resource Management (6)","Plan Resource Management","Estimate Activity Resources","Acquire Resources","Develop Team","Manage Team","Control Resources","Communication Management (3)","Plan Communications Management","Manage Communications","Monitor Communications","Risk Management (7)","Plan Risk Management","Identify Risks","Perform Qualitative Risk Analysis","Perform Quantitative Risk Analysis","Plan Risk Responses","Implement Risk Responses","Monitor Risks","Procurement Man text":"Right. Slow down, identify the exact PMP term being tested, and eliminate answers that sound related but do not match the definition."}],"questions":[{"q":"How many total project management processes are listed?","options":["49","39","10","5"],"answer":0,"why":"The notes list 49 processes across process groups and knowledge areas.","mindset":"Know the 49-process framework.","chapterRef":"Chapter 3: Processes","tags":["Process","Foundation"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"How many process groups are there?","options":["Five","Ten","Forty-nine","Three"],"answer":0,"why":"There are five process groups.","mindset":"Know the five process groups cold.","chapterRef":"Chapter 3: Process Groups","tags":["Process","Foundation"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"Which process group has two processes?","options":["Initiating","Planning","Executing","Closing"],"answer":0,"why":"Initiating has two processes.","mindset":"Initiating is about authorization.","chapterRef":"Chapter 3: Initiating","tags":["Process","Exam Trap"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"Which process group has 24 processes?","options":["Planning","Executing","Closing","Initiating"],"answer":0,"why":"Planning has 24 processes.","mindset":"Planning is the largest process group.","chapterRef":"Chapter 3: Planning","tags":["Process","Foundation"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"Which process group has 10 processes?","options":["Executing","Closing","Initiating","Monitoring and Controlling"],"answer":0,"why":"Executing has 10 processes.","mindset":"Executing is where work gets done.","chapterRef":"Chapter 3: Executing","tags":["Process","Execution"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"Which process group has 12 processes?","options":["Monitoring and Controlling","Initiating","Closing","Executing"],"answer":0,"why":"Monitoring and Controlling has 12 processes.","mindset":"This group compares actual work to planned work.","chapterRef":"Chapter 3: Monitoring and Controlling","tags":["Process","Control"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"Which process group has one process?","options":["Closing","Initiating","Planning","Executing"],"answer":0,"why":"Closing has one process.","mindset":"Closing is still heavily tested.","chapterRef":"Chapter 3: Closing","tags":["Process","Closing"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"What is the purpose of initiating?","options":["Authorize the project or phase to start","Create all deliverables","Close all contracts","Inspect quality only"],"answer":0,"why":"Initiating authorizes the project or phase.","mindset":"Initiating = authorizing.","chapterRef":"Chapter 3: Initiating","tags":["Process","Foundation"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"What are the main outputs of initiating?","options":["Project charter and stakeholder register","Cost baseline and schedule baseline","Work performance reports","Accepted deliverables"],"answer":0,"why":"The main initiating outputs are project charter and stakeholder register.","mindset":"Charter authorizes, stakeholder register identifies.","chapterRef":"Chapter 3: Initiating Outputs","tags":["Process","Stakeholder"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"What is the main output of planning?","options":["Project management plan","Work performance data","Accepted deliverables","Final report"],"answer":0,"why":"Planning creates the project management plan.","mindset":"The plan guides execution, monitoring/controlling, and closing.","chapterRef":"Chapter 3: Planning","tags":["Planning","Process"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"What is the main output of executing?","options":["Deliverables","Risk report only","Project charter","Final closure report"],"answer":0,"why":"The main output of executing is deliverables.","mindset":"Executing is where project work is performed.","chapterRef":"Chapter 3: Executing","tags":["Execution","Process"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"What does monitoring and controlling do?","options":["Compare actual work to planned work","Authorize the project","Only close contracts","Only identify stakeholders"],"answer":0,"why":"Monitoring and controlling measures and compares actual work to the plan.","mindset":"Off-plan work may require corrective action or changes.","chapterRef":"Chapter 3: Monitoring and Controlling","tags":["Control","Process"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"What is true about executing and monitoring/controlling?","options":["They occur in parallel/simultaneously","They cannot overlap","Monitoring only occurs after closing","Executing happens before planning"],"answer":0,"why":"The notes say executing and monitoring/controlling are parallel/simultaneous.","mindset":"You monitor/control while executing.","chapterRef":"Chapter 3: Exam Tip","tags":["Process","Exam Trap"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"What happens in closing?","options":["Accepted deliverables are transitioned, records archived, contracts closed, and lessons learned documented","Project is first authorized","Requirements are collected","Schedule is developed"],"answer":0,"why":"Closing happens after acceptance and includes transition, records, lessons learned, and final reporting.","mindset":"Closing is more than just finishing work.","chapterRef":"Chapter 3: Closing","tags":["Closing","Process"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"What are Enterprise Environmental Factors?","options":["Factors not under the project team’s control that may affect outcomes","Only templates and lessons learned","Only project documents","Only change requests"],"answer":0,"why":"EEF are internal/external factors not under the control of the project team.","mindset":"EEF can positively or negatively affect outcomes.","chapterRef":"Chapter 3: EEF","tags":["ITTO","Process"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"What are Organizational Process Assets?","options":["Plans, processes, policies, procedures, and knowledge bases used by the organization","External regulations only","The sponsor’s personal notes","Only risk tolerance"],"answer":0,"why":"OPA include templates, historical information, lessons learned, policies, procedures, and knowledge bases.","mindset":"OPA helps the PM manage the project.","chapterRef":"Chapter 3: OPA","tags":["ITTO","Process"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"What is the project management plan?","options":["The single most important document defining how the project is executed, monitored/controlled, and closed","A stakeholder list only","Raw work data","Only the charter"],"answer":0,"why":"The notes call the project management plan the single most important document.","mindset":"The plan guides how the project is handled.","chapterRef":"Chapter 3: Project Management Plan","tags":["Plan","Process"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"What is work performance data?","options":["Raw data with no analysis applied","Analyzed status compared to the plan","A compiled project report","A final closure report"],"answer":0,"why":"Work performance data is raw and not useful by itself.","mindset":"Data is raw; information is analyzed.","chapterRef":"Chapter 3: Work Performance Data","tags":["ITTO","Exam Trap"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"What is work performance information?","options":["Work data analyzed against the project management plan","Raw data only","A compiled project report","A vendor agreement"],"answer":0,"why":"Work performance information compares raw data to the plan.","mindset":"Information shows actual status compared to plan.","chapterRef":"Chapter 3: Work Performance Information","tags":["ITTO","Exam Trap"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"What is the correct work performance flow?","options":["Data → Information → Reports","Reports → Data → Information","Information → Data → Reports","Data → Charter → Reports"],"answer":0,"why":"Data is compared to the plan to create information, and information is compiled into reports.","mindset":"Data feeds info; info creates reports.","chapterRef":"Chapter 3: Work Performance Flow","tags":["ITTO","Exam Trap"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"You\u0027ve just been assigned as PM for a complex project. The sponsor hands you a list of deliverables and says \u0027Just get it done.\u0027 What should you do FIRST?","options":["Clarify the project objectives, constraints, and success criteria with the sponsor before beginning planning","Start creating the WBS immediately since you have the deliverables list","Assign work to team members based on the deliverables list","Create a project schedule and present it to the sponsor"],"answer":0,"why":"Before planning, the PM needs to understand the full picture â€” objectives, constraints, and how success will be measured. A deliverables list alone is insufficient.","mindset":"PMI mindset: don\u0027t jump to execution without understanding context. Ask questions, clarify, then plan.","tags":["Initiation","PM Role"],"chapterRef":"Chapter 3 - Role of the Project Manager"},{"q":"During execution, you notice a team member consistently making decisions that should involve the project manager. What is the BEST approach?","options":["Have a private conversation to clarify decision-making authority and RACI boundaries while acknowledging their initiative","Publicly correct them in the next team meeting","Report them to HR for insubordination","Let it continue since they seem competent"],"answer":0,"why":"The PM should address the issue directly but respectfully. Clarifying roles prevents future confusion while maintaining team morale.","mindset":"PMI mindset: address issues directly with the individual first. Public correction damages trust. Silence enables the problem.","tags":["PM Role","Team Management","Communication"],"chapterRef":"Chapter 3 - Role of the Project Manager"},{"q":"Your project is transitioning from planning to execution. A stakeholder asks you which process group takes the most time and resources. What is the correct answer?","options":["Execution â€” this is where the project plan is carried out and most resources are consumed producing deliverables","Planning â€” because it requires the most documentation","Monitoring and Controlling â€” because oversight is constant","Closing â€” because final deliverables must be perfected"],"answer":0,"why":"The Execution process group consumes the majority of project time and budget because that\u0027s where actual work is performed and deliverables are created.","mindset":"PMI mindset: understand the relative effort across process groups. Planning is important but execution is where resources are spent.","tags":["Process Groups","Execution"],"chapterRef":"Chapter 3 - Process Groups"},{"q":"Midway through your project, you realize that the monitoring and controlling processes were never properly set up. Variance reports don\u0027t exist and no one is tracking progress against baselines. What should you do?","options":["Immediately establish monitoring processes â€” define metrics, baselines, and reporting cadence so you can identify variances going forward","Continue without monitoring since the project is already halfway done","Only set up monitoring if problems arise","Ask the team to self-report their progress weekly"],"answer":0,"why":"Monitoring and controlling runs throughout the project. It\u0027s never too late to establish it â€” without it, you\u0027re flying blind and can\u0027t detect problems until it\u0027s too late.","mindset":"PMI mindset: M\u0026C is continuous. If it\u0027s missing, fix it immediately. You cannot manage what you cannot measure.","tags":["Monitoring and Controlling","Baselines"],"chapterRef":"Chapter 3 - Process Groups"},{"q":"A new PM asks you how the process groups relate to project phases. Which statement is MOST accurate?","options":["Process groups are not phases â€” they can repeat within each phase of a project, and all five groups may be used within a single phase","Process groups and phases are the same thing","Each phase corresponds to exactly one process group","Process groups only apply to waterfall projects"],"answer":0,"why":"Process groups are distinct from phases. Within a single phase, you may initiate, plan, execute, monitor/control, and close. They can repeat across phases.","mindset":"PMI mindset: don\u0027t confuse process groups with phases. Process groups are activities that may recur; phases are time-bounded segments of the project.","tags":["Process Groups","Phases"],"chapterRef":"Chapter 3 - Process Groups vs Phases"},{"q":"You are a PM who values servant leadership. Your team is struggling with a technical decision and asks you to just make the call. What should you do?","options":["Facilitate a discussion to help the team analyze options and reach their own decision, stepping in only if they cannot resolve it","Make the decision immediately since they asked","Tell them it\u0027s not your job to make technical decisions","Escalate the decision to the sponsor"],"answer":0,"why":"Servant leaders empower teams to make their own decisions. The PM should facilitate, not dictate â€” unless the team is truly stuck after attempting resolution.","mindset":"PMI mindset: servant leadership means removing obstacles and enabling the team, not commanding them. Help them solve it themselves.","tags":["Servant Leadership","Team Empowerment"],"chapterRef":"Chapter 3 - Role of the Project Manager"},{"q":"Your organization wants to improve its project management maturity. They ask which single thing would have the MOST impact. Based on PMI principles, what would you recommend?","options":["Implement consistent lessons learned practices so each project improves upon the last","Buy the most expensive PM software available","Hire more project managers","Create more documentation templates"],"answer":0,"why":"Lessons learned drive continuous improvement â€” the foundation of organizational maturity. Without learning from past projects, the same mistakes repeat.","mindset":"PMI mindset: organizational improvement comes from systematic learning, not just tools or people. Lessons learned close the feedback loop.","tags":["Lessons Learned","Organizational Maturity"],"chapterRef":"Chapter 3 - PM Processes"},{"q":"You\u0027re closing a project phase. The sponsor wants to skip the phase gate review to save time. What should you do?","options":["Explain the value of the phase gate review â€” it validates deliverables, confirms readiness, and prevents problems from carrying forward into the next phase","Skip it since the sponsor requested it","Conduct the review without telling the sponsor","Delay the entire project until the sponsor agrees"],"answer":0,"why":"Phase gate reviews are quality checkpoints. Skipping them creates risk. The PM should educate the sponsor on the value rather than simply complying or refusing.","mindset":"PMI mindset: protect project integrity through proper process. Educate stakeholders on why controls exist rather than blindly obeying shortcuts.","tags":["Phase Gates","Closing","Stakeholder Management"],"chapterRef":"Chapter 3 - Process Groups"},{"q":"Your team is in the Forming stage of development. Conflicts are minimal but productivity is low. What is the PM\u0027s PRIMARY role at this stage?","options":["Provide clear direction, establish ground rules, and help team members understand their roles and the project objectives","Step back and let the team self-organize immediately","Focus only on the technical deliverables","Address conflicts head-on since they should be emerging"],"answer":0,"why":"During Forming, the team needs direction and clarity. They\u0027re figuring out roles and relationships. The PM should be more directive at this stage.","mindset":"PMI mindset: adapt your leadership style to the team\u0027s development stage. Forming requires more structure; later stages require less.","tags":["Team Development","Leadership"],"chapterRef":"Chapter 3 - Role of the Project Manager"},{"q":"An executive asks you why your project needs a formal closing process when the work is already done. What is the BEST justification?","options":["Closing ensures deliverables are formally accepted, lessons learned are captured, resources are released, and contracts are settled â€” skipping it creates organizational risk","Closing is just paperwork and could be skipped","Closing is only needed if there are problems","Closing only matters for projects over $1M"],"answer":0,"why":"The closing process group has real deliverables â€” formal acceptance, lessons learned, resource release, contract closure. Without it, organizations lose knowledge and leave loose ends.","mindset":"PMI mindset: closing is a real process group, not an afterthought. It protects the organization and enables future success.","tags":["Closing","Process Groups"],"chapterRef":"Chapter 3 - Process Groups"},{"q":"You are managing a project using a hybrid approach. A purist agile coach says you cannot combine predictive and agile methods. What is the BEST response?","options":["Explain that PMI recognizes hybrid approaches as valid â€” the delivery method should fit the project\u0027s needs, not dogma","Agree and switch to pure agile","Agree and switch to pure waterfall","Ignore the coach entirely"],"answer":0,"why":"PMI explicitly supports hybrid approaches. The right method depends on project characteristics â€” complexity, uncertainty, stakeholder needs. Dogma helps no one.","mindset":"PMI mindset: be pragmatic, not dogmatic. Use the approach that fits the project context. Hybrid is explicitly recognized and valid.","tags":["Hybrid","Tailoring"],"chapterRef":"Chapter 3 - PM Approaches"},{"q":"Your team completed a deliverable but the customer hasn\u0027t formally accepted it. The team wants to move on to the next phase. What should you do?","options":["Obtain formal acceptance of the deliverable before proceeding to the next phase â€” unaccepted deliverables create risk downstream","Let the team proceed since the work is done","Send an email saying \u0027if we don\u0027t hear back, we\u0027ll assume acceptance\u0027","Mark it as accepted in your records and move on"],"answer":0,"why":"Formal acceptance is a required output of deliverable validation. Without it, the customer can later dispute the work, causing rework and scope issues.","mindset":"PMI mindset: formal acceptance protects both parties. Don\u0027t assume silence is acceptance. Get it documented.","tags":["Deliverable Acceptance","Closing"],"chapterRef":"Chapter 3 - PM Processes"},{"q":"A junior PM asks you what \u0027tailoring\u0027 means in project management. Which answer is MOST complete?","options":["Tailoring means adapting processes, tools, techniques, and documentation to fit the specific project context â€” not every project needs every process","Tailoring means removing all processes to go faster","Tailoring means adding more processes to be more rigorous","Tailoring is only done by the PMO, not the PM"],"answer":0,"why":"Tailoring is selecting and adapting appropriate processes for the project at hand. More process isn\u0027t always better; less isn\u0027t always faster. It\u0027s about fit.","mindset":"PMI mindset: there is no one-size-fits-all. The PM tailors the approach based on project size, complexity, risk, and organizational context.","tags":["Tailoring","PM Approach"],"chapterRef":"Chapter 3 - Tailoring"},{"q":"You notice that your project\u0027s initiating process was minimal â€” just a verbal go-ahead from the sponsor. Now in planning, you have no formal authority and teams are questioning your role. What went wrong?","options":["The project lacked a proper charter, which would have formally established your authority as PM and the project\u0027s existence","The team is being insubordinate and should be reported","Nothing went wrong â€” verbal authorization is sufficient","You should have started executing immediately without planning"],"answer":0,"why":"Without a charter, the PM has no formal authority. Teams rightfully question who is in charge. This is why proper initiation matters.","mindset":"PMI mindset: the charter establishes your authority. Without it, you\u0027re just someone asking people to do things with no organizational backing.","tags":["Project Charter","PM Authority"],"chapterRef":"Chapter 3 - Initiating Process Group"},{"q":"During a retrospective, a team member says \u0027We should have identified this risk earlier.\u0027 As the PM, what process improvement does this suggest?","options":["The risk identification process needs to be more thorough during planning, and possibly repeated more frequently during execution","One missed risk doesn\u0027t indicate a process problem","Risk identification should only happen once during planning","The team member is being critical and should be coached"],"answer":0,"why":"Hindsight about missed risks indicates the identification process needs improvement â€” perhaps more stakeholder input, more frequent reviews, or different techniques.","mindset":"PMI mindset: retrospectives are for process improvement, not blame. If risks were missed, improve the process to catch them earlier next time.","tags":["Risk Identification","Continuous Improvement","Lessons Learned"],"chapterRef":"Chapter 3 - Monitoring and Controlling"},{"q":"You are managing three projects simultaneously. Your organization has limited PM methodology. You\u0027re spending significant time creating processes from scratch for each project. What would MOST help?","options":["Propose that the organization establish a PMO to provide standardized processes, templates, and governance that all projects can reuse","Hire additional PMs for each project","Continue creating custom processes â€” it shows thoroughness","Eliminate processes and just focus on delivery"],"answer":0,"why":"A PMO eliminates redundant effort by providing reusable frameworks. When multiple PMs recreate the same thing independently, it signals an organizational gap.","mindset":"PMI mindset: when you see patterns of waste or inconsistency, propose systemic solutions. A PMO addresses root causes of process inefficiency.","tags":["PMO","Organizational Structure"],"chapterRef":"Chapter 3 - PM in the Organization"},{"q":"Your project team works across three time zones. Morning standups work for two zones but exclude the third. A team member from the excluded zone feels disconnected. What should you do FIRST?","options":["Rotate meeting times or create alternative communication mechanisms so all team members can participate equitably","Tell the excluded team member to adjust their schedule","Keep the current schedule since majority rules","Cancel standups entirely"],"answer":0,"why":"The PM is responsible for inclusive communication. When structure excludes team members, adapt the approach to ensure everyone can contribute.","mindset":"PMI mindset: communication must reach all stakeholders. Adapt methods to the team\u0027s reality rather than forcing one approach.","tags":["Communication","Team Management","Distributed Teams"],"chapterRef":"Chapter 3 - Role of the Project Manager"},{"q":"Your project has entered execution and you discover that planning was incomplete â€” several work packages have no estimates. What is the BEST course of action?","options":["Pause the affected work, complete the missing estimates, update the plan, and re-baseline with sponsor approval before continuing","Guess at estimates and continue executing","Wait until the work is done and record actual costs","Escalate to the sponsor and wait for them to decide"],"answer":0,"why":"Executing without estimates means you can\u0027t track progress or variance. Fix the planning gaps before proceeding with that work. Planning and execution can overlap.","mindset":"PMI mindset: planning isn\u0027t a one-time event. When gaps are found, fill them. Don\u0027t execute blindly without a baseline to measure against.","tags":["Planning","Baselines","Execution"],"chapterRef":"Chapter 3 - Iterative Planning"},{"q":"A stakeholder criticizes your project management approach saying \u0027All this process is slowing us down.\u0027 After investigation, you find the team is producing excessive documentation that adds no value. What should you do?","options":["Review and streamline the documentation requirements â€” eliminate what adds no value while keeping what supports project success","Defend all current processes since they follow the PMBOK Guide","Remove all documentation to appease the stakeholder","Ignore the feedback since stakeholders don\u0027t understand PM"],"answer":0,"why":"Process should serve the project, not burden it. If documentation adds no value, it should be reduced. The PM tailors processes to the project\u0027s actual needs.","mindset":"PMI mindset: more process isn\u0027t always better. Tailor, simplify, and ensure everything you do serves the project\u0027s actual needs. Listen to feedback.","tags":["Tailoring","Process Improvement"],"chapterRef":"Chapter 3 - Tailoring"},{"q":"A team member says they\u0027ve been doing project management for years without any formal training and sees no value in certifications or methodology. As the PM, what perspective does PMI take?","options":["Formal methodology provides consistent, repeatable processes that reduce risk â€” but experience is also valuable. The best approach combines both structured methods and practical experience","Formal methodology is the only way to manage projects","Experience alone is always sufficient","Certifications are more important than actual project success"],"answer":0,"why":"PMI values both formal methodology and practical experience. Neither alone is sufficient. Methodology without experience is academic; experience without methodology is inconsistent.","mindset":"PMI mindset: value both structure and experience. Formal processes provide a baseline; experience adds judgment and adaptation.","tags":["PM Professional Development","Methodology"],"chapterRef":"Chapter 3 - PM Competencies"}]},{"id":4,"title":"Chapter 4: Agile and Hybrid Project Management","summary":"Agile and hybrid project management, including Agile values/principles, Scrum/XP terms, product backlog, sprint flow, MVP, Kanban, Lean, servant leadership, and hybrid approaches.","notes":["Page 65 – Agile and Hybrid Project Management","Review of Agile processes and terms likely to appear on the PMP exam.","Need to be familiar with the entire Agile process and different Agile terms.","Chapter serves as an introduction to Agile project management and is more than sufficient for PMP exam questions.","Traditional (predictive) project management:","Goes through initiating, planning, executing, monitoring and controlling, and closing.","Has a strenuous change management approach.","Project manager generally in charge of the entire project.","Agile:","Represents iterative (flexible) project management.","Includes different Agile methods.","Agile framework:","Builds the product in increments versus as a whole.","Traditional projects generally build the product in its entirety in one long execution phase.","Agile projects build the product in small increments.","Customers provide feedback on each increment.","Allows more interaction with customers and more empowerment to the team.","Agile has become one of the most popular project management methods because of:","Frequent product delivery.","Customer interaction.","Value being realized throughout the project.","Agile is included on the current PMP exam.","Page 65 – What is Agile?","Agile is an umbrella term used to refer to different types of iterative development.","Agile methods include:","Scrum","Extreme Programming (XP)","Kanban","Lean development","Others","PMP exam will not go into these methodologies in detail.","Need to understand the Agile process and some terminology from these methodologies.","Agile techniques have been used for several decades in various forms.","In 2000, software developers created the manifesto for Agile software development.","The Agile manifesto outlines:","4 values","12 principles","No need to memorize the values or principles; a brief understanding is sufficient.","The four values are as follows:","Individuals and interactions over processes and tools","Working software over comprehensive documentation","Customer collaboration over contract negotiation","Responding to change over following a plan","Page 66 – Agile Manifesto Values (Explanation)","While they are valuable practices on the right, in Agile, we value things on the left more.","It is more important to have competent people working effectively in order to get the work done.","Projects are done by people, not by tools and processes.","Customers are more interested in working software, not comprehensive documentation.","While contracts are important, it will be more important to work with the customer to understand what they actually need on the project.","Need to be willing to accept changes and be willing to change the plan as the needs of the customer change.","Willingness to accept changes at any point throughout a project is one of the main differentiating factors between traditional projects and Agile projects.","Page 66 – The 12 Agile Principles","Customer satisfaction by early and continuous delivery of valuable software.","Welcome changing requirements, even late in development.","Deliver working software frequently (weeks rather than months).","Close, daily cooperation between business people and developers.","Projects are built around motivated individuals who should be trusted.","Face-to-face conversation is the best form of communication (co-location).","Working software is the primary measure of progress.","Sustainable development, able to maintain a constant pace.","Continuous attention to technical excellence and good design.","Simplicity—the art of maximizing the amount of work not done—is essential.","Best architectures, requirements, and designs emerge from self-organizing teams.","Regularly, the team reflects on how to become more effective, and adjusts accordingly.","Page 66 – Brief Explanation of the 12 Principles","Agile is about continuously delivering increments of a product over a span of time.","Traditional projects may take many months to a few years to deliver a working product.","Agile delivers increments of the product in a very short period of time.","The short period of time can be anywhere from a few weeks to a few months.","Fast delivery allows customers to realize the value of the product faster.","Allows the customer to fund the development of the product incrementally.","In a traditional project, value will not be realized until the entire project is done and the product is delivered to the customer.","A unique aspect of an Agile project is the ability to accept and welcome change throughout the entire development process.","Agile does not have a strenuous change management process that requires:","A formal change request.","Usage of a change management board.","Customers are able to submit changes throughout the entire Agile project.","Changes will be accepted and inputted into the product backlog, which may get completed.","Allows customers to feel more welcomed throughout the entire project.","Agile projects will not suppress change management like some traditional projects.","Agile is all about people collaboration.","It is important for Agile participants to consistently be in contact with each other.","This can be done using:","Daily standup meetings with team members.","Meetings with customers during iteration reviews to review the product.","Allows everyone to contribute and have a voice as the project is progressing.","Agile promotes face-to-face interaction.","Page 67 – Agile Principles (Continued)","Agile promotes face-to-face interaction as the best means of communication.","This means bringing together teams into one central location (co-location) for them to work together."],"examples":["Goes through initiating, planning, executing, monitoring and controlling, and closing.","Has a strenuous change management approach.","Project manager generally in charge of the entire project.","Agile:","Represents iterative (flexible) project management."],"podcast":[{"speaker":"Maya","text":"Welcome to Chapter 4: Agile and Hybrid Project Management. This chapter is about understanding Agile and hybrid project management the way the PMP exam wants you to think about it."},{"speaker":"Jordan","text":"Exactly. The big theme is value, collaboration, customer feedback, and using the right approach for the project."},{"speaker":"Maya","text":"Review of Agile processes and terms likely to appear on the PMP exam."},{"speaker":"Jordan","text":"Need to be familiar with the entire Agile process and different Agile terms."},{"speaker":"Maya","text":"Chapter serves as an introduction to Agile project management and is more than sufficient for PMP exam questions."},{"speaker":"Jordan","text":"Traditional (predictive) project management:"},{"speaker":"Maya","text":"Goes through initiating, planning, executing, monitoring and controlling, and closing."},{"speaker":"Jordan","text":"Has a strenuous change management approach."},{"speaker":"Maya","text":"Project manager generally in charge of the entire project."},{"speaker":"Jordan","text":"Agile:"},{"speaker":"Maya","text":"Represents iterative (flexible) project management."},{"speaker":"Jordan","text":"Includes different Agile methods."},{"speaker":"Maya","text":"Agile framework:"},{"speaker":"Jordan","text":"Builds the product in increments versus as a whole."},{"speaker":"Maya","text":"Traditional projects generally build the product in its entirety in one long execution phase."},{"speaker":"Jordan","text":"Agile projects build the product in small increments."},{"speaker":"Maya","text":"Customers provide feedback on each increment."},{"speaker":"Jordan","text":"Allows more interaction with customers and more empowerment to the team."},{"speaker":"Maya","text":"Agile has become one of the most popular project management methods because of:"},{"speaker":"Jordan","text":"Frequent product delivery."},{"speaker":"Maya","text":"For the exam, do not treat Agile as chaos. Agile still has structure, roles, events, and artifacts."},{"speaker":"Jordan","text":"Right. Think servant leadership, value delivery, feedback, sustainable pace, and empowered teams."}],"questions":[{"q":"What is Agile an umbrella term for?","options":["Different types of iterative development","Only Scrum","Only predictive project management","Only formal change control"],"answer":0,"why":"The notes define Agile as an umbrella term used to refer to different types of iterative development.","mindset":"Agile is broader than Scrum; Scrum is one Agile method.","chapterRef":"Chapter 4: What is Agile?","tags":["Agile","Concept"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound Agile-related, but they miss the exact Agile principle, role, artifact, or flow being tested."},{"q":"Which set lists Agile methods from the notes?","options":["Scrum, XP, Kanban, Lean development","PERT, CPM, EVM, RACI","FFP, CPIF, T&M, RFQ","Scope, schedule, cost, quality"],"answer":0,"why":"The notes list Scrum, Extreme Programming, Kanban, Lean development, and others as Agile methods.","mindset":"Do not treat Agile as one single method.","chapterRef":"Chapter 4: Agile Methods","tags":["Agile","Concept"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound Agile-related, but they miss the exact Agile principle, role, artifact, or flow being tested."},{"q":"Which Agile Manifesto value is listed in the notes?","options":["Individuals and interactions over processes and tools","Contracts over customer collaboration","Following a plan over responding to change","Documentation over working software"],"answer":0,"why":"One Agile value is individuals and interactions over processes and tools.","mindset":"The item on the left is valued more, though the item on the right still has value.","chapterRef":"Chapter 4: Agile Manifesto Values","tags":["Agile","Mindset"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound Agile-related, but they miss the exact Agile principle, role, artifact, or flow being tested."},{"q":"What is one main differentiating factor between traditional and Agile projects?","options":["Willingness to accept changes at any point throughout the project","Refusing customer feedback","Avoiding working software","Using no team collaboration"],"answer":0,"why":"The notes say willingness to accept changes at any point is a main differentiating factor.","mindset":"Agile welcomes change; predictive uses more formal change management.","chapterRef":"Chapter 4: Agile Manifesto Explanation","tags":["Agile","Change"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound Agile-related, but they miss the exact Agile principle, role, artifact, or flow being tested."},{"q":"What is the primary measure of progress in Agile according to the principles?","options":["Working software","Comprehensive documentation","A signed contract","A completed project charter"],"answer":0,"why":"One Agile principle says working software is the primary measure of progress.","mindset":"Customers value usable increments, not just percentage complete.","chapterRef":"Chapter 4: Agile Principles","tags":["Agile","Value"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound Agile-related, but they miss the exact Agile principle, role, artifact, or flow being tested."},{"q":"What does Agile promote as the best form of communication?","options":["Face-to-face conversation","Paper documentation","Email only","Formal reports only"],"answer":0,"why":"The Agile principles list face-to-face conversation as the best form of communication.","mindset":"Agile favors rich, high-touch communication.","chapterRef":"Chapter 4: Agile Principles","tags":["Agile","Communication"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound Agile-related, but they miss the exact Agile principle, role, artifact, or flow being tested."},{"q":"What is the Agile project manager’s role on the team?","options":["Facilitator/servant leader who removes impediments","Dictator who assigns all technical tasks","Functional manager controlling resources","Customer who prioritizes the backlog"],"answer":0,"why":"The Agile project manager acts more as a facilitator and servant leader who removes impediments.","mindset":"Agile teams are self-organizing; the PM supports rather than controls.","chapterRef":"Chapter 4: Agile Project Manager","tags":["Agile","Mindset"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound Agile-related, but they miss the exact Agile principle, role, artifact, or flow being tested."},{"q":"In Scrum, what is the work period called?","options":["Sprint","Phase gate","Control account","Portfolio"],"answer":0,"why":"In Scrum, the work being done is called a sprint.","mindset":"For exam purposes, Sprint = Iteration.","chapterRef":"Chapter 4: Agile Process Terms","tags":["Agile","Process"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound Agile-related, but they miss the exact Agile principle, role, artifact, or flow being tested."},{"q":"In XP, what is a sprint known as?","options":["Iteration","Portfolio","Deliverable","Baseline"],"answer":0,"why":"The notes state that in XP, the sprint is known as an iteration.","mindset":"Sprint and iteration are treated the same for exam purposes.","chapterRef":"Chapter 4: Scrum and XP","tags":["Agile","Exam Trap"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound Agile-related, but they miss the exact Agile principle, role, artifact, or flow being tested."},{"q":"Who represents the customer on an Agile project?","options":["Product Owner","Scrum Master","Functional Manager","PMO Director"],"answer":0,"why":"The product owner is the designated person who represents the customer.","mindset":"Product owner owns/prioritizes the product backlog.","chapterRef":"Chapter 4: Product Owner","tags":["Agile","Roles"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound Agile-related, but they miss the exact Agile principle, role, artifact, or flow being tested."},{"q":"Who prioritizes the product backlog?","options":["Product Owner","Agile project manager","Project team only","Senior management only"],"answer":0,"why":"The notes state only the product owner can prioritize the product backlog based on value.","mindset":"Backlog priority is based on value and owned by the product owner.","chapterRef":"Chapter 4: Product Backlog","tags":["Agile","Roles"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound Agile-related, but they miss the exact Agile principle, role, artifact, or flow being tested."},{"q":"What is the sprint backlog?","options":["Work the team selects to get done in the next sprint","All project requirements from customers","A list of all stakeholders","A formal change request log"],"answer":0,"why":"The sprint backlog is the work the team selects to complete in the next sprint.","mindset":"Product backlog = all requirements; sprint backlog = selected sprint work.","chapterRef":"Chapter 4: Sprint Backlog","tags":["Agile","Process"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound Agile-related, but they miss the exact Agile principle, role, artifact, or flow being tested."},{"q":"What is the purpose of the daily standup?","options":["A qu
