y completed, it must still be formally closed in this process.","Project Termination","If a project is terminated before completion, the project manager must still formally close the project.","Exam questions may state that a project was terminated before completion and ask what should be done next.","The answer is to follow the closing procedures.","All projects must be formally closed before moving on to the next phase or project.","If a project is closed and customers want to add new requirements, a new project may need to be started.","Agile and Hybrid Projects","On agile and hybrid projects, project closure is generally done when the work in the product backlog has been completed.","The team needs to:","Tie up loose ends.","Hand over the product to operations.","Ensure documents and tools are archived.","Organize documents for future use on other projects.","Ensure the product is correctly handed over to operations for maintenance.","Conduct a final retrospective focused on lessons learned from all sprints.","Then finally, celebrate.","Page 103 – Inputs","Project Charter","The project charter is created in the initiating section of the project.","It is used to authorize the project and the project manager.","The project manager may refer to the project charter to ensure that all components of its scope were accomplished in the project or phase.","Project Management Plan","Use the entire project management plan to close a project.","All 18 components are generally used to ensure the project is successfully closed down.","Project Documents","Most of the 33 project documents are generally used in this process to ensure the project is closed successfully.","Accepted Deliverables","Before a project or phase can be closed, the sponsor or customer must formally accept the deliverables.","Deliverables are formally accepted in the “validate scope” process, which is covered in the chapter “Scope Management.”","Page 104 – Inputs","Business Documents","The two main business documents that the PMBOK® Guide usually refers to are:","Business case","Benefits management plan","The project manager may want to look back at these two documents to ensure that the project will benefit the business and that it was cost-efficient.","Agreements","An agreement is usually a contract between a buyer and a seller for work.","It generally includes:","Work that needs to get done","Terms","Conditions","Pricing","Penalties","It is used in this process by the project manager to monitor the contractor’s work while the project is being executed.","More specifics about agreements are discussed in the procurement management chapter.","Procurement Documentation","Procurement documentation refers to the documents used to bid on a project, such as:","RFP","Procurement statement of work","Contract","Source selection criteria","The specifics of these documents are covered in the procurement management chapter.","In this process, the project manager collects these documents to be indexed and filed.","This is part of closing out a contract.","Organizational Process Assets","Covered in Chapter 3.","Page 104 – Tools and Techniques","Expert Judgment","Covered in Chapter 3.","Data Analysis","Covered in Chapter 3.","Meetings","Covered in Chapter 3.","Page 104 – Outputs","Final Product, Service, or Result Transition","This is the transition of the final output of the project or phase.","After a deliverable has been accepted by the customer or sponsor, it is given over to them in this output.","Example:","Handing over the keys of a newly painted room to the customer.","Another example:","Programmers handing over the completed application to system administrators to install on all company computers.","Final Report","The final report provides the overall performance of the project and is filed with the organization.","It gives a summary of what took place on the project and how successful the project was.","The final report should include:","High-level description of the project or phase.","The objectives (scope) of the project and whether they were accomplished.","The techniques that were used to measure the quality requirements and whether the requirements were met.","The budget of the project, how it was measured, and whether there were any variations.","Whether the project accomplished its real-world problems that it had set out to achieve and the benefits of this project to the organization.","Page 105 – Project Documents Updates","When a project or contract closes, many of the 33 project documents can be expected to get updated.","One document in particular is the lessons learned register.","The lessons learned register documents all of the lessons learned that were accumulated during the project or phase.","The lessons learned register is then passed on to the organization to be added to the lessons learned repository.","Page 105 – Organizational Process Assets Updates","Upon closing the project, the project manager updates many of the organizational process assets.","Organizational process assets that may be updated include:","Templates","Knowledge bases","Lessons learned","These updates help with future projects or phases."],"examples":["The project manager’s main job is to perform integration.","The business case and benefits management plan lead to the project charter, which leads to the project management plan.","Only an approved change request can change a plan once it has been approved.","Work performance data is raw information about the work that was performed.","On Agile projects, changes are generally added to the product backlog and re-prioritized by the product owner."],"podcast":[{"speaker":"Maya","text":"Welcome to Chapter 5: Integration Management. This chapter pulls together the other knowledge areas and shows how the project manager keeps the whole project connected."},{"speaker":"Jordan","text":"Exactly. The notes say the project manager’s main job is to perform integration, so think connection, coordination, and control across the full project."},{"speaker":"Maya","text":"The chapter starts with Develop Project Charter. The charter formally authorizes the project or phase and gives senior management approval to start."},{"speaker":"Jordan","text":"And once the charter is approved, the next step is to identify stakeholders and begin planning the project."},{"speaker":"Maya","text":"The business case explains why the business should do the project, and the benefits management plan describes the benefits the project should produce once completed."},{"speaker":"Jordan","text":"Those business documents feed the project charter, and the project charter leads into the project management plan."},{"speaker":"Maya","text":"For project selection, remember the basic direction: bigger BCR, IRR, PV, NPV, and ROI are better. Shorter payback period is better."},{"speaker":"Jordan","text":"Opportunity cost is what you give up when you choose one project over another."},{"speaker":"Maya","text":"Develop Project Management Plan creates the formal document that explains how the project will be executed, monitored and controlled, and closed."},{"speaker":"Jordan","text":"Once the plan is baselined, only an approved change request through perform integrated change control can update it."},{"speaker":"Maya","text":"The project management plan has management plans and baselines. The notes describe it as 18 parts: 4 baselines and 14 subsidiary plans."},{"speaker":"Jordan","text":"Direct and Manage Project Work is where the team performs the work defined in the plan and creates deliverables."},{"speaker":"Maya","text":"That process also produces work performance data, which is raw information about the work performed."},{"speaker":"Jordan","text":"Manage Project Knowledge focuses on using explicit and tacit knowledge for the benefit of the project and organization."},{"speaker":"Maya","text":"Explicit knowledge is tangible, like documents and manuals. Tacit knowledge is know-how gained by doing the work."},{"speaker":"Jordan","text":"Lessons learned are gathered throughout the project, not just at the end. They go into the lessons learned register."},{"speaker":"Maya","text":"Monitor and Control Project Work compares the work being done to the plan and produces work performance reports."},{"speaker":"Jordan","text":"Perform Integrated Change Control reviews change requests and approves or rejects them. On traditional projects, assess before action."},{"speaker":"Maya","text":"On agile projects, change is generally added to the product backlog and re-prioritized by the product owner."},{"speaker":"Jordan","text":"Close Project or Phase formally completes the project, phase, or contract, transfers the final output, captures lessons learned, and updates organizational process assets."}],"questions":[{"q":"What is Integration Management?","options":["The unification of all of the other knowledge areas","Only the creation of the schedule baseline","Only the process of closing contracts","Only the management of procurement documents"],"answer":0,"why":"The notes state that integration management is the unification of all of the other knowledge areas.","mindset":"Integration pulls the work together across knowledge areas.","chapterRef":"Chapter 5: Integration Management","tags":["Integration","Concept"],"examLike":true,"temptingWrong":"The tempting wrong answers sound project-related, but miss the integration focus from the notes."},{"q":"What is the project manager’s main job according to the notes?","options":["To perform integration","To write only the business case","To replace the sponsor","To approve every agile backlog item"],"answer":0,"why":"The notes directly state that the project manager’s main job is to perform integration.","mindset":"Think of the PM as the person connecting the whole project system.","chapterRef":"Chapter 5: Integration Management","tags":["Integration","PM Role"],"examLike":true,"temptingWrong":"The tempting wrong answers usually describe isolated tasks instead of integrating the whole project."},{"q":"What process formally authorizes the project or phase?","options":["Develop Project Charter","Develop Project Management Plan","Direct and Manage Project Work","Close Project or Phase"],"answer":0,"why":"Develop Project Charter creates the document that formally authorizes the project or phase.","mindset":"Charter = authorization.","chapterRef":"Chapter 5: Develop Project Charter","tags":["Initiating","ITTO"],"examLike":true,"temptingWrong":"The tempting wrong answers are real integration processes, but they occur after authorization."},{"q":"Who usually develops the project charter while working with the project manager?","options":["The project sponsor","The change control board","The product owner only","The project team only"],"answer":0,"why":"The notes state that the charter is usually developed by the project sponsor while working with the project manager.","mindset":"Sponsor authorizes; PM helps shape the project.","chapterRef":"Chapter 5: Project Charter","tags":["Initiating","Roles"],"examLike":true,"temptingWrong":"The tempting wrong answers confuse later project roles with charter authorization."},{"q":"After the project charter is approved, what is the next step listed in the notes?","options":["Identify stakeholders and begin planning the project","Immediately close the project","Execute approved change requests","Submit the final report"],"answer":0,"why":"Once the project charter is approved, the next step is to identify stakeholders and begin planning the project.","mindset":"Charter first, then stakeholders and planning.","chapterRef":"Chapter 5: Develop Project Charter","tags":["Sequence","Initiating"],"examLike":true,"temptingWrong":"The tempting wrong answers jump too far ahead in the project lifecycle."},{"q":"Which two main business documents are listed as inputs for the project charter?","options":["Business case and benefits management plan","Issue log and change log","Final report and procurement documentation","Scope baseline and cost baseline"],"answer":0,"why":"The notes list the business case and benefits management plan as the two main business documents.","mindset":"Business documents explain why the project should exist and what benefits it should create.","chapterRef":"Chapter 5: Business Documents","tags":["Initiating","ITTO"],"examLike":true,"temptingWrong":"The tempting wrong answers are project documents, but not the two business documents named here."},{"q":"What does a business case basically explain?","options":["Why a business should do the project","How to close the project team","Which change requests are approved","How the sprint backlog is prioritized"],"answer":0,"why":"The notes say a business case basically says why a business should do this project.","mindset":"Business case = project justification.","chapterRef":"Chapter 5: Business Case","tags":["Business","Initiating"],"examLike":true,"temptingWrong":"The tempting wrong answers describe other project activities, not business justification."},{"q":"For project selection, what does a larger Benefit-Cost Ratio mean?","options":["The better the project","The worse the project","The longer the payback period","The lower the benefit"],"answer":0,"why":"The notes state that the larger the BCR ratio, the better the project.","mindset":"BCR compares benefit to cost; bigger is better.","chapterRef":"Chapter 5: Project Selection Methods","tags":["Selection","Business"],"examLike":true,"temptingWrong":"The tempting wrong answers reverse the selection logic."},{"q":"What does opportunity cost represent?","options":["The value of what you choose not to do in order to do something else","The total budget approved by the sponsor","The amount already spent on a project","The cost baseline after approval"],"answer":0,"why":"The notes define opportunity cost as the value of what you choose not to do in order to do something else.","mindset":"Opportunity cost is what you give up.","chapterRef":"Chapter 5: Project Selection Methods","tags":["Selection","Business"],"examLike":true,"temptingWrong":"The tempting wrong answers sound financial, but they are not opportunity cost."},{"q":"What does the project benefits management plan describe?","options":["The main benefits the project will produce once completed","The list of all rejected change requests","The exact daily work instructions for the team","The final archive location only"],"answer":0,"why":"The notes state that the project benefits management plan describes the main benefits that the project will produce once completed.","mindset":"Benefits management connects the project output to business value.","chapterRef":"Chapter 5: Benefits Management Plan","tags":["Business","Benefits"],"examLike":true,"temptingWrong":"The tempting wrong answers confuse benefits with execution or closing artifacts."},{"q":"What happens to a project management plan once it is baselined?","options":["Only an approved change request can change it","It can be changed freely by the project manager","It is deleted and replaced by the issue log","It no longer applies to monitoring and controlling"],"answer":0,"why":"The notes state that once the plan is completed and baselined, only an approved change request through perform integrated change control can update it.","mindset":"Baseline means controlled changes only.","chapterRef":"Chapter 5: Develop Project Management Plan","tags":["Baseline","Change Control"],"examLike":true,"temptingWrong":"The tempting wrong answers ignore formal control after baseline approval."},{"q":"What does the project management plan describe?","options":["How the project is executed, monitored and controlled, and closed","Only who signs the contract","Only the project title and sponsor signature","Only the list of stakeholders"],"answer":0,"why":"The notes define the project management plan as describing how the project is executed, monitored and controlled, and closed.","mindset":"The plan explains how the project will be managed across the major process groups.","chapterRef":"Chapter 5: Project Management Plan","tags":["Planning","ITTO"],"examLike":true,"temptingWrong":"The tempting wrong answers describe narrower documents."},{"q":"How many parts does the project management plan have according to the notes?","options":["18 parts: 4 baselines and 14 subsidiary plans","10 parts: one for each knowledge area only","33 project documents","2 parts: business case and benefits management plan"],"answer":0,"why":"The notes state that the project management plan has 18 parts: 4 baselines and 14 subsidiary plans.","mindset":"Remember the app notes frame it as 18 total components.","chapterRef":"Chapter 5: Project Management Plan Components","tags":["Planning","Exam Tip"],"examLike":true,"temptingWrong":"The tempting wrong answers mix in other document counts or business documents."},{"q":"What does the change management plan outline?","options":["How change requests are collected, assessed, authorized, and incorporated","How final deliverables are accepted by the sponsor","How benefits are calculated before the charter","How project team members are released"],"answer":0,"why":"The notes say the change management plan outlines how change requests are collected, assessed, authorized, and incorporated into the project.","mindset":"Change management plan = how changes move through the system.","chapterRef":"Chapter 5: Change Management Plan","tags":["Change Control","Planning"],"examLike":true,"temptingWrong":"The tempting wrong answers describe scope validation, benefits, or closing."},{"q":"What is the performance measurement baseline used for?","options":["To check project performance as it is being executed","To authorize the project manager","To store all lessons learned only at the end","To select a seller contract type"],"answer":0,"why":"The notes state that the performance measurement baseline is used to check the performance of the project as it is being executed.","mindset":"Baseline = what to measure against.","chapterRef":"Chapter 5: Performance Measurement Baseline","tags":["Baseline","Monitoring"],"examLike":true,"temptingWrong":"The tempting wrong answers confuse baselines with other integration outputs."},{"q":"What is the main output of Direct and Manage Project Work?","options":["Deliverables","Final report","Business case","Approved change request"],"answer":0,"why":"The notes state that the most important output of this process is the deliverables.","mindset":"Executing the work creates deliverables.","chapterRef":"Chapter 5: Direct and Manage Project Work","tags":["Executing","ITTO"],"examLike":true,"temptingWrong":"The tempting wrong answers are valid items elsewhere, but not the main output here."},{"q":"What is work performance data?","options":["Raw information about the work that was performed","A final approved status report only","The project charter signature","A rejected change request"],"answer":0,"why":"The notes define work performance data as raw information about the work that was performed.","mindset":"Data is raw; information is analyzed; reports summarize status.","chapterRef":"Chapter 5: Work Performance Data","tags":["ITTO","Monitoring"],"examLike":true,"temptingWrong":"The tempting wrong answers confuse raw data with reports or unrelated documents."},{"q":"What is the lessons learned register?","options":["A living document where lessons learned are stored as the project is executed","A document created only after the final report is accepted","A list of approved vendors","A contract pricing attachment"],"answer":0,"why":"The notes say lessons learned are gathered throughout the project and stored in the lessons learned register as a living document.","mindset":"Lessons learned are not only an end-of-project activity.","chapterRef":"Chapter 5: Manage Project Knowledge","tags":["Knowledge","Executing"],"examLike":true,"temptingWrong":"The tempting wrong answers delay lessons learned or confuse it with procurement."},{"q":"In traditional project change control, what should happen before approving or denying a change?","options":["Assess the actual change and its impact","Immediately reject it","Immediately execute it","Archive the project documents first"],"answer":0,"why":"The notes say to first assess the change and determine how it impacts the overall project, and never approve or deny without assessment on a traditional project.","mindset":"Assess before action.","chapterRef":"Chapter 5: Perform Integrated Change Control","tags":["Change Control","Exam Tip"],"examLike":true,"temptingWrong":"The tempting wrong answers skip assessment."},{"q":"On an agile project, how are changes generally handled?","options":["They are added to the product backlog and re-prioritized by the product owner","They always go to a change control board first","They are always rejected after the charter","They require the final report before review"],"answer":0,"why":"The notes state that on Agile projects, changes are generally added to the product backlog and re-prioritized by the product owner.","mindset":"Agile welcomes change through backlog prioritization.","chapterRef":"Chapter 5: Agile and Hybrid Change Control","tags":["Agile","Change Control"],"examLike":true,"temptingWrong":"The tempting wrong answers apply traditional control too rigidly or ignore Agile flow."}]},{"id":6,"title":"Chapter 6: Project Scope Management","summary":"Scope management, product scope versus project scope, requirements, scope statement, WBS, scope baseline, validate scope, control scope, and agile scope concepts.","notes":["Page 115 – Project Scope Management","This knowledge area is very important, not just for your exam but also in actual real-life project management.","The scope is what the project will actually accomplish.","The scope should include the work required and only the work required to complete the project.","As a project manager, you should avoid doing extra work that is not in the scope baseline.","This is called “gold plating.”","Gold plating is not allowed in project management because it could increase risk, cost, schedule problems, and quality problems.","Product scope","Features and functions that characterize a product, service, or result.","The product scope is the requirements for the product.","Example: A Microsoft exchange server that allows you to send e-mails, receive e-mails, and synchronize contacts and calendars.","Does not tell you what the project is about; it tells you what the product can actually do.","Project scope","The work that is needed to deliver a product, service, or result with specified features and functions.","The project scope will actually tell you what the project is about.","Example: Installing a Microsoft exchange server and updating all user accounts and all user workstations.","Focuses on what the project is trying to accomplish versus what the product is trying to accomplish.","That is the main difference between the two.","Processes and Main Outputs","Plan Scope Management","Process Group: Planning","Main Output:","Scope Management Plan","Requirement Management Plan","Collect Requirements","Process Group: Planning","Main Output:","Requirement Documentation","Requirement Traceability Matrix","Define Scope","Process Group: Planning","Main Output:","Project Scope Statement","Create WBS","Process Group: Planning","Main Output:","Scope Baseline","Validate Scope","Process Group: Monitoring and Controlling","Main Output:","Accepted Deliverables","Work Performance Information","Control Scope","Process Group: Monitoring and Controlling","Main Output:","Change Request","Work Performance Information","Agile / Hybrid Projects","Expect the scope to change as the project evolves.","Agile tries to get work done as quickly as possible.","Agile plans and gathers requirements throughout the project.","Scope frequently changes as more of the product is understood.","Agile Scope Planning","The team will need to determine the number of iterations or sprints it will take to complete the project.","Two main types of planning:","Sprint planning","Release planning","Sprint Planning","The agile team determines what features will get done in what sprint.","Example:","First sprint may create 60% of the user interface.","Next sprint creates the remaining 40% of the user interface.","Page 116 – Project Scope Management","Release Planning","Determines what features will be released to the customers.","Generally includes multiple sprints.","Example:","A team that completed one sprint with just half of the user interface may not be able to push that to the customers.","It is only after two or three sprints that they will be able to release that particular feature to the customer.","Product Roadmap","Another important concept to know about an agile project.","The product roadmap is more of a high-level document that outlines what would be expected of the actual product itself.","The product roadmap will generally outline all of the different releases of the project.","Page 117 – Plan Scope Management","Plan Scope Management","Creates scope and requirement management plans.","These plans will document how the project will collect the requirements, as well as define, validate, and control the scope.","The project manager will document the steps needed to do the next 5 processes in this knowledge area.","This process involves outputs that are inputs to the project management plan.","The project management plan is an input to this process, but the output is an input to the project management plan.","These processes are iterations.","The project management plan is here as input even though it is not finished.","It could still be used to help create the scope and requirement management plans.","On agile or hybrid projects, this process could be done to help build the product backlog and to help determine the methods by which the product backlog could be populated by the product owner.","It can also outline that the product owner would prioritize the product backlog.","On a hybrid project, there is no right or wrong way to conduct the management of the product backlog since they incorporate both traditional and agile methods.","Inputs","Project Charter","Officially authorizes the project or phase to start.","Will have high-level requirements that may help to create the scope and requirement management plans.","Project Management Plan","The project management plan is an input, although it is not completed.","The plan may have other parts that will be helpful in creating the scope and requirements management plan.","Enterprise Environmental Factors","Covered in Chapter 3.","Organizational Process Assets","Covered in Chapter 3.","Tools and Techniques","Expert Judgment","Covered in Chapter 3.","Data Analysis","Covered in Chapter 3.","Meetings","Covered in Chapter 3.","Outputs","Scope Management Plan","Documents how you are going to write the scope statement.","Documents how you are going to baseline the scope.","Documents how you are going to control the scope.","Documents how you will get the scope accepted (validated).","This plan is part of the project management plan.","Requirements Management Plan","Shows the requirements to be collected, analyzed, documented, and managed.","This plan is part of the project management plan.","Page 118 – Plan Scope Management","Exam Tip","All management plans are “how tos.”","They all basically give the steps needed to manage that section of the project.","Example:","The scope management plan states how to manage the scope.","The cost management plan states how to manage the budget.","The quality management plan states how to manage the quality processes.","Exam Tip","An easy way to memorize a few of the outputs for the planning process is by looking at the process name to get the outputs.","Look at all the processes like “plan knowledge area management”; its output is the “knowledge area” management plan.","Example:","“Plan Scope Management”: output is the Scope management plan.","“Plan Schedule Management”: output is the schedule management plan.","In other words:","Put the word “Plan” at the start of the process.","Put the word “Plan” at the end for the output.","Page 119 – Collect Requirements","Collect Requirements","Process of defining and documenting stakeholders’ needs to meet the project objectives.","Very important at the beginning of the planning section of the project.","Process where you go out and interact with the stakeholders to gather the requirements they would like to see in the project.","Collecting requirements from stakeholders is vitally important to ensure the project is successful and actually meets the needs of the stakeholders.","If you do not gather the correct requirements from your stakeholders, you can end up making a product, service, or result that does not conform to the customer’s requirements.","Example:","If you plan to paint a room, you should gather what color paint the stakeholders would like to have and whether it should be semi-gloss, glossy, or flat.","The more detailed requirements, the more successful the project.","Collect requirements from the most important stakeholders: the customers that will actually use the project.","Often, project managers gather requirements from the boss of the customers, who do not actually use the product themselves.","To ensure greater success, gather requirements from all stakeholders, not just a certain few.","This will ensure that the project is successful.","On a traditional project, the project manager will try to conduct this process as thoroughly as possible the first time around and then build a large plan around all these requirements to get them done.","The project will be executed and, hopefully, there will be no more requirements when the project is executed.","On an agile project, this is vastly different.","Agile project customers will continue to give requirements to the project as they become more visible and known.","Since agile projects are mostly done with products that are undefined, requirements can be expected throughout the entire duration of the project.","Inputs","Project Charter","Covered in Chapter 5.","Project Management Plan","Covered in Chapter 3.","Project Documents","Covered in Chapter 3.","Business Documents","Usually include the business case and the benefits management plan.","The business case gives the cost-benefit of doing the project.","The benefits management plan shows what benefits the organization will get from the project.","Refer to the integration management chapter for more information on these two documents.","Agreements","A contract between a buyer and a seller for work to be performed or for the sale of products.","If the project has an agreement with a vendor, then it will have the cost included in it.","Enterprise Environmental Factors","Covered in Chapter 3.","Organizational Process Assets","Covered in Chapter 3.","Page 120 – Collect Requirements","Tools and Techniques","Expert Judgment","Covered in Chapter 3.","Data Gathering","One of the main things you will be doing in this process is to collect information from the stakeholders.","You can use any of the following methods to gather their requirements:","Brainstorming","A technique where stakeholders generate and gather many ideas.","Usually allows all stakeholders to document their ideas.","Interviews","Formal or informal discussions to discover information from stakeholders.","One of the easiest ways to gather requirements.","If you're looking to gather requirements from particular stakeholders, you should just speak to them and ask what their requirements are for this project.","Focus Groups","Subject matter experts and stakeholders gather to discuss their project expectations.","Very similar to an interview done with subject matter experts.","Questionnaires and Surveys","A set of questions that will allow the project manager to collect requirements from the stakeholders.","May change depending on who the stakeholders are.","Example:","Customer questionnaires might be very detail-oriented.","Senior management surveys might not be.","Benchmarking","Looking outside the project to provide a measurement of performance.","You can observe work within your organization or in other organizations.","Example:","Looking at industry best practices for how fast a website should load once a user visits it.","Data Analysis","After gathering the requirements from the stakeholders, use a method to analyze the data.","Can include analyzing:","Documents","Agreements","Policies","Proposals","Business plans","Decision Making","Covered in Chapter 3.","Data Representations","After gathering the data, you need a method to present the data to the stakeholders.","Idea/Mind Mapping","A technique where ideas are drawn instead of written.","May help to generate new ideas.","Affinity Diagram","Allows many ideas to be put into groups.","Interpersonal and Team Skills","Nominal Group Technique","How you rank and prioritize the ideas in brainstorming.","Delphi Technique","Requirements are collected anonymously from SME’s.","This way, stakeholders cannot influence each other.","Page 121 – Collect Requirements","Observations/Conversation","Observation, also known as job shadowing, involves viewing the stakeholders in their work environment.","Observation works very well because you can watch your stakeholders show you the problem that they have with the current system and what may need to be done to fix it.","Conversations simply involve talking directly with people to understand what the requirements would be on a project.","Facilitation","Facilitation is when you bring together stakeholders to gather requirements.","One method could be a workshop.","Facilitated workshops are interactive discussions designed to quickly define requirements, solve differences, and build trust.","Having a workshop with different stakeholders allows participants to see what differences they may have regarding the project requirements and how to solve them.","One example is a joint application development (JAD) session.","In a JAD session, subject matter experts and developers meet to improve the software development processes.","User Stories","One common tool used on an agile project to help facilitate and get users involved in the project is the creation of user stories.","User stories are descriptions of required functionality and are generally developed during the requirements workshop.","User stories are generally short and simple and follow this outline:","As a <role/user type>, I want so that <motivation/reason>.","Example:","As an accounts payable clerk, I want to be able to enter bills so that I can pay all my bills on time.","In this story, the user-type is a person in the accounts payable department, their goal is to enter the bills into an accounting software, so they can get paid on time.","User stories should be non-technical and easily understandable by users.","This will allow the team to understand the true value from a user’s perspective.","These stories are generally the smallest unit of work on an agile project.","Once the stories are clearly defined, you have to ensure that it is visible to the entire team, and the team has an understanding of what users are actually looking for in the agile project.","Prototypes","Prototypes are working models of a product that stakeholders can interact with.","This gives the stakeholders a great view of what the final product will be when the project is finished.","Stakeholders will give feedback on the product and how they might want to change it to better meet their requirements.","Many software development projects use prototypes to collect stakeholder requirements as the software is being programmed.","Agile development uses prototypes extensively.","Storyboarding","One prototyping technique used on agile projects.","Generally a series of images or illustrations that are used to show a mockup of what the program would look like once a user is using it.","Example:","First image shows what the screen would look like when they first log in.","Next image shows what it would look like when they click on the accounts receivable button.","Next image shows what the screen would look like when they click on enter invoice.","Storyboarding helps users visually see what the program will look like when it’s finished.","A great way to gather requirements from users and set their expectations for when the software is finished developing.","Context Diagrams","Used to visually show how a business process, other systems, and people interact.","Use drawings to show the inputs and outputs of a system.","Page 122 – Collect Requirements","Outputs","Requirements Documentation","Documentation of the actual requirements that are needed on the project.","Requirements documentation should be very detailed.","The more detailed the documentation, the more likely the project will meet the customer’s requirements.","It could be very high-level at the beginning, but it must become very detailed before the project can be executed.","Before the project plan is approved, the requirements should be measurable, testable, and acceptable to the stakeholders of the project.","In addition to the scope requirements for the project, other components may include:","Business requirements","Stakeholder requirements","Organizational impacts","Quality requirements","Requirements, assumptions and constraints","Legal or ethical compliance","Requirements Traceability Matrix","A table that is created to link the requirements back to their origin.","Basically tracks where the requirement suggestion came from.","Tracks which stakeholder gave the requirement.","Tracks why it was added to the actual project.","Helps keep track of the requirement as the project is carried out.","Page 123 – Define Scope","Define Scope","Process where you will create the project scope statement.","All the requirements from the requirements documentation will need to be analyzed and understood.","The scope statement will select the final requirements to become the final product, service, or results of the project or phase.","The scope of the project is iterative.","In the early planning of the project, the scope may be high-level and later may become more detailed.","You may discuss the scope with the main stakeholders, such as the sponsors or customers, to ensure the scope includes all their requirements.","Once a project scope has been baselined (in the next process, “create WBS”), you will need an approved change request to change it.","External events such as adding to scope because of a competitor offering a better product would require an approved change request.","On a traditional project, this process would be done multiple times to ensure the scope is well-defined before the work actually starts.","This may take many iterations of this process to actually define what the project will include and what it will not include.","Generally, on a traditional project, the execution of the work should not start until the scope has been well defined and agreed upon.","On agile and hybrid projects where much of the work is unknown and uncertain, this process may only be done once or twice before the work actually starts.","Once the work starts and customers are more involved and actually start to see the creation of the product, then the scope would become more refined.","The initial product backlog in an agile project may only contain a few items as the customers may not know what it is that they’re looking for on this particular product.","Once the work starts and the customer starts to actually use increments of the product, they will then refine the scope and come up with more detailed scope requirements.","Exam Tip","On a traditional project, the scope of the project is stored in the project scope statement.","On an agile project, the scope or requirements are stored in the product backlog.","Inputs","Project Charter","Officially authorizes the project.","Needed to ensure the project scope statement meets the requirements in the charter.","Project Management Plan","At this point, the project management plan will not be finished.","It should contain the scope management plan that will guide the project manager through this process of developing the project scope statement.","Project Documents","Although many of the 33 documents can be used in this process, the main ones should be:","Requirements documentation, which contains the requirements for the project.","Risk register to show what risks can affect the scope.","Enterprise Environmental Factors","Covered in Chapter 3.","Organizational Process Assets","Covered in Chapter 3.","Page 124 – Define Scope","Tools and Techniques","Expert Judgment","Covered in Chapter 3.","Data Analysis","Covered in Chapter 3.","Decision Making","Covered in Chapter 3.","Interpersonal and Team Skills","Covered in Chapter 3.","Product Analysis","If a project has a product as the deliverable, you will need to analyze the product to ensure it matches the requirements of the stakeholders.","Output","Project Scope Statement","One of the most important documents to be created in the planning processes.","Should include the project and the product scope.","Main purpose is to describe in detail the project deliverables and the work that will be required to produce those deliverables.","The greater the detail of the scope, the better the team will understand how to reach a successful project end state.","The less detail in the scope statement, the greater the chance of project risks, as well as the possibility of greater scope creep.","Details should include, but not be limited to:","Description of the product scope.","Detailed list of the deliverables.","Acceptance criteria:","That which must be done in order to have the deliverable accepted.","Exclusions:","Should state what the project will not get done or accomplished.","Example: If installing a phone system that will not include voice-to-email, this should be listed under exclusions.","Constraints:","If the project is limited by time or cost, it should be stated.","If a project has a preset budget, this may be listed as a constraint since the scope will be impacted by it.","Assumptions:","If the project team has any assumptions, these should also be stated.","Example: In an operating system upgrade project, the team may assume there is no need for hardware upgrades since all the hardware is one year old.","The project scope statement is a very detailed document.","The more detailed it is, the more likely you are to reach the successful completion of the project.","The project charter is a high-level document that was just used to authorize the project to get started.","The scope statement is a more specific and detailed project charter that will be used by the project team to execute the project.","Exam Tip","The scope statement tells you what the project will not be doing, not just what it will be doing.","At a minimum, all scope statements should have a detailed list of deliverables.","Project Documents Updates","Covered in Chapter 3.","Page 125 – Create WBS (Work Breakdown Structure)","Create WBS (Work Breakdown Structure)","Process of breaking down the deliverables into smaller, more manageable components (decomposition).","Main output of this process is the scope baseline.","The scope baseline includes:","Scope statement","WBS","WBS dictionary","Very important process for the creation of the project management plan.","It is where the work listed in the scope statement is broken down.","It will detail the work needed to complete the project deliverables.","The scope baseline is the main output.","Inputs","Project Management Plan","At this point, the project management plan will not be finished.","It should contain the scope management plan that will guide the project manager throughout this process of developing the scope baseline.","Project Documents","Although many of the 33 documents can be used in this process, the main ones should be:","Requirements documentation, which contains the requirements for the project.","Scope statement, which will have the deliverables of the project.","Enterprise Environmental Factors","Covered in Chapter 3.","Organizational Process Assets","Covered in Chapter 3.","Tools and Techniques","Decomposition","A technique in which you take the project deliverables from the scope statement and divide them into smaller parts, known as work packages.","Work packages are the lowest level on the WBS that will be used for estimating time and cost.","Since all projects are unique, the level of detail that needs to be broken down will depend on the project and the project team.","The project manager will need to decide how much detail will be needed to accurately estimate the cost, time, and resource assignments.","If the WBS is too high-level, the estimates may not be accurate.","Expert Judgment","Covered in Chapter 3.","Outputs","Scope Baseline","Main output of this process.","One of the three baselines and one of the main components in the project management plan.","Made up of three components:","Project scope statement","WBS","WBS dictionary","Page 126 – Create WBS (Work Breakdown Structure)","WBS","The WBS is the subdivided work that needs to get done to produce the project deliverables listed in the scope statement.","It provides a structure for the summation of cost, schedule, and resource information.","The WBS is hierarchical in design.","The top-level is very general and the lower level is very detailed.","The WBS will have control accounts that are broken down into work packages.","All control accounts have one or more work packages associated with them.","Complex projects may not be able to decompose all the deliverables at the start of the project.","The team might wait until the work is better understood, then decompose them.","This is known as rolling wave planning.","WBS Example Diagram","Project Name","Control Account","Work Package","Work Package","Work Package","Control Account","Work Package","Work Package","Work Package","Control Account","Work Package","Work Package","Work Package","Sample WBS illustrating control accounts and work packages.","Sample WBS by Phases – Phone System Upgrade","1.0 Phone System Upgrade","1.1 Collect Requirements","1.1.1 List All Stakeholders","1.1.2 Interview Stakeholders","1.1.3 Create Requirements Documentation","1.2 Select Phone System","1.2.1 Research Available Systems","1.2.2 Demo Systems","1.2.3 Purchase System","1.3 Install System","1.3.1 Configure Server Software","1.3.2 Configure Network Components","1.3.3 Install New Phones on Desk","1.3.4 Configure Individual Phones","1.4 Test System","1.4.1 Test Server Configurations","1.4.2 Test Network Configurations","1.4.3 Test Individual Phones","1.4.4 User Acceptance Testing","1.5 Train Users","1.5.1 Create Training Course Material","1.5.2 Conduct Training Sessions","Sample WBS by phases upgrading a phone system for a company.","Page 127 – Create WBS (Work Breakdown Structure)","WBS Dictionary","The WBS Dictionary is a document that has more details about each work package in the WBS.","It supports the WBS.","Information in the WBS dictionary includes:","A more detailed description of the work","Scheduling","Cost estimates","Assumptions","Constraints","Acceptance criteria","WBS Dictionary Example","Project Name: Phone System Upgrade","Work Package ID","1.3.1","Work Package Name","Configure Server Software","Work Package Description","Install a new virtual server.","Install the phone server software.","Configure the software to support 100 phones and voice mail to email.","Ensure all updates are applied to the operating system before installing the phone system software.","Assigned To","Bob Peterson","Duration","5 Days","Date Assigned","12/30/2017","Due Date","1/30/2018","Estimated Cost","$5,000","Account Code","PSU-882.3","Project Scope Statement","The scope is a detailed list of the project deliverables.","Exam Tip","The scope baseline includes the scope statement, WBS, and WBS dictionary.","After the project plan is approved and the project is executed, any changes to the scope baseline will need a change request.","Work that was not within the scope of the project charter should not be approved.","Project Documents Updates","Covered in Chapter 3.","Agile Work Decomposition","On an agile project, it is important to understand how work is decomposed.","Agile projects use the concepts of:","Epics","Features","Stories","The epic is decomposed into features.","Features are decomposed into user stories.","Epic → Feature → Story → Task","Epics","Generally large initiatives to deliver new products or solutions to the customer.","Generally made up of a large collection of different features and a span of multiple releases.","Example:","An epic may be to create an entire accounting system for an organization.","Different features of this epic may be in the Accounts Payable section, accounts receivable section, and payroll.","User stories will be a decomposition of the features.","Example user story:","As an accounts receivable personnel, I would like to input invoices, so we can receive payments on time.","Page 128 – Create WBS (Work Breakdown Structure)","Agile Decomposition Example","Epic","Create Accounting System","Features","Accounts Receivable","Payroll","Stories","Enter Invoice","Create Sales","Create Paychecks","Tasks","Tasks are the decomposition of user stories.","Example tasks:","Enter the customer’s name into the accounting system.","Create an invoice.","Send the invoice.","Definition of Done","A shared understanding of what it means when work is considered finished between the customers and the project team.","The team agrees on and displays a list of criteria that must be met before a product increment is considered done.","Failure to meet these criteria at the end of a sprint normally implies that the work should not be counted toward that sprint’s velocity.","Breaking down the work from an epic to a task will allow both the team and product owner to define what done means.","Generally, this will be tested once the iteration is over, and the customer reviews it.","Page 129 – Validate Scope","Validate Scope","Process where the project deliverables are formally inspected and accepted by the customer or sponsor.","The customer or sponsor actually inspects the deliverable to see if it meets their requirements.","If it does, then you will get the main output of the accepted deliverable.","If the customer finds that it doesn’t meet their requirements, then you will need to repair it (change request).","This process is done at the very end of all the executing and monitoring and controlling processes.","After completing the executing and monitoring and controlling processes, you will have a deliverable.","After the customer or sponsor has accepted the deliverables, then the project can be formally closed in the “close project or phase” process.","The output of this process, the accepted deliverable, is the input to the “close project or phase” process.","This process is done immediately after “control quality,” or sometimes they can be done together.","“Control quality” is the process where the deliverable is inspected to see if it meets the quality requirements.","Before taking a deliverable to a customer or sponsor for formal acceptance, the project manager should have inspected the deliverable to ensure it meets the quality requirements.","Quality requirements ensure the deliverable is correct and need to be checked before they can be formally accepted.","Example:","Ensure that the painted room has been painted correctly before calling in the sponsor to formally accept the job.","The output of “control quality,” a verified deliverable, is the input to this process.","You will generally perform the “control quality” process, then the “validate scope” process.","In some projects, both processes can be done at the same time.","Inputs","Project Management Plan","Consists of the scope baseline and the scope management plan.","These documents will tell the project manager and the team the steps needed to get the scope validated.","Project Documents","Although the project manager can use any of the 33 project documents to get the deliverable accepted, they’re most likely to use:","Requirements traceability matrix","Requirements documentation","Lessons learned register","Quality reports","Verified Deliverables","Output of the control quality process.","A deliverable that has been inspected to ensure that quality requirements have been met.","Work Performance Data","The raw information of the work that was done to create the project deliverables.","Tools and Techniques","Inspection","Main tool of this process.","The customer or sponsor will need to measure, examine, and validate that the deliverable meets his/her requirements.","Can include:","Walk-throughs","Audits","Visual inspection","Example:","Inspecting a painted room.","Page 130 – Validate Scope","Tools and Techniques","Decision Making","Covered in Chapter 3.","Outputs","Accepted Deliverables","Deliverables that have met the acceptance criteria and have been formally signed off by the customer or sponsor.","Once you have the accepted deliverable, you are ready to formally close the project or phase.","This output of accepted deliverable will become the input to the integration process of “close project or phase.”","Change Requests","If the deliverable does not meet the acceptance criteria and cannot be accepted, you may need to spend more time and money to fix it.","This will lead to a change request where the defect will need to be repaired.","Example:","If you painted the room with the wrong shade of green paint, you would need additional time and money to repair it correctly.","Work Performance Information","Gives the status of the deliverables.","States its progress, such as if it was accepted or needs to be fixed.","Project Documents Updates","Covered in Chapter 3.","Page 131 – Control Scope","Control Scope","Goal is to ensure that the project stays on the scope as it is executed.","Basically “controlling” the scope.","Ensure that the work the project team is doing is actually within the scope of the project.","The project manager will need to monitor the scope to ensure that unapproved changes are not added to the scope.","Unapproved expansion of the scope is known as scope creep.","Process where you’re looking at the actual work getting done in comparison to the project plan.","The project manager determines if there are any changes to the scope made during the work progress.","If the project manager detects a modified scope, he/she will need to get a change request to bring the project back on plan.","Do not confuse this process with “validate scope.”","Validate scope is where you get the project deliverables formally accepted.","Validate scope is done at the end of the project, after the deliverable has been made.","Control scope is done on a daily basis to ensure the project stays within the scope.","In other words:","“Validate scope” is done at the end when the deliverable is finished.","“Control scope” is done every single day the project is being executed to ensure the project stays within the scope.","On a traditional project, it is important to control the scope to ensure there are no unauthorized changes or modifications to the scope as the work is getting done.","It’s not uncommon for the project manager on a traditional project to discover team members doing work that is outside of the project scope.","When this happens, the project manager would either:","Submit a change request to the change control board in order to add that additional work in.","Tell the team members not to do it and stop that particular unauthorized change.","On agile and hybrid projects, changes are welcome and are less controlled by the scope.","Any time a customer wants to add a feature or make a scope change to the project, it is welcomed and added to the product backlog, where it will be prioritized by the product owner.","Exam Tip","On a traditional project, any changes to the scope must go through the perform integrated change control process, where this change must be reviewed and authorized.","On an agile or hybrid project, any changes to the features of the product would just be added to the product backlog and be prioritized by the product owner.","Inputs","Project Management Plan","Includes the scope baseline and the scope management plan.","The plan will tell us how to control the scope as the project progresses.","The scope baseline will outline what to look for as the work is getting done.","Other plans that may be needed to control the scope may include:","Change management plan","Configuration management plan","Requirements management plan","Project Documents","Although the project manager can use any of the 33 project documents to control the scope, they’re most likely to use:","Requirements traceability matrix","Requirements documentation","Lessons learned register","Quality reports","Page 132 – Control Scope","Inputs","Work Performance Data","A very important input to this process since this will document the actual work that is getting done.","This is the raw information of the work that was done on the deliverable.","Compared with the scope baseline in the project management plan to see if the project is within the scope.","Organizational Process Assets","Covered in Chapter 3.","Tools and Techniques","Data Analysis","As the project is progressing and the project manager is monitoring the scope, he/she will need a method to analyze the data.","Two methods are:","Variance analysis","Trend analysis","Variance Analysis","Determines if there is a variance between the planned work (project management plan) and the actual work (work performance data).","The project manager will need to ensure that there is no variance on the project that is related to scope.","If there is a variance between planned and actual work, the project manager might need a change request to fix the project scope.","Trend Analysis","Used to determine if a trend is emerging as the project progresses.","Example:","Is the project regularly staying within the scope, or is it frequently going beyond the scope?","The project manager will need to analyze the trend in order to assess what is happening in terms of scope.","Outputs","Work Performance Information","States the difference between the planned work of scope and the actual work on the project.","This is the status of the scope of the project.","Basically, it will state if the project is on scope or not.","Change Requests","If the project is off the scope, the project manager may need to get a change request.","The change request can include the corrective or preventive actions needed to bring the project back on scope.","Project Management Plan Updates","Covered in Chapter 3.","Project Documents Updates","Covered in Chapter 3.","Organizational Process Assets Updates","Covered in Chapter 3.","Exam Tip","All of the monitoring and controlling processes (starting with “validate scope”) on the process table have the project management plan and work performance data as inputs.","They then have an output of work performance information and change requests.","To control a project:","Look at the planned work (project management plan) and the actual work (work performance data).","Compare them to see if they match up.","This creates the work performance information.","The output of all these processes will be:","Work performance information (status of the work)","Change requests","Change requests are needed in case there’s something wrong with that section of the project.","These would be addressed by implementing corrective or preventive actions, if necessary, to bring the project back on track."],"examples":["Example: A Microsoft exchange server that allows you to send e-mails, receive e-mails, and synchronize contacts and calendars.","Example: Installing a Microsoft exchange server and updating all user accounts and all user workstations.","Example:","Example:","Example:","Example:","Example:","Example:"],"podcast":[{"speaker":"Maya","text":"Welcome to Chapter 6: Project Scope Management. This chapter focuses on what the project will accomplish and how to protect the project from work outside the scope."},{"speaker":"Jordan","text":"Right. The notes make the distinction between product scope and project scope. Product scope is the features and functions, while project scope is the work needed to deliver them."},{"speaker":"Maya","text":"A big warning in this chapter is gold plating. That is extra work that is not in the scope baseline, and it is not allowed because it can increase risk, cost, schedule problems, and quality problems."},{"speaker":"Jordan","text":"The planning processes include Plan Scope Management, Collect Requirements, Define Scope, and Create WBS."},{"speaker":"Maya","text":"Plan Scope Management creates the scope management plan and requirements management plan. These are how-to plans for managing scope and requirements."},{"speaker":"Jordan","text":"Collect Requirements is where stakeholders needs are defined and documented to meet project objectives."},{"speaker":"Maya","text":"The outputs are requirements documentation and the requirements traceability matrix, which links requirements back to their origin."},{"speaker":"Jordan","text":"Define Scope creates the project scope statement. The notes say this is one of the most important planning documents and should include both project and product scope."},{"speaker":"Maya","text":"The scope statement includes deliverables, acceptance criteria, exclusions, constraints, and assumptions."},{"speaker":"Jordan","text":"Create WBS breaks down deliverables into smaller work packages. Its main output is the scope baseline."},{"speaker":"Maya","text":"The scope baseline includes the project scope statement, WBS, and WBS dictionary."},{"speaker":"Jordan","text":"The WBS dictionary supports the WBS with details about each work package, including description, schedule, cost estimates, assumptions, constraints, and acceptance criteria."},{"speaker":"Maya","text":"On agile projects, work is decomposed from epic to feature to story to task."},{"speaker":"Jordan","text":"Definition of Done is a shared understanding of what it means when work is finished between the customer and project team."},{"speaker":"Maya","text":"Validate Scope is where deliverables are formally inspected and accepted by the customer or sponsor."},{"speaker":"Jordan","text":"Control Quality usually happens before Validate Scope because the deliverable should be checked for quality before formal acceptance."},{"speaker":"Maya","text":"Control Scope is different. It is done on a daily basis to make sure the project stays within scope."},{"speaker":"Jordan","text":"Unapproved expansion of scope is scope creep. On traditional projects, scope changes must go through integrated change control."},{"speaker":"Maya","text":"On agile or hybrid projects, feature changes are added to the product backlog and prioritized by the product owner."},{"speaker":"Jordan","text":"The key exam trap is Validate Scope versus Control Scope: validate is formal acceptance at the end; control is daily monitoring to stay on scope."}],"questions":[{"q":"What is project scope?","options":["The work needed to deliver a product, service, or result with specified features and functions","The features and functions that characterize a product","Extra work added to improve the final product","A list of stakeholder names"],"answer":0,"why":"Project scope is the work needed to deliver a product, service, or result with specified features and functions.","mindset":"Project scope = the work.","chapterRef":"Chapter 6: Project Scope","tags":["Concept","Scope"],"examLike":true,"temptingWrong":"Product scope sounds close, but it is about features and functions, not the project work."},{"q":"What is product scope?","options":["Features and functions that characterize a product, service, or result","The work required to deliver the product","The WBS dictionary","The change request process"],"answer":0,"why":"Product scope is the features and functions that characterize a product, service, or result.","mindset":"Product scope = what the product can do.","chapterRef":"Chapter 6: Product Scope","tags":["Concept","Scope"],"examLike":true,"temptingWrong":"The tempting wrong answer confuses product scope with project scope."},{"q":"What is gold plating?","options":["Doing extra work that is not in the scope baseline","Adding approved scope through change control","Breaking deliverables into work packages","Formally accepting deliverables"],"answer":0,"why":"Gold plating is extra work that is not in the scope baseline and is not allowed.","mindset":"Do not add extras outside the baseline.","chapterRef":"Chapter 6: Gold Plating","tags":["Exam Trap","Scope"],"examLike":true,"temptingWrong":"Extra work may sound helpful, but the notes say it can increase risk, cost, schedule, and quality problems."},{"q":"What are the main outputs of Plan Scope Management?","options":["Scope Management Plan and Requirements Management Plan","Project Charter and Assumption Log","Accepted Deliverables and Work Performance Information","Scope Baseline and Change Requests"],"answer":0,"why":"Plan Scope Management creates the scope management plan and requirements management plan.","mindset":"Plan Scope Management creates the how-to plans.","chapterRef":"Chapter 6: Plan Scope Management","tags":["ITTO","Planning"],"examLike":true,"temptingWrong":"Scope Baseline belongs to Create WBS, not Plan Scope Management."},{"q":"What does the scope management plan document?","options":["How to write, baseline, control, and validate the scope","How to calculate ROI","How to close contracts","How to estimate activity duration only"],"answer":0,"why":"The scope management plan documents how to write the scope statement, baseline scope, control scope, and get scope accepted.","mindset":"Management plans are how-to documents.","chapterRef":"Chapter 6: Scope Management Plan","tags":["Concept","Planning"],"examLike":true,"temptingWrong":"Management plans describe how to manage that section of the project."},{"q":"What is the purpose of Collect Requirements?","options":["Defining and documenting stakeholders needs to meet project objectives","Formally accepting final deliverables","Approving all change requests","Creating the final report"],"answer":0,"why":"Collect Requirements defines and documents stakeholders needs to meet the project objectives.","mindset":"Requirements come from stakeholder needs.","chapterRef":"Chapter 6: Collect Requirements","tags":["Concept","Planning"],"examLike":true,"temptingWrong":"Formal acceptance happens in Validate Scope, not Collect Requirements."},{"q":"What are the main outputs of Collect Requirements?","options":["Requirements Documentation and Requirements Traceability Matrix","Project Scope Statement and WBS","Scope Baseline and WBS Dictionary","Accepted Deliverables and Change Requests"],"answer":0,"why":"The outputs are requirements documentation and the requirements traceability matrix.","mindset":"Collect requirements creates the requirement records.","chapterRef":"Chapter 6: Collect Requirements Outputs","tags":["ITTO"],"examLike":true,"temptingWrong":"Scope statement comes later in Define Scope."},{"q":"What does the Requirements Traceability Matrix do?","options":["Links requirements back to their origin","Approves the project charter","Stores the final report","Breaks deliverables into work packages"],"answer":0,"why":"The matrix links requirements back to their origin and tracks where each requirement came from.","mindset":"Traceability = requirement origin and tracking.","chapterRef":"Chapter 6: Requirements Traceability Matrix","tags":["Concept","Planning"],"examLike":true,"temptingWrong":"Breaking deliverables into work packages is part of Create WBS."},{"q":"On a traditional project, where is the scope of the project stored?","options":["Project Scope Statement","Product Backlog","Issue Log","Final Report"],"answer":0,"why":"The notes say on a traditional project, the scope is stored in the project scope statement.","mindset":"Traditional scope lives in the scope statement.","chapterRef":"Chapter 6: Define Scope Exam Tip","tags":["Exam Tip","Scope"],"examLike":true,"temptingWrong":"On agile projects, scope or requirements are stored in the product backlog."},{"q":"On an agile project, where are scope or requirements stored?","options":["Product Backlog","Project Charter only","Final Report","Procurement Documentation"],"answer":0,"why":"The notes say on an agile project, scope or requirements are stored in the product backlog.","mindset":"Agile scope lives in the backlog.","chapterRef":"Chapter 6: Define Scope Exam Tip","tags":["Agile","Exam Tip"],"examLike":true,"temptingWrong":"The project charter is high-level authorization, not the agile requirements store."},{"q":"What is the main output of Define Scope?","options":["Project Scope Statement","Scope Baseline","Accepted Deliverables","Work Performance Data"],"answer":0,"why":"Define Scope creates the project scope statement.","mindset":"Define Scope = scope statement.","chapterRef":"Chapter 6: Define Scope","tags":["ITTO"],"examLike":true,"temptingWrong":"Scope Baseline is created in Create WBS."},{"q":"What should the project scope statement include?","options":["Deliverables, acceptance criteria, exclusions, constraints, and assumptions","Only the project manager name","Only the final report","Only the issue log"],"answer":0,"why":"The notes list deliverables, acceptance criteria, exclusions, constraints, and assumptions as details in the project scope statement.","mindset":"The scope statement includes what is included and excluded.","chapterRef":"Chapter 6: Project Scope Statement","tags":["Concept","Scope"],"examLike":true,"temptingWrong":"The scope statement tells what the project will not do, not just what it will do."},{"q":"What is the main output of Create WBS?","options":["Scope Baseline","Requirements Documentation","Accepted Deliverables","Work Performance Reports"],"answer":0,"why":"The main output of Create WBS is the scope baseline.","mindset":"Create WBS = scope baseline.","chapterRef":"Chapter 6: Create WBS","tags":["ITTO","Planning"],"examLike":true,"temptingWrong":"Accepted deliverables are an output of Validate Scope."},{"q":"What are the three components of the scope baseline?","options":["Project scope statement, WBS, and WBS dictionary","Scope management plan, cost baseline, and schedule baseline","Product backlog, sprint backlog, and final report","Issue log, risk register, and lessons learned register"],"answer":0,"why":"The scope baseline includes the project scope statement, WBS, and WBS dictionary.","mindset":"Scope baseline = statement + WBS + dictionary.","chapterRef":"Chapter 6: Scope Baseline","tags":["Exam Tip","Scope"],"examLike":true,"temptingWrong":"Management plans are not the same as baselines."},{"q":"What is decomposition in Create WBS?","options":["Dividing project deliverables into smaller work packages","Accepting deliverables from the customer","Approving change requests","Surveying stakeholders anonymously"],"answer":0,"why":"Decomposition divides project deliverables into smaller parts known as work packages.","mindset":"Decomposition breaks work down.","chapterRef":"Chapter 6: Decomposition","tags":["Concept","WBS"],"examLike":true,"temptingWrong":"Customer acceptance is Validate Scope."},{"q":"What is a work package?","options":["The lowest level on the WBS used for estimating time and cost","A high-level business case","A stakeholder survey","An approved change request"],"answer":0,"why":"Work packages are the lowest level on the WBS used for estimating time and cost.","mindset":"Work package = lowest WBS level.","chapterRef":"Chapter 6: Work Package","tags":["Concept","WBS"],"examLike":true,"temptingWrong":"The business case justifies why the project should be done."},{"q":"What is agile work decomposition shown in the notes?","options":["Epic → Feature → Story → Task","Task → Story → Feature → Epic","Scope Statement → Charter → Final Report","Risk → Issue → Change → Baseline"],"answer":0,"why":"The notes show agile work decomposition as Epic → Feature → Story → Task.","mindset":"Agile breaks large work into smaller items.","chapterRef":"Chapter 6: Agile Work Decomposition","tags":["Agile","Concept"],"examLike":true,"temptingWrong":"The reverse order is a common trap."},{"q":"What is Definition of Done?","options":["A shared understanding of what it means when work is considered finished","A list of project risks","A contract closeout form","A method for calculating cost variance"],"answer":0,"why":"Definition of Done is a shared understanding of what it means when work is considered finished between customers and the project team.","mindset":"Done must mean the same thing to the team and customer.","chapterRef":"Chapter 6: Definition of Done","tags":["Agile","Concept"],"examLike":true,"temptingWrong":"Definition of Done is not a cost or risk tool."},{"q":"What is the purpose of Validate Scope?","options":["Formal inspection and acceptance of deliverables by the customer or sponsor","Daily monitoring to keep scope on plan","Creating the WBS dictionary","Gathering stakeholder requirements"],"answer":0,"why":"Validate Scope is where deliverables are formally inspected and accepted by the customer or sponsor.","mindset":"Validate = formal acceptance.","chapterRef":"Chapter 6: Validate Scope","tags":["Exam Trap","Scope"],"examLike":true,"temptingWrong":"Daily monitoring belongs to Control Scope."},{"q":"What is the purpose of Control Scope?","options":["Ensuring the project stays within scope as it is executed","Formally accepting completed deliverables","Creating the project charter","Closing the project phase"],"answer":0,"why":"Control Scope ensures the project stays on scope as it is executed.","mindset":"Control = daily scope monitoring.","chapterRef":"Chapter 6: Control Scope","tags":["Exam Trap","Scope"],"examLike":true,"temptingWrong":"Formal acceptance is Validate Scope."}]},{"id":7,"title":"Chapter 7: Schedule Management","summary":"Schedule management focuses on creating the schedule baseline, building the project schedule, and controlling schedule performance.","notes":["Schedule management includes creating the schedule baseline, building the project schedule, and keeping the project on schedule.","The six schedule management processes are Plan Schedule Management, Define Activities, Sequence Activities, Estimate Activity Durations, Develop Schedule, and Control Schedule.","Critical Path Method is a guaranteed exam topic and uses a network diagram, forward pass, and backward pass.","Critical path is the longest path through the network diagram and determines project duration.","Activities on the critical path have no float.","Crashing adds resources, increases cost, and may increase risk.","Fast-tracking performs activities in parallel, reduces time, and increases risk.","Agile scheduling uses iterations, release plans, iteration plans, velocity, burn charts, lead time, cycle time, and WIP."],"examples":["If Activity B cannot start until Activity A finishes, that is Finish-to-Start.","If an activity on the critical path slips by two days, the project completion date slips by two days unless corrective action is taken.","If a project needs to finish sooner and the team adds resources, that is crashing.","If two activities are performed at the same time to shorten the schedule, that is fast-tracking."],"podcast":[{"speaker":"Host 1","text":"Let’s go deeper into Chapter 7, Schedule Management. This chapter is one of those PMP chapters where you cannot just memorize a few words and hope for the best. You need to understand the flow of how a schedule is built, how it is protected, and how the project manager reacts when the schedule starts slipping."},{"speaker":"Host 2","text":"Exactly. The big purpose of schedule management is timely project completion. That sounds simple, but underneath that are processes, dependencies, duration estimates, baselines, compression techniques, agile scheduling, and critical path math."},{"speaker":"Host 1","text":"So let’s anchor the chapter first. The project manager needs to create a schedule baseline, build the project schedule, and then ensure the project stays on schedule. That means the schedule is not just a calendar. It is a performance baseline."},{"speaker":"Host 2","text":"And the exam loves that distinction. A schedule baseline is the approved version of the schedule. Once approved, you do not casually change it. If a schedule change impacts the baseline, it needs to go through formal change control."},{"speaker":"Host 1","text":"The six schedule management processes are Plan Schedule Management, Define Activities, Sequence Activities, Estimate Activity Durations, Develop Schedule, and Control Schedule."},{"speaker":"Host 2","text":"Think of that as a natural build. First decide how scheduling will be managed. Then break the work into activities. Then put those activities in order. Then estimate how long they take. Then develop the full schedule. Then monitor and control the schedule during execution."},{"speaker":"Host 1","text":"Plan Schedule Management creates the schedule management plan. This plan explains how the next schedule processes will be performed. It also says how the schedule will be measured and how variances from the schedule baseline will be handled."},{"speaker":"Host 2","text":"A PMP mindset point here is that the project manager should not just wing it. PMI wants a defined approach. Before managing the schedule, the team needs to know how schedule work will be planned, estimated, developed, and controlled."},{"speaker":"Host 1","text":"Next is Define Activities. This process takes work packages from the WBS and breaks them into activities. Activities are the actual scheduled work needed to create deliverables."},{"speaker":"Host 2","text":"That means activities are more detailed than work packages. A work package can contain multiple activities. The activity list becomes a major output and is later used for estimating duration and cost."},{"speaker":"Host 1","text":"Rolling wave planning is important here. Near-term work is decomposed now. Future work is decomposed later when more details are known."},{"speaker":"Host 2","text":"That connects to progressive elaboration. PMI understands that not everything is known upfront. So the project manager plans near-term work in detail and waits to decompose future work until there is enough information."},{"speaker":"Host 1","text":"Then Sequence Activities puts the activities in the order they will be performed. The main output is the project schedule network diagram."},{"speaker":"Host 2","text":"The network diagram shows the sequence of activities and their dependencies. The exam expects you to understand predecessor and successor activities, activity-on-node diagrams, and the four relationship types."},{"speaker":"Host 1","text":"Finish-to-Start is the most common. Activity A must finish before Activity B starts. Example: you must finish installing memory before installing the operating system."},{"speaker":"Host 2","text":"Finish-to-Finish means activities must finish at the same time, but they do not need to start at the same time. Start-to-Start means one activity must start before another can start. Start-to-Finish is rare and means the successor cannot finish until the predecessor starts."},{"speaker":"Host 1","text":"Dependency types matter too. Mandatory dependencies are hard logic. They must
