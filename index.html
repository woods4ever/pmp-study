ick daily meeting to discuss status and impediments","A two-hour lessons learned meeting","A contract negotiation meeting","A formal change control board"],"answer":0,"why":"The daily standup is a quick daily meeting, usually 15 minutes, where team members discuss status and impediments.","mindset":"Standups surface work progress and blockers quickly.","chapterRef":"Chapter 4: Daily Standup","tags":["Agile","Communication"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound Agile-related, but they miss the exact Agile principle, role, artifact, or flow being tested."},{"q":"Which question is asked in a daily standup?","options":["What impediments or roadblocks are you facing?","What is the final project budget?","Should the contract be closed?","What is the project charter authority level?"],"answer":0,"why":"The notes list impediments/roadblocks as one of the three standup questions.","mindset":"Standups focus on progress, next work, and impediments.","chapterRef":"Chapter 4: Daily Standup Questions","tags":["Agile","Exam Trap"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound Agile-related, but they miss the exact Agile principle, role, artifact, or flow being tested."},{"q":"What is a sprint review?","options":["Customer inspection at the end of the sprint","Team-only meeting to discuss lessons learned","A formal procurement audit","A schedule compression technique"],"answer":0,"why":"The sprint review is an inspection done at the end of the sprint by customers.","mindset":"Sprint review gathers customer feedback on completed work.","chapterRef":"Chapter 4: Sprint Review","tags":["Agile","Process"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound Agile-related, but they miss the exact Agile principle, role, artifact, or flow being tested."},{"q":"What is a retrospective?","options":["A meeting to determine what went right and wrong during the sprint","A customer acceptance inspection only","A project charter approval meeting","A seller selection meeting"],"answer":0,"why":"A retrospective is where the team identifies what went right and wrong and how to improve next iteration.","mindset":"Retrospective = process improvement/lessons learned for the sprint.","chapterRef":"Chapter 4: Retrospective","tags":["Agile","Mindset"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound Agile-related, but they miss the exact Agile principle, role, artifact, or flow being tested."},{"q":"What is an MVP?","options":["A usable product that may not have all features","A fully complete final product with every feature","A predictive baseline","A procurement document"],"answer":0,"why":"An MVP may not have all features but is still usable.","mindset":"MVP delivers usable value early.","chapterRef":"Chapter 4: MVP","tags":["Agile","Value"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound Agile-related, but they miss the exact Agile principle, role, artifact, or flow being tested."},{"q":"How does Agile invert the traditional triangle?","options":["Fixed time and cost; variable scope","Fixed scope; variable time and cost","No constraints at all","Fixed scope, time, and cost with no changes"],"answer":0,"why":"The notes say Agile keeps time and cost fixed while varying scope.","mindset":"Agile focuses on delivering the most valuable features within fixed time/cost.","chapterRef":"Chapter 4: Inverting the Triangle","tags":["Agile","Exam Trap"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound Agile-related, but they miss the exact Agile principle, role, artifact, or flow being tested."},{"q":"What is grooming the product backlog?","options":["Adding, removing, and reprioritizing product backlog items","Closing the project","Approving a cost baseline","Testing final deliverables only"],"answer":0,"why":"Grooming means adding, removing, and reprioritizing the backlog so the most valuable items are at the top.","mindset":"Backlog is continuously managed based on value.","chapterRef":"Chapter 4: Product Backlog Grooming","tags":["Agile","Process"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound Agile-related, but they miss the exact Agile principle, role, artifact, or flow being tested."},{"q":"What is the purpose of Kanban limiting work in progress?","options":["Prevent overburdening the team and reveal issues/bottlenecks","Make all work invisible","Increase multitasking as much as possible","Remove customer feedback"],"answer":0,"why":"Kanban limits work in progress so teams are not overburdened and can see issues and bottlenecks.","mindset":"Limit WIP to improve focus and flow.","chapterRef":"Chapter 4: Kanban","tags":["Agile","Lean"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound Agile-related, but they miss the exact Agile principle, role, artifact, or flow being tested."},{"q":"Your agile team\u0027s velocity has been stable at 30 points per sprint. The product owner wants to commit to 45 points next sprint to impress a stakeholder. What should you do?","options":["Explain that overcommitting beyond proven velocity creates delivery risk and suggest using the sustainable 30-point pace","Agree to 45 points since the PO owns the backlog","Push the team to work overtime to meet 45 points","Split the sprint into two smaller sprints to fit more work"],"answer":0,"why":"Velocity is an empirical measure. Artificially inflating commitments leads to burnout and broken trust. The SM/PM protects sustainable pace.","mindset":"PMI mindset: respect empirical data. Don\u0027t let stakeholder pressure override what the team has proven it can deliver.","tags":["Agile","Velocity","Sustainable Pace"],"chapterRef":"Chapter 4 - Velocity and Sprint Planning"},{"q":"A stakeholder insists on detailed upfront requirements documentation before an agile project can begin. The team prefers to start with user stories and refine iteratively. What is the BEST approach?","options":["Explain that agile embraces progressive elaboration through user stories, but offer to document high-level epics and acceptance criteria to give the stakeholder sufficient confidence to begin","Force the stakeholder to accept pure agile with no documentation","Create full documentation to satisfy the stakeholder, then ignore it during sprints","Tell the stakeholder they cannot be involved until the product is built"],"answer":0,"why":"Meet stakeholders where they are. You can honor agile principles while providing enough documentation to build trust. This isn\u0027t all-or-nothing.","mindset":"PMI mindset: tailor the approach. Agile doesn\u0027t mean zero documentation â€” it means the right amount for the context and stakeholders.","tags":["Agile","Stakeholder Engagement","Tailoring"],"chapterRef":"Chapter 4 - Agile Documentation"},{"q":"During a sprint retrospective, the team identifies that the daily standup has become a status report to the scrum master rather than a team coordination event. What should you do?","options":["Coach the team that standups are for them to coordinate with each other, not report status to you â€” then step back and let them run it","Cancel standups since they\u0027re not working","Continue as-is since you\u0027re getting useful status information","Make standups longer to allow more discussion"],"answer":0,"why":"The daily standup is a team coordination ceremony, not a management reporting tool. The SM should correct this anti-pattern by coaching and stepping back.","mindset":"PMI mindset: servant leaders empower teams to self-organize. If a ceremony has been co-opted, coach the team back to its true purpose.","tags":["Agile","Scrum Ceremonies","Servant Leadership"],"chapterRef":"Chapter 4 - Daily Standup"},{"q":"Your hybrid project uses sprints for development but has a fixed regulatory deadline for final delivery. The team has completed 70% of features with 3 sprints remaining. The PO wants to add new features. What should you do?","options":["Prioritize the remaining backlog with the PO to ensure the highest-value items are delivered by the deadline, and defer lower-priority new features to a future release","Add all new features since agile welcomes change","Extend the deadline to fit everything","Remove the sprint structure and switch to waterfall to control scope"],"answer":0,"why":"Fixed deadlines require scope discipline. Agile welcomes change but through prioritization, not unlimited addition. The PM helps the PO make trade-off decisions.","mindset":"PMI mindset: agile doesn\u0027t mean unlimited scope. When time is fixed, manage scope through ruthless prioritization.","tags":["Hybrid","Scope Management","Prioritization"],"chapterRef":"Chapter 4 - Hybrid Approach"},{"q":"A team member says \u0027We don\u0027t need a project manager in agile â€” the team is self-organizing.\u0027 How should you respond?","options":["Explain that self-organizing teams still benefit from someone who removes impediments, facilitates stakeholder communication, and shields the team from distractions â€” that\u0027s the PM/SM role in agile","Agree and remove yourself from the project","Assert your authority as PM and override the team\u0027s preferences","Report the team member for insubordination"],"answer":0,"why":"Self-organizing doesn\u0027t mean leaderless. The PM/SM role shifts to servant leadership â€” facilitating, coaching, removing obstacles â€” not commanding.","mindset":"PMI mindset: the PM role evolves in agile, it doesn\u0027t disappear. Self-organization needs support, not abandonment or control.","tags":["Agile","Servant Leadership","PM Role"],"chapterRef":"Chapter 4 - Self-Organizing Teams"},{"q":"Your product owner is unavailable for sprint planning and backlog refinement. The team is unsure what to work on next. What should you do FIRST?","options":["Escalate the PO availability issue and help the team use the existing prioritized backlog for the current sprint while working to get PO engagement resolved","Have the team pick whatever they want to work on","Cancel the sprint until the PO is available","Assume the PO role yourself and prioritize the backlog"],"answer":0,"why":"The PO\u0027s absence is an impediment. The SM/PM should escalate while ensuring the team isn\u0027t blocked â€” using existing backlog priority as guidance.","mindset":"PMI mindset: remove impediments. Don\u0027t let the team sit idle, but don\u0027t overstep into the PO role. Escalate and bridge.","tags":["Agile","Product Owner","Impediment Removal"],"chapterRef":"Chapter 4 - Scrum Roles"},{"q":"Your agile team delivered a working increment, but the stakeholder says \u0027This isn\u0027t what I asked for.\u0027 The user stories were completed per the acceptance criteria. What went wrong and what should you do?","options":["The acceptance criteria may have been technically correct but didn\u0027t capture the stakeholder\u0027s true intent â€” schedule a demo earlier next sprint and involve the stakeholder in refinement sessions","Blame the stakeholder for approving incorrect acceptance criteria","Refuse to make changes since the stories are done per criteria","Add the rework to the next sprint without discussing it"],"answer":0,"why":"Working software that doesn\u0027t meet stakeholder expectations means the feedback loop is too long or refinement wasn\u0027t inclusive enough. Shorten the loop.","mindset":"PMI mindset: delivering to spec but not to satisfaction is still a failure. Tighten feedback loops and involve stakeholders earlier.","tags":["Agile","Stakeholder Feedback","Sprint Review"],"chapterRef":"Chapter 4 - Sprint Review"},{"q":"Your team wants to skip the retrospective because \u0027everything is going fine.\u0027 What should you do?","options":["Explain that retrospectives are about continuous improvement, not just fixing problems â€” even high-performing teams can find efficiencies. Hold the retro.","Cancel the retro since the team is happy","Make the retro mandatory and lecture them about process","Hold the retro but only discuss what went wrong"],"answer":0,"why":"Retros aren\u0027t just for problems. They\u0027re how good teams become great. Skipping them means missing improvement opportunities.","mindset":"PMI mindset: continuous improvement is always possible. Don\u0027t skip the inspect-and-adapt cycle just because things seem fine.","tags":["Agile","Retrospective","Continuous Improvement"],"chapterRef":"Chapter 4 - Retrospectives"},{"q":"Management wants to measure your agile team\u0027s performance using individual productivity metrics (lines of code, tasks completed per person). What should you recommend?","options":["Recommend team-level metrics like velocity, cycle time, and customer satisfaction instead â€” individual metrics can damage collaboration and create perverse incentives","Implement the individual metrics as requested","Track individual metrics secretly without telling the team","Refuse to track any metrics at all"],"answer":0,"why":"Agile values team performance over individual output. Individual metrics encourage heroics over collaboration and gaming over delivery.","mindset":"PMI mindset: measure what matters. Team outcomes \u003e individual output. Metrics should encourage collaboration, not competition.","tags":["Agile","Metrics","Team Performance"],"chapterRef":"Chapter 4 - Agile Metrics"},{"q":"A stakeholder asks when exactly a specific feature will be delivered. Your agile project doesn\u0027t have fixed feature-to-sprint mapping. What is the BEST response?","options":["Provide a range based on current velocity and backlog priority â€” \u0027Based on our velocity, this feature is likely in sprint 4-5, assuming priority doesn\u0027t change\u0027","Say \u0027We can\u0027t predict anything in agile\u0027","Commit to a specific sprint even though you\u0027re not sure","Tell the stakeholder that agile doesn\u0027t do dates"],"answer":0,"why":"Agile can forecast using velocity data. Saying \u0027we can\u0027t predict\u0027 is a cop-out. Provide a range with caveats about priority changes.","mindset":"PMI mindset: agile doesn\u0027t mean unpredictable. Use empirical data to forecast. Communicate ranges with assumptions, not absolutes or refusals.","tags":["Agile","Forecasting","Stakeholder Communication"],"chapterRef":"Chapter 4 - Agile Planning"}]},{"id":5,"title":"Chapter 5: Integration Management","summary":"Integration management, including the project charter, business documents, project management plan, direct and manage project work, project knowledge, work performance flow, integrated change control, and close project or phase.","notes":["Page 1 – Chapter 5: Integration Management","Integration management is the unification of all of the other knowledge areas.","It could be thought of as the combination or summary of the other nine knowledge areas.","In order to develop the project management plan, you will need to perform the other 23 planning processes.","By doing the other 23 processes, their outputs become the main input to the project management plan.","The processes listed under the integration knowledge area roll up to create the integration knowledge area.","In the integration executing process of “direct and manage project work,” you would need to complete the other nine processes listed under it.","This knowledge area is probably the most important of the 10 knowledge areas, as it incorporates and summarizes all of the work the project manager will need to do in order to successfully complete each phase of a project.","The project manager’s main job is to perform integration.","Integration means integrating all of the other knowledge areas such as scope, time, cost, and quality.","Different knowledge areas may be integrated in different sequences depending on the project.","Information gathered from the project scope may be used to create the schedule and budget.","On an agile project, the concept of managing a project in this knowledge area will not change.","The project manager will still be in charge of initiating, planning, executing, monitoring and controlling, and closing.","On agile projects, the project team will be more involved and make more decisions than the project manager.","In a traditional project, the project manager plays more of a central role with the project team reporting to them.","On agile and hybrid projects, the project manager plays more of a servant role and supports team members in conducting many of the processes listed in this knowledge area.","In agile, expect more changes throughout each phase and the project as a whole.","Expect exam questions on the processes covered in this chapter.","It is important to understand:","Why an input is needed.","How a tool can be used in a process.","The main outputs from each process.","Page 86 – Integration Management Processes","Develop Project Charter","Process Group: Initiating","Main Output:","Project Charter","Assumption Log","Develop Project Management Plan","Process Group: Planning","Main Output:","Project Management Plan","Direct and Manage Project Work","Process Group: Executing","Main Output:","Deliverables","Work Performance Data","Issue Log","Change Request","Manage Project Knowledge","Process Group: Executing","Main Output:","Lessons Learned Register","Monitor and Control Project Work","Process Group: Monitoring and Controlling","Main Output:","Work Performance Reports","Change Requests","Perform Integrated Change Control","Process Group: Monitoring and Controlling","Main Output:","Approved Change Request","Close Project or Phase","Process Group: Closing","Main Output:","Final Product, Service, or Result Transition","Final Report","Page 87 – Develop Project Charter","Develop Project Charter is the process of developing a document that formally authorizes the project or phase and documents initial requirements to satisfy the stakeholders.","The project charter establishes the partnership between the performing organization and the requesting organization.","This process is performed at the very beginning of a project or phase.","The charter is senior management written approval to start the project.","Think of the project charter as the authorization of the project manager and the project itself.","The charter is usually developed by the project sponsor while working with the project manager.","The charter contains high-level information that senior management will review in order to determine if the project should proceed.","The information collected to create the charter outlines the:","Cost","Schedule","Scope","Benefits","Once the project charter is approved, the next step is to identify stakeholders and begin planning the project.","Complete the two initiating processes of:","Develop project charter","Identify stakeholders","These should be completed before planning the project.","Agile and hybrid projects also have a project charter.","The project charter may not be as detailed as it would be in a traditional project.","It will still contain some of the high-level requirements so the project can be authorized.","An agile project charter generally contains a very high-level scope since most of the project will be unknown when the charter is being written.","Page 87 – Inputs: Business Documents","Business documents contain specific information as to why a project should be initiated.","There are two main documents:","Business case","Benefits management plan","Page 87 – Business Case","A business case basically says why a business should do this project.","Businesses usually do a cost-benefit analysis to justify the money being spent on the project.","Reasons companies initiate a project include:","Market demand, such as introducing a new product to the market that has a need.","Organizational need, such as reducing overhead to improve profits.","Customer request, such as improving a product to meet a customer request.","Technological advance, such as installing the latest operating system for better security.","Legal requirement, such as new regulations that a business needs to implement.","Environmental impacts, such as cleaning up toxic waste sites.","Social need, such as a project to reduce crime in certain areas.","Page 88 – Project Selection Methods","Selecting a project can be a complex task.","Methods that can be used to select a project include:","Benefit-Cost Ratio (BCR)","Ratio of benefit to cost.","Example:","Project returns $5,000 but costs $2,000.","$5,000 ÷ $2,000 = 2.5.","You are making $5 for every $2 that you spend.","The larger the ratio, the better the project.","Internal Rate of Return (IRR)","Looks at the return of the project investment as an interest rate.","The bigger the interest rate, the better the project.","An IRR of 20% is better than an IRR of 10%.","Opportunity Cost","An economic term that represents the value of what you choose not to do in order to do something else.","Example:","Project A will return $20,000.","Project B will return $30,000.","Selecting project B results in an opportunity cost of $20,000.","We give up option A to pursue option B.","Payback Period","How long it will take to return the investment capital in the project.","The shorter, the better.","The faster the business gets its money back, the faster it can start another project.","Economic Value Add (EVA)","Looks at the net value of a company over a period of time.","Equal to profits after tax minus the average cost of capital.","A business is only profitable if it creates value for its shareholders.","A formula is not needed for the PMP exam; you just need to understand it.","Present Value (PV) and Net Present Value (NPV)","Means money will lose value over time due to inflation.","$10 now will not be worth $10 in the next 5 years.","The NPV includes the expenses of the project.","The bigger the PV or NPV, the better.","Return on Investment (ROI)","A percentage that shows how much money you will get back on the project.","Example:","Company invests $1 million.","ROI is 10%.","Return will be $100,000.","The bigger the ROI, the better.","Page 89 – Project Benefits Management Plan","A project benefits management plan is used to describe the main benefits that the project will produce once it is completed.","The project benefit could be the product, service, or result that the organization is looking to obtain after the project is done.","This benefit would help to grow the organization.","Senior management will want to know the benefits this project will bring to the organization.","Most of the time, this is expressed in financial terms, such as:","How much money the company can gain by selling a particular product that the project is creating.","How it can reduce some of the organization’s risk.","It can also show how the output of the project is aligned with the strategic goals of the business.","Example:","It can show how the project deliverable will help to meet the organization’s long-term goal of increasing its revenue by 50%.","This benefits management plan is generally created by doing a cost-benefit analysis of whether a project should proceed or not and using the different business cases as to why a project is needed.","This document must be continually maintained because as the project is progressing and more benefits are realized, the plan should be updated accordingly.","The business case and the benefits management plan lead to the creation of the project charter, which then leads to the creation of the project management plan.","Page 89 – Agreements","An agreement is another word for a contract.","If this project is being done for an external customer, then an agreement will be needed to start the project for the contractor.","The agreement should be signed before the project starts.","Other forms of agreement can include:","Memorandums of understanding","Service level agreements","Letters of intent","Verbal agreements","Written agreements","Page 89 – Flow","Business Case ↔ Project Benefits Management Plan","Business Case / Project Benefits Management Plan → Project Charter","Project Charter → Project Management Plan","Page 89 – Inputs","Enterprise Environment Factors – Covered in Chapter 3","Organizational Process Assets – Covered in Chapter 3","Page 89 – Tools and Techniques","Expert Judgment – Covered in Chapter 3","Page 90 – Data Gathering","Gathering data to create the project charter can include techniques such as:","Brainstorming","Focus groups","Interviews","The objective is to gather the main requirements needed for the project.","This can include requirements for:","Scope","Cost","Schedule","Page 90 – Interpersonal and Team Skills","Expect to be doing a lot of facilitation among stakeholders while working to create the project charter.","Meeting management techniques will be needed in order to ensure meetings are run properly.","Page 90 – Meetings","Covered in Chapter 3","Page 90 – Outputs: Project Charter","The project charter is a document that officially authorizes the project to get started.","The project charter includes:","Project justification and purpose.","Name of the project manager.","Assignment of authority to the project manager.","Signature of the sponsor or others authorizing the project.","High-level requirements, including scope, budget, and milestones view of the project schedule.","High-level risks.","Stakeholder list.","Exit criteria (things that might cause the project to be canceled).","Page 90 – Assumption Log","The assumption log is a log of all the assumptions and constraints that are identified throughout the project.","Assumptions are things that you perceive to be true.","Constraints are things that might constrain the project.","Example:","A project manager may assume that the project does not need to upgrade any of the computer hardware in order to install a new application.","The project manager would write this assumption of no hardware upgrades in the assumption log.","Example:","A project may be constrained as to time because the work that is required may be too much for a short project schedule.","The project manager would list a constraint of time in the assumption log.","The assumption log is continuously updated throughout the entire phase or project.","Page 91 – Develop Project Management Plan","Develop Project Management Plan is the process of creating the project management plan that includes all the subsidiary plans and baselines.","The project management plan says how we will execute, monitor and control, and close the project.","The project management plan includes:","All the baselines (scope, time, and cost).","All of the management plans needed to manage each of the additional nine knowledge areas.","As you are doing the other planning processes, you will be creating many different types of documents that will be stored in this plan.","The whole objective of all 24 planning processes is to create this plan.","Without this plan, we will not know how to execute, monitor and control, and close the project.","Once the plan is completed, it will need to get baselined, which generally means getting it approved by the project sponsor.","While doing planning processes and changing or updating different components of the plan, there is no need for a change request because it has not been baselined.","Once the plan is completed and baselined, only an approved change request that has gone through the process of “perform integrated change control” can be used to update the plan.","Exam Tip: Only an approved change request can change a plan once it has been approved.","On agile and hybrid projects, this plan may not be as detailed as it would be on a traditional project.","While many of the components below mostly apply to a traditional project, agile projects can still use some of them.","In many traditional projects, these plans may be given to the project manager from the PMO.","On agile projects, the team will create them to best suit their needs.","Page 91 – Inputs","Project Charter","See the earlier process.","Outputs from Other Processes","There are 23 other planning processes.","Each planning process yields specific plans and baselines needed to create the project management plan.","The output of the other planning processes serves as the input to this high-level process.","Enterprise Environment Factors","Covered in Chapter 3.","Organizational Process Assets","Covered in Chapter 3.","Page 91 – Tools and Techniques","Expert Judgment","Covered in Chapter 3.","Data Gathering","Covered in Chapter 3.","Interpersonal and Team Skills","Covered in Chapter 3.","Meetings","While the project is being planned, expect to attend lots of meetings.","Utilize meeting management techniques in interpersonal and team skills.","One meeting to be aware of is the project kick-off meeting.","A project kick-off meeting is usually done... (continued on next page).","Page 92 – Outputs: Project Management Plan","Project Management Plan","The project management plan is a formal document that is used to describe how the project is executed, monitored and controlled, and closed.","This plan will be very important to the success of the project.","Exam Tip: The project management plan is an input to all executing, monitoring and controlling, and closing processes since it describes how to do those process groups.","Some important exam points about the project management plan:","This is a document with 18 parts: 4 baselines and 14 subsidiary plans.","This can be either summary or detailed; the more detailed, the better.","Smaller projects might need a very simple plan in contrast to a large project, which might need a very complex plan.","Once the project management plan is baselined, it may only be changed when a change request is generated and approved through the “perform integrated change control” process.","Components of the Project Management Plan and Process Where Made","Scope Management Plan","Plan Scope Management","Requirement Management Plan","Plan Scope Management","Schedule Management Plan","Plan Schedule Management","Cost Management Plan","Plan Cost Management","Quality Management Plan","Plan Quality Management","Resource Management Plan","Plan Resource Management","Communication Management Plan","Plan Communications Management","Risk Management Plan","Plan Risk Management","Procurement Management Plan","Plan Procurement Management","Stakeholder Management Plan","Plan Stakeholder Management","Change Management Plan","Develop Project Management Plan","Configuration Management Plan","Develop Project Management Plan","Scope Baseline","Create WBS","Schedule Baseline","Develop Schedule","Cost Baseline","Determine Budget","Performance Measurement Baseline","Develop Project Management Plan","Project Life Cycle Description","Develop Project Management Plan","Development Approach","Develop Project Management Plan","The project management plan is broken into two components:","Management plans","Baselines","A management plan is a plan that is used to describe how to do a particular component of a project.","Page 93 – Project Management Plan Components","The scope management plan describes:","How to write the scope.","Baseline the scope.","Validate the scope.","Ensure the project stays on the scope.","A management plan is really a “how-to.”","A management plan explains how you’re going to manage that section of the project.","A baseline is used to track the performance of the project.","The schedule baseline tells you the planned schedule.","The cost baseline tells you the planned budget of the project.","Most plans and baselines are created in other planning processes.","There are a few plans created in this process that you should know about.","Page 93 – Change Management Plan","The change management plan outlines:","How change requests will be collected.","How change requests will be assessed.","How change requests will be authorized.","How change requests will be incorporated into the project.","Page 93 – Configuration Management Plan","The configuration management plan outlines how the various components of a project can be configured.","Example:","When installing a large software package across many computers, a plan is needed that describes how to configure each computer to ensure the software works correctly.","Page 93 – Performance Measurement Baseline","The performance measurement baseline is used to check the performance of the project as it is being executed.","Anytime you see the word “baseline,” think of what to measure against.","The performance measurement baseline integrates:","Scope","Schedule","Costs","These are integrated into a single baseline used to track project performance.","Page 93 – Project Lifecycle Description","The project lifecycle description outlines what type of lifecycle the project will be following.","For an agile project, use more of an adaptive lifecycle.","For a traditional project, use a more predictive lifecycle.","This document outlines which lifecycle will be used on the project.","Page 93 – Development Approach","The development approach is a document that outlines how the product will be developed.","On an agile project:","Development may be more iterative.","Development may occur in small increments.","On a traditional project using a more predictive approach:","The entire product is developed in one shot.","The other parts of the project management plan will be covered in more detail as the processes where they are created are reviewed.","Page 94 – Direct and Manage Project Work","Direct and Manage Project Work is the process of performing the work defined in the project management plan to create the project deliverables.","The project manager leads the project team to actually build the deliverables and incorporate all approved changes.","This is an integration process and represents the rollup of the other nine executing processes.","Since this is an executing process, you are expected to do the project work as defined in the project management plan.","The project manager will be training and managing the project team assigned to the project to ensure the deliverable is built according to the plan.","As the project manager performs this process, he/she is also collecting data on the work being performed.","This collected data is the work performance data.","Work performance data is output here but is used as input to all monitoring and controlling processes.","On agile and hybrid projects, this is when the sprint starts and the project team begins to work.","On an agile project, this process usually lasts for a short time, anywhere from 1 to 4 weeks, as the team creates that increment of the product.","In a traditional project, this process can last for the entire duration it takes to build the actual deliverable.","In a traditional project, this process can take months to years.","Page 94 – Inputs","Project Management Plan","The project management plan describes the steps needed to build the deliverable.","The plan tells the project manager:","How to execute.","How to monitor and control.","How to close the project.","The more detailed the plan, the more successful the project execution will be.","Project Documents","While executing a project, the project manager will use many different project documents to ensure that the deliverable is getting created according to the plan.","Documents can include:","Project schedule","Risk register","Risk report","Milestones","Approved Change Requests","If a change is formally approved, the project manager will execute that change in this process.","An approved change request can be:","A customer request for a change.","A corrective action.","A preventive action.","Example:","If a customer requests a change to the color of paint in a room on a renovation project and the change is approved, the project manager should execute that change by changing the paint color in this process.","Approved change requests are outputs of the process “perform integrated change control.”","Enterprise Environmental Factors","Covered in Chapter 3.","Organizational Process Assets","Covered in Chapter 3.","Page 94 – Tools & Techniques","Expert Judgment","Covered in Chapter 3.","Project Management Information System","Covered in Chapter 3.","Meetings","Covered in Chapter 3.","Page 95 – Outputs","Deliverables","The most important output of this process is the deliverables.","Deliverables are the products or parts of the products that are given to the customer for acceptance.","When the project team has completed the execution of the project, they should have a deliverable.","Example:","On a “paint the room” project, the deliverable would be a completed painted room.","The deliverable becomes the input to the process, “control quality.”","From there, it is checked for quality requirements.","It is then passed to the “validate scope” process to be given formal acceptance by the stakeholders.","After it has been formally accepted, the project may move on to the “close project or phase” process.","Work Performance Data","Work performance data is the raw information about the work that was performed.","It can include things like:","How long the work took.","How much it cost.","This output is obtained continuously as the project is being executed.","The project manager analyzes the data alongside the plan to create work performance information.","Work performance information provides the project manager the status of the project.","Work performance data is used as an input to many monitoring and controlling processes.","Issue Log","As a project is being executed, expect to encounter a variety of problems, conflicts, and issues.","An issue log is where the list of all issues on a project is kept.","As issues arise, add them to the log.","The issue log helps ensure that issues are:","Described","Assigned","Prioritized","Addressed","The issue log also keeps track of:","Who raised the issue","When they raised it","The issue log must be updated continuously throughout the project.","Change Requests","As a project is being executed, expect to have changes throughout the project.","Changes can come from:","Customers","Sponsors","Team members","Senior management","Changes can also be requested because of:","Preventive actions","Corrective actions","Defect repairs","Once a change has been requested, it is passed to the process “perform integrated change control,” where it is assessed.","Project Management Plan Updates","Covered in Chapter 3.","Project Document Updates","Covered in Chapter 3.","Organizational Process Assets Updates","Covered in Chapter 3.","Page 96 – Manage Project Knowledge","Manage Project Knowledge is a process that ensures the knowledge that is gained before, during, and after the project is used for the organization’s benefit.","Knowledge is power, and if utilized correctly, can greatly benefit an organization.","Knowledge management allows the project manager to use the knowledge gained throughout the project for the benefit of the project and organization.","Explicit and Tacit Knowledge","Knowledge can be either explicit or tacit.","Explicit Knowledge","Has a tangible form.","Includes:","Documents","Procedures","Manuals","Textbooks are good places to get explicit knowledge.","Tacit Knowledge","Difficult to transfer between people by just speaking to them.","Gained by doing the work.","Sometimes referred to as “know-how.”","The project manager will try to ensure that both explicit and tacit knowledge are managed correctly for the benefit of the project.","The project manager must ensure that knowledge gained from the project is used correctly with stakeholders to ensure the project is successful.","The main output of the lessons learned register is where the project manager keeps a repository of all the main knowledge learned throughout the project.","On agile and hybrid projects, the team conducts a retrospective at the end of the sprint to capture project knowledge and other lessons learned during the sprint.","These lessons are then used to enhance performance during the next sprint.","Page 96 – Inputs","Project Management Plan","Covered in Chapter 3.","Project Documents","Covered in Chapter 3.","Deliverables","Deliverables are the products or parts of the products that are given to the customer for acceptance.","When the project team has completed the execution of the project, they should have a deliverable.","Deliverables are the objectives of the project.","Enterprise Environmental Factors","Covered in Chapter 3.","Organizational Process Assets","Covered in Chapter 3.","Page 96 – Tools & Techniques","Expert Judgment","Covered in Chapter 3.","Knowledge Management","Knowledge management is about the sharing of generally tacit knowledge between stakeholders on a project.","Each project is different, and the interaction between stakeholders might change from project to project.","It is up to the project manager to ensure that stakeholders are sharing knowledge with each other.","Methods can include:","Networking","Meetings","Discussions","Seminars","Workshops","Training","The method chosen will be dependent upon the project and the people working on the project.","Page 97 – Information Management","Information management is about ensuring that information is available to the stakeholders when needed.","While projects are unique, most will use a similar method to get information to stakeholders.","Methods can include:","Websites","Libraries","Articles","Documents","It is important that the project manager works to ensure that information is widely available to his/her team as the project is progressing.","Page 97 – Interpersonal and Team Skills","Covered in Chapter 3.","Page 97 – Outputs","Lessons Learned Register","The moment a project executes, the project manager should start to gather the lessons learned.","Lessons learned are gathered throughout the project, not just at the end.","The lessons learned register is where the project manager stores all of the lessons learned as the project is being executed.","This is a living document that will be consistently updated every time new knowledge is recognized within the project.","Example:","If a team member discovers a new method to code faster, the project manager should add that method to the lessons learned register.","When the phase or project is completed, the lessons learned register is given to the organization’s PMO.","The PMO stores it in the lessons learned repository for use on future projects within the organization.","Project Management Plan Updates","Covered in Chapter 3.","Organizational Process Assets Updates","Covered in Chapter 3.","Page 98 – Monitor and Control Project Work","Monitor and Control Project Work is the process of tracking, reviewing, and reporting the progress of the project work.","The goal of this process is to keep the project on plan.","As the project is executed, it is the responsibility of the project manager to ensure that the project is on plan.","If the project is falling behind schedule or budget, corrective or preventive actions in the form of a Change Request may be needed.","Monitoring and controlling a project includes looking at the work that was done and comparing it to the plan to see if they line up.","If they do not line up, necessary changes must be implemented to fix it.","The monitoring and controlling processes are performed in parallel to the executing processes.","The main outputs of this process are the work performance reports (status report).","Work performance reports give stakeholders an understanding of:","What is currently happening on the project.","Whether the project needs any correction or repairs through a change request.","On agile and hybrid projects, monitor and control project work is generally done by the team themselves.","In traditional projects, the project manager takes on the role of monitoring the work and ensuring it gets done according to the plan.","Monitor and control project work is generally done throughout the sprint on an agile or hybrid project.","Page 98 – Inputs","Project Management Plan","Covered in Chapter 3.","Project Documents","Covered in Chapter 3.","Work Performance Information","Work performance information is information on the performance of the work that was done on the project.","It provides the status of the deliverables.","It is made by comparing work performance data with the project management plan.","Work performance information is the output of all “Control” processes, such as:","Control Scope","Control Schedule","Etc.","Agreements","An agreement is usually a contract between a buyer and a seller for work.","It generally includes:","Work that needs to get done","Terms","Conditions","Pricing","Penalties","Agreements are used in this process by the project manager to monitor the contractor’s work while the project is being executed.","More specifics about agreements will be discussed in the procurement management chapter.","Enterprise Environmental Factors","Covered in Chapter 3.","Organizational Process Assets","Covered in Chapter 3.","Page 98 – Tools and Techniques","Expert Judgment","Covered in Chapter 3.","Data Analysis","Covered in Chapter 3.","Decision Making","Covered in Chapter 3.","Meetings","Covered in Chapter 3.","Page 99 – Outputs","Work Performance Reports","While monitoring and controlling the project, reports are created on the status of the project, such as whether it is on schedule or budget.","Work performance reports are sometimes called status reports.","The work performance report is used to update stakeholders on the progress of the project.","The input to this process is the work performance information.","The output of this process is the work performance report.","Change Requests","While monitoring and controlling the project, the project manager may need to implement:","Corrective actions","Preventive actions","Defect repairs","Example:","If the project is 20% over budget, the project manager will need to get a change request for additional funds to complete the project (corrective action).","Once the project manager has initiated a change request, he/she follows the process of “perform integrated change control” to get that change approved.","Project Management Plan Updates","Covered in Chapter 3.","Project Documents Updates","Covered in Chapter 3.","Page 100 – Perform Integrated Change Control","Perform Integrated Change Control is the process of reviewing all change requests and approving or rejecting them.","Once a project management plan is approved, any subsequent changes to it must go through this process to be updated.","Changes may be requested by any stakeholder.","Examples:","A sponsor may want the project finished faster or more cheaply.","A customer may want to add something new to the scope.","The project needs a system to document and manage changes throughout the project.","This is done using the:","Change management plan","Configuration management plan","These plans specify the steps to manage changes.","All documented change requests need to be approved or denied by the correct authority.","All changes need to be evaluated and approved correctly.","Changes can be authorized by:","Project manager","Sponsor","Change control board (CCB)","A change control board (CCB) can be used to:","Review changes","Evaluate changes","Approve changes","Reject changes","The project manager should influence the factors that affect change in order to prevent unnecessary changes.","This process is a key topic for the exam.","Questions may focus on:","What to do first when a change is requested.","What to do next when a change is requested.","Change Management Process","Record Change Request","Assess Change Requests (Impact on Project)","Approve or Disapprove Change Requests","First assess the change and determine how it impacts the overall project.","Then develop options for implementing the change.","Next, get the change approved.","Once approved, execute the change.","If a change request is rejected, the project manager should communicate back to the original stakeholder that the change will not be implemented.","Do not approve or deny a change without assessing the actual change.","Exam Tip:","Never take action without an assessment and never reject a change without an assessment on a traditional project.","The diagram mostly applies to a traditional project where there is a well-documented change management process.","On a traditional project, no changes should be made to any project management plans without submitting a change request and getting it approved.","Agile and Hybrid Projects","On agile and hybrid projects, change management is less process-oriented and more welcoming.","When a stakeholder wants to add a feature to an agile project, it is generally added to the product backlog.","The product backlog is then re-prioritized based on value to incorporate the new feature.","The product owner is responsible for re-prioritizing the product backlog and determining if the item should be added.","Most change management power on an agile project is given to the product owner and not the change control board.","Agile projects do not have the same well-documented change management processes as traditional projects.","Exam Tip:","On an Agile project, changes are generally added to the product backlog that is then re-prioritized by the product owner.","Page 101 – Inputs","Project Management Plan","The project management plan contains details about how to process, monitor, and control changes in a project.","Project Documents","Covered in Chapter 3.","Work Performance Reports","Covered in Chapter 3.","Change Requests","A change request is an output of most of the executing and monitoring and controlling processes.","Change requests are evaluated in this process.","Enterprise Environmental Factors","Covered in Chapter 3.","Organizational Process Assets","Covered in Chapter 3.","Page 101 – Tools and Techniques","Expert Judgment","Covered in Chapter 3.","Change Control Tools","Change control tools are manual or automated tools used to manage change requests.","These tools help to:","Identify changes","Document changes","Track changes","The main objective of the tools is to help the CCB make a decision on whether to approve or disapprove the change.","Data Analysis","Covered in Chapter 3.","Decision Making","Covered in Chapter 3.","Meetings","Covered in Chapter 3.","Page 101 – Outputs","Approved Change Requests","Once a change has been approved, it becomes an input to the “direct and manage project work” process.","This is where the approved change request is executed.","Example:","Someone requests a change to the color of paint on a renovation project.","The change is submitted to the change control board.","The change control board approves the change.","The approved change request is passed to the “direct and manage project work” process.","The painters implement the change by changing the paint color.","An approved change request triggers the project manager to update the project management plan and its associated project documents.","Project Management Plan Updates","Once a change has been approved, the project management plan should be updated.","Any of the 18 plan components can be updated with an approved change request.","Example:","Stakeholders request that the project be completed faster.","The change is approved.","The project manager updates the schedule baseline to reflect the earlier finish date.","The cost baseline may also be updated to reflect the additional costs associated with finishing the project sooner.","Page 102 – Project Documents Updates","As with the project management plan, any of the additional 33 project documents could be updated with an approved change request.","One document that would need to be updated is the change log.","The change log records the status of changes throughout the project.","The change log can include whether the change was:","Approved","Disapproved","Example:","Stakeholders request more work to be added to the scope.","The change is approved.","The project manager updates the change log to reflect the newly identified change to the project.","Page 103 – Close Project or Phase","Close Project or Phase is the process of formalizing all activities and overall project management process groups to formally complete the project, phase, or contract.","This process establishes a process to investigate and document the reasons a project is terminated early.","The project manager reviews the scope baseline and completed work to ensure all work was in scope and done correctly.","The project manager will:","Transfer the deliverable to productions or operations.","Successfully capture lessons learned.","Release the project team.","Updating templates and knowledge bases is also done in this phase.","Closing a Contract","Closing a contract can include:","Seller sign-off that all fees were paid.","Buyer sign-off that all work was completed.","Even if the contract is not successfully completed, it must still be formally closed in this process.","Project Termination","If a project is terminated before completion, the project manager must still formally close the project.","Exam questions may state that a project was terminated before completion and ask what should be done next.","The answer is to follow the closing procedures.","All projects must be formally closed before moving on to the next phase or project.","If a project is closed and customers want to add new requirements, a new project may need to be started.","Agile and Hybrid Projects","On agile and hybrid projects, project closure is generally done when the work in the product backlog has been completed.","The team needs to:","Tie up loose ends.","Hand over the product to operations.","Ensure documents and tools are archived.","Organize documents for future use on other projects.","Ensure the product is correctly handed over to operations for maintenance.","Conduct a final retrospective focused on lessons learned from all sprints.","Then finally, celebrate.","Page 103 – Inputs","Project Charter","The project charter is created in the initiating section of the project.","It is used to authorize the project and the project manager.","The project manager may refer to the project charter to ensure that all components of its scope were accomplished in the project or phase.","Project Management Plan","Use the entire project management plan to close a project.","All 18 components are generally used to ensure the project is successfully closed down.","Project Documents","Most of the 33 project documents are generally used in this process to ensure the project is closed successfully.","Accepted Deliverables","Before a project or phase can be closed, the sponsor or customer must formally accept the deliverables.","Deliverables are formally accepted in the “validate scope” process, which is covered in the chapter “Scope Management.”","Page 104 – Inputs","Business Documents","The two main business documents that the PMBOK® Guide usually refers to are:","Business case","Benefits management plan","The project manager may want to look back at these two documents to ensure that the project will benefit the business and that it was cost-efficient.","Agreements","An agreement is usually a contract between a buyer and a seller for work.","It generally includes:","Work that needs to get done","Terms","Conditions","Pricing","Penalties","It is used in this process by the project manager to monitor the contractor’s work while the project is being executed.","More specifics about agreements are discussed in the procurement management chapter.","Procurement Documentation","Procurement documentation refers to the documents used to bid on a project, such as:","RFP","Procurement statement of work","Contract","Source selection criteria","The specifics of these documents are covered in the procurement management chapter.","In this process, the project manager collects these documents to be indexed and filed.","This is part of closing out a contract.","Organizational Process Assets","Covered in Chapter 3.","Page 104 – Tools and Techniques","Expert Judgment","Covered in Chapter 3.","Data Analysis","Covered in Chapter 3.","Meetings","Covered in Chapter 3.","Page 104 – Outputs","Final Product, Service, or Result Transition","This is the transition of the final output of the project or phase.","After a deliverable has been accepted by the customer or sponsor, it is given over to them in this output.","Example:","Handing over the keys of a newly painted room to the customer.","Another example:","Programmers handing over the completed application to system administrators to install on all company computers.","Final Report","The final report provides the overall performance of the project and is filed with the organization.","It gives a summary of what took place on the project and how successful the project was.","The final report should include:","High-level description of the project or phase.","The objectives (scope) of the project and whether they were accomplished.","The techniques that were used to measure the quality requirements and whether the requirements were met.","The budget of the project, how it was measured, and whether there were any variations.","Whether the project accomplished its real-world problems that it had set out to achieve and the benefits of this project to the organization.","Page 105 – Project Documents Updates","When a project or contract closes, many of the 33 project documents can be expected to get updated.","One document in particular is the lessons learned register.","The lessons learned register documents all of the lessons learned that were accumulated during the project or phase.","The lessons learned register is then passed on to the organization to be added to the lessons learned repository.","Page 105 – Organizational Process Assets Updates","Upon closing the project, the project manager updates many of the organizational process assets.","Organizational process assets that may be updated include:","Templates","Knowledge bases","Lessons learned","These updates help with future projects or phases."],"examples":["The project manager’s main job is to perform integration.","The business case and benefits management plan lead to the project charter, which leads to the project management plan.","Only an approved change request can change a plan once it has been approved.","Work performance data is raw information about the work that was performed.","On Agile projects, changes are generally added to the product backlog and re-prioritized by the product owner."],"podcast":[{"speaker":"Maya","text":"Welcome to Chapter 5: Integration Management. This chapter pulls together the other knowledge areas and shows how the project manager keeps the whole project connected."},{"speaker":"Jordan","text":"Exactly. The notes say the project manager’s main job is to perform integration, so think connection, coordination, and control across the full project."},{"speaker":"Maya","text":"The chapter starts with Develop Project Charter. The charter formally authorizes the project or phase and gives senior management approval to start."},{"speaker":"Jordan","text":"And once the charter is approved, the next step is to identify stakeholders and begin planning the project."},{"speaker":"Maya","text":"The business case explains why the business should do the project, and the benefits management plan describes the benefits the project should produce once completed."},{"speaker":"Jordan","text":"Those business documents feed the project charter, and the project charter leads into the project management plan."},{"speaker":"Maya","text":"For project selection, remember the basic direction: bigger BCR, IRR, PV, NPV, and ROI are better. Shorter payback period is better."},{"speaker":"Jordan","text":"Opportunity cost is what you give up when you choose one project over another."},{"speaker":"Maya","text":"Develop Project Management Plan creates the formal document that explains how the project will be executed, monitored and controlled, and closed."},{"speaker":"Jordan","text":"Once the plan is baselined, only an approved change request through perform integrated change control can update it."},{"speaker":"Maya","text":"The project management plan has management plans and baselines. The notes describe it as 18 parts: 4 baselines and 14 subsidiary plans."},{"speaker":"Jordan","text":"Direct and Manage Project Work is where the team performs the work defined in the plan and creates deliverables."},{"speaker":"Maya","text":"That process also produces work performance data, which is raw information about the work performed."},{"speaker":"Jordan","text":"Manage Project Knowledge focuses on using explicit and tacit knowledge for the benefit of the project and organization."},{"speaker":"Maya","text":"Explicit knowledge is tangible, like documents and manuals. Tacit knowledge is know-how gained by doing the work."},{"speaker":"Jordan","text":"Lessons learned are gathered throughout the project, not just at the end. They go into the lessons learned register."},{"speaker":"Maya","text":"Monitor and Control Project Work compares the work being done to the plan and produces work performance reports."},{"speaker":"Jordan","text":"Perform Integrated Change Control reviews change requests and approves or rejects them. On traditional projects, assess before action."},{"speaker":"Maya","text":"On agile projects, change is generally added to the product backlog and re-prioritized by the product owner."},{"speaker":"Jordan","text":"Close Project or Phase formally completes the project, phase, or contract, transfers the final output, captures lessons learned, and updates organizational process assets."}],"questions":[{"q":"What is Integration Management?","options":["The unification of all of the other knowledge areas","Only the creation of the schedule baseline","Only the process of closing contracts","Only the management of procurement documents"],"answer":0,"why":"The notes state that integration management is the unification of all of the other knowledge areas.","mindset":"Integration pulls the work together across knowledge areas.","chapterRef":"Chapter 5: Integration Management","tags":["Integration","Concept"],"examLike":true,"temptingWrong":"The tempting wrong answers sound project-related, but miss the integration focus from the notes."},{"q":"What is the project manager’s main job according to the notes?","options":["To perform integration","To write only the business case","To replace the sponsor","To approve every agile backlog item"],"answer":0,"why":"The notes directly state that the project manager’s main job is to perform integration.","mindset":"Think of the PM as the person connecting the whole project system.","chapterRef":"Chapter 5: Integration Management","tags":["Integration","PM Role"],"examLike":true,"temptingWrong":"The tempting wrong answers usually describe isolated tasks instead of integrating the whole project."},{"q":"What process formally authorizes the project or phase?","options":["Develop Project Charter","Develop Project Management Plan","Direct and Manage Project Work","Close Project or Phase"],"answer":0,"why":"Develop Project Charter creates the document that formally authorizes the project or phase.","mindset":"Charter = authorization.","chapterRef":"Chapter 5: Develop Project Charter","tags":["Initiating","ITTO"],"examLike":true,"temptingWrong":"The tempting wrong answers are real integration processes, but they occur after authorization."},{"q":"Who usually develops the project charter while working with the project manager?","options":["The project sponsor","The change control board","The product owner only","The project team only"],"answer":0,"why":"The notes state that the charter is usually developed by the project sponsor while working with the project manager.","mindset":"Sponsor authorizes; PM helps shape the project.","chapterRef":"Chapter 5: Project Charter","tags":["Initiating","Roles"],"examLike":true,"temptingWrong":"The tempting wrong answers confuse later project roles with charter authorization."},{"q":"After the project charter is approved, what is the next step listed in the notes?","options":["Identify stakeholders and begin planning the project","Immediately close the project","Execute approved change requests","Submit the final report"],"answer":0,"why":"Once the project charter is approved, the next step is to identify stakeholders and begin planning the project.","mindset":"Charter first, then stakeholders and planning.","chapterRef":"Chapter 5: Develop Project Charter","tags":["Sequence","Initiating"],"examLike":true,"temptingWrong":"The tempting wrong answers jump too far ahead in the project lifecycle."},{"q":"Which two main business documents are listed as inputs for the project charter?","options":["Business case and benefits management plan","Issue log and change log","Final report and procurement documentation","Scope baseline and cost baseline"],"answer":0,"why":"The notes list the business case and benefits management plan as the two main business documents.","mindset":"Business documents explain why the project should exist and what benefits it should create.","chapterRef":"Chapter 5: Business Documents","tags":["Initiating","ITTO"],"examLike":true,"temptingWrong":"The tempting wrong answers are project documents, but not the two business documents named here."},{"q":"What does a business case basically explain?","options":["Why a business should do the project","How to close the project team","Which change requests are approved","How the sprint backlog is prioritized"],"answer":0,"why":"The notes say a business case basically says why a business should do this project.","mindset":"Business case = project justification.","chapterRef":"Chapter 5: Business Case","tags":["Business","Initiating"],"examLike":true,"temptingWrong":"The tempting wrong answers describe other project activities, not business justification."},{"q":"For project selection, what does a larger Benefit-Cost Ratio mean?","options":["The better the project","The worse the project","The longer the payback period","The lower the benefit"],"answer":0,"why":"The notes state that the larger the BCR ratio, the better the project.","mindset":"BCR compares benefit to cost; bigger is better.","chapterRef":"Chapter 5: Project Selection Methods","tags":["Selection","Business"],"examLike":true,"temptingWrong":"The tempting wrong answers reverse the selection logic."},{"q":"What does opportunity cost represent?","options":["The value of what you choose not to do in order to do something else","The total budget approved by the sponsor","The amount already spent on a project","The cost baseline after approval"],"answer":0,"why":"The notes define opportunity cost as the value of what you choose not to do in order to do something else.","mindset":"Opportunity cost is what you give up.","chapterRef":"Chapter 5: Project Selection Methods","tags":["Selection","Business"],"examLike":true,"temptingWrong":"The tempting wrong answers sound financial, but they are not opportunity cost."},{"q":"What does the project benefits management plan describe?","options":["The main benefits the project will produce once completed","The list of all rejected change requests","The exact daily work instructions for the team","The final archive location only"],"answer":0,"why":"The notes state that the project benefits management plan describes the main benefits that the project will produce once completed.","mindset":"Benefits management connects the project output to business value.","chapterRef":"Chapter 5: Benefits Management Plan","tags":["Business","Benefits"],"examLike":true,"temptingWrong":"The tempting wrong answers confuse benefits with execution or closing artifacts."},{"q":"What happens to a project management plan once it is baselined?","options":["Only an approved change request can change it","It can be changed freely by the project manager","It is deleted and replaced by the issue log","It no longer applies to monitoring and controlling"],"answer":0,"why":"The notes state that once the plan is completed and baselined, only an approved change request through perform integrated change control can update it.","mindset":"Baseline means controlled changes only.","chapterRef":"Chapter 5: Develop Project Management Plan","tags":["Baseline","Change Control"],"examLike":true,"temptingWrong":"The tempting wrong answers ignore formal control after baseline approval."},{"q":"What does the project management plan describe?","options":["How the project is executed, monitored and controlled, and closed","Only who signs the contract","Only the project title and sponsor signature","Only the list of stakeholders"],"answer":0,"why":"The notes define the project management plan as describing how the project is executed, monitored and controlled, and closed.","mindset":"The plan explains how the project will be managed across the major process groups.","chapterRef":"Chapter 5: Project Management Plan","tags":["Planning","ITTO"],"examLike":true,"temptingWrong":"The tempting wrong answers describe narrower documents."},{"q":"How many parts does the project management plan have according to the notes?","options":["18 parts: 4 baselines and 14 subsidiary plans","10 parts: one for each knowledge area only","33 project documents","2 parts: business case and benefits management plan"],"answer":0,"why":"The notes state that the project management plan has 18 parts: 4 baselines and 14 subsidiary plans.","mindset":"Remember the app notes frame it as 18 total components.","chapterRef":"Chapter 5: Project Management Plan Components","tags":["Planning","Exam Tip"],"examLike":true,"temptingWrong":"The tempting wrong answers mix in other document counts or business documents."},{"q":"What does the change management plan outline?","options":["How change requests are collected, assessed, authorized, and incorporated","How final deliverables are accepted by the sponsor","How benefits are calculated before the charter","How project team members are released"],"answer":0,"why":"The notes say the change management plan outlines how change requests are collected, assessed, authorized, and incorporated into the project.","mindset":"Change management plan = how changes move through the system.","chapterRef":"Chapter 5: Change Management Plan","tags":["Change Control","Planning"],"examLike":true,"temptingWrong":"The tempting wrong answers describe scope validation, benefits, or closing."},{"q":"What is the performance measurement baseline used for?","options":["To check project performance as it is being executed","To authorize the project manager","To store all lessons learned only at the end","To select a seller contract type"],"answer":0,"why":"The notes state that the performance measurement baseline is used to check the performance of the project as it is being executed.","mindset":"Baseline = what to measure against.","chapterRef":"Chapter 5: Performance Measurement Baseline","tags":["Baseline","Monitoring"],"examLike":true,"temptingWrong":"The tempting wrong answers confuse baselines with other integration outputs."},{"q":"What is the main output of Direct and Manage Project Work?","options":["Deliverables","Final report","Business case","Approved change request"],"answer":0,"why":"The notes state that the most important output of this process is the deliverables.","mindset":"Executing the work creates deliverables.","chapterRef":"Chapter 5: Direct and Manage Project Work","tags":["Executing","ITTO"],"examLike":true,"temptingWrong":"The tempting wrong answers are valid items elsewhere, but not the main output here."},{"q":"What is work performance data?","options":["Raw information about the work that was performed","A final approved status report only","The project charter signature","A rejected change request"],"answer":0,"why":"The notes define work performance data as raw information about the work that was performed.","mindset":"Data is raw; information is analyzed; reports summarize status.","chapterRef":"Chapter 5: Work Performance Data","tags":["ITTO","Monitoring"],"examLike":true,"temptingWrong":"The tempting wrong answers confuse raw data with reports or unrelated documents."},{"q":"What is the lessons learned register?","options":["A living document where lessons learned are stored as the project is executed","A document created only after the final report is accepted","A list of approved vendors","A contract pricing attachment"],"answer":0,"why":"The notes say lessons learned are gathered throughout the project and stored in the lessons learned register as a living document.","mindset":"Lessons learned are not only an end-of-project activity.","chapterRef":"Chapter 5: Manage Project Knowledge","tags":["Knowledge","Executing"],"examLike":true,"temptingWrong":"The tempting wrong answers delay lessons learned or confuse it with procurement."},{"q":"In traditional project change control, what should happen before approving or denying a change?","options":["Assess the actual change and its impact","Immediately reject it","Immediately execute it","Archive the project documents first"],"answer":0,"why":"The notes say to first assess the change and determine how it impacts the overall project, and never approve or deny without assessment on a traditional project.","mindset":"Assess before action.","chapterRef":"Chapter 5: Perform Integrated Change Control","tags":["Change Control","Exam Tip"],"examLike":true,"temptingWrong":"The tempting wrong answers skip assessment."},{"q":"On an agile project, how are changes generally handled?","options":["They are added to the product backlog and re-prioritized by the product owner","They always go to a change control board first","They are always rejected after the charter","They require the final report before review"],"answer":0,"why":"The notes state that on Agile projects, changes are generally added to the product backlog and re-prioritized by the product owner.","mindset":"Agile welcomes change through backlog prioritization.","chapterRef":"Chapter 5: Agile and Hybrid Change Control","tags":["Agile","Change Control"],"examLike":true,"temptingWrong":"The tempting wrong answers apply traditional control too rigidly or ignore Agile flow."},{"q":"During execution, a team member makes a change to a deliverable without going through the change control process. The change actually improved the product. What should you do?","options":["Acknowledge the improvement but coach the team member that all changes must go through change control â€” then submit a retroactive change request to document it","Punish the team member for not following process","Ignore it since the outcome was positive","Remove the improvement and revert to the original"],"answer":0,"why":"Even beneficial changes need documentation. Change control isn\u0027t about preventing good ideas â€” it\u0027s about ensuring visibility, traceability, and impact assessment.","mindset":"PMI mindset: process exists for traceability and control. Good outcomes don\u0027t justify bypassing governance. Document retroactively and coach.","tags":["Change Control","Integration Management"],"chapterRef":"Chapter 5 - Integrated Change Control"},{"q":"Your project has multiple changes approved and in progress simultaneously. The team is confused about which version of the project plan is current. What tool should you implement?","options":["Configuration management system to track versions of project documents and ensure everyone works from the current approved baseline","A shared folder where everyone saves their updates","Email the latest version to all team members after each change","Let each team member maintain their own copy of the plan"],"answer":0,"why":"Configuration management provides version control, ensures a single source of truth, and prevents the chaos of multiple conflicting document versions.","mindset":"PMI mindset: configuration management is how you maintain document integrity across changes. Without it, baselines become meaningless.","tags":["Configuration Management","Integration"],"chapterRef":"Chapter 5 - Configuration Management"},{"q":"A stakeholder requests a scope change. You assess it will add 3 weeks to the schedule and $50K to the budget. The stakeholder says \u0027Just absorb it.\u0027 What should you do?","options":["Present the impact analysis to the CCB/sponsor and let them make an informed decision â€” changes to baselines require formal approval, not absorption","Absorb it to maintain the stakeholder relationship","Reject the change outright since it impacts schedule and budget","Implement the change and adjust the baseline yourself"],"answer":0,"why":"Baseline changes require formal approval. The PM provides impact analysis; the CCB/sponsor decides. You don\u0027t absorb costs or reject unilaterally.","mindset":"PMI mindset: the PM doesn\u0027t approve baseline changes â€” they assess and present. Decision authority belongs to the CCB or sponsor.","tags":["Change Control","Baselines","CCB"],"chapterRef":"Chapter 5 - Integrated Change Control"},{"q":"Your project is closing. A team member asks why you\u0027re spending time on lessons learned when the project is already done. What is the BEST explanation?","options":["Lessons learned benefit future projects and the organization â€” they capture what worked and what didn\u0027t so others don\u0027t repeat mistakes","You agree it\u0027s pointless and skip it","Lessons learned are only done if the project failed","It\u0027s a PMO requirement with no real value"],"answer":0,"why":"Lessons learned are a key output of closing. They feed organizational process assets and enable continuous improvement across the enterprise.","mindset":"PMI mindset: project knowledge doesn\u0027t die with the project. Capturing and sharing lessons is how organizations mature.","tags":["Closing","Lessons Learned","Knowledge Management"],"chapterRef":"Chapter 5 - Close Project"},{"q":"Midway through execution, you discover that two work streams are building conflicting solutions to the same problem because they weren\u0027t aware of each other\u0027s work. What process failed?","options":["Direct and Manage Project Work â€” the PM failed to coordinate and integrate work across the project, allowing silos to develop","The team is incompetent","Planning was too detailed","Monitoring and controlling caught it, so the process worked"],"answer":0,"why":"Integration is the PM\u0027s core responsibility. When work streams conflict, it means coordination across the project failed â€” that\u0027s squarely a PM accountability.","mindset":"PMI mindset: integration is what makes a PM different from a team lead. You own the connections between all parts of the project.","tags":["Integration","PM Role","Coordination"],"chapterRef":"Chapter 5 - Direct and Manage Project Work"},{"q":"The CCB approves a change request. What should you do NEXT?","options":["Update the project management plan and relevant baselines to reflect the approved change, then communicate the changes to affected stakeholders","Start implementing immediately without updating documents","File the change request and forget about it","Ask the CCB to reconsider their decision"],"answer":0,"why":"Approved changes must be reflected in the plan and baselines. Without updating documentation, the team works from outdated information.","mindset":"PMI mindset: approval is not the end of change control. Update baselines, communicate, THEN implement.","tags":["Change Control","Baselines","Communication"],"chapterRef":"Chapter 5 - Integrated Change Control"},{"q":"Your project has dependencies on two other projects. One of them is behind schedule, which will impact your critical path.
