at does not conform to the customer’s requirements.","Example:","If you plan to paint a room, you should gather what color paint the stakeholders would like to have and whether it should be semi-gloss, glossy, or flat.","The more detailed requirements, the more successful the project.","Collect requirements from the most important stakeholders: the customers that will actually use the project.","Often, project managers gather requirements from the boss of the customers, who do not actually use the product themselves.","To ensure greater success, gather requirements from all stakeholders, not just a certain few.","This will ensure that the project is successful.","On a traditional project, the project manager will try to conduct this process as thoroughly as possible the first time around and then build a large plan around all these requirements to get them done.","The project will be executed and, hopefully, there will be no more requirements when the project is executed.","On an agile project, this is vastly different.","Agile project customers will continue to give requirements to the project as they become more visible and known.","Since agile projects are mostly done with products that are undefined, requirements can be expected throughout the entire duration of the project.","Inputs","Project Charter","Covered in Chapter 5.","Project Management Plan","Covered in Chapter 3.","Project Documents","Covered in Chapter 3.","Business Documents","Usually include the business case and the benefits management plan.","The business case gives the cost-benefit of doing the project.","The benefits management plan shows what benefits the organization will get from the project.","Refer to the integration management chapter for more information on these two documents.","Agreements","A contract between a buyer and a seller for work to be performed or for the sale of products.","If the project has an agreement with a vendor, then it will have the cost included in it.","Enterprise Environmental Factors","Covered in Chapter 3.","Organizational Process Assets","Covered in Chapter 3.","Page 120 – Collect Requirements","Tools and Techniques","Expert Judgment","Covered in Chapter 3.","Data Gathering","One of the main things you will be doing in this process is to collect information from the stakeholders.","You can use any of the following methods to gather their requirements:","Brainstorming","A technique where stakeholders generate and gather many ideas.","Usually allows all stakeholders to document their ideas.","Interviews","Formal or informal discussions to discover information from stakeholders.","One of the easiest ways to gather requirements.","If you're looking to gather requirements from particular stakeholders, you should just speak to them and ask what their requirements are for this project.","Focus Groups","Subject matter experts and stakeholders gather to discuss their project expectations.","Very similar to an interview done with subject matter experts.","Questionnaires and Surveys","A set of questions that will allow the project manager to collect requirements from the stakeholders.","May change depending on who the stakeholders are.","Example:","Customer questionnaires might be very detail-oriented.","Senior management surveys might not be.","Benchmarking","Looking outside the project to provide a measurement of performance.","You can observe work within your organization or in other organizations.","Example:","Looking at industry best practices for how fast a website should load once a user visits it.","Data Analysis","After gathering the requirements from the stakeholders, use a method to analyze the data.","Can include analyzing:","Documents","Agreements","Policies","Proposals","Business plans","Decision Making","Covered in Chapter 3.","Data Representations","After gathering the data, you need a method to present the data to the stakeholders.","Idea/Mind Mapping","A technique where ideas are drawn instead of written.","May help to generate new ideas.","Affinity Diagram","Allows many ideas to be put into groups.","Interpersonal and Team Skills","Nominal Group Technique","How you rank and prioritize the ideas in brainstorming.","Delphi Technique","Requirements are collected anonymously from SME’s.","This way, stakeholders cannot influence each other.","Page 121 – Collect Requirements","Observations/Conversation","Observation, also known as job shadowing, involves viewing the stakeholders in their work environment.","Observation works very well because you can watch your stakeholders show you the problem that they have with the current system and what may need to be done to fix it.","Conversations simply involve talking directly with people to understand what the requirements would be on a project.","Facilitation","Facilitation is when you bring together stakeholders to gather requirements.","One method could be a workshop.","Facilitated workshops are interactive discussions designed to quickly define requirements, solve differences, and build trust.","Having a workshop with different stakeholders allows participants to see what differences they may have regarding the project requirements and how to solve them.","One example is a joint application development (JAD) session.","In a JAD session, subject matter experts and developers meet to improve the software development processes.","User Stories","One common tool used on an agile project to help facilitate and get users involved in the project is the creation of user stories.","User stories are descriptions of required functionality and are generally developed during the requirements workshop.","User stories are generally short and simple and follow this outline:","As a <role/user type>, I want so that <motivation/reason>.","Example:","As an accounts payable clerk, I want to be able to enter bills so that I can pay all my bills on time.","In this story, the user-type is a person in the accounts payable department, their goal is to enter the bills into an accounting software, so they can get paid on time.","User stories should be non-technical and easily understandable by users.","This will allow the team to understand the true value from a user’s perspective.","These stories are generally the smallest unit of work on an agile project.","Once the stories are clearly defined, you have to ensure that it is visible to the entire team, and the team has an understanding of what users are actually looking for in the agile project.","Prototypes","Prototypes are working models of a product that stakeholders can interact with.","This gives the stakeholders a great view of what the final product will be when the project is finished.","Stakeholders will give feedback on the product and how they might want to change it to better meet their requirements.","Many software development projects use prototypes to collect stakeholder requirements as the software is being programmed.","Agile development uses prototypes extensively.","Storyboarding","One prototyping technique used on agile projects.","Generally a series of images or illustrations that are used to show a mockup of what the program would look like once a user is using it.","Example:","First image shows what the screen would look like when they first log in.","Next image shows what it would look like when they click on the accounts receivable button.","Next image shows what the screen would look like when they click on enter invoice.","Storyboarding helps users visually see what the program will look like when it’s finished.","A great way to gather requirements from users and set their expectations for when the software is finished developing.","Context Diagrams","Used to visually show how a business process, other systems, and people interact.","Use drawings to show the inputs and outputs of a system.","Page 122 – Collect Requirements","Outputs","Requirements Documentation","Documentation of the actual requirements that are needed on the project.","Requirements documentation should be very detailed.","The more detailed the documentation, the more likely the project will meet the customer’s requirements.","It could be very high-level at the beginning, but it must become very detailed before the project can be executed.","Before the project plan is approved, the requirements should be measurable, testable, and acceptable to the stakeholders of the project.","In addition to the scope requirements for the project, other components may include:","Business requirements","Stakeholder requirements","Organizational impacts","Quality requirements","Requirements, assumptions and constraints","Legal or ethical compliance","Requirements Traceability Matrix","A table that is created to link the requirements back to their origin.","Basically tracks where the requirement suggestion came from.","Tracks which stakeholder gave the requirement.","Tracks why it was added to the actual project.","Helps keep track of the requirement as the project is carried out.","Page 123 – Define Scope","Define Scope","Process where you will create the project scope statement.","All the requirements from the requirements documentation will need to be analyzed and understood.","The scope statement will select the final requirements to become the final product, service, or results of the project or phase.","The scope of the project is iterative.","In the early planning of the project, the scope may be high-level and later may become more detailed.","You may discuss the scope with the main stakeholders, such as the sponsors or customers, to ensure the scope includes all their requirements.","Once a project scope has been baselined (in the next process, “create WBS”), you will need an approved change request to change it.","External events such as adding to scope because of a competitor offering a better product would require an approved change request.","On a traditional project, this process would be done multiple times to ensure the scope is well-defined before the work actually starts.","This may take many iterations of this process to actually define what the project will include and what it will not include.","Generally, on a traditional project, the execution of the work should not start until the scope has been well defined and agreed upon.","On agile and hybrid projects where much of the work is unknown and uncertain, this process may only be done once or twice before the work actually starts.","Once the work starts and customers are more involved and actually start to see the creation of the product, then the scope would become more refined.","The initial product backlog in an agile project may only contain a few items as the customers may not know what it is that they’re looking for on this particular product.","Once the work starts and the customer starts to actually use increments of the product, they will then refine the scope and come up with more detailed scope requirements.","Exam Tip","On a traditional project, the scope of the project is stored in the project scope statement.","On an agile project, the scope or requirements are stored in the product backlog.","Inputs","Project Charter","Officially authorizes the project.","Needed to ensure the project scope statement meets the requirements in the charter.","Project Management Plan","At this point, the project management plan will not be finished.","It should contain the scope management plan that will guide the project manager through this process of developing the project scope statement.","Project Documents","Although many of the 33 documents can be used in this process, the main ones should be:","Requirements documentation, which contains the requirements for the project.","Risk register to show what risks can affect the scope.","Enterprise Environmental Factors","Covered in Chapter 3.","Organizational Process Assets","Covered in Chapter 3.","Page 124 – Define Scope","Tools and Techniques","Expert Judgment","Covered in Chapter 3.","Data Analysis","Covered in Chapter 3.","Decision Making","Covered in Chapter 3.","Interpersonal and Team Skills","Covered in Chapter 3.","Product Analysis","If a project has a product as the deliverable, you will need to analyze the product to ensure it matches the requirements of the stakeholders.","Output","Project Scope Statement","One of the most important documents to be created in the planning processes.","Should include the project and the product scope.","Main purpose is to describe in detail the project deliverables and the work that will be required to produce those deliverables.","The greater the detail of the scope, the better the team will understand how to reach a successful project end state.","The less detail in the scope statement, the greater the chance of project risks, as well as the possibility of greater scope creep.","Details should include, but not be limited to:","Description of the product scope.","Detailed list of the deliverables.","Acceptance criteria:","That which must be done in order to have the deliverable accepted.","Exclusions:","Should state what the project will not get done or accomplished.","Example: If installing a phone system that will not include voice-to-email, this should be listed under exclusions.","Constraints:","If the project is limited by time or cost, it should be stated.","If a project has a preset budget, this may be listed as a constraint since the scope will be impacted by it.","Assumptions:","If the project team has any assumptions, these should also be stated.","Example: In an operating system upgrade project, the team may assume there is no need for hardware upgrades since all the hardware is one year old.","The project scope statement is a very detailed document.","The more detailed it is, the more likely you are to reach the successful completion of the project.","The project charter is a high-level document that was just used to authorize the project to get started.","The scope statement is a more specific and detailed project charter that will be used by the project team to execute the project.","Exam Tip","The scope statement tells you what the project will not be doing, not just what it will be doing.","At a minimum, all scope statements should have a detailed list of deliverables.","Project Documents Updates","Covered in Chapter 3.","Page 125 – Create WBS (Work Breakdown Structure)","Create WBS (Work Breakdown Structure)","Process of breaking down the deliverables into smaller, more manageable components (decomposition).","Main output of this process is the scope baseline.","The scope baseline includes:","Scope statement","WBS","WBS dictionary","Very important process for the creation of the project management plan.","It is where the work listed in the scope statement is broken down.","It will detail the work needed to complete the project deliverables.","The scope baseline is the main output.","Inputs","Project Management Plan","At this point, the project management plan will not be finished.","It should contain the scope management plan that will guide the project manager throughout this process of developing the scope baseline.","Project Documents","Although many of the 33 documents can be used in this process, the main ones should be:","Requirements documentation, which contains the requirements for the project.","Scope statement, which will have the deliverables of the project.","Enterprise Environmental Factors","Covered in Chapter 3.","Organizational Process Assets","Covered in Chapter 3.","Tools and Techniques","Decomposition","A technique in which you take the project deliverables from the scope statement and divide them into smaller parts, known as work packages.","Work packages are the lowest level on the WBS that will be used for estimating time and cost.","Since all projects are unique, the level of detail that needs to be broken down will depend on the project and the project team.","The project manager will need to decide how much detail will be needed to accurately estimate the cost, time, and resource assignments.","If the WBS is too high-level, the estimates may not be accurate.","Expert Judgment","Covered in Chapter 3.","Outputs","Scope Baseline","Main output of this process.","One of the three baselines and one of the main components in the project management plan.","Made up of three components:","Project scope statement","WBS","WBS dictionary","Page 126 – Create WBS (Work Breakdown Structure)","WBS","The WBS is the subdivided work that needs to get done to produce the project deliverables listed in the scope statement.","It provides a structure for the summation of cost, schedule, and resource information.","The WBS is hierarchical in design.","The top-level is very general and the lower level is very detailed.","The WBS will have control accounts that are broken down into work packages.","All control accounts have one or more work packages associated with them.","Complex projects may not be able to decompose all the deliverables at the start of the project.","The team might wait until the work is better understood, then decompose them.","This is known as rolling wave planning.","WBS Example Diagram","Project Name","Control Account","Work Package","Work Package","Work Package","Control Account","Work Package","Work Package","Work Package","Control Account","Work Package","Work Package","Work Package","Sample WBS illustrating control accounts and work packages.","Sample WBS by Phases – Phone System Upgrade","1.0 Phone System Upgrade","1.1 Collect Requirements","1.1.1 List All Stakeholders","1.1.2 Interview Stakeholders","1.1.3 Create Requirements Documentation","1.2 Select Phone System","1.2.1 Research Available Systems","1.2.2 Demo Systems","1.2.3 Purchase System","1.3 Install System","1.3.1 Configure Server Software","1.3.2 Configure Network Components","1.3.3 Install New Phones on Desk","1.3.4 Configure Individual Phones","1.4 Test System","1.4.1 Test Server Configurations","1.4.2 Test Network Configurations","1.4.3 Test Individual Phones","1.4.4 User Acceptance Testing","1.5 Train Users","1.5.1 Create Training Course Material","1.5.2 Conduct Training Sessions","Sample WBS by phases upgrading a phone system for a company.","Page 127 – Create WBS (Work Breakdown Structure)","WBS Dictionary","The WBS Dictionary is a document that has more details about each work package in the WBS.","It supports the WBS.","Information in the WBS dictionary includes:","A more detailed description of the work","Scheduling","Cost estimates","Assumptions","Constraints","Acceptance criteria","WBS Dictionary Example","Project Name: Phone System Upgrade","Work Package ID","1.3.1","Work Package Name","Configure Server Software","Work Package Description","Install a new virtual server.","Install the phone server software.","Configure the software to support 100 phones and voice mail to email.","Ensure all updates are applied to the operating system before installing the phone system software.","Assigned To","Bob Peterson","Duration","5 Days","Date Assigned","12/30/2017","Due Date","1/30/2018","Estimated Cost","$5,000","Account Code","PSU-882.3","Project Scope Statement","The scope is a detailed list of the project deliverables.","Exam Tip","The scope baseline includes the scope statement, WBS, and WBS dictionary.","After the project plan is approved and the project is executed, any changes to the scope baseline will need a change request.","Work that was not within the scope of the project charter should not be approved.","Project Documents Updates","Covered in Chapter 3.","Agile Work Decomposition","On an agile project, it is important to understand how work is decomposed.","Agile projects use the concepts of:","Epics","Features","Stories","The epic is decomposed into features.","Features are decomposed into user stories.","Epic → Feature → Story → Task","Epics","Generally large initiatives to deliver new products or solutions to the customer.","Generally made up of a large collection of different features and a span of multiple releases.","Example:","An epic may be to create an entire accounting system for an organization.","Different features of this epic may be in the Accounts Payable section, accounts receivable section, and payroll.","User stories will be a decomposition of the features.","Example user story:","As an accounts receivable personnel, I would like to input invoices, so we can receive payments on time.","Page 128 – Create WBS (Work Breakdown Structure)","Agile Decomposition Example","Epic","Create Accounting System","Features","Accounts Receivable","Payroll","Stories","Enter Invoice","Create Sales","Create Paychecks","Tasks","Tasks are the decomposition of user stories.","Example tasks:","Enter the customer’s name into the accounting system.","Create an invoice.","Send the invoice.","Definition of Done","A shared understanding of what it means when work is considered finished between the customers and the project team.","The team agrees on and displays a list of criteria that must be met before a product increment is considered done.","Failure to meet these criteria at the end of a sprint normally implies that the work should not be counted toward that sprint’s velocity.","Breaking down the work from an epic to a task will allow both the team and product owner to define what done means.","Generally, this will be tested once the iteration is over, and the customer reviews it.","Page 129 – Validate Scope","Validate Scope","Process where the project deliverables are formally inspected and accepted by the customer or sponsor.","The customer or sponsor actually inspects the deliverable to see if it meets their requirements.","If it does, then you will get the main output of the accepted deliverable.","If the customer finds that it doesn’t meet their requirements, then you will need to repair it (change request).","This process is done at the very end of all the executing and monitoring and controlling processes.","After completing the executing and monitoring and controlling processes, you will have a deliverable.","After the customer or sponsor has accepted the deliverables, then the project can be formally closed in the “close project or phase” process.","The output of this process, the accepted deliverable, is the input to the “close project or phase” process.","This process is done immediately after “control quality,” or sometimes they can be done together.","“Control quality” is the process where the deliverable is inspected to see if it meets the quality requirements.","Before taking a deliverable to a customer or sponsor for formal acceptance, the project manager should have inspected the deliverable to ensure it meets the quality requirements.","Quality requirements ensure the deliverable is correct and need to be checked before they can be formally accepted.","Example:","Ensure that the painted room has been painted correctly before calling in the sponsor to formally accept the job.","The output of “control quality,” a verified deliverable, is the input to this process.","You will generally perform the “control quality” process, then the “validate scope” process.","In some projects, both processes can be done at the same time.","Inputs","Project Management Plan","Consists of the scope baseline and the scope management plan.","These documents will tell the project manager and the team the steps needed to get the scope validated.","Project Documents","Although the project manager can use any of the 33 project documents to get the deliverable accepted, they’re most likely to use:","Requirements traceability matrix","Requirements documentation","Lessons learned register","Quality reports","Verified Deliverables","Output of the control quality process.","A deliverable that has been inspected to ensure that quality requirements have been met.","Work Performance Data","The raw information of the work that was done to create the project deliverables.","Tools and Techniques","Inspection","Main tool of this process.","The customer or sponsor will need to measure, examine, and validate that the deliverable meets his/her requirements.","Can include:","Walk-throughs","Audits","Visual inspection","Example:","Inspecting a painted room.","Page 130 – Validate Scope","Tools and Techniques","Decision Making","Covered in Chapter 3.","Outputs","Accepted Deliverables","Deliverables that have met the acceptance criteria and have been formally signed off by the customer or sponsor.","Once you have the accepted deliverable, you are ready to formally close the project or phase.","This output of accepted deliverable will become the input to the integration process of “close project or phase.”","Change Requests","If the deliverable does not meet the acceptance criteria and cannot be accepted, you may need to spend more time and money to fix it.","This will lead to a change request where the defect will need to be repaired.","Example:","If you painted the room with the wrong shade of green paint, you would need additional time and money to repair it correctly.","Work Performance Information","Gives the status of the deliverables.","States its progress, such as if it was accepted or needs to be fixed.","Project Documents Updates","Covered in Chapter 3.","Page 131 – Control Scope","Control Scope","Goal is to ensure that the project stays on the scope as it is executed.","Basically “controlling” the scope.","Ensure that the work the project team is doing is actually within the scope of the project.","The project manager will need to monitor the scope to ensure that unapproved changes are not added to the scope.","Unapproved expansion of the scope is known as scope creep.","Process where you’re looking at the actual work getting done in comparison to the project plan.","The project manager determines if there are any changes to the scope made during the work progress.","If the project manager detects a modified scope, he/she will need to get a change request to bring the project back on plan.","Do not confuse this process with “validate scope.”","Validate scope is where you get the project deliverables formally accepted.","Validate scope is done at the end of the project, after the deliverable has been made.","Control scope is done on a daily basis to ensure the project stays within the scope.","In other words:","“Validate scope” is done at the end when the deliverable is finished.","“Control scope” is done every single day the project is being executed to ensure the project stays within the scope.","On a traditional project, it is important to control the scope to ensure there are no unauthorized changes or modifications to the scope as the work is getting done.","It’s not uncommon for the project manager on a traditional project to discover team members doing work that is outside of the project scope.","When this happens, the project manager would either:","Submit a change request to the change control board in order to add that additional work in.","Tell the team members not to do it and stop that particular unauthorized change.","On agile and hybrid projects, changes are welcome and are less controlled by the scope.","Any time a customer wants to add a feature or make a scope change to the project, it is welcomed and added to the product backlog, where it will be prioritized by the product owner.","Exam Tip","On a traditional project, any changes to the scope must go through the perform integrated change control process, where this change must be reviewed and authorized.","On an agile or hybrid project, any changes to the features of the product would just be added to the product backlog and be prioritized by the product owner.","Inputs","Project Management Plan","Includes the scope baseline and the scope management plan.","The plan will tell us how to control the scope as the project progresses.","The scope baseline will outline what to look for as the work is getting done.","Other plans that may be needed to control the scope may include:","Change management plan","Configuration management plan","Requirements management plan","Project Documents","Although the project manager can use any of the 33 project documents to control the scope, they’re most likely to use:","Requirements traceability matrix","Requirements documentation","Lessons learned register","Quality reports","Page 132 – Control Scope","Inputs","Work Performance Data","A very important input to this process since this will document the actual work that is getting done.","This is the raw information of the work that was done on the deliverable.","Compared with the scope baseline in the project management plan to see if the project is within the scope.","Organizational Process Assets","Covered in Chapter 3.","Tools and Techniques","Data Analysis","As the project is progressing and the project manager is monitoring the scope, he/she will need a method to analyze the data.","Two methods are:","Variance analysis","Trend analysis","Variance Analysis","Determines if there is a variance between the planned work (project management plan) and the actual work (work performance data).","The project manager will need to ensure that there is no variance on the project that is related to scope.","If there is a variance between planned and actual work, the project manager might need a change request to fix the project scope.","Trend Analysis","Used to determine if a trend is emerging as the project progresses.","Example:","Is the project regularly staying within the scope, or is it frequently going beyond the scope?","The project manager will need to analyze the trend in order to assess what is happening in terms of scope.","Outputs","Work Performance Information","States the difference between the planned work of scope and the actual work on the project.","This is the status of the scope of the project.","Basically, it will state if the project is on scope or not.","Change Requests","If the project is off the scope, the project manager may need to get a change request.","The change request can include the corrective or preventive actions needed to bring the project back on scope.","Project Management Plan Updates","Covered in Chapter 3.","Project Documents Updates","Covered in Chapter 3.","Organizational Process Assets Updates","Covered in Chapter 3.","Exam Tip","All of the monitoring and controlling processes (starting with “validate scope”) on the process table have the project management plan and work performance data as inputs.","They then have an output of work performance information and change requests.","To control a project:","Look at the planned work (project management plan) and the actual work (work performance data).","Compare them to see if they match up.","This creates the work performance information.","The output of all these processes will be:","Work performance information (status of the work)","Change requests","Change requests are needed in case there’s something wrong with that section of the project.","These would be addressed by implementing corrective or preventive actions, if necessary, to bring the project back on track."],"examples":["Example: A Microsoft exchange server that allows you to send e-mails, receive e-mails, and synchronize contacts and calendars.","Example: Installing a Microsoft exchange server and updating all user accounts and all user workstations.","Example:","Example:","Example:","Example:","Example:","Example:"],"podcast":[{"speaker":"Maya","text":"Welcome to Chapter 6: Project Scope Management. This chapter focuses on what the project will accomplish and how to protect the project from work outside the scope."},{"speaker":"Jordan","text":"Right. The notes make the distinction between product scope and project scope. Product scope is the features and functions, while project scope is the work needed to deliver them."},{"speaker":"Maya","text":"A big warning in this chapter is gold plating. That is extra work that is not in the scope baseline, and it is not allowed because it can increase risk, cost, schedule problems, and quality problems."},{"speaker":"Jordan","text":"The planning processes include Plan Scope Management, Collect Requirements, Define Scope, and Create WBS."},{"speaker":"Maya","text":"Plan Scope Management creates the scope management plan and requirements management plan. These are how-to plans for managing scope and requirements."},{"speaker":"Jordan","text":"Collect Requirements is where stakeholders needs are defined and documented to meet project objectives."},{"speaker":"Maya","text":"The outputs are requirements documentation and the requirements traceability matrix, which links requirements back to their origin."},{"speaker":"Jordan","text":"Define Scope creates the project scope statement. The notes say this is one of the most important planning documents and should include both project and product scope."},{"speaker":"Maya","text":"The scope statement includes deliverables, acceptance criteria, exclusions, constraints, and assumptions."},{"speaker":"Jordan","text":"Create WBS breaks down deliverables into smaller work packages. Its main output is the scope baseline."},{"speaker":"Maya","text":"The scope baseline includes the project scope statement, WBS, and WBS dictionary."},{"speaker":"Jordan","text":"The WBS dictionary supports the WBS with details about each work package, including description, schedule, cost estimates, assumptions, constraints, and acceptance criteria."},{"speaker":"Maya","text":"On agile projects, work is decomposed from epic to feature to story to task."},{"speaker":"Jordan","text":"Definition of Done is a shared understanding of what it means when work is finished between the customer and project team."},{"speaker":"Maya","text":"Validate Scope is where deliverables are formally inspected and accepted by the customer or sponsor."},{"speaker":"Jordan","text":"Control Quality usually happens before Validate Scope because the deliverable should be checked for quality before formal acceptance."},{"speaker":"Maya","text":"Control Scope is different. It is done on a daily basis to make sure the project stays within scope."},{"speaker":"Jordan","text":"Unapproved expansion of scope is scope creep. On traditional projects, scope changes must go through integrated change control."},{"speaker":"Maya","text":"On agile or hybrid projects, feature changes are added to the product backlog and prioritized by the product owner."},{"speaker":"Jordan","text":"The key exam trap is Validate Scope versus Control Scope: validate is formal acceptance at the end; control is daily monitoring to stay on scope."}],"questions":[{"q": "What is project scope?", "options": ["The work needed to deliver a product, service, or result with specified features", "The features and functions that characterize the final product itself", "Extra work added by the team to improve the deliverable quality", "A list of all stakeholder names and their contact information"], "answer": 0, "why": "Project scope is the work required to deliver the product. Product scope is the features themselves.", "mindset": "Project scope = the work. Product scope = what the product does.", "tags": ["Scope", "Concept"], "chapterRef": "Chapter 6 - Project vs Product Scope"}, {"q": "What is product scope?", "options": ["Features and functions that characterize a product, service, or result", "The work required to deliver the product to the customer", "The project manager's authority level on the project", "The change control process for handling scope requests"], "answer": 0, "why": "Product scope describes what the product can do â€” its features and functions.", "mindset": "Product scope = capabilities. Project scope = work to build it.", "tags": ["Scope", "Concept"], "chapterRef": "Chapter 6 - Product Scope"}, {"q": "What is gold plating?", "options": ["Doing extra work not in the scope baseline without authorization", "Adding approved scope through the formal change control process", "Breaking deliverables into smaller work packages for estimating", "Formally accepting completed deliverables from the project team"], "answer": 0, "why": "Gold plating is extra work outside the scope baseline â€” it's not allowed because it increases risk.", "mindset": "Don't add extras. Stick to the approved scope.", "tags": ["Scope", "Exam Trap"], "chapterRef": "Chapter 6 - Gold Plating"}, {"q": "What are the main outputs of Plan Scope Management?", "options": ["Scope management plan and requirements management plan", "Project charter and assumption log", "Accepted deliverables and work performance information", "Scope baseline and change requests"], "answer": 0, "why": "Plan Scope Management creates the scope management plan and requirements management plan.", "mindset": "Plan Scope Management creates how-to plans for managing scope.", "tags": ["ITTO", "Planning"], "chapterRef": "Chapter 6 - Plan Scope Management"}, {"q": "What does the scope management plan document?", "options": ["How to write, baseline, validate, and control the scope", "How to calculate return on investment for the project", "How to close all procurement contracts with sellers", "How to estimate activity durations using PERT formula"], "answer": 0, "why": "The scope management plan documents how scope will be defined, baselined, validated, and controlled.", "mindset": "Management plans are how-to guides for their knowledge area.", "tags": ["Planning", "Concept"], "chapterRef": "Chapter 6 - Scope Management Plan"}, {"q": "What is the purpose of Collect Requirements?", "options": ["Defining and documenting stakeholder needs to meet project objectives", "Formally accepting final deliverables from the project team", "Approving all change requests submitted by stakeholders", "Creating the final project report for the sponsor"], "answer": 0, "why": "Collect Requirements defines and documents what stakeholders need for project success.", "mindset": "Requirements come from stakeholders â€” gather them thoroughly.", "tags": ["Planning", "Requirements"], "chapterRef": "Chapter 6 - Collect Requirements"}, {"q": "What are the main outputs of Collect Requirements?", "options": ["Requirements documentation and requirements traceability matrix", "Project scope statement and work breakdown structure", "Scope baseline and WBS dictionary documents", "Accepted deliverables and formal change requests"], "answer": 0, "why": "Collect Requirements produces the requirements documentation and RTM.", "mindset": "RTM traces requirements back to their origin.", "tags": ["ITTO", "Requirements"], "chapterRef": "Chapter 6 - Collect Requirements Outputs"}, {"q": "What does the Requirements Traceability Matrix do?", "options": ["Links each requirement back to its origin and tracks it throughout", "Approves the project charter for the sponsor's signature", "Stores the final project report and lessons learned", "Breaks deliverables into work packages for estimating"], "answer": 0, "why": "The RTM links requirements to their origin and tracks them through the project lifecycle.", "mindset": "Traceability ensures nothing falls through the cracks.", "tags": ["Requirements", "Planning"], "chapterRef": "Chapter 6 - RTM"}, {"q": "On a traditional project, where is the scope stored?", "options": ["In the project scope statement", "In the product backlog", "In the issue log only", "In the final project report"], "answer": 0, "why": "On traditional projects, scope is stored in the project scope statement.", "mindset": "Traditional = scope statement. Agile = product backlog.", "tags": ["Scope", "Exam Trap"], "chapterRef": "Chapter 6 - Scope Storage"}, {"q": "On an agile project, where are requirements stored?", "options": ["In the product backlog", "In the project scope statement only", "In the final project report", "In the procurement contract"], "answer": 0, "why": "On agile projects, scope/requirements are stored in the product backlog.", "mindset": "Agile backlog = living requirements document.", "tags": ["Agile", "Exam Trap"], "chapterRef": "Chapter 6 - Agile Scope"}, {"q": "What is the main output of Define Scope?", "options": ["Project scope statement", "Scope baseline", "Accepted deliverables", "Work performance reports"], "answer": 0, "why": "Define Scope creates the project scope statement â€” a detailed description of project deliverables.", "mindset": "Define Scope = scope statement.", "tags": ["ITTO", "Scope"], "chapterRef": "Chapter 6 - Define Scope"}, {"q": "What should the scope statement include?", "options": ["Deliverables, acceptance criteria, exclusions, constraints, and assumptions", "Only the project manager's name and authority level", "Only the final budget number approved by the sponsor", "Only the list of team members assigned to the project"], "answer": 0, "why": "The scope statement includes deliverables, acceptance criteria, exclusions, constraints, and assumptions.", "mindset": "Scope statement tells what IS and what ISN'T in scope.", "tags": ["Scope", "Concept"], "chapterRef": "Chapter 6 - Scope Statement Contents"}, {"q": "What is the main output of Create WBS?", "options": ["Scope baseline", "Requirements documentation", "Accepted deliverables", "Work performance reports"], "answer": 0, "why": "Create WBS produces the scope baseline (scope statement + WBS + WBS dictionary).", "mindset": "Create WBS = scope baseline.", "tags": ["ITTO", "WBS"], "chapterRef": "Chapter 6 - Create WBS"}, {"q": "What three components make up the scope baseline?", "options": ["Project scope statement, WBS, and WBS dictionary", "Scope management plan, cost baseline, and schedule baseline", "Product backlog, sprint backlog, and definition of done", "Issue log, risk register, and lessons learned register"], "answer": 0, "why": "Scope baseline = scope statement + WBS + WBS dictionary.", "mindset": "Three components form the scope baseline.", "tags": ["Baseline", "Exam Trap"], "chapterRef": "Chapter 6 - Scope Baseline"}, {"q": "What is decomposition in Create WBS?", "options": ["Dividing deliverables into smaller, more manageable work packages", "Accepting deliverables from the customer for formal sign-off", "Approving change requests through the change control board", "Surveying stakeholders anonymously to gather requirements"], "answer": 0, "why": "Decomposition breaks project deliverables into smaller parts called work packages.", "mindset": "Decomposition = breaking big into small.", "tags": ["WBS", "Concept"], "chapterRef": "Chapter 6 - Decomposition"}, {"q": "What is a work package?", "options": ["The lowest level on the WBS used for estimating time and cost", "A high-level business case document for project justification", "A stakeholder survey form used during requirements gathering", "An approved change request logged in the change control system"], "answer": 0, "why": "Work packages are the lowest WBS level â€” detailed enough to estimate time and cost.", "mindset": "Work package = lowest estimatable level.", "tags": ["WBS", "Concept"], "chapterRef": "Chapter 6 - Work Packages"}, {"q": "What is the agile work decomposition order?", "options": ["Epic â†’ Feature â†’ Story â†’ Task", "Task â†’ Story â†’ Feature â†’ Epic", "Scope statement â†’ Charter â†’ Final report", "Risk â†’ Issue â†’ Change â†’ Baseline"], "answer": 0, "why": "Agile decomposes from Epic to Feature to Story to Task.", "mindset": "Epic is biggest, task is smallest.", "tags": ["Agile", "WBS"], "chapterRef": "Chapter 6 - Agile Decomposition"}, {"q": "What is Definition of Done?", "options": ["A shared understanding of what it means when work is considered finished", "A list of all identified project risks and their owners", "A contract closeout form signed by both buyer and seller", "A method for calculating cost variance on the project"], "answer": 0, "why": "DoD is a shared understanding between customer and team of what 'finished' means.", "mindset": "Done must mean the same thing to everyone.", "tags": ["Agile", "Concept"], "chapterRef": "Chapter 6 - Definition of Done"}, {"q": "What is the purpose of Validate Scope?", "options": ["Formal inspection and acceptance of deliverables by customer or sponsor", "Daily monitoring to keep the project within approved scope boundaries", "Creating the WBS dictionary for each work package identified", "Gathering stakeholder requirements during the planning phase"], "answer": 0, "why": "Validate Scope is where deliverables are formally inspected and accepted.", "mindset": "Validate = formal acceptance at the end.", "tags": ["Scope", "Exam Trap"], "chapterRef": "Chapter 6 - Validate Scope"}, {"q": "What is the purpose of Control Scope?", "options": ["Ensuring the project stays within approved scope during execution", "Formally accepting completed deliverables from the team", "Creating the project charter during initiation", "Closing the project phase and releasing resources"], "answer": 0, "why": "Control Scope ensures no unauthorized changes are added â€” done daily during execution.", "mindset": "Control = daily monitoring. Validate = end acceptance.", "tags": ["Scope", "Exam Trap"], "chapterRef": "Chapter 6 - Control Scope"}, {"q": "What is scope creep?", "options": ["Unapproved expansion of scope without going through change control", "Approved scope additions through the formal change process", "Reducing scope to meet the project budget constraints", "Decomposing deliverables into work packages for the WBS"], "answer": 0, "why": "Scope creep is unapproved scope expansion â€” changes added without proper authorization.", "mindset": "Scope creep bypasses change control. It's never acceptable.", "tags": ["Scope", "Change Control"], "chapterRef": "Chapter 6 - Scope Creep"}, {"q": "What process comes immediately before Validate Scope?", "options": ["Control Quality â€” deliverables are checked for quality before acceptance", "Define Scope â€” the scope statement is written before acceptance", "Collect Requirements â€” requirements are gathered before acceptance", "Close Project â€” the project is closed before acceptance"], "answer": 0, "why": "Control Quality checks deliverables meet quality requirements before they go to Validate Scope for formal acceptance.", "mindset": "Quality check first, then formal acceptance.", "tags": ["Process", "Quality"], "chapterRef": "Chapter 6 - Validate Scope"}, {"q": "What is a user story in agile?", "options": ["A short description of required functionality from the user's perspective", "A formal project charter signed by the executive sponsor", "A detailed work breakdown structure with all work packages", "A contract negotiation document between buyer and seller"], "answer": 0, "why": "User stories describe required functionality from the user's perspective in simple, non-technical language.", "mindset": "User stories capture what the user needs and why.", "tags": ["Agile", "Requirements"], "chapterRef": "Chapter 6 - User Stories"}, {"q": "What is the format of a user story?", "options": ["As a [role], I want [goal] so that [reason]", "Given [context], When [action], Then [result]", "Input [data], Process [steps], Output [deliverable]", "Plan [scope], Execute [work], Close [phase]"], "answer": 0, "why": "User stories follow: As a [role], I want [goal] so that [motivation/reason].", "mindset": "Role + goal + motivation = user story.", "tags": ["Agile", "Requirements"], "chapterRef": "Chapter 6 - User Story Format"}, {"q": "What does the WBS dictionary contain?", "options": ["Detailed descriptions, scheduling, cost estimates, and acceptance criteria", "Only the project manager's name and contact phone number", "Only the final project budget and overall timeline", "Only the list of all approved change requests"], "answer": 0, "why": "The WBS dictionary supports the WBS with details about each work package.", "mindset": "WBS dictionary = detail behind each work package.", "tags": ["WBS", "Concept"], "chapterRef": "Chapter 6 - WBS Dictionary"}, {"q": "What tools can be used to collect requirements?", "options": ["Brainstorming, interviews, focus groups, questionnaires, and prototypes", "Only the Delphi technique and nothing else", "Only the critical path method for scheduling", "Only earned value management formulas for cost"], "answer": 0, "why": "Multiple techniques are available: brainstorming, interviews, focus groups, surveys, prototyping, etc.", "mindset": "Use multiple techniques to get complete requirements.", "tags": ["Requirements", "Tools"], "chapterRef": "Chapter 6 - Requirements Gathering Tools"}, {"q": "The customer accepts 9 of 10 deliverables but rejects one — even though it matches documented requirements. What should you do?", "options": ["Discuss the gap between documentation and expectations to understand what's actually needed", "Tell the customer they approved the requirements so they must accept the deliverable", "Redo the rejected deliverable immediately without submitting a formal change request", "Escalate to the legal department since the customer is being unreasonable"], "answer": 0, "why": "Requirements may have been technically correct but incomplete. Bridge the gap, don't hide behind paperwork.", "mindset": "PMI mindset: if the customer isn't satisfied, understand why before forcing acceptance.", "tags": ["Scope Validation", "Requirements"], "chapterRef": "Chapter 6 - Validate Scope"}, {"q": "A senior stakeholder keeps adding small requirements directly to team members without going through you. What should you do FIRST?", "options": ["Meet with the stakeholder privately to explain why changes must go through change control", "Ignore the small additions since they don't significantly impact the project schedule", "Tell the team to immediately reject all requests that come from this stakeholder", "Add all the extra work to the scope baseline without documenting it formally"], "answer": 0, "why": "Scope creep happens through bypassed processes. Address the root cause — the stakeholder's behavior.", "mindset": "PMI mindset: address scope creep at the source, not just the symptom.", "tags": ["Scope Creep", "Stakeholder Management"], "chapterRef": "Chapter 6 - Control Scope"}, {"q": "A team member asks why you can't just list all tasks instead of creating a hierarchical WBS. What is the BEST explanation?", "options": ["The WBS ensures nothing is missed and enables accurate estimating at each level", "You agree that a flat task list would be simpler and more efficient for the team", "The WBS is required by PMI regardless of whether it actually helps the project", "Tell them to follow the process without explaining the reasoning behind it"], "answer": 0, "why": "WBS provides structure for complete coverage, accurate estimates, and clear accountability.", "mindset": "PMI mindset: structure enables control. A flat list loses hierarchy and traceability.", "tags": ["WBS", "Decomposition"], "chapterRef": "Chapter 6 - Create WBS"}, {"q": "Two stakeholder groups provide conflicting requirements for the same feature. What should you do?", "options": ["Facilitate a meeting to find common ground and escalate to the sponsor if needed", "Pick whichever stakeholder group has more organizational authority and power", "Include both conflicting requirements and let the development team figure it out", "Exclude both conflicting requirements from the scope to avoid any further conflict"], "answer": 0, "why": "Conflicting requirements must be resolved before entering the baseline. Facilitate alignment first.", "mindset": "PMI mindset: facilitate resolution. Escalate only if you can't resolve at your level.", "tags": ["Requirements", "Conflict Resolution"], "chapterRef": "Chapter 6 - Collect Requirements"}, {"q": "A customer asks for a small feature not in scope. The team has capacity. Should you just add it?", "options": ["No — submit it through change control regardless of size to protect baseline integrity", "Yes — it's small enough to absorb without any documentation or formal process", "Yes — keeping the customer happy is always more important than following process", "Add it to the work but don't bother updating the WBS or scope statement"], "answer": 0, "why": "All scope changes go through change control. Small untracked changes accumulate into scope creep.", "mindset": "PMI mindset: no change is too small for change control.", "tags": ["Change Control", "Scope Creep"], "chapterRef": "Chapter 6 - Control Scope"}, {"q": "Your scope statement says 'build a mobile app' but the team asks: iOS only, Android only, or both? When should this have been clarified?", "options": ["During scope definition — the scope statement should have specified platform requirements", "During execution — it's normal to figure this out while building the product", "During closing — you'll know by then what you actually built and delivered", "It doesn't matter — just build both platforms and the customer will be satisfied"], "answer": 0, "why": "Scope ambiguity should be resolved during planning. Vague scope creates costly mid-project confusion.", "mindset": "PMI mindset: invest in clear scope statements during planning.", "tags": ["Scope Definition", "Requirements Clarity"], "chapterRef": "Chapter 6 - Define Scope"}, {"q": "Your RTM shows 3 requirements with no corresponding WBS work packages. What does this indicate?", "options": ["Those requirements won't be delivered unless work packages are created for them", "The traceability matrix is incorrect and should be updated to remove them", "Requirements don't actually need to map to WBS elements to be delivered", "Those requirements are implied by other work and don't need explicit packages"], "answer": 0, "why": "If a requirement has no work mapped to it, it won't be delivered. This gap must be addressed immediately.", "mindset": "PMI mindset: traceability ensures every requirement has work assigned.", "tags": ["RTM", "WBS"], "chapterRef": "Chapter 6 - Requirements Traceability"}, {"q": "A new stakeholder joins after WBS approval and says their needs aren't represented. What should you do?", "options": ["Review the WBS with them, identify gaps, and submit a change request if scope needs updating", "Ignore them since the WBS was already approved and baselined by the sponsor", "Redo the entire WBS from scratch to incorporate their complete set of requirements", "Tell them they missed their chance and will need to wait for the next project"], "answer": 0, "why": "New stakeholders may reveal genuine gaps. Assess, then use change control to address them properly.", "mindset": "PMI mindset: the WBS is baselined but not permanent. Address gaps through proper process.", "tags": ["WBS", "Stakeholder Management"], "chapterRef": "Chapter 6 - Create WBS"}, {"q": "During sprint review, the PO validates the increment but wants a small enhancement before release. What should you do?", "options": ["Treat it as a new backlog item to be prioritized against other work in future sprints", "Add it immediately since the PO owns the backlog and can add anything they want", "Refuse because the increment was already validated and accepted by the PO", "Release without the enhancement and never bring it up again"], "answer": 0, "why": "New requests go to the backlog for prioritization, not directly into current work.", "mindset": "PMI mindset: even in agile, scope has iteration boundaries.", "tags": ["Agile", "Backlog"], "chapterRef": "Chapter 6 - Agile Scope"}, {"q": "The scope statement doesn't mention what's excluded from the project. A team member asks how to know what's out of scope. What should you recommend?", "options": ["The scope statement should explicitly include exclusions to prevent assumptions and creep", "Exclusions don't need to be documented since they should be obvious to everyone", "The WBS covers everything needed so exclusions are automatically implied by omission", "Only the project charter should address what's excluded from the project work"], "answer": 0, "why": "Explicit exclusions prevent misunderstandings. If something is commonly assumed to be in scope but isn't, call it out.", "mindset": "PMI mindset: what's NOT in scope is as important as what IS.", "tags": ["Scope Statement", "Exclusions"], "chapterRef": "Chapter 6 - Define Scope"}]},{"id":7,"title":"Chapter 7: Schedule Management","summary":"Schedule management focuses on creating the schedule baseline, building the project schedule, and controlling schedule performance.","notes":["Schedule management includes creating the schedule baseline, building the project schedule, and keeping the project on schedule.","The six schedule management processes are Plan Schedule Management, Define Activities, Sequence Activities, Estimate Activity Durations, Develop Schedule, and Control Schedule.","Critical Path Method is a guaranteed exam topic and uses a network diagram, forward pass, and backward pass.","Critical path is the longest path through the network diagram and determines project duration.","Activities on the critical path have no float.","Crashing adds resources, increases cost, and may increase risk.","Fast-tracking performs activities in parallel, reduces time, and increases risk.","Agile scheduling uses iterations, release plans, iteration plans, velocity, burn charts, lead time, cycle time, and WIP."],"examples":["If Activity B cannot start until Activity A finishes, that is Finish-to-Start.","If an activity on the critical path slips by two days, the project completion date slips by two days unless corrective action is taken.","If a project needs to finish sooner and the team adds resources, that is crashing.","If two activities are performed at the same time to shorten the schedule, that is fast-tracking."],"podcast":[{"speaker":"Host 1","text":"Let’s go deeper into Chapter 7, Schedule Management. This chapter is one of those PMP chapters where you cannot just memorize a few words and hope for the best. You need to understand the flow of how a schedule is built, how it is protected, and how the project manager reacts when the schedule starts slipping."},{"speaker":"Host 2","text":"Exactly. The big purpose of schedule management is timely project completion. That sounds simple, but underneath that are processes, dependencies, duration estimates, baselines, compression techniques, agile scheduling, and critical path math."},{"speaker":"Host 1","text":"So let’s anchor the chapter first. The project manager needs to create a schedule baseline, build the project schedule, and then ensure the project stays on schedule. That means the schedule is not just a calendar. It is a performance baseline."},{"speaker":"Host 2","text":"And the exam loves that distinction. A schedule baseline is the approved version of the schedule. Once approved, you do not casually change it. If a schedule change impacts the baseline, it needs to go through formal change control."},{"speaker":"Host 1","text":"The six schedule management processes are Plan Schedule Management, Define Activities, Sequence Activities, Estimate Activity Durations, Develop Schedule, and Control Schedule."},{"speaker":"Host 2","text":"Think of that as a natural build. First decide how scheduling will be managed. Then break the work into activities. Then put those activities in order. Then estimate how long they take. Then develop the full schedule. Then monitor and control the schedule during execution."},{"speaker":"Host 1","text":"Plan Schedule Management creates the schedule management plan. This plan explains how the next schedule processes will be performed. It also says how the schedule will be measured and how variances from the schedule baseline will be handled."},{"speaker":"Host 2","text":"A PMP mindset point here is that the project manager should not just wing it. PMI wants a defined approach. Before managing the schedule, the team needs to know how schedule work will be planned, estimated, developed, and controlled."},{"speaker":"Host 1","text":"Next is Define Activities. This process takes work packages from the WBS and breaks them into activities. Activities are the actual scheduled work needed to create deliverables."},{"speaker":"Host 2","text":"That means activities are more detailed than work packages. A work package can contain multiple activities. The activity list becomes a major output and is later used for estimating duration and cost."},{"speaker":"Host 1","text":"Rolling wave planning is important here. Near-term work is decomposed now. Future work is decomposed later when more details are known."},{"speaker":"Host 2","text":"That connects to progressive elaboration. PMI understands that not everything is known upfront. So the project manager plans near-term work in detail and waits to decompose future work until there is enough information."},{"speaker":"Host 1","text":"Then Sequence Activities puts the activities in the order they will be performed. The main output is the project schedule network diagram."},{"speaker":"Host 2","text":"The network diagram shows the sequence of activities and their dependencies. The exam expects you to understand predecessor and successor activities, activity-on-node diagrams, and the four relationship types."},{"speaker":"Host 1","text":"Finish-to-Start is the most common. Activity A must finish before Activity B starts. Example: you must finish installing memory before installing the operating system."},{"speaker":"Host 2","text":"Finish-to-Finish means activities must finish at the same time, but they do not need to start at the same time. Start-to-Start means one activity must start before another can start. Start-to-Finish is rare and means the successor cannot finish until the predecessor starts."},{"speaker":"Host 1","text":"Dependency types matter too. Mandatory dependencies are hard logic. They must happen in a certain order. Discretionary dependencies are preferred order, but not required. External dependencies come from outside the project team. Internal dependencies are within the project team’s control."},{"speaker":"Host 2","text":"The exam may give you a scenario and ask what kind of dependency it is. If the project is waiting on a government permit, that is external. If testing comes after installation because the team controls both, that is internal. If one activity physically cannot happen before another, that is mandatory."},{"speaker":"Host 1","text":"Leads and lags are another trap area. A lead creates overlap. A lag creates delay. If Activity B starts before Activity A finishes, that is a lead. If Activity B must wait two days after Activity A finishes, that is a lag."},{"speaker":"Host 2","text":"Then we estimate activity durations. This is determining how long each activity will take. The duration can be in hours, days, weeks, or years, and it is affected by risk, resources, availability, and scope."},{"speaker":"Host 1","text":"Estimating methods include analogous estimating, parametric estimating, three-point estimating, and bottom-up estimating."},{"speaker":"Host 2","text":"Analogous estimating is quick and uses historical data from similar work, but it is less accurate. Parametric estimating uses mathematical formulas with historical data. Bottom-up estimating is the most accurate but takes the most time because each smaller component is estimated and rolled up."},{"speaker":"Host 1","text":"PERT uses three estimates: optimistic, most likely, and pessimistic. The beta formula is optimistic plus four times most likely plus pessimistic, divided by six."},{"speaker":"Host 2","text":"And the reason most likely is multiplied by four is because the formula weights the realistic estimate more heavily. The exam tip is to use PERT beta if the question does not specify."},{"speaker":"Host 1","text":"Standard deviation is pessimistic minus optimistic, divided by six. Triangular distribution is optimistic plus most likely plus pessimistic, divided by three."},{"speaker":"Host 2","text":"Now Develop Schedule is where the full project schedule and schedule baseline are created. This process uses the outputs from activity definition, sequencing, resource estimating, and duration estimating."},{"speaker":"Host 1","text":"Critical Path Method is one of the biggest exam areas. The critical path is the longest path through the network diagram and determines the project duration."},{"speaker":"Host 2","text":"This is the key: activities on the critical path have no float. If a critical path activity slips, the whole project slips unless the project manager takes action."},{"speaker":"Host 1","text":"Float, or slack, is how long an activity can be delayed without delaying the project. You can calculate slack as late start minus early start or late finish minus early finish."},{"speaker":"Host 2","text":"For forward pass, you calculate early start and early finish. For backward pass, you calculate late finish and late start. The exam may give you a network diagram and ask for critical path, float, early start, or late finish."},{"speaker":"Host 1","text":"Resource optimization also appears in Develop Schedule. Resource leveling adjusts the schedule due to limited or overallocated resources and often increases project duration."},{"speaker":"Host 2","text":"Resource smoothing adjusts activities without changing the critical path. It uses available float and does not delay project completion."},{"speaker":"Host 1","text":"Schedule compression is used when the schedule is too long. Crashing means adding resources. It increases cost and may increase risk. Fast-tracking means doing activities in parallel. It reduces time but increases risk."},{"speaker":"Host 2","text":"So if the question says the project manager adds people, pays overtime, or adds equipment to shorten the schedule, think crashing. If the question says activities are done at the same time that were originally planned in sequence, think fast-tracking."},{"speaker":"Host 1","text":"Control Schedule is about monitoring the work against the schedule baseline. The project manager compares planned work versus actual work and determines whether the project is on schedule."},{"speaker":"Host 2","text":"If there is a variance, the project manager analyzes it and may need a change request. The mindset is not panic, blame the team, or secretly change the schedule. The project manager follows the process."},{"speaker":"Host 1","text":"Agile scheduling works differently. Work is stored in the product backlog. Teams estimate effort using t-shirt sizing or planning poker. Work is delivered in increments."},{"speaker":"Host 2","text":"Planning poker often uses Fibonacci numbers like 1, 2, 3, 5, 8, and 13. The larger the number, the more effort the user story requires."},{"speaker":"Host 1","text":"Velocity measures how many points the team completes per iteration. That helps forecast future sprint capacity."},{"speaker":"Host 2","text":"Burnup charts show work completed. Burndown charts show work remaining. Cumulative flow diagrams help visualize work over time and where work may be stuck."},{"speaker":"Host 1","text":"Lead time is the time to complete the entire process. Cycle time is the time to complete part of the process. Cycle time equals work in progress divided by throughput."},{"speaker":"Host 2","text":"And if WIP is too high, bottlenecks can form and efficiency drops. That is why reducing WIP helps reduce cycle time."},{"speaker":"Host 1","text":"Final Chapter 7 mindset: the project manager protects the schedule by understanding dependencies, estimating realistically, monitoring performance, and using the right corrective actions when needed."},{"speaker":"Host 2","text":"Exactly. For the PMP, always think: understand the schedule baseline, analyze the variance, use the right tool, and follow change control when the baseline is affected."}],"questions":[{"q": "What is the critical path?", "options": ["The longest path through the network diagram that determines project duration", "The shortest path through the network diagram with the most float", "The path with the lowest cost activities on the project", "The path with the most stakeholders assigned to activities"], "answer": 0, "why": "The critical path is the longest path and determines the minimum project duration.", "mindset": "Critical path = longest path = project duration.", "tags": ["Critical Path", "Schedule"], "chapterRef": "Chapter 7 - Critical Path"}, {"q": "What is true about activities on the critical path?", "options": ["They have zero float and any delay extends the project", "They always have the highest cost of all activities", "They are optional and can be removed without impact", "They are always performed by external contractors"], "answer": 0, "why": "Critical path activities have no float. If one slips, the project slips.", "mindset": "Zero float = critical. Any delay = project delay.", "tags": ["Critical Path", "Float"], "chapterRef": "Chapter 7 - Critical Path"}, {"q": "What does float (slack) measure?", "options": ["How long an activity can be delayed without delaying the project end date", "How much budget remains in the project contingency reserve", "How many people are assigned to the project team currently", "How much risk tolerance exists for the project stakeholders"], "answer": 0, "why": "Float is the time an activity can slip without affecting the project completion date.", "mindset": "Float = flexibility. Zero float = no flexibility.", "tags": ["Float", "Schedule"], "chapterRef": "Chapter 7 - Float"}, {"q": "Which formula calculates float?", "options": ["Late Start minus Early Start (LS - ES)", "Earned Value divided by Actual Cost (EV/AC)", "Budget at Completion divided by CPI (BAC/CPI)", "Number of stakeholders times N-1 divided by 2"], "answer": 0, "why": "Float = LS - ES or LF - EF. Both give the same result.", "mindset": "Float compares late and early dates.", "tags": ["Formula", "Schedule"], "chapterRef": "Chapter 7 - Float Formula"}, {"q": "What is crashing?", "options": ["Adding resources to critical path activities to shorten the schedule", "Performing sequential activities in parallel to reduce duration", "Delaying activities intentionally to level resources", "Reducing product quality to save time on testing"], "answer": 0, "why": "Crashing adds resources (overtime, extra people, equipment) to compress the schedule. Increases cost.", "mindset": "Crashing = more resources = more cost = less time.", "tags": ["Schedule Compression", "Concept"], "chapterRef": "Chapter 7 - Crashing"}, {"q": "What is fast-tracking?", "options": ["Performing activities in parallel that were originally planned sequentially", "Adding resources to critical path activities to finish faster", "Delaying all non-critical activities to free up resources", "Removing activities from the project scope entirely"], "answer": 0, "why": "Fast-tracking overlaps sequential activities. Reduces time but increases risk.", "mindset": "Fast-tracking = parallel work = more risk.", "tags": ["Schedule Compression", "Concept"], "chapterRef": "Chapter 7 - Fast-Tracking"}, {"q": "What is the PERT beta formula?", "options": ["(Optimistic + 4×Most Likely + Pessimistic) / 6", "(Optimistic + Most Likely + Pessimistic) / 3", "(Pessimistic - Optimistic) / 6", "Earned Value / Actual Cost"], "answer": 0, "why": "PERT beta weights the most likely estimate: (O + 4M + P) / 6.", "mindset": "Most likely gets 4x weight in the beta formula.", "tags": ["Formula", "Estimating"], "chapterRef": "Chapter 7 - Three-Point Estimating"}, {"q": "What is the standard deviation formula for duration estimates?", "options": ["(Pessimistic - Optimistic) / 6", "(Optimistic + 4×Most Likely + Pessimistic) / 6", "(Optimistic + Most Likely + Pessimistic) / 3", "Late Start minus Early Start"], "answer": 0, "why": "Standard deviation = (P - O) / 6. Measures uncertainty/variability.", "mindset": "SD measures how spread out your estimate range is.", "tags": ["Formula", "Estimating"], "chapterRef": "Chapter 7 - Standard Deviation"}, {"q": "Which estimating method is MOST accurate but time-consuming?", "options": ["Bottom-up estimating that breaks work into smallest components", "Analogous estimating using previous similar project data", "Expert judgment from a single senior team member", "T-shirt sizing used in agile sprint planning"], "answer": 0, "why": "Bottom-up estimates each small component and rolls up. Most accurate but takes the most time.", "mindset": "More detail = more accuracy = more time.", "tags": ["Estimating", "Concept"], "chapterRef": "Chapter 7 - Bottom-Up Estimating"}, {"q": "What is analogous estimating?", "options": ["Top-down estimating using historical data from similar past projects", "Breaking work into smallest components and summing the estimates", "Using mathematical formulas with unit rates and historical data", "Getting anonymous estimates from multiple subject matter experts"], "answer": 0, "why": "Analogous (top-down) uses previous similar work. Quick but less accurate.", "mindset": "Analogous = similar past project data. Fast but rough.", "tags": ["Estimating", "Concept"], "chapterRef": "Chapter 7 - Analogous Estimating"}, {"q": "What is the most common dependency relationship type?", "options": ["Finish-to-Start: predecessor must finish before successor starts", "Start-to-Start: both activities must start at the same time", "Finish-to-Finish: both activities must finish at the same time", "Start-to-Finish: successor can't finish until predecessor starts"], "answer": 0, "why": "Finish-to-Start is the most common relationship. Activity A finishes, then B starts.", "mindset": "FS is the default relationship type.", "tags": ["Dependencies", "Schedule"], "chapterRef": "Chapter 7 - PDM Relationships"}, {"q": "What is a mandatory dependency?", "options": ["A hard logic dependency that physically must happen in a certain order", "A preferred sequence that the team chose but could change", "A dependency from an external source outside the project", "A dependency that only applies to agile projects"], "answer": 0, "why": "Mandatory (hard logic) dependencies must happen in that order — physically required.", "mindset": "Mandatory = can't change it. Required by nature of work.", "tags": ["Dependencies", "Concept"], "chapterRef": "Chapter 7 - Dependency Types"}, {"q": "What is a discretionary dependency?", "options": ["A preferred sequence based on best practice but not physically required", "A hard logic dependency that cannot be changed under any circumstances", "A dependency caused by external government regulations", "A dependency that only exists in the project charter"], "answer": 0, "why": "Discretionary (soft logic) dependencies are preferred order but not required.", "mindset": "Discretionary = could change it, but prefer not to.", "tags": ["Dependencies", "Concept"], "chapterRef": "Chapter 7 - Dependency Types"}, {"q": "What is a lead in scheduling?", "options": ["An overlap that allows the successor to start before the predecessor finishes", "A delay or waiting time between activities in the schedule", "The longest path through the project network diagram", "A zero-duration event marking a significant project point"], "answer": 0, "why": "A lead creates overlap — the successor starts early.", "mindset": "Lead = overlap. Lag = delay.", "tags": ["Leads and Lags", "Schedule"], "chapterRef": "Chapter 7 - Leads and Lags"}, {"q": "What is a lag in scheduling?", "options": ["A waiting period or delay between the end of one activity and start of another", "An overlap that allows activities to run in parallel", "The total float available on the critical path", "The earned value of completed project work"], "answer": 0, "why": "A lag is a delay — like curing time after painting before the next activity can start.", "mindset": "Lag = wait time between activities.", "tags": ["Leads and Lags", "Schedule"], "chapterRef": "Chapter 7 - Leads and Lags"}, {"q": "What does resource leveling do to the schedule?", "options": ["Adjusts schedule for limited resources and often increases project duration", "Shortens the schedule by adding extra resources to activities", "Removes all resource constraints from the project plan", "Only applies to agile projects using kanban boards"], "answer": 0, "why": "Resource leveling resolves over-allocation but typically extends the schedule.", "mindset": "Leveling fixes resource conflicts but may delay the project.", "tags": ["Resource Optimization", "Schedule"], "chapterRef": "Chapter 7 - Resource Leveling"}, {"q": "What is resource smoothing?", "options": ["Adjusting activities within available float without extending the critical path", "Adjusting the schedule by extending the critical path for resources", "Removing all resource assignments from the project plan", "Adding unlimited resources to all project activities"], "answer": 0, "why": "Smoothing uses available float to adjust — it doesn't change the critical path or project end date.", "mindset": "Smoothing = adjust within float. Leveling = may extend duration.", "tags": ["Resource Optimization", "Schedule"], "chapterRef": "Chapter 7 - Resource Smoothing"}, {"q": "What does a burndown chart show?", "options": ["Work remaining over time — the line goes down as work completes", "Work completed over time — the line goes up as work completes", "The total project budget consumption rate per month", "The number of stakeholders added to the project over time"], "answer": 0, "why": "Burndown shows remaining work decreasing over time.", "mindset": "Burndown = work left. Burnup = work done.", "tags": ["Agile", "Schedule"], "chapterRef": "Chapter 7 - Agile Scheduling"}, {"q": "What does velocity measure in agile?", "options": ["How many story points the team completes per iteration", "How fast individual team members complete their assigned tasks", "The total budget consumed during each sprint cycle", "The number of defects found per sprint review"], "answer": 0, "why": "Velocity = story points completed per iteration. Used to forecast future capacity.", "mindset": "Velocity helps predict how much work fits in future sprints.", "tags": ["Agile", "Metrics"], "chapterRef": "Chapter 7 - Velocity"}, {"q": "What are the six Schedule Management processes?", "options": ["Plan Schedule, Define Activities, Sequence Activities, Estimate Durations, Develop Schedule, Control Schedule", "Plan Schedule, Estimate Costs, Determine Budget, Control Costs, Close Schedule, Audit Schedule", "Identify Risks, Analyze Risks, Plan Responses, Implement Responses, Monitor Risks, Close Risks", "Plan Quality, Manage Quality, Control Quality, Audit Quality, Test Quality, Close Quality"], "answer": 0, "why": "The six processes build the schedule step by step: plan, define, sequence, estimate, develop, control.", "mindset": "Schedule processes follow a natural build sequence.", "tags": ["Process", "Schedule"], "chapterRef": "Chapter 7 - Schedule Processes"}, {"q": "What is rolling wave planning?", "options": ["Near-term work is planned in detail while future work is planned at a higher level", "All work is planned in complete detail at the very beginning of the project", "No planning is done — the team figures it out as they go during execution", "Only the final deliverable is planned, with no intermediate milestones"], "answer": 0, "why": "Rolling wave decomposes near-term work now and future work later as details become available.", "mindset": "Plan what you know in detail; plan the rest later.", "tags": ["Planning", "Schedule"], "chapterRef": "Chapter 7 - Rolling Wave Planning"}, {"q": "What is a milestone?", "options": ["A significant point or event in the project with zero duration", "An activity that takes the longest time on the critical path", "A dependency between two activities in the network diagram", "A resource assigned to work on multiple project activities"], "answer": 0, "why": "Milestones mark significant points — they have zero duration (they're events, not work).", "mindset": "Milestone = event marker, not a task.", "tags": ["Schedule", "
