ble, Accountable, Consulted, and Informed.","mindset":"RACI clarifies who does what and who needs input/status.","chapterRef":"Chapter 10: RACI","tags":["Resource"],"examLike":true,"temptingWrong":"The tempting wrong answers usually jump to command-and-control. PMP prefers servant leadership, training, role clarity, and removing impediments."},{"q":"What is the important RACI rule from the notes?","options":["Never have more than one person accountable","Always make everyone accountable","Only the customer can be responsible","Do not inform stakeholders"],"answer":0,"why":"The notes say never have more than one person held accountable.","mindset":"One accountable person prevents confusion and blame shifting.","chapterRef":"Chapter 10: RACI Rule","tags":["Resource"],"examLike":true,"temptingWrong":"The tempting wrong answers usually jump to command-and-control. PMP prefers servant leadership, training, role clarity, and removing impediments."},{"q":"What is a team charter?","options":["A document outlining acceptable behavior within the project","A seller invoice","A cost baseline","A burndown chart"],"answer":0,"why":"The team charter outlines acceptable behavior and team rules.","mindset":"Team-created ground rules improve buy-in.","chapterRef":"Chapter 10: Team Charter","tags":["Resource"],"examLike":true,"temptingWrong":"The tempting wrong answers usually jump to command-and-control. PMP prefers servant leadership, training, role clarity, and removing impediments."},{"q":"Who should best create the team charter?","options":["The project team for the project team","Only the sponsor without team input","Only procurement","Only external auditors"],"answer":0,"why":"The notes say the team charter is best created by the project team for the project team.","mindset":"People are more likely to follow rules they help create.","chapterRef":"Chapter 10: Team Charter","tags":["Resource","Scenario"],"examLike":true,"temptingWrong":"The tempting wrong answers usually jump to command-and-control. PMP prefers servant leadership, training, role clarity, and removing impediments."},{"q":"What does Estimate Activity Resources determine?","options":["What and how many resources are needed for each activity","Stakeholder engagement state","Contract legal terms","Final acceptance criteria only"],"answer":0,"why":"Estimate Activity Resources determines the types and quantities of resources needed for activities.","mindset":"This includes people, equipment, machines, and supplies.","chapterRef":"Chapter 10: Estimate Activity Resources","tags":["Process","Resource"],"examLike":true,"temptingWrong":"The tempting wrong answers usually jump to command-and-control. PMP prefers servant leadership, training, role clarity, and removing impediments."},{"q":"Which estimating method breaks work down until resources can be assigned?","options":["Bottom-up estimating","Analogous estimating","Pull communication","Control charting"],"answer":0,"why":"Bottom-up estimating breaks down activities into more detail until resources can be assigned.","mindset":"Accurate but time-consuming.","chapterRef":"Chapter 10: Bottom-Up Estimating","tags":["Resource"],"examLike":true,"temptingWrong":"The tempting wrong answers usually jump to command-and-control. PMP prefers servant leadership, training, role clarity, and removing impediments."},{"q":"What is analogous estimating also called?","options":["Top-down estimating","Bottom-up estimating","Fishbone estimating","Earned value estimating"],"answer":0,"why":"Analogous estimating is also known as top-down estimating and uses historical information.","mindset":"Analogous is quick but may be inaccurate.","chapterRef":"Chapter 10: Analogous Estimating","tags":["Concept","Resource"],"examLike":true,"temptingWrong":"The tempting wrong answers usually jump to command-and-control. PMP prefers servant leadership, training, role clarity, and removing impediments."},{"q":"What is a Resource Breakdown Structure?","options":["Hierarchical breakdown of resources by category and type","List of all stakeholders","A contract type","A project communication model"],"answer":0,"why":"An RBS is a hierarchical breakdown of resources by category and type.","mindset":"RBS helps organize and track resources.","chapterRef":"Chapter 10: Resource Breakdown Structure","tags":["Resource"],"examLike":true,"temptingWrong":"The tempting wrong answers usually jump to command-and-control. PMP prefers servant leadership, training, role clarity, and removing impediments."},{"q":"What is Acquire Resources about?","options":["Getting staff and physical resources needed to build deliverables","Inspecting quality only","Closing contracts","Ranking risks"],"answer":0,"why":"Acquire Resources gets the staff and physical resources needed for project deliverables.","mindset":"Right resources are critical during execution.","chapterRef":"Chapter 10: Acquire Resources","tags":["Resource"],"examLike":true,"temptingWrong":"The tempting wrong answers usually jump to command-and-control. PMP prefers servant leadership, training, role clarity, and removing impediments."},{"q":"What is multi-criteria decision analysis used for in acquiring resources?","options":["Selecting team members based on criteria","Calculating EVM","Counting defects","Choosing stakeholder engagement states"],"answer":0,"why":"It ranks candidates/resources using criteria such as communication, location, availability, cost, experience, and education.","mindset":"Use criteria to select the right person for the right activity.","chapterRef":"Chapter 10: Acquire Resources","tags":["Resource"],"examLike":true,"temptingWrong":"The tempting wrong answers usually jump to command-and-control. PMP prefers servant leadership, training, role clarity, and removing impediments."},{"q":"What is pre-assignment?","options":["Project team selected before the project starts","Stakeholders refusing engagement","A risk response after impact","A final inspection"],"answer":0,"why":"Pre-assignment means project team members were selected before the project starts.","mindset":"Pre-assigned resources may come from functional managers or early decisions.","chapterRef":"Chapter 10: Pre-assignment","tags":["Concept","Resource"],"examLike":true,"temptingWrong":"The tempting wrong answers usually jump to command-and-control. PMP prefers servant leadership, training, role clarity, and removing impediments."},{"q":"What is a drawback of virtual teams?","options":["Communication, language, cultural, technology, or isolation issues","No access to global talent","No need for collaboration","No possible stakeholder impact"],"answer":0,"why":"Virtual teams can face communication, language, cultural, technology cost, and isolation challenges.","mindset":"Virtual teams need intentional engagement and tools.","chapterRef":"Chapter 10: Virtual Teams","tags":["Resource"],"examLike":true,"temptingWrong":"The tempting wrong answers usually jump to command-and-control. PMP prefers servant leadership, training, role clarity, and removing impediments."},{"q":"What do resource calendars show?","options":["Resource availability and use on the project","Only defect totals","Only project risks","Only contract terms"],"answer":0,"why":"Resource calendars show staff availability, including project work, functional work, and vacations.","mindset":"Availability affects activity duration and scheduling.","chapterRef":"Chapter 10: Resource Calendars","tags":["Resource"],"examLike":true,"temptingWrong":"The tempting wrong answers usually jump to command-and-control. PMP prefers servant leadership, training, role clarity, and removing impediments."},{"q":"Two team members have a personal conflict that\u0027s affecting their collaboration. One asks you to move the other off the project. What should you do FIRST?","options":["Meet with both team members separately to understand the issue, then facilitate a joint conversation to find a resolution â€” don\u0027t remove someone without attempting resolution","Move the person off the project as requested","Ignore it and hope it resolves itself","Report both to HR immediately"],"answer":0,"why":"The PM should attempt conflict resolution at the lowest level first. Removing someone without trying to resolve the issue is a last resort.","mindset":"PMI mindset: address conflicts directly. Don\u0027t avoid them, don\u0027t escalate prematurely, and don\u0027t take sides without understanding both perspectives.","tags":["Conflict Resolution","Team Management"],"chapterRef":"Chapter 10 - Manage Team"},{"q":"You\u0027re building your team and need a specialist skill. The functional manager says the person is unavailable for 3 months. What should you do?","options":["Negotiate with the functional manager â€” explore options like part-time allocation, delayed start for that work package, or identify alternatives. Escalate only if negotiation fails.","Wait 3 months to start that work","Hire an external contractor immediately","Do the work yourself to avoid the delay"],"answer":0,"why":"Resource negotiation is a core PM skill. Explore options before escalating or accepting constraints. There\u0027s usually a middle ground.","mindset":"PMI mindset: negotiate before escalating. Explore creative solutions. Accept constraints only after exhausting alternatives.","tags":["Resource Management","Negotiation"],"chapterRef":"Chapter 10 - Acquire Resources"},{"q":"Your team is in the Storming phase. Arguments are frequent, people challenge each other\u0027s approaches, and tensions are high. What should you do?","options":["Recognize this is normal team development â€” facilitate constructive conflict resolution, establish ground rules, and guide the team through it rather than suppressing disagreement","Disband the team and start over","Tell everyone to stop arguing and just do their work","Skip to the performing phase by ignoring conflicts"],"answer":0,"why":"Storming is normal and necessary. Teams that navigate it become high-performing. The PM facilitates rather than suppresses â€” suppression just delays storming.","mindset":"PMI mindset: storming is a sign of growth, not failure. Facilitate healthy conflict. Don\u0027t suppress it or panic.","tags":["Team Development","Tuckman","Conflict"],"chapterRef":"Chapter 10 - Develop Team"},{"q":"A team member is consistently underperforming despite coaching. Other team members are picking up their slack and getting frustrated. What should you do NEXT?","options":["Have a direct conversation about specific performance gaps, set clear expectations with measurable targets, and establish consequences if performance doesn\u0027t improve within a defined period","Remove them from the project immediately","Continue coaching indefinitely","Ignore it to avoid confrontation"],"answer":0,"why":"After coaching fails, the next step is formal performance expectations with clear targets and timelines. You\u0027ve tried soft approaches â€” now be direct and specific.","mindset":"PMI mindset: servant leadership doesn\u0027t mean avoiding hard conversations. Direct feedback with clear expectations is respectful and necessary.","tags":["Team Performance","Leadership"],"chapterRef":"Chapter 10 - Manage Team"},{"q":"You\u0027re using a RACI matrix and discover one work package has two people listed as \u0027Accountable.\u0027 What\u0027s the problem?","options":["Only one person can be Accountable for each deliverable â€” having two creates confusion about who ultimately owns the outcome. Clarify and assign one A.","Having two accountable people provides backup","It\u0027s fine as long as they communicate","Add a third accountable person for even more coverage"],"answer":0,"why":"The \u0027A\u0027 in RACI must be singular. Multiple accountable people means no one is truly accountable. This causes confusion, blame-shifting, and dropped balls.","mindset":"PMI mindset: accountability must be clear and singular. When everyone is accountable, no one is.","tags":["RACI","Accountability","Roles"],"chapterRef":"Chapter 10 - RACI Matrix"},{"q":"A virtual team member in a different timezone misses the third consecutive team meeting. What should you do?","options":["Reach out privately to understand the barrier â€” the meeting time may not work for their timezone. Adjust meeting schedules or provide alternative participation methods.","Remove them from the team for non-participation","Send a stern email demanding attendance","Assume they\u0027re not committed and reduce their assignments"],"answer":0,"why":"Virtual team challenges are often logistical, not motivational. The PM should understand the constraint before judging â€” meeting times may be 3 AM for them.","mindset":"PMI mindset: assume positive intent first. Understand barriers before judging behavior. Adapt the process to the team\u0027s reality.","tags":["Virtual Teams","Communication","Inclusive Leadership"],"chapterRef":"Chapter 10 - Develop Team"},{"q":"Your team successfully delivers a major milestone. What should you do?","options":["Recognize the team\u0027s achievement â€” celebrate the win appropriately and acknowledge individual contributions to reinforce positive performance","Move immediately to the next deliverable without comment","Only acknowledge the top performers publicly","Wait until project close to recognize anyone"],"answer":0,"why":"Recognition builds morale, reinforces desired behaviors, and motivates future performance. Waiting or skipping recognition demotivates teams.","mindset":"PMI mindset: recognition is a team development tool. Celebrate wins to build momentum and reinforce the behaviors that created success.","tags":["Team Motivation","Recognition"],"chapterRef":"Chapter 10 - Develop Team"},{"q":"A team member with a critical skill gives two weeks notice. They\u0027re the only person who understands a key system. What should you do FIRST?","options":["Prioritize knowledge transfer â€” get them to document their knowledge and train others before they leave. Then assess schedule impact and plan accordingly.","Beg them to stay longer","Immediately start recruiting a replacement without knowledge transfer","Accept the risk and figure it out after they leave"],"answer":0,"why":"Knowledge transfer is the immediate priority when a critical resource departs. Documentation and training must happen before they leave, not after.","mindset":"PMI mindset: protect project knowledge. When a single-point-of-failure resource departs, knowledge transfer is job #1.","tags":["Resource Management","Knowledge Transfer","Risk"],"chapterRef":"Chapter 10 - Resource Planning"},{"q":"You have authority to select your own team. You\u0027re choosing between a highly skilled individual who is difficult to work with and a moderately skilled person who collaborates well. What should you consider?","options":["Team dynamics matter as much as individual skill â€” a difficult team member can reduce overall team productivity even if individually talented. Consider the project\u0027s collaboration needs.","Always pick the most skilled person regardless of behavior","Always pick the easiest person to work with","Flip a coin since both have tradeoffs"],"answer":0,"why":"Team performance depends on collaboration, not just individual talent. A toxic high-performer can drag down the entire team\u0027s output. Consider the whole picture.","mindset":"PMI mindset: teams outperform individuals. A collaborative moderate performer often adds more value than a brilliant solo act who disrupts the team.","tags":["Team Building","Emotional Intelligence"],"chapterRef":"Chapter 10 - Acquire Resources"},{"q":"A team member comes to you with a personal issue that\u0027s affecting their work. They ask you not to tell anyone. What should you do?","options":["Listen with empathy, maintain confidentiality where possible, and help them find appropriate support â€” while also discussing how to manage their work responsibilities during this time","Tell the whole team so they understand why the person is struggling","Ignore the personal issue and only focus on work output","Report it to HR immediately without their consent"],"answer":0,"why":"Emotional intelligence means balancing empathy with project needs. Maintain trust through confidentiality while also addressing the work impact constructively.","mindset":"PMI mindset: lead with empathy. People are not resources to be optimized â€” they\u0027re individuals with needs. Balance care with accountability.","tags":["Emotional Intelligence","Leadership","Team Management"],"chapterRef":"Chapter 10 - Interpersonal Skills"}]},{"id":11,"title":"Chapter 11: Project Communication Management","summary":"Project Communication Management","notes":["Project Communication Management","One of the most important knowledge areas in real-life project management","Communication is the key to a successful project","Management is about good communications","More than 90% of daily project manager tasks involve communication internally or externally","Project Manager’s Role","Set communication expectations for the project","Let people know what communications will take place","Identify communication needs of all stakeholders","Ensure stakeholder communication needs are met","Ensure stakeholders get the information they need","Agile Project Communications","Communications are just as important on agile projects as traditional projects","Agile projects involve more communication with customers because of iterations during the project","Customers are generally more engaged throughout the project life cycle","Most exam questions come from:","Communications formula","Communications management plan","Questions should not be very difficult to answer","Why the plan/formula would be used","How the plan/formula would be used","Similar to stakeholder management knowledge area"],"examples":["One of the most important knowledge areas in real-life project management","Communication is the key to a succes gement","tags":["Process","Communication"],"examLike":true,"temptingWrong":"The tempting wrong answers usually assume sending equals communicating. PMP wants confirmation of understanding and audience-appropriate communication."},{"q":"What does the project manager do with communication expectations?","options":["Set expectations and identify stakeholder communication needs","Avoid stakeholder communication","Use one report for everyone","Only communicate with the sponsor"],"answer":0,"why":"The PM sets communication expectations and ensures stakeholders get needed information.","mindset":"Communication should be planned and stakeholder-specific.","chapterRef":"Chapter 11: PM Role","tags":["Scenario","Process","Communication"],"examLike":true,"temptingWrong":"The tempting wrong answers usually assume sending equals communicating. PMP wants confirmation of understanding and audience-appropriate communication."},{"q":"Why do agile projects involve more customer communication?","options":["Iterations require frequent engagement and feedback","Agile has no stakeholders","Agile uses only written reports","Customers are removed after planning"],"answer":0,"why":"Agile projects involve more customer communication because iterations bring customers into feedback throughout the life cycle.","mindset":"Agile relies on frequent stakeholder/customer feedback.","chapterRef":"Chapter 11: Agile Communications","tags":["Agile","Communication"],"examLike":true,"temptingWrong":"The tempting wrong answers usually assume sending equals communicating. PMP wants confirmation of understanding and audience-appropriate communication."},{"q":"What are the three communication management processes?","options":["Plan, Manage, Monitor Communications","Identify, Rank, Transfer Communications","Estimate, Budget, Control Communications","Plan, Acquire, Develop Communications"],"answer":0,"why":"The notes list Plan Communications Management, Manage Communications, and Monitor Communications.","mindset":"Communication is planned, executed, and monitored.","chapterRef":"Chapter 11: Processes","tags":["Process","Communication"],"examLike":true,"temptingWrong":"The tempting wrong answers usually assume sending equals communicating. PMP wants confirmation of understanding and audience-appropriate communication."},{"q":"What does Plan Communications Management create?","options":["Communications management plan","Risk register","Resource calendar","Cost forecast"],"answer":0,"why":"Plan Communications Management creates the communications management plan.","mindset":"The plan defines who needs what, when, how, and by whom.","chapterRef":"Chapter 11: Plan Communications Management","tags":["Process","Communication"],"examLike":true,"temptingWrong":"The tempting wrong answers usually assume sending equals communicating. PMP wants confirmation of understanding and audience-appropriate communication."},{"q":"What does the communications management plan define?","options":["Who needs what information, when, how, and how it is stored","Only project cost","Only seller payments","Only team rewards"],"answer":0,"why":"The plan defines stakeholder information needs, timing, methods, storage, and ownership.","mindset":"Communication should be intentional and tailored.","chapterRef":"Chapter 11: Communications Management Plan","tags":["Process","Communication"],"examLike":true,"temptingWrong":"The tempting wrong answers usually assume sending equals communicating. PMP wants confirmation of understanding and audience-appropriate communication."},{"q":"What is the communication channels formula?","options":["N(N-1)/2","EV/AC","(O+4M+P)/6","LS-ES"],"answer":0,"why":"The formula for communication channels is N(N-1)/2.","mindset":"Use this when asked how many possible communication links exist.","chapterRef":"Chapter 11: Communication Channels","tags":["Formula","Communication"],"examLike":true,"temptingWrong":"The tempting wrong answers usually assume sending equals communicating. PMP wants confirmation of understanding and audience-appropriate communication."},{"q":"A project has 4 stakeholders. How many communication channels exist?","options":["4","6","8","12"],"answer":1,"why":"4(4-1)/2 = 6 communication channels.","mindset":"Apply N(N-1)/2 carefully.","chapterRef":"Chapter 11: Communication Channels","tags":["Formula","Mindset","Communication"],"examLike":true,"temptingWrong":"The tempting wrong answers usually assume sending equals communicating. PMP wants confirmation of understanding and audience-appropriate communication."},{"q":"A project has 10 stakeholders. How many communication channels exist?","options":["10","45","90","100"],"answer":1,"why":"10(10-1)/2 = 45 communication channels.","mindset":"Do multiplication before division if needed.","chapterRef":"Chapter 11: Communication Channels","tags":["Formula","Mindset","Communication"],"examLike":true,"temptingWrong":"The tempting wrong answers usually assume sending equals communicating. PMP wants confirmation of understanding and audience-appropriate communication."},{"q":"What communication option does agile generally prefer?","options":["Lowest-tech, highest-touch option","Lowest-touch, highest-tech option","Only written email","Only pull communication"],"answer":0,"why":"Agile communications should use the most low-tech, high-touch option when appropriate.","mindset":"Face-to-face interaction improves richness.","chapterRef":"Chapter 11: Agile Communications","tags":["Agile","Communication"],"examLike":true,"temptingWrong":"The tempting wrong answers usually assume sending equals communicating. PMP wants confirmation of understanding and audience-appropriate communication."},{"q":"What increases communication richness?","options":["Interactive and face-to-face communication","Longer emails only","Less feedback","More formal documents always"],"answer":0,"why":"Communication effectiveness increases as channels become more interactive and face-to-face.","mindset":"Rich communication helps with complex or sensitive issues.","chapterRef":"Chapter 11: Communication Richness","tags":["Communication"],"examLike":true,"temptingWrong":"The tempting wrong answers usually assume sending equals communicating. PMP wants confirmation of understanding and audience-appropriate communication."},{"q":"What is the sender responsible for?","options":["Ensuring the receiver understands the information","Avoiding feedback","Only encoding the message","Only storing the message"],"answer":0,"why":"The sender is responsible for ensuring the receiver understands the message.","mindset":"Communication is not complete just because it was sent.","chapterRef":"Chapter 11: Communication Model","tags":["Communication"],"examLike":true,"temptingWrong":"The tempting wrong answers usually assume sending equals communicating. PMP wants confirmation of understanding and audience-appropriate communication."},{"q":"What is feedback in communication?","options":["Confirmation that information was received and understood","A contract penalty","A risk trigger","A cost estimate"],"answer":0,"why":"Feedback confirms information was received and understood and whether clarification is needed.","mindset":"Feedback closes the communication loop.","chapterRef":"Chapter 11: Communication Terms","tags":["Communication"],"examLike":true,"temptingWrong":"The tempting wrong answers usually assume sending equals communicating. PMP wants confirmation of understanding and audience-appropriate communication."},{"q":"What is active listening?","options":["Listener is engaged and asks questions","Ignoring the speaker","Only reading a memo","Posting to SharePoint"],"answer":0,"why":"Active listening means the listener is engaged, such as asking questions.","mindset":"Active listening improves understanding.","chapterRef":"Chapter 11: Communication Terms","tags":["Communication"],"examLike":true,"temptingWrong":"The tempting wrong answers usually assume sending equals communicating. PMP wants confirmation of understanding and audience-appropriate communication."},{"q":"What is a communication blocker?","options":["Anything that negatively affects sending or receiving information","A stakeholder register","A resource calendar","A fixed-price contract"],"answer":0,"why":"A communication blocker negatively affects the sender sending or receiver receiving information.","mindset":"Noise and barriers reduce message clarity.","chapterRef":"Chapter 11: Communication Blockers","tags":["Communication"],"examLike":true,"temptingWrong":"The tempting wrong answers usually assume sending equals communicating. PMP wants confirmation of understanding and audience-appropriate communication."},{"q":"What is interactive communication?","options":["Two-way or multi-way direct communication","Information posted for access later","One-way distribution only","A formal written contract"],"answer":0,"why":"Interactive communication is direct two-way or multi-way communication, such as meetings or instant messaging.","mindset":"Use interactive methods when immediate exchange is needed.","chapterRef":"Chapter 11: Communication Methods","tags":["Communication"],"examLike":true,"temptingWrong":"The tempting wrong answers usually assume sending equals communicating. PMP wants confirmation of understanding and audience-appropriate communication."},{"q":"What is push communication?","options":["Information sent out to recipients","Information stored for people to access","Two-way direct communication","A face-to-face workshop only"],"answer":0,"why":"Push communication distributes information, such as emails or memos.","mindset":"Push sends information out but does not guarantee understanding.","chapterRef":"Chapter 11: Communication Methods","tags":["Communication"],"examLike":true,"temptingWrong":"The tempting wrong answers usually assume sending equals communicating. PMP wants confirmation of understanding and audience-appropriate communication."},{"q":"What is pull communication?","options":["Information placed in a central location for people to access","A direct conversation","A speech to executives","A phone call only"],"answer":0,"why":"Pull communication leaves information in a central place for receivers to access, often for large audiences.","mindset":"Pull works well for large audiences and self-service access.","chapterRef":"Chapter 11: Communication Methods","tags":["Communication"],"examLike":true,"temptingWrong":"The tempting wrong answers usually assume sending equals communicating. PMP wants confirmation of understanding and audience-appropriate communication."},{"q":"Which communication is formal written?","options":["Agreements, project management plans, and charters","Text messages","Casual hallway conversations","Instant messages"],"answer":0,"why":"Formal written communication includes agreements, PM plans, and charters.","mindset":"Formal written is structured and trackable.","chapterRef":"Chapter 11: Communication Types","tags":["Communication"],"examLike":true,"temptingWrong":"The tempting wrong answers usually assume sending equals communicating. PMP wants confirmation of understanding and audience-appropriate communication."},{"q":"Why should communications be tailored?","options":["Different stakeholders need different detail, timing, and language","All stakeholders need identical reports","Only the project team needs communication","Technical terms should never be explained"],"answer":0,"why":"Communications should be tailored to the stakeholders receiving them.","mindset":"Senior leaders may need brief overviews; teams may need more frequent detail.","chapterRef":"Chapter 11: Tailoring Communications","tags":["Communication"],"examLike":true,"temptingWrong":"The tempting wrong answers usually assume sending equals communicating. PMP wants confirmation of understanding and audience-appropriate communication."},{"q":"A stakeholder complains they \u0027never know what\u0027s going on\u0027 with the project. You send weekly status reports. What should you do?","options":["Ask the stakeholder what information they need, in what format, and how frequently â€” your current communication may not match their actual needs","Send reports more frequently","Add them to every meeting","Tell them to read the reports you already send"],"answer":0,"why":"Communication isn\u0027t complete until the receiver understands. If they feel uninformed, your approach isn\u0027t working for them. Adapt to their needs.","mindset":"PMI mindset: communication is the sender\u0027s responsibility. If the receiver isn\u0027t getting it, change your approach â€” don\u0027t blame them for not reading.","tags":["Communication","Stakeholder Management"],"chapterRef":"Chapter 11 - Communication Planning"},{"q":"You have 12 stakeholders on your project. A new team of 3 joins. How many additional communication channels does this create?","options":["Before: 12Ã—11/2 = 66 channels. After: 15Ã—14/2 = 105 channels. Added: 39 new channels. This significantly increases communication complexity.","Only 3 new channels (one per new person)","12 new channels (one between each new person and each existing person)","Communication channels don\u0027t change when people are added"],"answer":0,"why":"N(N-1)/2 formula. Adding people creates exponential growth in channels. This is why communication planning becomes harder as teams grow.","mindset":"PMI mindset: every person added increases complexity non-linearly. This is why communication planning must scale with team size.","tags":["Communication Channels","Formula"],"chapterRef":"Chapter 11 - Communication Channels"},{"q":"A critical project issue needs to reach the sponsor immediately. You\u0027ve been communicating via weekly reports. What communication method should you use NOW?","options":["Direct interactive communication â€” call or meet face-to-face for urgent critical issues. Don\u0027t wait for the next weekly report or rely on email.","Include it in next week\u0027s report","Send an email marked \u0027urgent\u0027","Post it in the project Slack channel"],"answer":0,"why":"Urgent critical issues require immediate interactive communication. Written methods are too slow and may not be seen in time.","mindset":"PMI mindset: match the communication method to the urgency and importance. Critical issues need immediate, interactive, high-bandwidth channels.","tags":["Communication Methods","Urgency"],"chapterRef":"Chapter 11 - Manage Communications"},{"q":"You\u0027re presenting project status to executives. Your 30-slide deck covers every detail. After 5 minutes, they look disengaged. What went wrong?","options":["The communication wasn\u0027t tailored to the audience â€” executives need high-level summaries with key decisions, risks, and financials, not granular details","The executives don\u0027t care about the project","You need more slides to be thorough","Present faster to fit all 30 slides in the time available"],"answer":0,"why":"Executive communication requires tailoring â€” summarize, highlight decisions needed, focus on outcomes. Detail overload causes disengagement.","mindset":"PMI mindset: tailor communication to the audience. Executives want outcomes and decisions. Teams want details and direction. One size doesn\u0027t fit all.","tags":["Communication","Stakeholder Tailoring"],"chapterRef":"Chapter 11 - Communication Planning"},{"q":"A team member from a high-context culture (Japan) says \u0027That might be difficult\u0027 when asked about a deadline. What should you interpret?","options":["In high-context cultures, indirect language often means \u0027no\u0027 â€” the team member is likely saying the deadline cannot be met. Follow up privately to understand the actual situation.","They said it\u0027s difficult but possible, so proceed","They\u0027re just being cautious â€” ignore it","Ask them to be more direct"],"answer":0,"why":"Cultural awareness is critical in communication. High-context cultures communicate indirectly. \u0027That might be difficult\u0027 often means \u0027no\u0027 or \u0027there\u0027s a serious problem.\u0027","mindset":"PMI mindset: communication requires cultural intelligence. Don\u0027t interpret everyone through your own cultural lens. Adapt to how others express meaning.","tags":["Cultural Awareness","Communication","Global Teams"],"chapterRef":"Chapter 11 - Communication Barriers"},{"q":"A stakeholder asks you to share confidential project financial data with their team \u0027for transparency.\u0027 What should you do?","options":["Check the communication management plan to determine who has access to what information. If the data is restricted, explain that you cannot share it beyond authorized recipients.","Share it since transparency is always good","Refuse without explanation","Share partial data to seem cooperative"],"answer":0,"why":"Not all project information is for all stakeholders. The communication plan defines who gets what. The PM protects confidential information.","mindset":"PMI mindset: transparency has boundaries. The communication plan defines them. Protect sensitive information while being as open as appropriate.","tags":["Communication","Confidentiality","Governance"],"chapterRef":"Chapter 11 - Communication Plan"},{"q":"Your project team uses email for almost everything. Response times are slow, misunderstandings are frequent, and context is often lost. What should you recommend?","options":["Assess which communications need to be interactive (meetings, calls) vs asynchronous (email, documents) and establish guidelines for when to use each method","Switch everything to meetings","Keep using email but ask people to respond faster","Hire a communications specialist"],"answer":0,"why":"Different communication types need different channels. Complex discussions need interactive methods. Status updates can be asynchronous. Match method to need.","mindset":"PMI mindset: choose communication technology based on the message type. Complex = interactive. Simple/FYI = asynchronous. Don\u0027t use one channel for everything.","tags":["Communication Technology","Methods"],"chapterRef":"Chapter 11 - Communication Methods"},{"q":"During a project meeting, two stakeholders argue about priorities. As PM, what is your role?","options":["Facilitate the discussion â€” help both parties articulate their positions, find common ground, and reach a resolution or escalation path. Don\u0027t take sides.","Side with the more senior stakeholder","End the meeting immediately","Let them argue until one gives up"],"answer":0,"why":"The PM facilitates constructive dialogue. Taking sides damages trust. The goal is resolution or clear escalation, not avoidance or domination.","mindset":"PMI mindset: the PM is a facilitator, not a judge. Help stakeholders reach alignment. If they can\u0027t, escalate â€” but always try resolution first.","tags":["Facilitation","Conflict","Stakeholder Management"],"chapterRef":"Chapter 11 - Communication Skills"},{"q":"You realize that a message you sent last week was misunderstood by three team members who took different actions based on different interpretations. What should you fix going forward?","options":["Improve message clarity â€” use specific language, confirm understanding with recipients, and follow up verbal communication with written summaries","Send longer messages with more detail","Copy more people on emails","Blame the team for not asking clarifying questions"],"answer":0,"why":"Ambiguous communication causes divergent actions. The sender is responsible for clarity. Confirm understanding and follow up verbal with written.","mindset":"PMI mindset: the sender owns clarity. If multiple people misunderstood, the message was unclear â€” not the audience was careless.","tags":["Communication Clarity","Feedback Loop"],"chapterRef":"Chapter 11 - Effective Communication"},{"q":"Your project has stakeholders who prefer very different communication styles â€” some want detailed reports, others want brief verbal updates, one wants only dashboards. How should you handle this?","options":["Document each stakeholder\u0027s communication preferences in the communication management plan and deliver information tailored to each â€” one size does not fit all","Pick one format and make everyone use it","Let stakeholders figure out their own information needs","Only communicate with stakeholders who ask for updates"],"answer":0,"why":"Effective communication requires tailoring to each stakeholder\u0027s needs. The communication plan captures these preferences and ensures consistent, appropriate delivery.","mindset":"PMI mindset: communication plans exist to ensure the right information reaches the right people in the right format at the right time. Tailor everything.","tags":["Communication Plan","Stakeholder Preferences"],"chapterRef":"Chapter 11 - Plan Communications"}]},{"id":12,"title":"Chapter 12: Project Risk Management","summary":"Project Risk Management is a hot topic on the exam and contains several processes.","notes":["Project Risk Management is a hot topic on the exam and contains several processes.","Defined as an uncertain event that can affect one or more project objectives","Uncertain by definition because it may or may not occur","All projects have risk","Risks must be documented, ranked, planned for, and monitored","Risk can be:","Negative risks:","Known as threats","Example: supplier delivery delayed for weeks, increasing budget or schedule","Positive risks:","Known as opportunities","Example: permit approved faster than normal, allowing earlier project start","On the exam:","Risk processes discuss both positive and negative risks","Identifying risks includes both threats and opportunities","Risk appetite:","Amount of risk someone is usually ready to take for a reward","Risk tolerance:","How much risk someone is willing to take","Risk threshold:","The point at which risk is no longer acceptable and requires attention","Risk terms are important bec o identify, analyze, plan, and monitor risk instead of reacting emotionally."},{"q":"What are negative risks called?","options":["Threats","Opportunities","Assumptions","Benefits"],"answer":0,"why":"Negative risks are known as threats.","mindset":"Threats may harm project objectives.","chapterRef":"Chapter 12: Risk Types","tags":["Risk"],"examLike":true,"temptingWrong":"The tempting wrong answers usually skip the risk process. PMP wants you to identify, analyze, plan, and monitor risk instead of reacting emotionally."},{"q":"What are positive risks called?","options":["Opportunities","Threats","Issues","Defects"],"answer":0,"why":"Positive risks are opportunities.","mindset":"Risk can be positive or negative.","chapterRef":"Chapter 12: Risk Types","tags":["Risk"],"examLike":true,"temptingWrong":"The tempting wrong answers usually skip the risk process. PMP wants you to identify, analyze, plan, and monitor risk instead of reacting emotionally."},{"q":"What is risk appetite?","options":["Amount of risk someone is ready to take for a reward","Exact point where risk becomes unacceptable","A list of individual risks","A contract type"],"answer":0,"why":"Risk appetite is the amount of risk someone is usually ready to take for a reward.","mindset":"Appetite influences how risk responses are handled.","chapterRef":"Chapter 12: Risk Terms","tags":["Risk"],"examLike":true,"temptingWrong":"The tempting wrong answers usually skip the risk process. PMP wants you to identify, analyze, plan, and monitor risk instead of reacting emotionally."},{"q":"What is risk threshold?","options":["The point where risk is no longer acceptable and requires attention","A positive risk","A seller invoice","A resource calendar"],"answer":0,"why":"Risk threshold is the point at which risk is no longer acceptable and needs attention.","mindset":"Threshold is the trigger for action based on tolerance limits.","chapterRef":"Chapter 12: Risk Terms","tags":["Risk"],"examLike":true,"temptingWrong":"The tempting wrong answers usually skip the risk process. PMP wants you to identify, analyze, plan, and monitor risk instead of reacting emotionally."},{"q":"What is an individual project risk?","options":["A specific risk affecting objectives like scope, time, or cost","The sum of all risks only","Only sponsor risk","Only organization-level uncertainty"],"answer":0,"why":"Individual project risks usually have positive or negative impacts on specific project objectives.","mindset":"The PM primarily manages individual risks in the risk register.","chapterRef":"Chapter 12: Individual Risk","tags":["Risk"],"examLike":true,"temptingWrong":"The tempting wrong answers usually skip the risk process. PMP wants you to identify, analyze, plan, and monitor risk instead of reacting emotionally."},{"q":"Where are individual project risks generally listed?","options":["Risk register","Stakeholder register","Communications plan","Issue log only"],"answer":0,"why":"The risk register lists individual project risks.","mindset":"Individual risks = risk register.","chapterRef":"Chapter 12: Risk Register","tags":["Risk"],"examLike":true,"temptingWrong":"The tempting wrong answers usually skip the risk process. PMP wants you to identify, analyze, plan, and monitor risk instead of reacting emotionally."},{"q":"What does the risk report describe?","options":["Overall project risks","Only individual activity durations","Only resource calendars","Only quality metrics"],"answer":0,"why":"The risk report covers overall project risks, sources, categories, threats, and opportunities.","mindset":"Overall risk is bigger-picture uncertainty.","chapterRef":"Chapter 12: Risk Report","tags":["Risk"],"examLike":true,"temptingWrong":"The tempting wrong answers usually skip the risk process. PMP wants you to identify, analyze, plan, and monitor risk instead of reacting emotionally."},{"q":"What does the risk management plan contain?","options":["How risk processes will be conducted","The full list of risks","Only seller bids","Only approved defects"],"answer":0,"why":"The risk management plan specifies how risk processes will be conducted.","mindset":"Exam trap: risk management plan does not list risks; risk register does.","chapterRef":"Chapter 12: Risk Management Plan","tags":["Process","Risk"],"examLike":true,"temptingWrong":"The tempting wrong answers usually skip the risk process. PMP wants you to identify, analyze, plan, and monitor risk instead of reacting emotionally."},{"q":"What does the Risk Breakdown Structure do?","options":["Categorizes risks","Calculates CPI","Ranks stakeholders by power","Defines contract price"],"answer":0,"why":"The RBS categorizes risks, such as external or organizational categories.","mindset":"RBS helps organize and identify risks.","chapterRef":"Chapter 12: RBS","tags":["Risk"],"examLike":true,"temptingWrong":"The tempting wrong answers usually skip the risk process. PMP wants you to identify, analyze, plan, and monitor risk instead of reacting emotionally."},{"q":"What does Identify Risks do?","options":["Identifies risks that could affect the project","Ranks risks by probability and impact only","Calculates numerical risk exposure only","Closes risks"],"answer":0,"why":"Identify Risks identifies risks that could affect the project and updates the risk register/report.","mindset":"Risk identification continues throughout the project.","chapterRef":"Chapter 12: Identify Risks","tags":["Process","Risk"],"examLike":true,"temptingWrong":"The tempting wrong answers usually skip the risk process. PMP wants you to identify, analyze, plan, and monitor risk instead of reacting emotionally."},{"q":"Does risk identification stop after planning?","options":["Yes","No, it continues throughout the project","Only on predictive projects","Only after closeout"],"answer":1,"why":"The notes say risk identification never stops and new risks arise every day.","mindset":"Risks change throughout the life cycle.","chapterRef":"Chapter 12: Identify Risks","tags":["Process","Risk"],"examLike":true,"temptingWrong":"The tempting wrong answers usually skip the risk process. PMP wants you to identify, analyze, plan, and monitor risk instead of reacting emotionally."},{"q":"What is the Delphi technique used for?","options":["Gathering risks anonymously from stakeholders","Calculating EV","Selecting seller contracts","Counting communication channels"],"answer":0,"why":"The Delphi technique gathers risks anonymously and reduces conflict or influence by others.","mindset":"Use Delphi when anonymity reduces bias.","chapterRef":"Chapter 12: Delphi Technique","tags":["Concept","Risk"],"examLike":true,"temptingWrong":"The tempting wrong answers usually skip the risk process. PMP wants you to identify, analyze, plan, and monitor risk instead of reacting emotionally."},{"q":"What does assumptions and constraints analysis help identify?","options":["Risks from incorrect assumptions or limiting constraints","Only resource names","Only formal presentations","Only project closure steps"],"answer":0,"why":"Every assumption carries risk because it may be incorrect; constraints can create risks.","mindset":"Assumptions and constraints are risk sources.","chapterRef":"Chapter 12: Risk Identification Tools","tags":["Process","Risk"],"examLike":true,"temptingWrong":"The tempting wrong answers usually skip the risk process. PMP wants you to identify, analyze, plan, and monitor risk instead of reacting emotionally."},{"q":"What does SWOT stand for?","options":["Strengths, Weaknesses, Opportunities, Threats","Schedule, Work, Output, Time","Scope, Work, Opportunity, Team","Seller, Work, Order, Transfer"],"answer":0,"why":"SWOT stands for Strengths, Weaknesses, Opportunities, and Threats.","mindset":"SWOT identifies both positive and negative risks.","chapterRef":"Chapter 12: SWOT","tags":["Concept","Risk"],"examLike":true,"temptingWrong":"The tempting wrong answers usually skip the risk process. PMP wants you to identify, analyze, plan, and monitor risk instead of reacting emotionally."},{"q":"What does qualitative risk analysis do?","options":["Prioritizes risks based on probability and impact","Calculates EVM formulas","Finalizes contracts","Inspects deliverables"],"answer":0,"why":"Qualitative risk analysis prioritizes risks based on probability and impact.","mindset":"Qualitative = quick ranking/prioritization.","chapterRef":"Chapter 12: Qualitative Risk Analysis","tags":["Risk"],"examLike":true,"temptingWrong":"The tempting wrong answers usually skip the risk process. PMP wants you to identify, analyze, plan, and monitor risk instead of reacting emotionally."},{"q":"What tool ranks risks using probability and impact?","options":["Probability and impact matrix","RACI chart","Gantt chart","Communications model"],"answer":0,"why":"The probability and impact matrix ranks risks by probability and impact.","mindset":"Use it to prioritize risks visually.","chapterRef":"Chapter 12: Probability and Impact Matrix","tags":["Risk"],"examLike":true,"temptingWrong":"The tempting wrong answers usually skip the risk process. PMP wants you to identify, analyze, plan, and monitor risk instead of reacting emotionally."},{"q":"What does a bubble chart add beyond two risk parameters?","options":["A third parameter such as urgency shown by bubble size","Cost baseline only","Contract terms","Team charter rules"],"answer":0,"why":"A bubble chart uses three parameters, such as impact, probability, and urgency.","mindset":"Bubble size often represents urgency.","chapterRef":"Chapter 12: Bubble Chart","tags":["Risk"],"examLike":true,"temptingWrong":"The tempting wrong answers usually skip the risk process. PMP wants you to identify, analyze, plan, and monitor risk instead of reacting emotionally."},{"q":"Which risks require immediate attention?","options":["High impact and high probability risks","Low impact and low probability risks","Only positive risks","Only closed risks"],"answer":0,"why":"Risk urgency assessment identifies risks needing near-term attention, especially high impact/high probability risks.","mindset":"Urgent risks need timely responses.","chapterRef":"Chapter 12: Risk Urgency Assessment","tags":["Risk"],"examLike":true,"temptingWrong":"The tempting wrong answers usually skip the risk process. PMP wants you to identify, analyze, plan, and monitor risk instead of reacting emotionally."},{"q":"What is the key distinction between risk register and risk report?","options":["Risk register = individual risks; risk report = overall project risk","They are the same document","Risk report contains team assignments only","Risk register is part of the PM plan"],"answer":0,"why":"Your notes state the risk register describes individual project risks and the risk report describes overall project risks.","mindset":"This is a common exam distinction.","chapterRef":"Chapter 12: Risk Register vs Risk Report","tags":["Risk"],"examLike":true,"temptingWrong":"The tempting wrong answers usually skip the risk process. PMP wants you to identify, analyze, plan, and monitor risk instead of reacting emotionally."},{"q":"Your team identified 50 risks during planning. A stakeholder says \u0027That\u0027s too many â€” just focus on the top 5.\u0027 What should you do?","options":["Prioritize all 50 using probability and impact assessment, then focus active management on the highest-ranked risks while monitoring the rest on a watchlist","Reduce the list to 5 as the stakeholder requested","Keep all 50 at equal priority","Stop identifying risks since 50 is enough"],"answer":0,"why":"All identified risks should be documented and assessed. Prioritization determines which get active response plans vs monitoring. You don\u0027t ignore lower risks â€” you watch them.","mindset":"PMI mindset: identify all risks, prioritize ruthlessly, and manage actively at the top while monitoring the rest. Don\u0027t artificially cap your risk register.","tags":["Risk Identification","Prioritization"],"chapterRef":"Chapter 12 - Risk Register"},{"q":"A risk you identified has a probability of 80% and an impact of $200K. The risk response costs $50K to implement. Should you implement the response?","options":["Yes â€” expected monetary value is $160K (80% Ã— $200K), so spending $50K to mitigate is clearly justified. The response costs less than the expected loss.","No â€” $50K is too expensive for something that might not happen","Only if the risk actually occurs","Wait to see if probability changes"],"answer":0,"why":"EMV analysis: 80% Ã— $200K = $160K expected loss. A $50K response to avoid $160K expected loss is a clear positive ROI.","mindset":"PMI mindset: use quantitative analysis to justify risk responses. Compare response cost to expected monetary value of the risk.","tags":["EMV","Risk Response","Quantitative Analysis"],"chapterRef":"Chapter 12 - Risk Analysis"},{"q":"A risk event occurs that was NOT in your risk register. The impact is moderate. What does this mean and what should you do?","options":["This is an unknown risk (unknown unknown) â€” use management reserve to address it, then update your risk identification process to improve future identification","Blame the team for not identifying it","Ignore it since it wasn\u0027t planned for","Use contingency reserve since any risk qualifies"],"answer":0,"why":"Unknown unknowns are addressed with management reserve (requires approval). The event also signals a gap in your identification process â€” learn from it.","mindset":"PMI mindset: unknown unknowns happen. Use management reserve. Then ask \u0027why didn\u0027t we see this?\u0027 to improve future identification.","tags":["Unknown Risks","Management Reserve","Lessons Learned"],"chapterRef":"Chapter 12 - Unknown Unknowns"},{"q":"During risk response planning, a team member suggests \u0027accepting\u0027 all high-probability, high-impact risks because \u0027we\u0027ll deal with them if they happen.\u0027 What\u0027s wrong with this approach?","options":["Accepting high-impact risks without proactive response plans is irresponsible â€” acceptance is appropriate for low-probability/low-impact risks, not major threats","Nothing is wrong â€” acceptance is a valid strategy for all risks","They should avoid all risks instead","Only the PM can decide risk responses"],"answer":0,"why":"Acceptance is valid for risks where the cost of response exceeds the impact. For high-probability, high-impact risks, proactive strategies (mitigate, transfer, avoid) are needed.","mindset":"PMI mindset: acceptance is a deliberate choice for the right risks, not a default for all risks. High-impact risks demand proactive responses.","tags":["Risk Response Strategies","Acceptance"],"chapterRef":"Chapter 12 - Risk Response Planning"},{"q":"You implement a risk mitigation strategy. After implementation, there\u0027s still some residual risk remaining. What should you do with the residual risk?","options":["Document it in the risk register, assign an owner, and monitor it â€” residual risks are expected after mitigation and still need tracking","Ignore it since you already mitigated","Implement another mitigation on top of the first","Close the risk entirely since you responded"],"answer":0,"why":"Mitigation reduces risk but rarely eliminates it. Residual risk must be documented, owned, and monitored. It may still need a contingency plan.","mindset":"PMI mindset: mitigation â‰  elimination. Residual risks are real and need attention. Don\u0027t mark risks as closed just because you responded.","tags":["Residual Risk","Risk Monitoring"],"chapterRef":"Chapter 12 - Risk Response"},{"q":"A positive risk (opportunity) is identified â€” if a new technology works, the project could deliver 3 months early. What strategy should you consider?","options":["Exploit â€” take deliberate action to ensure the opportunity materializes, such as investing in a proof-of-concept or dedicating resources to validate the technology early","Avoid the opportunity since it\u0027s uncertain","Ignore positive risks â€” only manage threats","Wait and see if it happens naturally"],"answer":0,"why":"Opportunities are managed too. Exploit means taking action to make it happen. Share, enhance, and accept are other options. Ignoring opportunities is wasteful.","mindset":"PMI mindset: risks include opportunities, not just threats. Actively manage positive risks to maximize project value.","tags":["Opportunities","Positive Risk","Exploit Strategy"],"chapterRef":"Chapter 12 - Opportunity Strategies"},{"q":"Your risk register hasn\u0027t been updated in 6 weeks. Several new risks have emerged but aren\u0027t documented. A risk event occurs that could have been anticipated. What process failed?","options":["Monitor Risks â€” the risk register should be reviewed and updated regularly throughout the project. Stale registers miss emerging risks.","Risk identification â€” but that only happens once during planning","Nothing failed â€” you can\u0027t predict everything","The team should have informally tracked risks"],"answer":0,"why":"Risk monitoring is continuous. A stale register means the team stopped looking for new risks. This is a process failure, not bad luck.","mindset":"PMI mindset: risk management is iterative and continuous, not a planning-only activity. Regular reviews catch emerging risks before they become issues.","tags":["Risk Monitoring","Continuous Process"],"chapterRef":"Chapter 12 - Monitor Risks"},{"q":"A team member says \u0027I don\u0027t want to put that risk in the register â€” it\u0027ll make us look bad to the sponsor.\u0027 What should you do?","options":["Explain that hiding risks creates MORE exposure â€” transparent risk management allows proactive response. An undocumented risk is an unmanaged risk.","Agree and keep it off the register","Put it in a separate \u0027private\u0027 register","Let the team member decide what to report"],"answer":0,"why":"Risk registers must be complete and honest. Hidden risks can\u0027t be managed, resourced, or responded to. Transparency enables management; secrecy enables failure.","mindset":"PMI mindset: risk transparency is non-negotiable. You cannot manage what you don\u0027t acknowledge. Hidden risks always cost more than visible ones.","tags":["Risk Transparency","Risk Register","Ethics"],"chapterRef":"Chapter 12 - Risk Identification"},{"q":"Your project has a risk with 20% probability and $500K impact. Another risk has 80% probability and $20K impact. Which deserves more attention?","options":["Both EMVs are similar ($100K vs $16K) but the first risk deserves more attention because its impact is catastrophic if it occurs â€” probability isn\u0027t the only factor, severity matters too","The 80% risk because it\u0027s almost certain to happen","The $500K risk because it\u0027s the biggest number","Treat them equally since both are in the register"],"answer":0,"why":"EMV helps prioritize, but impact severity matters independently. A low-probability catastrophic risk may need more attention than a high-probability nuisance.","mindset":"PMI mindset: don\u0027t rely solely on EMV. Consider impact severity independently. Catastrophic risks need contingency plans regardless of probability.","tags":["Risk Prioritization","EMV","Impact Analysis"],"chapterRef":"Chapter 12 - Qualitative Risk Analysis"},{"q":"Near project completion, the sponsor says \u0027We don\u0027t need to worry about risks anymore â€” we\u0027re almost done.\u0027 What should you communicate?","options":["Risks exist throughout the entire project lifecycle including closing â€” implementation risks, transition risks, and acceptance risks are all relevant near the end","Agree and stop risk management since the project is almost done","Only monitor the top 3 risks at this point","Risks only matter during planning and execution"],"answer":0,"why":"Risk management continues until the project is formally closed. Late-stage risks (deployment failures, acceptance issues, transition problems) can still derail outcomes.","mindset":"PMI mindset: risk management never stops. The nature of risks changes throughout the lifecycle but the process continues until formal closure.","tags":["Risk Management","Project Lifecycle","Closing"],"chapterRef":"Chapter 12 - Continuous Risk Management"}]},{"id":13,"title":"Chapter 13: Project Procurement Management","summary":"Procurement management knowledge area is about getting products, services, or results from outside the project team.","notes":["Procurement management knowledge area is about getting products, services, or results from outside the project team.","There are only three processes in this knowledge area, but expect many questions about contract types on the exam.","PMP exam questions are generally from the perspective of a buyer.","Unless specifically stated otherwise, assume you are the buyer hiring a seller for the project.","Only assume seller perspective if the question specifically says you are a seller.","Agreements and contracts are generally considered the same on the PMP exam.","A contract is a legally binding agreement between a buyer and a seller for products, services, or results.","A contract is not legal if it is for illegal work (crime) to be performed.","A contract can be terminated by both buyer and seller for work not getting done or payments not being made.","Contracts generally include the following:","Formal written document","Scope of work to be performed","Roles and responsibilities","How to perform the work, including locations and times","Terms and conditions","Warranties and penalties","Payment terms","Termination clauses","Change request process","Insurance and performance bonds","Three main types of contracts:","Time and material"],"examples":["There are only three processes in this knowledge area, but expect many questions about contract types on the exam.","PMP exam questions are generally from the perspective of a buyer.","Unless specifically stated otherwise, assume you are the buyer hiring a seller for the project.","Only assume seller perspective if the question specifically says you are a seller."],"podcast":[{"speaker":"Maya","text":"Alright, let’s study Chapter 13: Project Procurement Management. This is one of those PMP areas where you want to understand both the terminology and the project manager mindset behind it."},{"speaker":"Jordan","text":"Exactly. The PMP rarely rewards memorizing words only. It wants you to recognize the situation, identify what process or principle is being tested, and choose the next best action."},{"speaker":"Maya","text":"One key point is this: Procurement management knowledge area is about getting products, services, or results from outside the project team."},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. There are only three processes in this knowledge area, but expect many questions about contract types on the exam."},{"speaker":"Maya","text":"One key point is this: PMP exam questions are generally from the perspective of a buyer."},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. Unless specifically stated otherwise, assume you are the buyer hiring a seller for the project."},{"speaker":"Maya","text":"One key point is this: Only assume seller perspective if the question specifically says you are a seller."},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. Agreements and contracts are generally considered the same on the PMP exam."},{"speaker":"Maya","text":"One key point is this: A contract is a legally binding agreement between a buyer and a seller for products, services, or results."},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. A contract is not legal if it is for illegal work (crime) to be performed."},{"speaker":"Maya","text":"One key point is this: A contract can be terminated by both buyer and seller for work not getting done or payments not being made."},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. Contracts generally include the following:"},{"speaker":"Maya","text":"One key point is this: Formal written document"},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. Scope of work to be performed"},{"speaker":"Maya","text":"One key point is this: Roles and responsibilities"},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. How to perform the work, including locations and times"},{"speaker":"Maya","text":"One key point is this: Terms and conditions"},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. Warranties and penalties"},{"speaker":"Maya","text":"One key point is this: Payment terms"},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. Termination clauses"},{"speaker":"Maya","text":"So the big takeaway is not just knowing the definition. You want to ask: what is happening in the scenario, who is impacted, what process should be used, and what should the project manager do next?"},{"speaker":"Jordan","text":"Right. Slow down, do not jump straight to escalation, and use the correct PMP process. That is how this chapter turns into points on the exam."}],"questions":[{"q":"What is procurement management about?","options":["Getting products, services, or results from outside the project team","Managing only internal team conflicts","Calculating float","Creating quality metrics"],"answer":0,"why":"Procurement management is about acquiring products, services, or results from outside the project team.","mindset":"Procurement means outside acquisition.","chapterRef":"Chapter 13: Procurement Management","tags":["Process","Procurement"],"examLike":true,"temptingWrong":"The tempting wrong answers usually ignore buyer/seller risk ownership or use the wrong contract type for the scope clarity."},{"q":"From what perspective are PMP procurement questions generally written?","options":["Buyer","Seller","Auditor only","End user only"],"answer":0,"why":"The notes say PMP procurement questions are generally from the buyer perspective unless stated otherwise.","mindset":"Assume buyer unless the question explicitly says seller.","chapterRef":"Chapter 13: Exam Perspective","tags":["Procurement"],"examLike":true,"temptingWrong":"The tempting wrong answers usually ignore buyer/seller risk ownership or use the wrong contract type for the scope clarity."},{"q":"What is a contract?","options":["A legally binding agreement between buyer and seller","A stakeholder map","A quality metric","A risk category"],"answer":0,"why":"A contract is a legally binding agreement between a buyer and seller for products, services, or results.","mindset":"Agreement and contract are generally considered the same on the PMP exam.","chapterRef":"Chapter 13: Contracts","tags":["Procurement"],"examLike":true,"temptingWrong":"The tempting wrong answers usually ignore buyer/seller risk ownership or use the wrong contract type for the scope clarity."},{"q":"What are the three main contract types?","options":["Fixed price, time and material, cost-reimbursable","Push, pull, interactive","ROM, budget, definitive","Avoid, transfer, accept"],"answer":0,"why":"The notes list fixed price, time and material, and cost-reimbursable as the three main contract types.","mindset":"Contract type drives buyer/seller risk.","chapterRef":"Chapter 13: Contract Types","tags":["Procurement"],"examLike":true,"temptingWrong":"The tempting wrong answers usually ignore buyer/seller risk ownership or use the wrong contract type for the scope clarity."},{"q":"When is a fixed price contract best used?","options":["When scope is well-defined","When scope is unknown","When buyer wants all cost risk","When work is illegal"],"answer":0,"why":"Fixed price works when scope is well-defined and understood.","mindset":"Defined scope supports a fixed price.","chapterRef":"Chapter 13: Fixed Price","tags":["Procurement","Scenario"],"examLike":true,"temptingWrong":"The tempting wrong answers usually ignore buyer/seller risk ownership or use the wrong contract type for the scope clarity."},{"q":"Who takes most cost overrun risk in a fixed price contract?","options":["Seller","Buyer","Project sponsor only","Customer only"],"answer":0,"why":"In fixed price, the seller takes the risk of exceeding cost constraints.","mindset":"Fixed price shifts cost risk to the seller.","chapterRef":"Chapter 13: Fixed Price Risk","tags":["Procurement","Risk"],"examLike":true,"temptingWrong":"The tempting wrong answers usually skip the risk process. PMP wants you to identify, analyze, plan, and monitor risk instead of reacting emotionally."},{"q":"What is Firm Fixed Price?","options":["Price is fixed and cannot be changed","Buyer pays all expenses plus fee","Hourly labor and materials","A risk register"],"answer":0,"why":"FFP means the price is fixed and cannot be changed.","mindset":"Firm fixed price is the strongest fixed price structure.","chapterRef":"Chapter 13: FFP","tags":["Procurement"],"examLike":true,"temptingWrong":"The tempting wrong answers usually ignore buyer/seller risk ownership or use the wrong contract type for the scope clarity."},{"q":"What is FPIF?","options":["Fixed price with an incentive fee for meeting a target","Cost plus fixed fee","Time and material contract","A procurement statement of work"],"answer":0,"why":"FPIF includes an additional fee for meeting a target outlined in the contract.","mindset":"Incentives can encourage seller performance.","chapterRef":"Chapter 13: FPIF","tags":["Concept","Procurement"],"examLike":true,"temptingWrong":"The tempting wrong answers usually ignore buyer/seller risk ownership or use the wrong contract type for the scope clarity."},{"q":"When is FP-EPA used?","options":["Longer contracts affected by economic conditions","Short tasks with no economic risk","Internal team rewards only","Quality inspections"],"answer":0,"why":"FP-EPA adjusts fixed cost over contract life due to economic conditions.","mindset":"Use FP-EPA for longer periods with economic uncertainty.","chapterRef":"Chapter 13: FP-EPA","tags":["Concept","Procurement"],"examLike":true,"temptingWrong":"The tempting wrong answers usually ignore buyer/seller risk ownership or use the wrong contract type for the scope clarity."},{"q":"What is cost-reimbursable?","options":["Buyer pays work expenses plus a seller fee","Seller pays all expenses","A fixed price only","A communication method"],"answer":0,"why":"Cost-reimbursable means the buyer pays expenses and then a fee for seller profit.","mindset":"Buyer carries more cost risk.","chapterRef":"Chapter 13: Cost Reimbursable","tags":["Procurement"],"examLike":true,"temptingWrong":"The tempting wrong answers usually ignore buyer/seller risk ownership or use the wrong contract type for the scope clarity."},{"q":"Who takes more risk in cost-reimbursable contracts?","options":["Buyer","Seller","Auditor","No one"],"answer":0,"why":"The buyer takes risk because they cover cost overruns of work expenses.","mindset":"Buyer must monitor costs carefully.","chapterRef":"Chapter 13: Cost Reimbursable Risk","tags":["Procurement","Risk"],"examLike":true,"temptingWrong":"The tempting wrong answers usually skip the risk process. PMP wants you to identify, analyze, plan, and monitor risk instead of reacting emotionally."},{"q":"What is CPFF?","options":["Cost Plus Fixed Fee","Cost Plus Flexible Funding","Contract Price Final Form","Customer Payment Fixed Funding"],"answer":0,"why":"CPFF means the buyer pays work expense plus a fixed fee to the seller.","mindset":"CPFF is a cost-reimbursable subtype.","chapterRef":"Chapter 13: CPFF","tags":["Concept","Procurement"],"examLike":true,"temptingWrong":"The tempting wrong answers usually ignore buyer/seller risk ownership or use the wrong contract type for the scope clarity."},{"q":"What is CPIF?","options":["Cost Plus Incentive Fee","Cost Price Internal Funding","Contract Plan Incentive Form","Customer Procurement Information File"],"answer":0,"why":"CPIF pays work expense plus an additional fee if a target is met.","mindset":"Incentive fee rewards target achievement.","chapterRef":"Chapter 13: CPIF","tags":["Formula","Procurement"],"examLike":true,"temptingWrong":"The tempting wrong answers usually ignore buyer/seller risk ownership or use the wrong contract type for the scope clarity."},{"q":"When should time and material be used?","options":["When scope is high-level","When scope is fully defined and fixed","Only when no materials exist","Only for internal staff"],"answer":0,"why":"Time and material should be used when scope is high-level.","mindset":"T&M can expose buyer to cost overrun risk.","chapterRef":"Chapter 13: Time and Material","tags":["Concept","Procurement"],"examLike":true,"temptingWrong":"The tempting wrong answers usually ignore buyer/seller risk ownership or use the wrong contract type for the scope clarity."},{"q":"Who takes cost overrun risk in time and material?","options":["Buyer","Seller only","Neither","External auditor"],"answer":0,"why":"The buyer takes cost overrun risk for labor and materials in time and material contracts.","mindset":"Buyer must monitor T&M work closely.","chapterRef":"Chapter 13: Time and Material Risk","tags":["Risk","Procurement"],"examLike":true,"temptingWrong":"The tempting wrong answers usually skip the risk process. PMP wants you to identify, analyze, plan, and monitor risk instead of reacting emotionally."},{"q":"What is Plan Procurement Management used to determine?","options":["What to acquire, how, how much, and when","Only team ground rules","Only quality thresholds","Only stakeholder engagement"],"answer":0,"why":"Plan Procurement determines whether anything needs to be procured and how procurement will be planned.","mindset":"Procurement planning starts with make/acquire decisions.","chapterRef":"Chapter 13: Plan Procurement","tags":["Process","Procurement"],"examLike":true,"temptingWrong":"The tempting wrong answers usually ignore buyer/seller risk ownership or use the wrong contract type for the scope clarity."},{"q":"What is market research used for?","options":["Determining normal industry standards for work","Calculating CPI","Counting stakeholders","Inspecting deliverables"],"answer":0,"why":"Market research determines normal industry standards for the work.","mindset":"Use market research to understand seller/industry options.","chapterRef":"Chapter 13: Market Research","tags":["Concept","Procurement"],"examLike":true,"temptingWrong":"The tempting wrong answers usually ignore buyer/seller risk ownership or use the wrong contract type for the scope clarity."},{"q":"What does make-or-buy analysis decide?","options":["Whether work should be done internally or purchased externally","How many communication channels exist","Whether quality is high grade","Which risk is urgent"],"answer":0,"why":"Make-or-buy analysis determines whether something can be done by the team or by outside contractors.","mindset":"Make-or-buy is a core procurement planning decision.","chapterRef":"Chapter 13: Make-or-Buy","tags":["Concept","Procurement"],"examLike":true,"temptingWrong":"The tempting wrong answers usually ignore buyer/seller risk ownership or use the wrong contract type for the scope clarity."},{"q":"What does an RFP request?","options":["Details from sellers explaining how work will be performed","Only a price quote per unit","Only a final invoice","Only a risk response"],"answer":0,"why":"An RFP asks potential sellers to explain how work will be performed.","mindset":"RFP = proposal/approach details.","chapterRef":"Chapter 13: Bid Documents","tags":["Procurement"],"examLike":true,"temptingWrong":"The tempting wrong answers usually ignore buyer/seller risk ownership or use the wrong contract type for the scope clarity."},{"q":"What does an RFQ request?","options":["A price quote per item, hour, foot, or unit","A stakeholder engagement plan","A risk report","A team charter"],"answer":0,"why":"An RFQ requests a price quote per unit of measure.","mindset":"RFQ = quote/pricing.","chapterRef":"Chapter 13: Bid Documents","tags":["Procurement"],"examLike":true,"temptingWrong":"The tempting wrong answers usually ignore buyer/seller risk ownership or use the wrong contract type for the scope clarity."},{"q":"You\u0027re selecting a contract type for a project where scope is well-defined and unlikely to change. The seller wants a cost-reimbursable contract. What should you recommend?","options":["Fixed-price â€” when scope is clear and stable, fixed-price shifts cost risk to the seller and protects the buyer from overruns","Cost-reimbursable since the seller prefers it","Time and materials as a compromise","Let the seller choose the contract type"],"answer":0,"why":"Fixed-price is appropriate when scope is well-defined. It puts cost risk on the seller. The buyer\u0027s interest is to use the contract type that matches scope clarity.","mindset":"PMI mindset: on the exam, assume you are the buyer unless told otherwise. Choose the contract type that matches scope clarity and optimally allocates risk.","tags":["Contract Types","Fixed-Price","Procurement"],"chapterRef":"Chapter 13 - Contract Types"},{"q":"A seller on a cost-plus-incentive-fee (CPIF) contract comes in 20% under the target cost. Who benefits?","options":["Both parties benefit â€” CPIF contracts share savings between buyer and seller based on the share ratio, incentivizing the seller to control costs","Only the buyer benefits since they pay less","Only the seller benefits since they keep all savings","Neither benefits â€” the contract price is fixed"],"answer":0,"why":"CPIF splits cost savings per the share ratio. Both parties benefit, which is the whole point â€” it incentivizes seller efficiency while reducing buyer cost.","mindset":"PMI mindset: understand how incentive contracts align interests. Both parties benefit from good performance â€” that\u0027s the incentive mechanism.","tags":["CPIF","Incentive Contracts","Procurement"],"chapterRef":"Chapter 13 - Contract Types"},{"q":"During contract execution, you discover the seller is not meeting quality standards defined in the SOW. What should you do FIRST?","options":["Document the non-compliance and formally notify the seller through the contract\u0027s defined communication channels, giving them opportunity to correct","Immediately terminate the contract","Ignore it if the overall project is on schedule","Fix the quality issues yourself and bill the seller"],"answer":0,"why":"Contract issues require formal documentation and notification through proper channels. This protects both parties legally and gives the seller a chance to cure.","mindset":"PMI mindset: contract management follows formal processes. Document, notify, give opportunity to cure. Termination is a last resort.","tags":["Contract Administration","Quality","Procurement"],"chapterRef":"Chapter 13 - Control Procurements"},{"q":"A potential seller takes you out to dinner during the procurement process and hints they\u0027d appreciate being selected. What should you do?","options":["Decline the dinner or pay for yourself, and report the interaction to your procurement/ethics office â€” this creates a conflict of interest and appearance of bias","Accept dinner but promise it won\u0027t influence your decision","Accept since it\u0027s just networking","Select a different seller to avoid the appearance of bias without reporting"],"answer":0,"why":"Gifts during
