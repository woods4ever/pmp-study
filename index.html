    <div class="analytics-card"><p class="muted">Review Queue</p><div class="big-num">${reviewQueue.length}</div><p>Items waiting</p></div>
    <div class="analytics-card"><p class="muted">Weakest Chapter</p><h3>${wc ? esc(wc.name) : "Not enough data"}</h3></div>
    <div class="analytics-card"><p class="muted">Weakest Tag</p><h3>${wt ? esc(wt.tag) : "Not enough data"}</h3></div>
  </div>
  <div class="card"><h3>Confidence Calibration</h3>
    <table class="calibration-table"><tr><th>Category</th><th>Count</th></tr>
    <tr><td>Confident + Correct</td><td>${s.confidentCorrect}</td></tr>
    <tr><td>Confident + Wrong</td><td>${s.confidentWrong}</td></tr>
    <tr><td>Unsure + Correct</td><td>${s.unsureCorrect}</td></tr>
    <tr><td>Guessed + Correct</td><td>${s.guessCorrect}</td></tr>
    <tr><td>Guessed + Wrong</td><td>${s.guessWrong}</td></tr></table>
    <p class="muted small">Watch “Confident + Wrong” closely. That usually means a misunderstanding, not just a knowledge gap.</p>
  </div>
  <div class="card"><h3>Question Tags</h3>${tagRows || `<p class="muted">Take a quiz to generate tag performance.</p>`}</div>
  <h3>Chapter Performance</h3>
  <div class="analytics-grid">${chapterRows || `<div class="card"><p class="muted">Take a quiz to unlock chapter analytics.</p></div>`}</div>
  <div class="card"><h3>Audio Bookmarks</h3>${audioMarks.length ? audioMarks.map(a=>`<div class="audio-bookmark">${esc(a.label)} • ${esc(a.date)}</div>`).join("") : `<p class="muted">No audio bookmarks yet.</p>`}</div>`;
}

function startChapterQuiz(id){stopPodcast(false);quizMode="practice";let ch=chapters.find(c=>c.id===id);quizQuestions=ch.questions.map(q=>shuffleOptions({...q,chapterTitle:ch.title,chapterId:ch.id}));quizIndex=0;selectedOption=null;confidence=null;quizResults=[];screen="quiz";resetQuestionTools();render();}
function startMock(){stopPodcast(false);quizMode="mock";quizQuestions=chapters.flatMap(ch=>ch.questions.map(q=>shuffleOptions({...q,chapterTitle:ch.title,chapterId:ch.id}))).sort(()=>Math.random()-.5);quizIndex=0;selectedOption=null;confidence=null;quizResults=[];screen="quiz";resetQuestionTools();render();}
function selectOption(i){selectedOption=i;render();} function setConfidence(c){confidence=c;render();}
function nextQuestion(){
  let q=quizQuestions[quizIndex];
  quizResults.push({question:q,selected:selectedOption,confidence,timeSpent:questionElapsed,eliminated:[...eliminatedOptions]});
  const latest = quizResults[quizResults.length-1];
  const isCorrect = latest.selected === latest.question.answer;
  if(!isCorrect) addToReviewQueue(latest.question, "Missed");
  if(latest.confidence === "guess") addToReviewQueue(latest.question, "Guessed");
  if(latest.confidence === "unsure") addToReviewQueue(latest.question, "Low confidence");
  if(latest.confidence === "confident" && !isCorrect) addToReviewQueue(latest.question, "Confident + wrong");

  if(quizIndex>=quizQuestions.length-1){
    if(questionTimerInterval) clearInterval(questionTimerInterval);
    questionTimerInterval = null;
    if(examTimerInterval) clearInterval(examTimerInterval);
    examTimerInterval = null;
    quizResults.filter(r=>r.selected!==r.question.answer||r.confidence==="guess").forEach(r=>{let q=r.question;if(!missed.some(m=>m.q===q.q))missed.push(q)});
    studyHistory.push({date:new Date().toLocaleString(), mode:quizMode, results:quizResults});
    save();
    screen="results";
  }else{
    quizIndex++;
    selectedOption=null;
    confidence=null;
    resetQuestionTools();
  }
  render();
}

const TRAP_WORDS = ["FIRST","NEXT","BEST","MOST","LEAST","EXCEPT","ALWAYS","NEVER","AVOID","IMMEDIATELY","ONLY","INITIAL","PRIMARY","NOT","MOST LIKELY","LEAST LIKELY"];

function resetQuestionTools(){
  eliminatedOptions = [];
  showTrapWords = false;
  questionStartTime = Date.now();
  questionElapsed = 0;
  startQuestionTimer();
}

function startQuestionTimer(){
  if(questionTimerInterval) clearInterval(questionTimerInterval);
  questionTimerInterval = setInterval(() => {
    if(screen !== "quiz"){
      clearInterval(questionTimerInterval);
      questionTimerInterval = null;
      return;
    }
    questionElapsed = Math.floor((Date.now() - questionStartTime) / 1000);
    updateQuestionTimerUI();
  }, 1000);
}

function updateQuestionTimerUI(){
  const secondsEl = document.getElementById("questionSeconds");
  const fill = document.getElementById("timerFill");
  const label = document.getElementById("timerLabel");
  if(!secondsEl || !fill || !label) return;
  secondsEl.textContent = questionElapsed + "s";
  const pct = Math.min(100, (questionElapsed / 90) * 100);
  fill.style.width = pct + "%";
  fill.classList.remove("warn","danger");
  if(questionElapsed >= 90){
    fill.classList.add("danger");
    label.textContent = "Move on soon";
  } else if(questionElapsed >= 75){
    fill.classList.add("warn");
    label.textContent = "Pacing warning";
  } else {
    label.textContent = "On pace";
  }
}

function toggleEliminate(i){
  if(eliminatedOptions.includes(i)){
    eliminatedOptions = eliminatedOptions.filter(x => x !== i);
  } else {
    eliminatedOptions.push(i);
  }
  render();
}

function toggleTrapWords(){
  showTrapWords = !showTrapWords;
  render();
}

function highlightTrapWords(text){
  if(!showTrapWords) return esc(text);
  let safe = esc(text);
  const phrases = ["MOST LIKELY","LEAST LIKELY"];
  phrases.forEach(word => {
    const re = new RegExp("\\b" + word.replace(" ", "\\s+") + "\\b", "gi");
    safe = safe.replace(re, m => `<span class="trap-word">${m}</span>`);
  });
  const singles = TRAP_WORDS.filter(w => !w.includes(" "));
  singles.forEach(word => {
    const re = new RegExp("\\b" + word + "\\b", "gi");
    safe = safe.replace(re, m => `<span class="trap-word">${m}</span>`);
  });
  return safe;
}

function quizView(){
  let q=quizQuestions[quizIndex];
  setTimeout(updateQuestionTimerUI, 0);
  return `<span class="pill blue">Question ${quizIndex+1} of ${quizQuestions.length}</span><span class="pill">${esc(q.chapterTitle)}</span><button class="bookmark" onclick="toggleBookmark('q-${esc(q.q)}','${esc(q.q)}','Question')">${isBookmarked('q-'+q.q)?'★':'☆'}</button>
  ${quizMode==="fullExam" ? `<div class="exam-panel"><span class="sim-badge">Full Mock Exam</span><div class="exam-clock" id="examClock">3:50:00</div><p id="examTimeStatus">Exam timer running</p><p class="muted small">180 questions. Built from your current note-based question bank. Use it for stamina, pacing, and review.</p></div>` : ``}<div class="question-timer">
    <div class="timer-row">
      <span>Question pacing: <span id="questionSeconds">${questionElapsed}s</span></span>
      <span id="timerLabel">On pace</span>
    </div>
    <div class="timer-bar"><div id="timerFill" class="timer-fill"></div></div>
    <div class="pacing-note">PMP target: about 75 seconds per question. If this turns orange, choose your best answer and keep moving.</div>
  </div>
  <div class="exam-toolbar">
    ${(quizMode==="simulation" || quizMode==="fullExam") ? "" : `<button class="tool-btn ${showTrapWords?'active':''}" onclick="toggleTrapWords()">Highlight Trap Words</button>`}
    <button class="tool-btn" onclick="eliminatedOptions=[];render()">Clear Cross-Outs</button>
  </div>
  <div>${(q.tags||[]).map(t=>`<span class="tag-pill">${esc(t)}</span>`).join("")}</div><h2>${(quizMode==="simulation" || quizMode==="fullExam") ? esc(q.q) : highlightTrapWords(q.q)}</h2>
  ${q.options.map((o,i)=>`<div class="option-wrap"><button class="option ${selectedOption===i?'selected':''} ${eliminatedOptions.includes(i)?'eliminated':''}" onclick="selectOption(${i})">${esc(o)}</button><button class="cross-btn ${eliminatedOptions.includes(i)?'eliminated':''}" onclick="toggleEliminate(${i})">✕</button></div>`).join("")}
  <div class="card"><h3>Confidence</h3><div class="conf-grid"><button class="conf ${confidence==='guess'?'selected':''}" onclick="setConfidence('guess')">Guessed</button><button class="conf ${confidence==='unsure'?'selected':''}" onclick="setConfidence('unsure')">Unsure</button><button class="conf ${confidence==='confident'?'selected':''}" onclick="setConfidence('confident')">Confident</button></div></div>
  <button class="btn" ${selectedOption===null||confidence===null?'disabled':''} onclick="nextQuestion()">${quizIndex===quizQuestions.length-1?'Finish':'Next'}</button>`;
}

function resultsView(){let correct=quizResults.filter(r=>r.selected===r.question.answer).length,pct=Math.round(correct/quizResults.length*100),low=quizResults.filter(r=>r.confidence!=='confident').length;return `<div class="card" style="background:#020617;color:white;text-align:center;"><p>Score</p><h2 style="font-size:48px;margin:0;">${pct}%</h2><p>${correct} correct • ${quizResults.length-correct} missed • ${low} low-confidence</p><p>Avg time: ${Math.round(quizResults.reduce((sum,r)=>sum+(r.timeSpent||0),0)/quizResults.length)}s/question</p></div><h2>Review</h2>${quizResults.map(r=>{let good=r.selected===r.question.answer;return `<div class="card"><p class="${good?'result-good':'result-bad'}">${good?'Correct':'Missed'} • Confidence: ${r.confidence}</p><h3>${esc(r.question.q)}</h3><p><strong>Your answer:</strong> ${r.selected === -1 ? "Unanswered" : esc(r.question.options[r.selected])}</p>${!good?`<p><strong>Correct answer:</strong> ${esc(r.question.options[r.question.answer])}</p>`:''}<p><strong>Why:</strong> ${esc(r.question.why)}</p><p><strong>PMP mindset:</strong> ${esc(r.question.mindset)}</p><div class="mindset-box"><strong>Why PMI wants this answer:</strong><br>${esc(pmiMindsetFor(r.question))}<br><br><strong>Why the tempting answers are wrong:</strong><br>${esc(r.question.temptingWrong || "The wrong answers may sound partly correct, but they miss the best PMP process or mindset.")}<br><br><strong>Trap pattern:</strong><br>${esc(trapPatternFor(r.question))}</div><p><strong>Read again:</strong> ${esc(r.question.chapterRef)}</p></div>`}).join("")}<button class="btn" onclick="go('home')">Back Home</button>`}
function missedView(){if(!missed.length)return `<h2>Missed / Low Confidence</h2><div class="card"><p class="muted">No missed or guessed questions yet.</p></div>`;return `<h2>Missed / Low Confidence</h2>${missed.map(q=>`<div class="card"><h3>${esc(q.q)}</h3><p class="muted">${esc(q.chapterRef)}</p><p><strong>Mindset:</strong> ${esc(q.mindset)}</p></div>`).join("")}<button class="btn red" onclick="missed=[];save();render()">Clear</button>`}

function isBookmarked(id){return bookmarks.some(b=>b.id===id)} function toggleBookmark(id,title,type){if(isBookmarked(id))bookmarks=bookmarks.filter(b=>b.id!==id);else bookmarks.push({id,title,type,date:new Date().toLocaleDateString()});save();render();}
function bookmarksView(){return `<h2>Saved / Bookmarks</h2>${bookmarks.length?bookmarks.map(b=>`<div class="card"><span class="pill amber">${esc(b.type)}</span><h3>${esc(b.title)}</h3><p class="muted">Saved ${esc(b.date)}</p><button class="btn secondary" onclick="toggleBookmark('${esc(b.id)}','${esc(b.title)}','${esc(b.type)}')">Remove</button></div>`).join(""):`<div class="card"><p class="muted">No bookmarks yet. Tap the star on chapters or questions.</p></div>`}`}

function tutorView(){return `<h2>AI Tutor Mode</h2><div class="card"><p class="muted">This is an offline tutor for the chapters loaded into the app. Type a question like “Explain CPI” or “Manage Quality vs Control Quality.”</p><textarea id="tutorInput" placeholder="Ask about Schedule, Cost, Quality, formulas, mindset, or exam traps..."></textarea><button class="btn purple" onclick="askTutor()">Ask Tutor</button></div><div id="tutorAnswer"></div><h3>Recent Tutor Questions</h3>${tutorHistory.slice(-5).reverse().map(h=>`<div class="card"><strong>Q:</strong> ${esc(h.q)}<br><br><strong>A:</strong> ${esc(h.a)}</div>`).join("")}`}
function askTutor(){let input=document.getElementById("tutorInput").value.trim();if(!input)return;let a=generateTutorAnswer(input);tutorHistory.push({q:input,a});save();document.getElementById("tutorAnswer").innerHTML=`<div class="card"><h3>Tutor Answer</h3><p>${esc(a)}</p></div>`;}
function generateTutorAnswer(q){let s=q.toLowerCase();if(s.includes("cpi"))return "CPI is Cost Performance Index. Formula: EV divided by AC. If CPI is below 1, the project is over budget. If CPI is above 1, the project is under budget. PMP mindset: interpret the number, then analyze the cause before taking corrective action.";if(s.includes("spi"))return "SPI is Schedule Performance Index. Formula: EV divided by PV. Below 1 means behind schedule; above 1 means ahead of schedule. PMP mindset: use schedule data to understand performance before changing the baseline.";if(s.includes("critical"))return "The critical path is the longest path through the network diagram and determines project duration. Critical path activities have no float. If one slips, the project slips unless corrective action is taken.";if(s.includes("crashing")||s.includes("fast"))return "Crashing adds resources to shorten the schedule and increases cost. Fast-tracking overlaps activities and increases risk. Exam trap: adding people or equipment is crashing; doing tasks in parallel is fast-tracking.";if(s.includes("manage quality")||s.includes("control quality"))return "Manage Quality focuses on the processes used to produce deliverables. Control Quality inspects completed deliverables to determine whether they meet standards. Exam shortcut: process = Manage Quality; deliverable inspection = Control Quality.";if(s.includes("reserve"))return "Contingency reserve covers known unknowns and is included in the cost baseline. Management reserve covers unknown unknowns, sits above the baseline, and requires management approval.";if(s.includes("float")||s.includes("slack"))return "Float, or slack, is how long an activity can be delayed without delaying the project. Critical path activities have zero float. Slack can be calculated as LS minus ES or LF minus EF.";if(s.includes("quality"))return "Quality means meeting requirements, not just having fancy features. Grade can be low or high, but quality must be high. PMI favors prevention, clear requirements, process improvement, and objective measurement.";
if(s.includes("raci")||s.includes("accountable"))return "RACI means Responsible, Accountable, Consulted, and Informed. The exam trap is accountability: avoid having more than one accountable person for the same work because it creates confusion and blame.";
if(s.includes("communication channel")||s.includes("channels"))return "Communication channels use N(N-1)/2. N is the number of stakeholders or people. Example: 10 people gives 10×9/2 = 45 channels.";
if(s.includes("stakeholder"))return "Stakeholder management is about identifying stakeholders, understanding their power/interest/influence, planning engagement, managing engagement, and monitoring it. PMP mindset: engage early, tailor communication, and move stakeholders toward the desired engagement level.";
if(s.includes("procurement")||s.includes("contract"))return "For procurement, assume you are the buyer unless the question says otherwise. Fixed price works best when scope is clear and shifts risk to the seller. Cost reimbursable and time/material place more cost risk on the buyer.";
if(s.includes("conflict"))return "For conflict, first understand the source and context. Use servant leadership: facilitate, listen, and help the team reach a constructive solution instead of dictating immediately.";
if(s.includes("emotional intelligence"))return "Emotional intelligence helps the PM read tone, facial expression, and behavior, then adjust responses to de-escalate and support project outcomes.";
if(s.includes("mvp")||s.includes("business value"))return "An MVP gives customers usable minimal functionality sooner so they can realize value and provide feedback earlier. PMP mindset: keep checking whether the project is still delivering expected business value.";
return "Based on the loaded chapters, think like PMI: understand the issue first, use the right process, analyze data, avoid jumping straight to escalation, engage stakeholders, communicate clearly, support the team, and protect baselines through change control when needed."}

function progressView(){return progressDashboardV24();}

function render(){let root=document.getElementById("root"); if(screen==="home")root.innerHTML=home(); if(screen==="chapters")root.innerHTML=chaptersView(); if(screen==="chapterDetail")root.innerHTML=chapterDetail(); if(screen==="quiz")root.innerHTML=quizView(); if(screen==="results")root.innerHTML=resultsView(); if(screen==="missed")root.innerHTML=missedView(); if(screen==="bookmarks")root.innerHTML=bookmarksView(); if(screen==="tutor")root.innerHTML=tutorView(); if(screen==="progress")root.innerHTML=progressView(); if(screen==="reviewQueue")root.innerHTML=reviewQueueView(); if(screen==="dailyPlan")root.innerHTML=dailyPlanView();}
render();

</script>
