const chapters = [{"id":2,"title":"Chapter 2: Key Project Management Terms","summary":"Key PMP terms including projects, operations, progressive elaboration, life cycles, baselines, PMO types, stakeholders, organizational structures, constraints, and success.","notes":["Page 21 – Key Project Management Terms","PMBOK® Guide and Agile Practice Guide","Originally published in 1996, the PMBOK® Guide is currently in its 6th edition.","It has been consistently updated every four to five years.","When you get certified in one PMBOK® Guide, you do not need to be certified in another if all you have to do is maintain that certification.","The PMBOK® Guide was written by a large body of individuals who came together to write common standards for project management.","The PMBOK® Guide provides a standard set of processes that standardize the way a project is managed across different industries.","The goal of the PMBOK® Guide is to answer questions about whether all projects follow a standard set of processes and what those processes are.","The Agile Practice Guide is another guide used heavily on the exam.","The Agile Practice Guide outlines agile concepts, processes, and terminology needed for the exam.","Although 50% of the exam is still based on the PMBOK® Guide, questions on agile practices should also be expected.","Review the dedicated Agile chapter to learn more about the guide and the terms needed to understand Agile.","Project","A temporary endeavor to create a unique product, service, or result.","A project is temporary; it can be either short or long.","Projects can range from tasks lasting a few days to efforts requiring multiple years to complete.","All projects must:","Be temporary.","Have a start date and an end date.","Produce a unique output.","Be unique to the customer.","Even though a project is temporary, the output or main deliverable may exist for a very long time.","Examples of projects can include:","Building a house.","Creating new software.","Installing a new computer network.","Redesigning a process in a company.","Merging different organizations.","Operations","Operations are the opposite of projects.","Operations deal with the day-to-day work of a business.","One of the main differences between projects and operations is that projects are temporary while operations are ongoing.","Operations have no start date or end date.","Sales is an example of an operation because it is performed every day and is never finished.","Providing IT support is also an operation.","Page 22 – Key Project Management Terms","Operations (continued)","Building cars on an assembly line is also an operation because the output is not unique, and there is no start or end date.","Main difference for the exam:","Projects are temporary and unique.","Operations have no start date, no end date, and are not unique.","Progressive Elaboration","Progressive elaboration involves discovering greater levels of detail as the project moves toward completion.","Also known as “rolling wave planning.”","As time progresses, things get more detailed.","At the beginning of a project, you may not know the specific details of what you want to do.","Initially, only high-level information may be known, such as an approximate cost.","As the project progresses, details become more elaborated.","Over time, more specific information becomes known about the project outcome.","Project Management","Project management is the application of knowledge, skills, tools, and techniques to meet the project requirements.","It is about managing people to accomplish the scope of the project within the constraints of time and costs.","All projects are limited as to time, cost, and scope.","In project management, the goal is to get work done within a specific budget and a specific timeframe.","Accomplishing project activities results in completing the actual project requirements.","Three Approaches to Managing a Project","Predictive","Also known as traditional waterfall or plan-driven.","Much of the planning is done upfront at the beginning of the project.","The remainder of the project focuses on executing the plan to complete the work.","More of a traditional project approach.","Planning is completed first, followed by execution with very few changes throughout the project.","Agile","Also known as adaptive or change-driven.","Product is built in small increments instead of all at once.","Allows more customer interactions as increments are being built.","Users can begin using portions of the product and provide feedback.","Supports changes throughout the entire project.","Allows customers to add requirements without going through a change management process as in a traditional project.","Hybrid"],"examples":["The PMBOK® Guide was written by a large body of individuals who came together to write common standards for project management.","The PMBOK® Guide provides a standard set of processes that standardize the way a project is managed across different industries.","The goal of the PMBOK® Guide is to answer questions about whether all projects follow a standard set of processes and what those processes are.","The Agile Practice Guide is another guide used heavily on the exam.","The Agile Practice Guide outlines agile concepts, processes, and terminology needed for the exam."],"podcast":[{"speaker":"Maya","text":"Welcome to Chapter 2: Key Project Management Terms. This chapter is foundational, so the goal is to understand the PMP meaning of each term."},{"speaker":"Jordan","text":"Exactly. These concepts show up everywhere else in the exam, so this is about building clean mental hooks."},{"speaker":"Maya","text":"PMBOK® Guide and Agile Practice Guide"},{"speaker":"Jordan","text":"Originally published in 1996, the PMBOK® Guide is currently in its 6th edition."},{"speaker":"Maya","text":"It has been consistently updated every four to five years."},{"speaker":"Jordan","text":"When you get certified in one PMBOK® Guide, you do not need to be certi  usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"What is project management?","options":["Applying knowledge, skills, tools, and techniques to meet project requirements","Managing operations forever","Only creating the schedule","Only controlling cost"],"answer":0,"why":"Project management applies knowledge, skills, tools, and techniques to meet requirements.","mindset":"It balances people, scope, cost, and time.","chapterRef":"Chapter 2: Project Management","tags":["Concept","Foundation"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"Which approach is also known as waterfall or plan-driven?","options":["Predictive","Agile","Hybrid","Adaptive"],"answer":0,"why":"Predictive is traditional waterfall or plan-driven.","mindset":"Predictive uses more upfront planning.","chapterRef":"Chapter 2: Predictive","tags":["Lifecycle","Concept"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"Which approach builds in small increments and supports changes?","options":["Agile","Predictive","Operations","Portfolio"],"answer":0,"why":"Agile builds in increments and supports changes throughout the project.","mindset":"Agile is adaptive/change-driven.","chapterRef":"Chapter 2: Agile","tags":["Agile","Lifecycle"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"What is a hybrid approach?","options":["Combining predictive and agile methods","Using no project life cycle","Only doing operations","Only using a PMO"],"answer":0,"why":"Hybrid combines predictive and agile methods.","mindset":"Hybrid blends approaches depending on project needs.","chapterRef":"Chapter 2: Hybrid","tags":["Agile","Lifecycle"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"Why do companies do projects?","options":["To derive value from the output","To avoid all change","To maintain daily operations only","To create paperwork only"],"answer":0,"why":"Companies do projects to gain value from the output.","mindset":"Projects should deliver business value.","chapterRef":"Chapter 2: Value","tags":["Business","Value"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"What does ITTO stand for?","options":["Inputs, Tools and Techniques, Outputs","Initiating, Testing, Tracking, Operations","Integration, Time, Team, Outputs","Issues, Tools, Teams, Outcomes"],"answer":0,"why":"ITTO stands for Inputs, Tools and Techniques, Outputs.","mindset":"Every process has ITTOs.","chapterRef":"Chapter 2: ITTO","tags":["Process","Foundation"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"What is a phase?","options":["A division within the project where extra control is needed to manage deliverables","A permanent operation","A contract type","A stakeholder role"],"answer":0,"why":"A phase is a project division used for extra control, usually ending with deliverable acceptance.","mindset":"Phases help manage deliverables.","chapterRef":"Chapter 2: Phase","tags":["Lifecycle","Process"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"What happens at phase gates?","options":["A review determines whether the project is meeting goals and should continue","The project automatically ends","All scope is removed","The sponsor always rejects deliverables"],"answer":0,"why":"Phase gates review progress and decide whether the project should continue.","mindset":"Phase gate = stage gate/kill point/review.","chapterRef":"Chapter 2: Phase Gates","tags":["Process","Exam Trap"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"What is a deliverable?","options":["A part of the product presented for acceptance","A PMO type","A stakeholder role","An operational activity"],"answer":0,"why":"A deliverable is presented to customers/stakeholders for acceptance.","mindset":"Deliverables are accepted by customers or sponsors.","chapterRef":"Chapter 2: Deliverable","tags":["Scope","Concept"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"What is a process group?","options":["A grouping of processes the PM may do at a certain time","A project phase","A life cycle stage","A product deliverable"],"answer":0,"why":"A process group groups processes that may be performed at a certain time.","mindset":"Process groups are not phases.","chapterRef":"Chapter 2: Process Group","tags":["Process","Exam Trap"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"Which statement is true about phases and process groups?","options":["All phases contain the five process groups","Process groups and phases are the same","Only closing is a process group","Only agile projects have process groups"],"answer":0,"why":"All phases contain initiating, planning, executing, monitoring/controlling, and closing.","mindset":"Do not confuse phases with process groups.","chapterRef":"Chapter 2: Process Groups vs Phases","tags":["Process","Exam Trap"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"What are the three baselines?","options":["Scope, schedule/time, and cost","Quality, risk, and procurement","Stakeholder, resource, and communication","Program, portfolio, and product"],"answer":0,"why":"The notes list scope, time/schedule, and cost as the three baselines.","mindset":"Performance is measured against baselines.","chapterRef":"Chapter 2: Baselines","tags":["Baseline","Process"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"What is a baseline?","options":["The original plan plus approved changes","Only the first rough idea","Any informal sponsor request","A lesson learned"],"answer":0,"why":"A baseline is the original plan plus approved changes.","mindset":"Approved changes update baselines.","chapterRef":"Chapter 2: Baselines","tags":["Baseline","Change Control"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"What should happen when a sponsor requests added scope?","options":["Submit a formal change request and assess impacts","Add the work immediately","Ignore the sponsor","Close the phase"],"answer":0,"why":"Added scope requires a formal change request and impact assessment before approval.","mindset":"Scope changes affect time and cost.","chapterRef":"Chapter 2: Baseline Example","tags":["Change Control","Exam Trap"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"What does a supportive PMO provide?","options":["Templates and training with low authority","Full control of the project","Moderate mandatory framework only","Only product ownership"],"answer":0,"why":"A supportive PMO provides support, templates, and training with low authority.","mindset":"Supportive PMO = low authority.","chapterRef":"C  charter and stakeholder register","Cost baseline and schedule baseline","Work performance reports","Accepted deliverables"],"answer":0,"why":"The main initiating outputs are project charter and stakeholder register.","mindset":"Charter authorizes, stakeholder register identifies.","chapterRef":"Chapter 3: Initiating Outputs","tags":["Process","Stakeholder"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"What is the main output of planning?","options":["Project management plan","Work performance data","Accepted deliverables","Final report"],"answer":0,"why":"Planning creates the project management plan.","mindset":"The plan guides execution, monitoring/controlling, and closing.","chapterRef":"Chapter 3: Planning","tags":["Planning","Process"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"What is the main output of executing?","options":["Deliverables","Risk report only","Project charter","Final closure report"],"answer":0,"why":"The main output of executing is deliverables.","mindset":"Executing is where project work is performed.","chapterRef":"Chapter 3: Executing","tags":["Execution","Process"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"What does monitoring and controlling do?","options":["Compare actual work to planned work","Authorize the project","Only close contracts","Only identify stakeholders"],"answer":0,"why":"Monitoring and controlling measures and compares actual work to the plan.","mindset":"Off-plan work may require corrective action or changes.","chapterRef":"Chapter 3: Monitoring and Controlling","tags":["Control","Process"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"What is true about executing and monitoring/controlling?","options":["They occur in parallel/simultaneously","They cannot overlap","Monitoring only occurs after closing","Executing happens before planning"],"answer":0,"why":"The notes say executing and monitoring/controlling are parallel/simultaneous.","mindset":"You monitor/control while executing.","chapterRef":"Chapter 3: Exam Tip","tags":["Process","Exam Trap"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"What happens in closing?","options":["Accepted deliverables are transitioned, records archived, contracts closed, and lessons learned documented","Project is first authorized","Requirements are collected","Schedule is developed"],"answer":0,"why":"Closing happens after acceptance and includes transition, records, lessons learned, and final reporting.","mindset":"Closing is more than just finishing work.","chapterRef":"Chapter 3: Closing","tags":["Closing","Process"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"What are Enterprise Environmental Factors?","options":["Factors not under the project team’s control that may affect outcomes","Only templates and lessons learned","Only project documents","Only change requests"],"answer":0,"why":"EEF are internal/external factors not under the control of the project team.","mindset":"EEF can positively or negatively affect outcomes.","chapterRef":"Chapter 3: EEF","tags":["ITTO","Process"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"What are Organizational Process Assets?","options":["Plans, processes, policies, procedures, and knowledge bases used by the organization","External regulations only","The sponsor’s personal notes","Only risk tolerance"],"answer":0,"why":"OPA include templates, historical information, lessons learned, policies, procedures, and knowledge bases.","mindset":"OPA helps the PM manage the project.","chapterRef":"Chapter 3: OPA","tags":["ITTO","Process"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"What is the project management plan?","options":["The single most important document defining how the project is executed, monitored/controlled, and closed","A stakeholder list only","Raw work data","Only the charter"],"answer":0,"why":"The notes call the project management plan the single most important document.","mindset":"The plan guides how the project is handled.","chapterRef":"Chapter 3: Project Management Plan","tags":["Plan","Process"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"What is work performance data?","options":["Raw data with no analysis applied","Analyzed status compared to the plan","A compiled project report","A final closure report"],"answer":0,"why":"Work performance data is raw and not useful by itself.","mindset":"Data is raw; information is analyzed.","chapterRef":"Chapter 3: Work Performance Data","tags":["ITTO","Exam Trap"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"What is work performance information?","options":["Work data analyzed against the project management plan","Raw data only","A compiled project report","A vendor agreement"],"answer":0,"why":"Work performance information compares raw data to the plan.","mindset":"Information shows actual status compared to plan.","chapterRef":"Chapter 3: Work Performance Information","tags":["ITTO","Exam Trap"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."},{"q":"What is the correct work performance flow?","options":["Data → Information → Reports","Reports → Data → Information","Information → Data → Reports","Data → Charter → Reports"],"answer":0,"why":"Data is compared to the plan to create information, and information is compiled into reports.","mindset":"Data feeds info; info creates reports.","chapterRef":"Chapter 3: Work Performance Flow","tags":["ITTO","Exam Trap"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound related, but they miss the exact PMP definition or distinction being tested."}]},{"id":4,"title":"Chapter 4: Agile and Hybrid Project Management","summary":"Agile and hybrid project management, including Agile values/principles, Scrum/XP terms, product backlog, sprint flow, MVP, Kanban, Lean, servant leadership, and hybrid approaches.","notes":["Page 65 – Agile and Hybrid Project Management","Review of Agile processes and terms likely to appear on the PMP exam.","Need to be familiar with the entire Agile process and different Agile terms.","Chapter serves as an introduction to Agile project management and is more than sufficient for PMP exam questions.","Traditional (predictive) project management:","Goes through initiating, planning, executing, monitoring and controlling, and closing.","Has a strenuous change management approach.","Project manager generally in charge of the entire project.","Agile:","Represents iterative (flexible) project management.","Includes different Agile methods.","Agile framework:","Builds the product in increments versus as a whole.","Traditional projects generally build the product in its entirety in one long execution phase.","Agile projects build the product in small increments.","Customers provide feedback on each increment.","Allows more interaction with customers and more empowerment to the team.","Agile has become one of the most popular project management methods because of:","Frequent product delivery.","Customer interaction.","Value being realized throughout the project.","Agile is included on the current PMP exam.","Page 65 – What is Agile?","Agile is an umbrella term used to refer to different types of iterative development.","Agile methods include:","Scrum","Extreme Programming (XP)","Kanban","Lean development","Others","PMP exam will not go into these methodologies in detail.","Need to understand the Agile process and some terminology from these methodologies.","Agile techniques have been used for several decades in various forms.","In 2000, software developers created the manifesto for Agile software development.","The Agile manifesto outlines:","4 values","12 principles","No need to memorize the values or principles; a brief understanding is sufficient.","The four values are as follows:","Individuals and interactions over processes and tools","Working software over comprehensive documentation","Customer collaboration over contract negotiation","Responding to change over following a plan","Page 66 – Agile Manifesto Values (Explanation)","While they are valuable practices on the right, in Agile, we value things on the left more.","It is more important to have competent people working effectively in order to get the work done.","Projects are done by people, not by tools and processes.","Customers are more interested in working software, not comprehensive documentation.","While contracts are important, it will be more important to work with the customer to understand what they actually need on the project.","Need to be willing to accept changes and be willing to change the plan as the needs of the customer change.","Willingness to accept changes at any point throughout a project is one of the main differentiating factors between traditional projects and Agile projects.","Page 66 – The 12 Agile Principles","Customer satisfaction by early and continuous delivery of valuable software.","Welcome changing requirements, even late in development.","Deliver working software frequently (weeks rather than months).","Close, daily cooperation between business people and developers.","Projects are built around motivated individuals who should be trusted.","Face-to-face conversation is the best form of communication (co-location).","Working software is the primary measure of progress.","Sustainable development, able to maintain a constant pace.","Continuous attention to technical excellence and good design.","Simplicity—the art of maximizing the amount of work not done—is essential.","Best architectures, requirements, and designs emerge from self-organizing teams.","Regularly, the team reflects on how to become more effective, and adjusts accordingly.","Page 66 – Brief Explanation of the 12 Principles","Agile is about continuously delivering increments of a product over a span of time.","Traditional projects may take many months to a few years to deliver a working product.","Agile delivers increments of the product in a very short period of time.","The short period of time can be anywhere from a few weeks to a few months.","Fast delivery allows customers to realize the value of the product faster.","Allows the customer to fund the development of the product incrementally.","In a traditional project, value will not be realized until the entire project is done and the product is delivered to the customer.","A unique aspect of an Agile project is the ability to accept and welcome change throughout the entire development process.","Agile does not have a strenuous change management process that requires:","A formal change request.","Usage of a change management board.","Customers are able to submit changes throughout the entire Agile project.","Changes will be accepted and inputted into the product backlog, which may get completed.","Allows customers to feel more welcomed throughout the entire project.","Agile projects will not suppress change management like some traditional projects.","Agile is all about people collaboration.","It is important for Agile participants to consistently be in contact with each other.","This can be done using:","Daily standup meetings with team members.","Meetings with customers during iteration reviews to review the product.","Allows everyone to contribute and have a voice as the project is progressing.","Agile promotes face-to-face interaction.","Page 67 – Agile Principles (Continued)","Agile promotes face-to-face interaction as the best means of communication.","This means bringing together teams into one central location (co-location) for them to work together."],"examples":["Goes through initiating, planning, executing, monitoring and controlling, and closing.","Has a strenuous change management approach.","Project manager generally in charge of the entire project.","Agile:","Represents iterative (flexible) project management."],"podcast":[{"speaker":"Maya","text":"Welcome to Chapter 4: Agile and Hybrid Project Management. This chapter is about understanding Agile and hybrid project management the way the PMP exam wants you to think about it."},{"speaker":"Jordan","text":"Exactly. The big theme is value, collaboration, customer feedback, and using the right approach for the project."},{"speaker":"Maya","text":"Review of Agile processes and terms likely to appear on the PMP exam."},{"speaker":"Jordan","text":"Need to be familiar with the entire Agile process and different Agile terms."},{"speaker":"Maya","text":"Chapter serves as an introduction to Agile project management and is more than sufficient for PMP exam questions."},{"speaker":"Jordan","text":"Traditional (predictive) project management:"},{"speaker":"Maya","text":"Goes through initiating, planning, executing, monitoring and controlling, and closing."},{"speaker":"Jordan","text":"Has a strenuous change management approach."},{"speaker":"Maya","text":"Project manager generally in charge of the entire project."},{"speaker":"Jordan","text":"Agile:"},{"speaker":"Maya","text":"Represents iterative (flexible) project management."},{"speaker":"Jordan","text":"Includes different Agile methods."},{"speaker":"Maya","text":"Agile framework:"},{"speaker":"Jordan","text":"Builds the product in increments versus as a whole."},{"speaker":"Maya","text":"Traditional projects generally build the product in its entirety in one long execution phase."},{"speaker":"Jordan","text":"Agile projects build the product in small increments."},{"speaker":"Maya","text":"Customers provide feedback on each increment."},{"speaker":"Jordan","text":"Allows more interaction with customers and more empowerment to the team."},{"speaker":"Maya","text":"Agile has become one of the most popular project management methods because of:"},{"speaker":"Jordan","text":"Frequent product delivery."},{"speaker":"Maya","text":"For the exam, do not treat Agile as chaos. Agile still has structure, roles, events, and artifacts."},{"speaker":"Jordan","text":"Right. Think servant leadership, value delivery, feedback, sustainable pace, and empowered teams."}],"questions":[{"q":"What is Agile an umbrella term for?","options":["Different types of iterative development","Only Scrum","Only predictive project management","Only formal change control"],"answer":0,"why":"The notes define Agile as an umbrella term used to refer to different types of iterative development.","mindset":"Agile is broader than Scrum; Scrum is one Agile method.","chapterRef":"Chapter 4: What is Agile?","tags":["Agile","Concept"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound Agile-related, but they miss the exact Agile principle, role, artifact, or flow being tested."},{"q":"Which set lists Agile methods from the notes?","options":["Scrum, XP, Kanban, Lean development","PERT, CPM, EVM, RACI","FFP, CPIF, T&M, RFQ","Scope, schedule, cost, quality"],"answer":0,"why":"The notes list Scrum, Extreme Programming, Kanban, Lean development, and others as Agile methods.","mindset":"Do not treat Agile as one single method.","chapterRef":"Chapter 4: Agile Methods","tags":["Agile","Concept"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound Agile-related, but they miss the exact Agile principle, role, artifact, or flow being tested."},{"q":"Which Agile Manifesto value is listed in the notes?","options":["Individuals and interactions over processes and tools","Contracts over customer collaboration","Following a plan over responding to change","Documentation over working software"],"answer":0,"why":"One Agile value is individuals and interactions over processes and tools.","mindset":"The item on the left is valued more, though the item on the right still has value.","chapterRef":"Chapter 4: Agile Manifesto Values","tags":["Agile","Mindset"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound Agile-related, but they miss the exact Agile principle, role, artifact, or flow being tested."},{"q":"What is one main differentiating factor between traditional and Agile projects?","options":["Willingness to accept changes at any point throughout the project","Refusing customer feedback","Avoiding working software","Using no team collaboration"],"answer":0,"why":"The notes say willingness to accept changes at any point is a main differentiating factor.","mindset":"Agile welcomes change; predictive uses more formal change management.","chapterRef":"Chapter 4: Agile Manifesto Explanation","tags":["Agile","Change"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound Agile-related, but they miss the exact Agile principle, role, artifact, or flow being tested."},{"q":"What is the primary measure of progress in Agile according to the principles?","options":["Working software","Comprehensive documentation","A signed contract","A completed project charter"],"answer":0,"why":"One Agile principle says working software is the primary measure of progress.","mindset":"Customers value usable increments, not just percentage complete.","chapterRef":"Chapter 4: Agile Principles","tags":["Agile","Value"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound Agile-related, but they miss the exact Agile principle, role, artifact, or flow being tested."},{"q":"What does Agile promote as the best form of communication?","options":["Face-to-face conversation","Paper documentation","Email only","Formal reports only"],"answer":0,"why":"The Agile principles list face-to-face conversation as the best form of communication.","mindset":"Agile favors rich, high-touch communication.","chapterRef":"Chapter 4: Agile Principles","tags":["Agile","Communication"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound Agile-related, but they miss the exact Agile principle, role, artifact, or flow being tested."},{"q":"What is the Agile project manager’s role on the team?","options":["Facilitator/servant leader who removes impediments","Dictator who assigns all technical tasks","Functional manager controlling resources","Customer who prioritizes the backlog"],"answer":0,"why":"The Agile project manager acts more as a facilitator and servant leader who removes impediments.","mindset":"Agile teams are self-organizing; the PM supports rather than controls.","chapterRef":"Chapter 4: Agile Project Manager","tags":["Agile","Mindset"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound Agile-related, but they miss the exact Agile principle, role, artifact, or flow being tested."},{"q":"In Scrum, what is the work period called?","options":["Sprint","Phase gate","Control account","Portfolio"],"answer":0,"why":"In Scrum, the work being done is called a sprint.","mindset":"For exam purposes, Sprint = Iteration.","chapterRef":"Chapter 4: Agile Process Terms","tags":["Agile","Process"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound Agile-related, but they miss the exact Agile principle, role, artifact, or flow being tested."},{"q":"In XP, what is a sprint known as?","options":["Iteration","Portfolio","Deliverable","Baseline"],"answer":0,"why":"The notes state that in XP, the sprint is known as an iteration.","mindset":"Sprint and iteration are treated the same for exam purposes.","chapterRef":"Chapter 4: Scrum and XP","tags":["Agile","Exam Trap"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound Agile-related, but they miss the exact Agile principle, role, artifact, or flow being tested."},{"q":"Who represents the customer on an Agile project?","options":["Product Owner","Scrum Master","Functional Manager","PMO Director"],"answer":0,"why":"The product owner is the designated person who represents the customer.","mindset":"Product owner owns/prioritizes the product backlog.","chapterRef":"Chapter 4: Product Owner","tags":["Agile","Roles"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound Agile-related, but they miss the exact Agile principle, role, artifact, or flow being tested."},{"q":"Who prioritizes the product backlog?","options":["Product Owner","Agile project manager","Project team only","Senior management only"],"answer":0,"why":"The notes state only the product owner can prioritize the product backlog based on value.","mindset":"Backlog priority is based on value and owned by the product owner.","chapterRef":"Chapter 4: Product Backlog","tags":["Agile","Roles"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound Agile-related, but they miss the exact Agile principle, role, artifact, or flow being tested."},{"q":"What is the sprint backlog?","options":["Work the team selects to get done in the next sprint","All project requirements from customers","A list of all stakeholders","A formal change request log"],"answer":0,"why":"The sprint backlog is the work the team selects to complete in the next sprint.","mindset":"Product backlog = all requirements; sprint backlog = selected sprint work.","chapterRef":"Chapter 4: Sprint Backlog","tags":["Agile","Process"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound Agile-related, but they miss the exact Agile principle, role, artifact, or flow being tested."},{"q":"What is the purpose of the daily standup?","options":["A quick daily meeting to discuss status and impediments","A two-hour lessons learned meeting","A contract negotiation meeting","A formal change control board"],"answer":0,"why":"The daily standup is a quick daily meeting, usually 15 minutes, where team members discuss status and impediments.","mindset":"Standups surface work progress and blockers quickly.","chapterRef":"Chapter 4: Daily Standup","tags":["Agile","Communication"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound Agile-related, but they miss the exact Agile principle, role, artifact, or flow being tested."},{"q":"Which question is asked in a daily standup?","options":["What impediments or roadblocks are you facing?","What is the final project budget?","Should the contract be closed?","What is the project charter authority level?"],"answer":0,"why":"The notes list impediments/roadblocks as one of the three standup questions.","mindset":"Standups focus on progress, next work, and impediments.","chapterRef":"Chapter 4: Daily Standup Questions","tags":["Agile","Exam Trap"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound Agile-related, but they miss the exact Agile principle, role, artifact, or flow being tested."},{"q":"What is a sprint review?","options":["Customer inspection at the end of the sprint","Team-only meeting to discuss lessons learned","A formal procurement audit","A schedule compression technique"],"answer":0,"why":"The sprint review is an inspection done at the end of the sprint by customers.","mindset":"Sprint review gathers customer feedback on completed work.","chapterRef":"Chapter 4: Sprint Review","tags":["Agile","Process"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound Agile-related, but they miss the exact Agile principle, role, artifact, or flow being tested."},{"q":"What is a retrospective?","options":["A meeting to determine what went right and wrong during the sprint","A customer acceptance inspection only","A project charter approval meeting","A seller selection meeting"],"answer":0,"why":"A retrospective is where the team identifies what went right and wrong and how to improve next iteration.","mindset":"Retrospective = process improvement/lessons learned for the sprint.","chapterRef":"Chapter 4: Retrospective","tags":["Agile","Mindset"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound Agile-related, but they miss the exact Agile principle, role, artifact, or flow being tested."},{"q":"What is an MVP?","options":["A usable product that may not have all features","A fully complete final product with every feature","A predictive baseline","A procurement document"],"answer":0,"why":"An MVP may not have all features but is still usable.","mindset":"MVP delivers usable value early.","chapterRef":"Chapter 4: MVP","tags":["Agile","Value"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound Agile-related, but they miss the exact Agile principle, role, artifact, or flow being tested."},{"q":"How does Agile invert the traditional triangle?","options":["Fixed time and cost; variable scope","Fixed scope; variable time and cost","No constraints at all","Fixed scope, time, and cost with no changes"],"answer":0,"why":"The notes say Agile keeps time and cost fixed while varying scope.","mindset":"Agile focuses on delivering the most valuable features within fixed time/cost.","chapterRef":"Chapter 4: Inverting the Triangle","tags":["Agile","Exam Trap"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound Agile-related, but they miss the exact Agile principle, role, artifact, or flow being tested."},{"q":"What is grooming the product backlog?","options":["Adding, removing, and reprioritizing product backlog items","Closing the project","Approving a cost baseline","Testing final deliverables only"],"answer":0,"why":"Grooming means adding, removing, and reprioritizing the backlog so the most valuable items are at the top.","mindset":"Backlog is continuously managed based on value.","chapterRef":"Chapter 4: Product Backlog Grooming","tags":["Agile","Process"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound Agile-related, but they miss the exact Agile principle, role, artifact, or flow being tested."},{"q":"What is the purpose of Kanban limiting work in progress?","options":["Prevent overburdening the team and reveal issues/bottlenecks","Make all work invisible","Increase multitasking as much as possible","Remove customer feedback"],"answer":0,"why":"Kanban limits work in progress so teams are not overburdened and can see issues and bottlenecks.","mindset":"Limit WIP to improve focus and flow.","chapterRef":"Chapter 4: Kanban","tags":["Agile","Lean"],"examLike":true,"temptingWrong":"The tempting wrong answers usually sound Agile-related, but they miss the exact Agile principle, role, artifact, or flow being tested."}]},{"id":5,"title":"Chapter 5: Integration Management","summary":"Integration management, including the project charter, business documents, project management plan, direct and manage project work, project knowledge, work performance flow, integrated change control, and close project or phase.","notes":["Page 1 – Chapter 5: Integration Management","Integration management is the unification of all of the other knowledge areas.","It could be thought of as the combination or summary of the other nine knowledge areas.","In order to develop the project management plan, you will need to perform the other 23 planning processes.","By doing the other 23 processes, their outputs become the main input to the project management plan.","The processes listed under the integration knowledge area roll up to create the integration knowledge area.","In the integration executing process of “direct and manage project work,” you would need to complete the other nine processes listed under it.","This knowledge area is probably the most important of the 10 knowledge areas, as it incorporates and summarizes all of the work the project manager will need to do in order to successfully complete each phase of a project.","The project manager’s main job is to perform integration.","Integration means integrating all of the other knowledge areas such as scope, time, cost, and quality.","Different knowledge areas may be integrated in different sequences depending on the project.","Information gathered from the project scope may be used to create the schedule and budget.","On an agile project, the concept of managing a project in this knowledge area will not change.","The project manager will still be in charge of initiating, planning, executing, monitoring and controlling, and closing.","On agile projects, the project team will be more involved and make more decisions than the project manager.","In a traditional project, the project manager plays more of a central role with the project team reporting to them.","On agile and hybrid projects, the project manager plays more of a servant role and supports team members in conducting many of the processes listed in this knowledge area.","In agile, expect more changes throughout each phase and the project as a whole.","Expect exam questions on the processes covered in this chapter.","It is important to understand:","Why an input is needed.","How a tool can be used in a process.","The main outputs from each process.","Page 86 – Integration Management Processes","Develop Project Charter","Process Group: Initiating","Main Output:","Project Charter","Assumption Log","Develop Project Management Plan","Process Group: Planning","Main Output:","Project Management Plan","Direct and Manage Project Work","Process Group: Executing","Main Output:","Deliverables","Work Performance Data","Issue Log","Change Request","Manage Project Knowledge","Process Group: Executing","Main Output:","Lessons Learned Register","Monitor and Control Project Work","Process Group: Monitoring and Controlling","Main Output:","Work Performance Reports","Change Requests","Perform Integrated Change Control","Process Group: Monitoring and Controlling","Main Output:","Approved Change Request","Close Project or Phase","Process Group: Closing","Main Output:","Final Product, Service, or Result Transition","Final Report","Page 87 – Develop Project Charter","Develop Project Charter is the process of developing a document that formally authorizes the project or phase and documents initial requirements to satisfy the stakeholders.","The project charter establishes the partnership between the performing organization and the requesting organization.","This process is performed at the very beginning of a project or phase.","The charter is senior management written approval to start the project.","Think of the project charter as the authorization of the project manager and the project itself.","The charter is usually developed by the project sponsor while working with the project manager.","The charter contains high-level information that senior management will review in order to determine if the project should proceed.","The information collected to create the charter outlines the:","Cost","Schedule","Scope","Benefits","Once the project charter is approved, the next step is to identify stakeholders and begin planning the project.","Complete the two initiating processes of:","Develop project charter","Identify stakeholders","These should be completed before planning the project.","Agile and hybrid projects also have a project charter.","The project charter may not be as detailed as it would be in a traditional project.","It will still contain some of the high-level requirements so the project can be authorized.","An agile project charter generally contains a very high-level scope since most of the project will be unknown when the charter is being written.","Page 87 – Inputs: Business Documents","Business documents contain specific information as to why a project should be initiated.","There are two main documents:","Business case","Benefits management plan","Page 87 – Business Case","A business case basically says why a business should do this project.","Businesses usually do a cost-benefit analysis to justify the money being spent on the project.","Reasons companies initiate a project include:","Market demand, such as introducing a new product to the market that has a need.","Organizational need, such as reducing overhead to improve profits.","Customer request, such as improving a product to meet a customer request.","Technological advance, such as installing the latest operating system for better security.","Legal requirement, such as new regulations that a business needs to implement.","Environmental impacts, such as cleaning up toxic waste sites.","Social need, such as a project to reduce crime in certain areas.","Page 88 – Project Selection Methods","Selecting a project can be a complex task.","Methods that can be used to select a project include:","Benefit-Cost Ratio (BCR)","Ratio of benefit to cost.","Example:","Project returns $5,000 but costs $2,000.","$5,000 ÷ $2,000 = 2.5.","You are making $5 for every $2 that you spend.","The larger the ratio, the better the project.","Internal Rate of Return (IRR)","Looks at the return of the project investment as an interest rate.","The bigger the interest rate, the better the project.","An IRR of 20% is better than an IRR of 10%.","Opportunity Cost","An economic term that represents the value of what you choose not to do in order to do something else.","Example:","Project A will return $20,000.","Project B will return $30,000.","Selecting project B results in an opportunity cost of $20,000.","We give up option A to pursue option B.","Payback Period","How long it will take to return the investment capital in the project.","The shorter, the better.","The faster the business gets its money back, the faster it can start another project.","Economic Value Add (EVA)","Looks at the net value of a company over a period of time.","Equal to profits after tax minus the average cost of capital.","A business is only profitable if it creates value for its shareholders.","A formula is not needed for the PMP exam; you just need to understand it.","Present Value (PV) and Net Present Value (NPV)","Means money will lose value over time due to inflation.","$10 now will not be worth $10 in the next 5 years.","The NPV includes the expenses of the project.","The bigger the PV or NPV, the better.","Return on Investment (ROI)","A percentage that shows how much money you will get back on the project.","Example:","Company invests $1 million.","ROI is 10%.","Return will be $100,000.","The bigger the ROI, the better.","Page 89 – Project Benefits Management Plan","A project benefits management plan is used to describe the main benefits that the project will produce once it is completed.","The project benefit could be the product, service, or result that the organization is looking to obtain after the project is done.","This benefit would help to grow the organization.","Senior management will want to know the benefits this project will bring to the organization.","Most of the time, this is expressed in financial terms, such as:","How much money the company can gain by selling a particular product that the project is creating.","How it can reduce some of the organization’s risk.","It can also show how the output of the project is aligned with the strategic goals of the business.","Example:","It can show how the project deliverable will help to meet the organization’s long-term goal of increasing its revenue by 50%.","This benefits management plan is generally created by doing a cost-benefit analysis of whether a project should proceed or not and using the different business cases as to why a project is needed.","This document must be continually maintained because as the project is progressing and more benefits are realized, the plan should be updated accordingly.","The business case and the benefits management plan lead to the creation of the project charter, which then leads to the creation of the project management plan.","Page 89 – Agreements","An agreement is another word for a contract.","If this project is being done for an external customer, then an agreement will be needed to start the project for the contractor.","The agreement should be signed before the project starts.","Other forms of agreement can include:","Memorandums of understanding","Service level agreements","Letters of intent","Verbal agreements","Written agreements","Page 89 – Flow","Business Case ↔ Project Benefits Management Plan","Business Case / Project Benefits Management Plan → Project Charter","Project Charter → Project Management Plan","Page 89 – Inputs","Enterprise Environment Factors – Covered in Chapter 3","Organizational Process Assets – Covered in Chapter 3","Page 89 – Tools and Techniques","Expert Judgment – Covered in Chapter 3","Page 90 – Data Gathering","Gathering data to create the project charter can include techniques such as:","Brainstorming","Focus groups","Interviews","The objective is to gather the main requirements needed for the project.","This can include requirements for:","Scope","Cost","Schedule","Page 90 – Interpersonal and Team Skills","Expect to be doing a lot of facilitation among stakeholders while working to create the project charter.","Meeting management techniques will be needed in order to ensure meetings are run properly.","Page 90 – Meetings","Covered in Chapter 3","Page 90 – Outputs: Project Charter","The project charter is a document that officially authorizes the project to get started.","The project charter includes:","Project justification and purpose.","Name of the project manager.","Assignment of authority to the project manager.","Signature of the sponsor or others authorizing the project.","High-level requirements, including scope, budget, and milestones view of the project schedule.","High-level risks.","Stakeholder list.","Exit criteria (things that might cause the project to be canceled).","Page 90 – Assumption Log","The assumption log is a log of all the assumptions and constraints that are identified throughout the project.","Assumptions are things that you perceive to be true.","Constraints are things that might constrain the project.","Example:","A project manager may assume that the project does not need to upgrade any of the computer hardware in order to install a new application.","The project manager would write this assumption of no hardware upgrades in the assumption log.","Example:","A project may be constrained as to time because the work that is required may be too much for a short project schedule.","The project manager would list a constraint of time in the assumption log.","The assumption log is continuously updated throughout the entire phase or project.","Page 91 – Develop Project Management Plan","Develop Project Management Plan is the process of creating the project management plan that includes all the subsidiary plans and baselines.","The project management plan says how we will execute, monitor and control, and close the project.","The project management plan includes:","All the baselines (scope, time, and cost).","All of the management plans needed to manage each of the additional nine knowledge areas.","As you are doing the other planning processes, you will be creating many different types of documents that will be stored in this plan.","The whole objective of all 24 planning processes is to create this plan.","Without this plan, we will not know how to execute, monitor and control, and close the project.","Once the plan is completed, it will need to get baselined, which generally means getting it approved by the project sponsor.","While doing planning processes and changing or updating different components of the plan, there is no need for a change request because it has not been baselined.","Once the plan is completed and baselined, only an approved change request that has gone through the process of “perform integrated change control” can be used to update the plan.","Exam Tip: Only an approved change request can change a plan once it has been approved.","On agile and hybrid projects, this plan may not be as detailed as it would be on a traditional project.","While many of the components below mostly apply to a traditional project, agile projects can still use some of them.","In many traditional projects, these plans may be given to the project manager from the PMO.","On agile projects, the team will create them to best suit their needs.","Page 91 – Inputs","Project Charter","See the earlier process.","Outputs from Other Processes","There are 23 other planning processes.","Each planning process yields specific plans and baselines needed to create the project management plan.","The output of the other planning processes serves as the input to this high-level process.","Enterprise Environment Factors","Covered in Chapter 3.","Organizational Process Assets","Covered in Chapter 3.","Page 91 – Tools and Techniques","Expert Judgment","Covered in Chapter 3.","Data Gathering","Covered in Chapter 3.","Interpersonal and Team Skills","Covered in Chapter 3.","Meetings","While the project is being planned, expect to attend lots of meetings.","Utilize meeting management techniques in interpersonal and team skills.","One meeting to be aware of is the project kick-off meeting.","A project kick-off meeting is usually done... (continued on next page).","Page 92 – Outputs: Project Management Plan","Project Management Plan","The project management plan is a formal document that is used to describe how the project is executed, monitored and controlled, and closed.","This plan will be very important to the success of the project.","Exam Tip: The project management plan is an input to all executing, monitoring and controlling, and closing processes since it describes how to do those process groups.","Some important exam points about the project management plan:","This is a document with 18 parts: 4 baselines and 14 subsidiary plans.","This can be either summary or detailed; the more detailed, the better.","Smaller projects might need a very simple plan in contrast to a large project, which might need a very complex plan.","Once the project management plan is baselined, it may only be changed when a change request is generated and approved through the “perform integrated change control” process.","Components of the Project Management Plan and Process Where Made","Scope Management Plan","Plan Scope Management","Requirement Management Plan","Plan Scope Management","Schedule Management Plan","Plan Schedule Management","Cost Management Plan","Plan Cost Management","Quality Management Plan","Plan Quality Management","Resource Management Plan","Plan Resource Management","Communication Management Plan","Plan Communications Management","Risk Management Plan","Plan Risk Management","Procurement Management Plan","Plan Procurement Management","Stakeholder Management Plan","Plan Stakeholder Management","Change Management Plan","Develop Project Management Plan","Configuration Management Plan","Develop Project Management Plan","Scope Baseline","Create WBS","Schedule Baseline","Develop Schedule","Cost Baseline","Determine Budget","Performance Measurement Baseline","Develop Project Management Plan","Project Life Cycle Description","Develop Project Management Plan","Development Approach","Develop Project Management Plan","The project management plan is broken into two components:","Management plans","Baselines","A management plan is a plan that is used to describe how to do a particular component of a project.","Page 93 – Project Management Plan Components","The scope management plan describes:","How to write the scope.","Baseline the scope.","Validate the scope.","Ensure the project stays on the scope.","A management plan is really a “how-to.”","A management plan explains how you’re going to manage that section of the project.","A baseline is used to track the performance of the project.","The schedule baseline tells you the planned schedule.","The cost baseline tells you the planned budget of the project.","Most plans and baselines are created in other planning processes.","There are a few plans created in this process that you should know about.","Page 93 – Change Management Plan","The change management plan outlines:","How change requests will be collected.","How change requests will be assessed.","How change requests will be authorized.","How change requests will be incorporated into the project.","Page 93 – Configuration Management Plan","The configuration management plan outlines how the various components of a project can be configured.","Example:","When installing a large software package across many computers, a plan is needed that describes how to configure each computer to ensure the software works correctly.","Page 93 – Performance Measurement Baseline","The performance measurement baseline is used to check the performance of the project as it is being executed.","Anytime you see the word “baseline,” think of what to measure against.","The performance measurement baseline integrates:","Scope","Schedule","Costs","These are integrated into a single baseline used to track project performance.","Page 93 – Project Lifecycle Description","The project lifecycle description outlines what type of lifecycle the project will be following.","For an agile project, use more of an adaptive lifecycle.","For a traditional project, use a more predictive lifecycle.","This document outlines which lifecycle will be used on the project.","Page 93 – Development Approach","The development approach is a document that outlines how the product will be developed.","On an agile project:","Development may be more iterative.","Development may occur in small increments.","On a traditional project using a more predictive approach:","The entire product is developed in one shot.","The other parts of the project management plan will be covered in more detail as the processes where they are created are reviewed.","Page 94 – Direct and Manage Project Work","Direct and Manage Project Work is the process of performing the work defined in the project management plan to create the project deliverables.","The project manager leads the project team to actually build the deliverables and incorporate all approved changes.","This is an integration process and represents the rollup of the other nine executing processes.","Since this is an executing process, you are expected to do the project work as defined in the project management plan.","The project manager will be training and managing the project team assigned to the project to ensure the deliverable is built according to the plan.","As the project manager performs this process, he/she is also collecting data on the work being performed.","This collected data is the work performance data.","Work performance data is output here but is used as input to all monitoring and controlling processes.","On agile and hybrid projects, this is when the sprint starts and the project team begins to work.","On an agile project, this process usually lasts for a short time, anywhere from 1 to 4 weeks, as the team creates that increment of the product.","In a traditional project, this process can last for the entire duration it takes to build the actual deliverable.","In a traditional project, this process can take months to years.","Page 94 – Inputs","Project Management Plan","The project management plan describes the steps needed to build the deliverable.","The plan tells the project manager:","How to execute.","How to monitor and control.","How to close the project.","The more detailed the plan, the more successful the project execution will be.","Project Documents","While executing a project, the project manager will use many different project documents to ensure that the deliverable is getting created according to the plan.","Documents can include:","Project schedule","Risk register","Risk report","Milestones","Approved Change Requests","If a change is formally approved, the project manager will execute that change in this process.","An approved change request can be:","A customer request for a change.","A corrective action.","A preventive action.","Example:","If a customer requests a change to the color of paint in a room on a renovation project and the change is approved, the project manager should execute that change by changing the paint color in this process.","Approved change requests are outputs of the process “perform integrated change control.”","Enterprise Environmental Factors","Covered in Chapter 3.","Organizational Process Assets","Covered in Chapter 3.","Page 94 – Tools & Techniques","Expert Judgment","Covered in Chapter 3.","Project Management Information System","Covered in Chapter 3.","Meetings","Covered in Chapter 3.","Page 95 – Outputs","Deliverables","The most important output of this process is the deliverables.","Deliverables are the products or parts of the products that are given to the customer for acceptance.","When the project team has completed the execution of the project, they should have a deliverable.","Example:","On a “paint the room” project, the deliverable would be a completed painted room.","The deliverable becomes the input to the process, “control quality.”","From there, it is checked for quality requirements.","It is then passed to the “validate scope” process to be given formal acceptance by the stakeholders.","After it has been formally accepted, the project may move on to the “close project or phase” process.","Work Performance Data","Work performance data is the raw information about the work that was performed.","It can include things like:","How long the work took.","How much it cost.","This output is obtained continuously as the project is being executed.","The project manager analyzes the data alongside the plan to create work performance information.","Work performance information provides the project manager the status of the project.","Work performance data is used as an input to many monitoring and controlling processes.","Issue Log","As a project is being executed, expect to encounter a variety of problems, conflicts, and issues.","An issue log is where the list of all issues on a project is kept.","As issues arise, add them to the log.","The issue log helps ensure that issues are:","Described","Assigned","Prioritized","Addressed","The issue log also keeps track of:","Who raised the issue","When they raised it","The issue log must be updated continuously throughout the project.","Change Requests","As a project is being executed, expect to have changes throughout the project.","Changes can come from:","Customers","Sponsors","Team members","Senior management","Changes can also be requested because of:","Preventive actions","Corrective actions","Defect repairs","Once a change has been requested, it is passed to the process “perform integrated change control,” where it is assessed.","Project Management Plan Updates","Covered in Chapter 3.","Project Document Updates","Covered in Chapter 3.","Organizational Process Assets Updates","Covered in Chapter 3.","Page 96 – Manage Project Knowledge","Manage Project Knowledge is a process that ensures the knowledge that is gained before, during, and after the project is used for the organization’s benefit.","Knowledge is power, and if utilized correctly, can greatly benefit an organization.","Knowledge management allows the project manager to use the knowledge gained throughout the project for the benefit of the project and organization.","Explicit and Tacit Knowledge","Knowledge can be either explicit or tacit.","Explicit Knowledge","Has a tangible form.","Includes:","Documents","Procedures","Manuals","Textbooks are good places to get explicit knowledge.","Tacit Knowledge","Difficult to transfer between people by just speaking to them.","Gained by doing the work.","Sometimes referred to as “know-how.”","The project manager will try to ensure that both explicit and tacit knowledge are managed correctly for the benefit of the project.","The project manager must ensure that knowledge gained from the project is used correctly with stakeholders to ensure the project is successful.","The main output of the lessons learned register is where the project manager keeps a repository of all the main knowledge learned throughout the project.","On agile and hybrid projects, the team conducts a retrospective at the end of the sprint to capture project knowledge and other lessons learned during the sprint.","These lessons are then used to enhance performance during the next sprint.","Page 96 – Inputs","Project Management Plan","Covered in Chapter 3.","Project Documents","Covered in Chapter 3.","Deliverables","Deliverables are the products or parts of the products that are given to the customer for acceptance.","When the project team has completed the execution of the project, they should have a deliverable.","Deliverables are the objectives of the project.","Enterprise Environmental Factors","Covered in Chapter 3.","Organizational Process Assets","Covered in Chapter 3.","Page 96 – Tools & Techniques","Expert Judgment","Covered in Chapter 3.","Knowledge Management","Knowledge management is about the sharing of generally tacit knowledge between stakeholders on a project.","Each project is different, and the interaction between stakeholders might change from project to project.","It is up to the project manager to ensure that stakeholders are sharing knowledge with each other.","Methods can include:","Networking","Meetings","Discussions","Seminars","Workshops","Training","The method chosen will be dependent upon the project and the people working on the project.","Page 97 – Information Management","Information management is about ensuring that information is available to the stakeholders when needed.","While projects are unique, most will use a similar method to get information to stakeholders.","Methods can include:","Websites","Libraries","Articles","Documents","It is important that the project manager works to ensure that information is widely available to his/her team as the project is progressing.","Page 97 – Interpersonal and Team Skills","Covered in Chapter 3.","Page 97 – Outputs","Lessons Learned Register","The moment a project executes, the project manager should start to gather the lessons learned.","Lessons learned are gathered throughout the project, not just at the end.","The lessons learned register is where the project manager stores all of the lessons learned as the project is being executed.","This is a living document that will be consistently updated every time new knowledge is recognized within the project.","Example:","If a team member discovers a new method to code faster, the project manager should add that method to the lessons learned register.","When the phase or project is completed, the lessons learned register is given to the organization’s PMO.","The PMO stores it in the lessons learned repository for use on future projects within the organization.","Project Management Plan Updates","Covered in Chapter 3.","Organizational Process Assets Updates","Covered in Chapter 3.","Page 98 – Monitor and Control Project Work","Monitor and Control Project Work is the process of tracking, reviewing, and reporting the progress of the project work.","The goal of this process is to keep the project on plan.","As the project is executed, it is the responsibility of the project manager to ensure that the project is on plan.","If the project is falling behind schedule or budget, corrective or preventive actions in the form of a Change Request may be needed.","Monitoring and controlling a project includes looking at the work that was done and comparing it to the plan to see if they line up.","If they do not line up, necessary changes must be implemented to fix it.","The monitoring and controlling processes are performed in parallel to the executing processes.","The main outputs of this process are the work performance reports (status report).","Work performance reports give stakeholders an understanding of:","What is currently happening on the project.","Whether the project needs any correction or repairs through a change request.","On agile and hybrid projects, monitor and control project work is generally done by the team themselves.","In traditional projects, the project manager takes on the role of monitoring the work and ensuring it gets done according to the plan.","Monitor and control project work is generally done throughout the sprint on an agile or hybrid project.","Page 98 – Inputs","Project Management Plan","Covered in Chapter 3.","Project Documents","Covered in Chapter 3.","Work Performance Information","Work performance information is information on the performance of the work that was done on the project.","It provides the status of the deliverables.","It is made by comparing work performance data with the project management plan.","Work performance information is the output of all “Control” processes, such as:","Control Scope","Control Schedule","Etc.","Agreements","An agreement is usually a contract between a buyer and a seller for work.","It generally includes:","Work that needs to get done","Terms","Conditions","Pricing","Penalties","Agreements are used in this process by the project manager to monitor the contractor’s work while the project is being executed.","More specifics about agreements will be discussed in the procurement management chapter.","Enterprise Environmental Factors","Covered in Chapter 3.","Organizational Process Assets","Covered in Chapter 3.","Page 98 – Tools and Techniques","Expert Judgment","Covered in Chapter 3.","Data Analysis","Covered in Chapter 3.","Decision Making","Covered in Chapter 3.","Meetings","Covered in Chapter 3.","Page 99 – Outputs","Work Performance Reports","While monitoring and controlling the project, reports are created on the status of the project, such as whether it is on schedule or budget.","Work performance reports are sometimes called status reports.","The work performance report is used to update stakeholders on the progress of the project.","The input to this process is the work performance information.","The output of this process is the work performance report.","Change Requests","While monitoring and controlling the project, the project manager may need to implement:","Corrective actions","Preventive actions","Defect repairs","Example:","If the project is 20% over budget, the project manager will need to get a change request for additional funds to complete the project (corrective action).","Once the project manager has initiated a change request, he/she follows the process of “perform integrated change control” to get that change approved.","Project Management Plan Updates","Covered in Chapter 3.","Project Documents Updates","Covered in Chapter 3.","Page 100 – Perform Integrated Change Control","Perform Integrated Change Control is the process of reviewing all change requests and approving or rejecting them.","Once a project management plan is approved, any subsequent changes to it must go through this process to be updated.","Changes may be requested by any stakeholder.","Examples:","A sponsor may want the project finished faster or more cheaply.","A customer may want to add something new to the scope.","The project needs a system to document and manage changes throughout the project.","This is done using the:","Change management plan","Configuration management plan","These plans specify the steps to manage changes.","All documented change requests need to be approved or denied by the correct authority.","All changes need to be evaluated and approved correctly.","Changes can be authorized by:","Project manager","Sponsor","Change control board (CCB)","A change control board (CCB) can be used to:","Review changes","Evaluate changes","Approve changes","Reject changes","The project manager should influence the factors that affect change in order to prevent unnecessary changes.","This process is a key topic for the exam.","Questions may focus on:","What to do first when a change is requested.","What to do next when a change is requested.","Change Management Process","Record Change Request","Assess Change Requests (Impact on Project)","Approve or Disapprove Change Requests","First assess the change and determine how it impacts the overall project.","Then develop options for implementing the change.","Next, get the change approved.","Once approved, execute the change.","If a change request is rejected, the project manager should communicate back to the original stakeholder that the change will not be implemented.","Do not approve or deny a change without assessing the actual change.","Exam Tip:","Never take action without an assessment and never reject a change without an assessment on a traditional project.","The diagram mostly applies to a traditional project where there is a well-documented change management process.","On a traditional project, no changes should be made to any project management plans without submitting a change request and getting it approved.","Agile and Hybrid Projects","On agile and hybrid projects, change management is less process-oriented and more welcoming.","When a stakeholder wants to add a feature to an agile project, it is generally added to the product backlog.","The product backlog is then re-prioritized based on value to incorporate the new feature.","The product owner is responsible for re-prioritizing the product backlog and determining if the item should be added.","Most change management power on an agile project is given to the product owner and not the change control board.","Agile projects do not have the same well-documented change management processes as traditional projects.","Exam Tip:","On an Agile project, changes are generally added to the product backlog that is then re-prioritized by the product owner.","Page 101 – Inputs","Project Management Plan","The project management plan contains details about how to process, monitor, and control changes in a project.","Project Documents","Covered in Chapter 3.","Work Performance Reports","Covered in Chapter 3.","Change Requests","A change request is an output of most of the executing and monitoring and controlling processes.","Change requests are evaluated in this process.","Enterprise Environmental Factors","Covered in Chapter 3.","Organizational Process Assets","Covered in Chapter 3.","Page 101 – Tools and Techniques","Expert Judgment","Covered in Chapter 3.","Change Control Tools","Change control tools are manual or automated tools used to manage change requests.","These tools help to:","Identify changes","Document changes","Track changes","The main objective of the tools is to help the CCB make a decision on whether to approve or disapprove the change.","Data Analysis","Covered in Chapter 3.","Decision Making","Covered in Chapter 3.","Meetings","Covered in Chapter 3.","Page 101 – Outputs","Approved Change Requests","Once a change has been approved, it becomes an input to the “direct and manage project work” process.","This is where the approved change request is executed.","Example:","Someone requests a change to the color of paint on a renovation project.","The change is submitted to the change control board.","The change control board approves the change.","The approved change request is passed to the “direct and manage project work” process.","The painters implement the change by changing the paint color.","An approved change request triggers the project manager to update the project management plan and its associated project documents.","Project Management Plan Updates","Once a change has been approved, the project management plan should be updated.","Any of the 18 plan components can be updated with an approved change request.","Example:","Stakeholders request that the project be completed faster.","The change is approved.","The project manager updates the schedule baseline to reflect the earlier finish date.","The cost baseline may also be updated to reflect the additional costs associated with finishing the project sooner.","Page 102 – Project Documents Updates","As with the project management plan, any of the additional 33 project documents could be updated with an approved change request.","One document that would need to be updated is the change log.","The change log records the status of changes throughout the project.","The change log can include whether the change was:","Approved","Disapproved","Example:","Stakeholders request more work to be added to the scope.","The change is approved.","The project manager updates the change log to reflect the newly identified change to the project.","Page 103 – Close Project or Phase","Close Project or Phase is the process of formalizing all activities and overall project management process groups to formally complete the project, phase, or contract.","This process establishes a process to investigate and document the reasons a project is terminated early.","The project manager reviews the scope baseline and completed work to ensure all work was in scope and done correctly.","The project manager will:","Transfer the deliverable to productions or operations.","Successfully capture lessons learned.","Release the project team.","Updating templates and knowledge bases is also done in this phase.","Closing a Contract","Closing a contract can include:","Seller sign-off that all fees were paid.","Buyer sign-off that all work was completed.","Even if the contract is not successfull
