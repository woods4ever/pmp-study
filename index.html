 happen in a certain order. Discretionary dependencies are preferred order, but not required. External dependencies come from outside the project team. Internal dependencies are within the project team’s control."},{"speaker":"Host 2","text":"The exam may give you a scenario and ask what kind of dependency it is. If the project is waiting on a government permit, that is external. If testing comes after installation because the team controls both, that is internal. If one activity physically cannot happen before another, that is mandatory."},{"speaker":"Host 1","text":"Leads and lags are another trap area. A lead creates overlap. A lag creates delay. If Activity B starts before Activity A finishes, that is a lead. If Activity B must wait two days after Activity A finishes, that is a lag."},{"speaker":"Host 2","text":"Then we estimate activity durations. This is determining how long each activity will take. The duration can be in hours, days, weeks, or years, and it is affected by risk, resources, availability, and scope."},{"speaker":"Host 1","text":"Estimating methods include analogous estimating, parametric estimating, three-point estimating, and bottom-up estimating."},{"speaker":"Host 2","text":"Analogous estimating is quick and uses historical data from similar work, but it is less accurate. Parametric estimating uses mathematical formulas with historical data. Bottom-up estimating is the most accurate but takes the most time because each smaller component is estimated and rolled up."},{"speaker":"Host 1","text":"PERT uses three estimates: optimistic, most likely, and pessimistic. The beta formula is optimistic plus four times most likely plus pessimistic, divided by six."},{"speaker":"Host 2","text":"And the reason most likely is multiplied by four is because the formula weights the realistic estimate more heavily. The exam tip is to use PERT beta if the question does not specify."},{"speaker":"Host 1","text":"Standard deviation is pessimistic minus optimistic, divided by six. Triangular distribution is optimistic plus most likely plus pessimistic, divided by three."},{"speaker":"Host 2","text":"Now Develop Schedule is where the full project schedule and schedule baseline are created. This process uses the outputs from activity definition, sequencing, resource estimating, and duration estimating."},{"speaker":"Host 1","text":"Critical Path Method is one of the biggest exam areas. The critical path is the longest path through the network diagram and determines the project duration."},{"speaker":"Host 2","text":"This is the key: activities on the critical path have no float. If a critical path activity slips, the whole project slips unless the project manager takes action."},{"speaker":"Host 1","text":"Float, or slack, is how long an activity can be delayed without delaying the project. You can calculate slack as late start minus early start or late finish minus early finish."},{"speaker":"Host 2","text":"For forward pass, you calculate early start and early finish. For backward pass, you calculate late finish and late start. The exam may give you a network diagram and ask for critical path, float, early start, or late finish."},{"speaker":"Host 1","text":"Resource optimization also appears in Develop Schedule. Resource leveling adjusts the schedule due to limited or overallocated resources and often increases project duration."},{"speaker":"Host 2","text":"Resource smoothing adjusts activities without changing the critical path. It uses available float and does not delay project completion."},{"speaker":"Host 1","text":"Schedule compression is used when the schedule is too long. Crashing means adding resources. It increases cost and may increase risk. Fast-tracking means doing activities in parallel. It reduces time but increases risk."},{"speaker":"Host 2","text":"So if the question says the project manager adds people, pays overtime, or adds equipment to shorten the schedule, think crashing. If the question says activities are done at the same time that were originally planned in sequence, think fast-tracking."},{"speaker":"Host 1","text":"Control Schedule is about monitoring the work against the schedule baseline. The project manager compares planned work versus actual work and determines whether the project is on schedule."},{"speaker":"Host 2","text":"If there is a variance, the project manager analyzes it and may need a change request. The mindset is not panic, blame the team, or secretly change the schedule. The project manager follows the process."},{"speaker":"Host 1","text":"Agile scheduling works differently. Work is stored in the product backlog. Teams estimate effort using t-shirt sizing or planning poker. Work is delivered in increments."},{"speaker":"Host 2","text":"Planning poker often uses Fibonacci numbers like 1, 2, 3, 5, 8, and 13. The larger the number, the more effort the user story requires."},{"speaker":"Host 1","text":"Velocity measures how many points the team completes per iteration. That helps forecast future sprint capacity."},{"speaker":"Host 2","text":"Burnup charts show work completed. Burndown charts show work remaining. Cumulative flow diagrams help visualize work over time and where work may be stuck."},{"speaker":"Host 1","text":"Lead time is the time to complete the entire process. Cycle time is the time to complete part of the process. Cycle time equals work in progress divided by throughput."},{"speaker":"Host 2","text":"And if WIP is too high, bottlenecks can form and efficiency drops. That is why reducing WIP helps reduce cycle time."},{"speaker":"Host 1","text":"Final Chapter 7 mindset: the project manager protects the schedule by understanding dependencies, estimating realistically, monitoring performance, and using the right corrective actions when needed."},{"speaker":"Host 2","text":"Exactly. For the PMP, always think: understand the schedule baseline, analyze the variance, use the right tool, and follow change control when the baseline is affected."}],"questions":[{"q":"What is the main purpose of schedule management?","options":["To control procurement contracts","To manage timely project completion","To define stakeholder power","To approve project funding"],"answer":1,"why":"Schedule management focuses on creating the schedule baseline, building the schedule, and keeping the project on schedule.","mindset":"Think schedule baseline, schedule development, and schedule control.","chapterRef":"Chapter 7: Schedule Management","tags":["Process","Schedule"],"examLike":true,"temptingWrong":"The tempting wrong answers usually confuse leads/lags, crashing/fast-tracking, or critical path versus non-critical float."},{"q":"Which process creates the schedule management plan?","options":["Define Activities","Plan Schedule Management","Develop Schedule","Control Schedule"],"answer":1,"why":"Plan Schedule Management documents how the schedule processes will be performed.","mindset":"The plan tells the team how scheduling will be handled before detailed schedule work begins.","chapterRef":"Chapter 7: Plan Schedule Management","tags":["Process","Schedule"],"examLike":true,"temptingWrong":"The tempting wrong answers usually confuse leads/lags, crashing/fast-tracking, or critical path versus non-critical float."},{"q":"What does Define Activities do?","options":["Breaks work packages into specific activities","Approves the final schedule baseline","Calculates CPI","Ranks stakeholder power"],"answer":0,"why":"Define Activities takes work packages from the WBS and breaks them into scheduled activities.","mindset":"Activities are the detailed work needed to create deliverables.","chapterRef":"Chapter 7: Define Activities","tags":["Concept","Schedule"],"examLike":true,"temptingWrong":"The tempting wrong answers usually confuse leads/lags, crashing/fast-tracking, or critical path versus non-critical float."},{"q":"What is rolling wave planning?","options":["Planning all future work in full detail immediately","Decomposing near-term work now and future work later","Compressing the schedule with extra resources","Approving all schedule changes upfront"],"answer":1,"why":"Rolling wave planning decomposes near-term work now and future work later as more detail becomes known.","mindset":"Use rolling wave planning when details become clearer over time.","chapterRef":"Chapter 7: Rolling Wave Planning","tags":["Process","Schedule"],"examLike":true,"temptingWrong":"The tempting wrong answers usually confuse leads/lags, crashing/fast-tracking, or critical path versus non-critical float."},{"q":"What is the main output of Sequence Activities?","options":["Cost baseline","Project schedule network diagram","Stakeholder register","Quality report"],"answer":1,"why":"Sequence Activities creates the project schedule network diagram showing order and dependencies.","mindset":"Sequencing is about relationships between activities.","chapterRef":"Chapter 7: Sequence Activities","tags":["Concept","Schedule"],"examLike":true,"temptingWrong":"The tempting wrong answers usually confuse leads/lags, crashing/fast-tracking, or critical path versus non-critical float."},{"q":"Which relationship is most commonly used in network diagrams?","options":["Start-to-Finish","Finish-to-Start","Finish-to-Finish","Start-to-Start"],"answer":1,"why":"Finish-to-Start is the most commonly used relationship; one activity must finish before the next starts.","mindset":"Do not overthink rare relationships when the question points to common sequencing.","chapterRef":"Chapter 7: PDM Relationships","tags":["Concept","Schedule"],"examLike":true,"temptingWrong":"The tempting wrong answers usually confuse leads/lags, crashing/fast-tracking, or critical path versus non-critical float."},{"q":"A city permit must be approved before work begins. What type of dependency is this?","options":["Internal","External","Discretionary","Soft logic"],"answer":1,"why":"A permit is outside the project team’s control, making it an external dependency.","mindset":"Outside control usually means external dependency.","chapterRef":"Chapter 7: Dependency Types","tags":["Concept","Schedule"],"examLike":true,"temptingWrong":"The tempting wrong answers usually confuse leads/lags, crashing/fast-tracking, or critical path versus non-critical float."},{"q":"A team prefers to test after installation because it is a best practice, but it is not required. What dependency type is this?","options":["Mandatory","Discretionary","External","Start-to-Finish"],"answer":1,"why":"Discretionary dependencies are preferred order but not required.","mindset":"Preferred sequence equals soft logic/discretionary dependency.","chapterRef":"Chapter 7: Dependency Types","tags":["Resource","Schedule","Scenario"],"examLike":true,"temptingWrong":"The tempting wrong answers usually confuse leads/lags, crashing/fast-tracking, or critical path versus non-critical float."},{"q":"What is a lead?","options":["A delay between activities","An overlap between activities","The longest path","A zero-duration milestone"],"answer":1,"why":"A lead allows overlap between activities; a successor may start before the predecessor finishes.","mindset":"Lead overlaps; lag delays.","chapterRef":"Chapter 7: Leads and Lags","tags":["Concept","Schedule"],"examLike":true,"temptingWrong":"The tempting wrong answers usually confuse leads/lags, crashing/fast-tracking, or critical path versus non-critical float."},{"q":"What is a lag?","options":["A delay between activities","The value of completed work","The first activity in a network","A resource histogram"],"answer":0,"why":"A lag is a waiting period or delay between activities.","mindset":"Lag is wait time, like drying time after painting.","chapterRef":"Chapter 7: Leads and Lags","tags":["Concept","Schedule"],"examLike":true,"temptingWrong":"The tempting wrong answers usually confuse leads/lags, crashing/fast-tracking, or critical path versus non-critical float."},{"q":"What is the PERT beta formula?","options":["(O + M + P) / 3","(O + 4M + P) / 6","(P - O) / 6","EV / AC"],"answer":1,"why":"PERT beta uses optimistic plus four times most likely plus pessimistic, divided by six.","mindset":"If not specified, your notes say to use PERT beta.","chapterRef":"Chapter 7: Three-Point Estimating","tags":["Formula","Schedule"],"examLike":true,"temptingWrong":"The tempting wrong answers usually confuse leads/lags, crashing/fast-tracking, or critical path versus non-critical float."},{"q":"What is the standard deviation formula for three-point estimates?","options":["(O + 4M + P) / 6","(O + M + P) / 3","(P - O) / 6","LS - ES"],"answer":2,"why":"Standard deviation is calculated as pessimistic minus optimistic, divided by six.","mindset":"Standard deviation measures variability/uncertainty.","chapterRef":"Chapter 7: Standard Deviation","tags":["Formula","Process","Schedule"],"examLike":true,"temptingWrong":"The tempting wrong answers usually confuse leads/lags, crashing/fast-tracking, or critical path versus non-critical float."},{"q":"Which estimating method is most accurate but time-consuming?","options":["Analogous estimating","Bottom-up estimating","T-shirt sizing","Expert judgment only"],"answer":1,"why":"Bottom-up estimating breaks work into the smallest components and aggregates the estimates.","mindset":"Detailed estimating improves accuracy but takes more time.","chapterRef":"Chapter 7: Bottom-Up Estimating","tags":["Concept","Schedule"],"examLike":true,"temptingWrong":"The tempting wrong answers usually confuse leads/lags, crashing/fast-tracking, or critical path versus non-critical float."},{"q":"What is the critical path?","options":["The shortest path through the network","The path with the most stakeholders","The longest path that determines project duration","The path with the lowest cost"],"answer":2,"why":"The critical path is the longest path through the network diagram and determines total project duration.","mindset":"If the critical path slips, the project slips.","chapterRef":"Chapter 7: Critical Path Method","tags":["Concept","Schedule"],"examLike":true,"temptingWrong":"The tempting wrong answers usually confuse leads/lags, crashing/fast-tracking, or critical path versus non-critical float."},{"q":"What is true about activities on the critical path?","options":["They have no float","They always cost the most","They are optional","They are always external"],"answer":0,"why":"Critical path activities have no float; delays delay the project.","mindset":"Zero float is a critical path clue.","chapterRef":"Chapter 7: Critical Path Method","tags":["Concept","Schedule"],"examLike":true,"temptingWrong":"The tempting wrong answers usually confuse leads/lags, crashing/fast-tracking, or critical path versus non-critical float."},{"q":"What does float/slack measure?","options":["How much an activity can be delayed without delaying the project","How much budget remains","How many people are on the team","How much risk tolerance exists"],"answer":0,"why":"Float is the amount of time an activity can be delayed without delaying the project.","mindset":"Float helps determine flexibility in non-critical activities.","chapterRef":"Chapter 7: Slack / Float","tags":["Formula","Schedule"],"examLike":true,"temptingWrong":"The tempting wrong answers usually confuse leads/lags, crashing/fast-tracking, or critical path versus non-critical float."},{"q":"Which formula can calculate slack?","options":["EV - AC","LS - ES","BAC / CPI","N(N-1)/2"],"answer":1,"why":"Slack can be calculated as LS minus ES or LF minus EF.","mindset":"Slack formulas compare late and early dates.","chapterRef":"Chapter 7: Slack Formulas","tags":["Formula","Schedule"],"examLike":true,"temptingWrong":"The tempting wrong answers usually confuse leads/lags, crashing/fast-tracking, or critical path versus non-critical float."},{"q":"What is resource leveling likely to do?","options":["Shorten the project with no risk","Adjust schedule due to limited resources and may increase duration","Remove the critical path","Create the stakeholder register"],"answer":1,"why":"Resource leveling adjusts the schedule for limited or overallocated resources and may extend the critical path.","mindset":"Resource leveling can delay work when resources are constrained.","chapterRef":"Chapter 7: Resource Optimization","tags":["Formula","Resource","Schedule"],"examLike":true,"temptingWrong":"The tempting wrong answers usually confuse leads/lags, crashing/fast-tracking, or critical path versus non-critical float."},{"q":"What is crashing?","options":["Doing activities in parallel","Adding resources to finish faster","Delaying activities intentionally","Reducing product quality"],"answer":1,"why":"Crashing adds resources to finish faster and usually increases cost.","mindset":"Crashing buys time with money/resources.","chapterRef":"Chapter 7: Schedule Compression","tags":["Concept","Schedule"],"examLike":true,"temptingWrong":"The tempting wrong answers usually confuse leads/lags, crashing/fast-tracking, or critical path versus non-critical float."},{"q":"What is the key difference between burnup and burndown charts?","options":["Burnup shows completed work; burndown shows remaining work","Burnup is for cost; burndown is for quality","Burnup is predictive only; burndown is procurement only","There is no difference"],"answer":0,"why":"Burnup charts show work completed; burndown charts show work remaining.","mindset":"Remember: burnup = done, burndown = left.","chapterRef":"Chapter 7: Agile Scheduling","tags":["Agile","Schedule"],"examLike":true,"temptingWrong":"The tempting wrong answers usually confuse leads/lags, crashing/fast-tracking, or critical path versus non-critical float."}]},{"id":8,"title":"Chapter 8: Cost Management","summary":"Cost management focuses on creating the cost baseline, managing the project budget, and using earned value formulas to interpret performance.","notes":["Cost management is about creating the cost baseline and ensuring the project stays on budget.","Cost types include variable, fixed, direct, indirect, sunk, and value engineering.","The four cost processes are Plan Cost Management, Estimate Costs, Determine Budget, and Control Costs.","Traditional project budgeting is done upfront; agile project funding is done incrementally.","Contingency reserves cover known unknowns and are included in the cost baseline.","Management reserves cover unknown unknowns and require management approval.","Earned Value Management includes BAC, PV, EV, AC, CV, CPI, SV, SPI, EAC, ETC, VAC, and TCPI.","Negative CV means over budget. Negative SV means behind schedule. CPI or SPI below 1 is unfavorable."],"examples":["If EV is 75 and AC is 70, CV is +5, meaning the project is under budget.","If EV is 75 and PV is 60, SV is +15, meaning the project is ahead of schedule.","If CPI is 0.80, the project is getting 80 cents of value for every dollar spent.","Contingency reserve is for identified risks; management reserve is for unforeseen risks."],"podcast":[{"speaker":"Host 1","text":"Let’s dig into Chapter 8, Cost Management. This chapter matters because it combines basic cost concepts, budgeting process flow, reserves, and earned value management."},{"speaker":"Host 2","text":"And earned value is one of those areas where students might memorize formulas but still miss questions because they do not understand what the numbers actually mean."},{"speaker":"Host 1","text":"The big goal of cost management is creating the cost baseline, which is the project budget, and then ensuring the project stays on budget."},{"speaker":"Host 2","text":"Start with cost types. Variable costs change as the project progresses. Fixed costs stay the same. Direct costs are directly tied to project work and are included in the cost baseline. Indirect costs are not included in the project budget."},{"speaker":"Host 1","text":"Sunk cost is money already spent. Value engineering, also called value analysis, is finding a less costly way to achieve the same goal or scope."},{"speaker":"Host 2","text":"And the PMP mindset is important here. Value engineering is not cutting quality or removing requirements. It is finding a less costly way to achieve the required outcome."},{"speaker":"Host 1","text":"The four cost management processes are Plan Cost Management, Estimate Costs, Determine Budget, and Control Costs."},{"speaker":"Host 2","text":"Plan Cost Management creates the cost management plan. That plan guides how activity costs will be estimated, how the budget will be created, and how project costs will be monitored and controlled."},{"speaker":"Host 1","text":"Estimate Costs assigns a cost to each activity. Costs can include labor, materials, equipment, services, facilities, inflation, and reserves for risk."},{"speaker":"Host 2","text":"Know the estimate ranges. Rough Order of Magnitude is the least accurate and is usually minus 25 percent to plus 75 percent. Budget estimate is around minus 10 to plus 25. Definitive estimate is the most accurate, around minus 5 to plus 10."},{"speaker":"Host 1","text":"Analogous estimating is top-down. It uses previous similar projects. It is quick, but can be inaccurate if the previous work is not very similar."},{"speaker":"Host 2","text":"Bottom-up estimating is the opposite. It breaks work into smaller pieces, estimates each part, and aggregates the total. It is time-consuming but very accurate."},{"speaker":"Host 1","text":"Parametric estimating uses math and historical data. For example, if painting costs two dollars per square foot, then five hundred square feet costs one thousand dollars."},{"speaker":"Host 2","text":"Reserve analysis is a big exam topic. Contingency reserves cover known unknowns. That means identified risks. They are included in the cost baseline and the project manager can usually use them without additional approval."},{"speaker":"Host 1","text":"Management reserves cover unknown unknowns. These are unforeseen events management did not identify earlier. Management reserves are above the cost baseline and require management approval."},{"speaker":"Host 2","text":"That distinction is critical. Contingency equals known unknown and included in baseline. Management equals unknown unknown and above baseline."},{"speaker":"Host 1","text":"Determine Budget aggregates cost estimates to create the project budget. Cost aggregation rolls up activity cost estimates and work packages into the total project cost."},{"speaker":"Host 2","text":"The cost baseline includes project work and contingency reserve, but not management reserve. It can be shown as an S-curve because spending is often lower at the start, highest in the middle, and lower at the end."},{"speaker":"Host 1","text":"Control Costs is where the project manager monitors cost performance. The PM compares planned work to actual work, identifies variances, determines why they happened, and decides corrective action."},{"speaker":"Host 2","text":"Now earned value. BAC is Budget at Completion, the total planned budget. PV is Planned Value, the cost of work planned to be completed. EV is Earned Value, the value of work actually completed. AC is Actual Cost, the amount actually spent."},{"speaker":"Host 1","text":"Cost Variance is EV minus AC. If CV is positive, the project is under budget. If CV is negative, the project is over budget."},{"speaker":"Host 2","text":"Cost Performance Index is EV divided by AC. CPI tells how efficiently the project is spending money. CPI above 1 is good. CPI below 1 is bad."},{"speaker":"Host 1","text":"So if CPI is point eight, that means for every dollar spent, the project only gets eighty cents of value. That is over budget."},{"speaker":"Host 2","text":"Schedule Variance is EV minus PV. If SV is positive, the project is ahead of schedule. If SV is negative, the project is behind schedule."},{"speaker":"Host 1","text":"Schedule Performance Index is EV divided by PV. SPI above 1 means ahead of schedule. SPI below 1 means behind schedule."},{"speaker":"Host 2","text":"Estimate at Completion is BAC divided by CPI. This is the forecasted final project cost if the project continues at the current spending rate."},{"speaker":"Host 1","text":"Estimate to Complete is EAC minus AC. That tells how much more money is needed to finish the project."},{"speaker":"Host 2","text":"Variance at Completion is BAC minus EAC. Positive VAC means money left over. Negative VAC means more money is needed."},{"speaker":"Host 1","text":"TCPI is the To-Complete Performance Index. It tells the efficiency needed to finish within budget. If TCPI is higher than 1, the project team must work more efficiently to finish within budget."},{"speaker":"Host 2","text":"The exam may give numbers and ask you to calculate, but the real skill is interpretation. If CPI is less than 1, cost is bad. If SPI is less than 1, schedule is bad. If CV is negative, over budget. If SV is negative, behind schedule."},{"speaker":"Host 1","text":"Agile budgeting is also different. Traditional projects calculate the entire budget during planning. Agile projects are often funded incrementally as iterations are completed."},{"speaker":"Host 2","text":"Agile can use a burn rate approach. For example, number of people times hourly cost times hours worked gives cost per week. Then multiply by iteration length and number of iterations."},{"speaker":"Host 1","text":"Final mindset: when cost issues appear, the project manager should analyze the data, understand the variance, determine corrective action, and use change control when budget changes are needed."},{"speaker":"Host 2","text":"Do not just ask for more money. Do not ignore the variance. Do not change the budget informally. Analyze, forecast, communicate, and follow the process."}],"questions":[{"q":"What is the main purpose of cost management?","options":["Creating the cost baseline and keeping the project on budget","Creating the stakeholder register","Defining quality metrics","Closing procurements"],"answer":0,"why":"Cost management focuses on creating the cost baseline and ensuring the project stays on budget.","mindset":"Cost management is budget creation plus cost control.","chapterRef":"Chapter 8: Cost Management","tags":["Process","Cost"],"examLike":true,"temptingWrong":"The tempting wrong answers usually mix up cost versus schedule performance. Read the formula and interpret whether the value is favorable or unfavorable."},{"q":"Which cost changes as the project progresses?","options":["Fixed cost","Variable cost","Sunk cost","Indirect cost"],"answer":1,"why":"Variable costs change as the project progresses.","mindset":"Variable means it varies with project conditions or usage.","chapterRef":"Chapter 8: Types of Costs","tags":["Concept","Cost"],"examLike":true,"temptingWrong":"The tempting wrong answers usually mix up cost versus schedule performance. Read the formula and interpret whether the value is favorable or unfavorable."},{"q":"Which cost stays the same as the project progresses?","options":["Fixed cost","Variable cost","Direct cost","Reserve cost"],"answer":0,"why":"Fixed costs stay the same as the project progresses.","mindset":"Fixed means stable regardless of normal project progress.","chapterRef":"Chapter 8: Types of Costs","tags":["Concept","Cost"],"examLike":true,"temptingWrong":"The tempting wrong answers usually mix up cost versus schedule performance. Read the formula and interpret whether the value is favorable or unfavorable."},{"q":"Which cost is directly incurred by project work and included in the cost baseline?","options":["Indirect cost","Direct cost","Sunk cost","Management reserve"],"answer":1,"why":"Direct costs are directly incurred by project work and included in the cost baseline.","mindset":"Direct costs belong to the project work itself.","chapterRef":"Chapter 8: Types of Costs","tags":["Concept","Cost"],"examLike":true,"temptingWrong":"The tempting wrong answers usually mix up cost versus schedule performance. Read the formula and interpret whether the value is favorable or unfavorable."},{"q":"What is a sunk cost?","options":["Money already spent on the project","Money held for unknown unknowns","A cost that changes over time","A seller incentive"],"answer":0,"why":"Sunk cost is money already spent on the project.","mindset":"Do not let sunk costs drive future decisions.","chapterRef":"Chapter 8: Types of Costs","tags":["Concept","Cost"],"examLike":true,"temptingWrong":"The tempting wrong answers usually mix up cost versus schedule performance. Read the formula and interpret whether the value is favorable or unfavorable."},{"q":"What is value engineering?","options":["Finding a less costly way to achieve the goal/scope","Increasing scope without approval","Removing quality requirements","Adding management reserve"],"answer":0,"why":"Value engineering finds a less costly way to achieve the same goal or scope.","mindset":"Value engineering protects value while reducing cost.","chapterRef":"Chapter 8: Value Engineering","tags":["Concept","Cost"],"examLike":true,"temptingWrong":"The tempting wrong answers usually mix up cost versus schedule performance. Read the formula and interpret whether the value is favorable or unfavorable."},{"q":"Which process creates the cost management plan?","options":["Estimate Costs","Determine Budget","Plan Cost Management","Control Costs"],"answer":2,"why":"Plan Cost Management creates the cost management plan.","mindset":"The plan guides estimating, budgeting, and controlling costs.","chapterRef":"Chapter 8: Plan Cost Management","tags":["Process","Cost"],"examLike":true,"temptingWrong":"The tempting wrong answers usually mix up cost versus schedule performance. Read the formula and interpret whether the value is favorable or unfavorable."},{"q":"Which estimate type is the least accurate?","options":["Definitive estimate","Budget estimate","Rough Order of Magnitude","Bottom-up estimate"],"answer":2,"why":"ROM is the most inaccurate estimate, with a wide range.","mindset":"ROM is early and rough.","chapterRef":"Chapter 8: Estimate Types","tags":["Process","Cost"],"examLike":true,"temptingWrong":"The tempting wrong answers usually mix up cost versus schedule performance. Read the formula and interpret whether the value is favorable or unfavorable."},{"q":"Which estimate type is most accurate?","options":["ROM","Budget estimate","Definitive estimate","Analogous estimate"],"answer":2,"why":"Definitive estimate is considered the best estimate possible and is usually done later in planning.","mindset":"More detail usually produces a better estimate.","chapterRef":"Chapter 8: Estimate Types","tags":["Process","Cost"],"examLike":true,"temptingWrong":"The tempting wrong answers usually mix up cost versus schedule performance. Read the formula and interpret whether the value is favorable or unfavorable."},{"q":"Which estimating method is also known as top-down estimating?","options":["Analogous estimating","Bottom-up estimating","Parametric estimating","Reserve analysis"],"answer":0,"why":"Analogous estimating is also called top-down estimating and uses previous similar work.","mindset":"Analogous is quick but less accurate.","chapterRef":"Chapter 8: Analogous Estimating","tags":["Concept","Cost"],"examLike":true,"temptingWrong":"The tempting wrong answers usually mix up cost versus schedule performance. Read the formula and interpret whether the value is favorable or unfavorable."},{"q":"Which estimating method is very accurate but complex and time-consuming?","options":["Analogous estimating","Bottom-up estimating","ROM estimating","Funding limit reconciliation"],"answer":1,"why":"Bottom-up estimating breaks work into smaller pieces and aggregates estimates.","mindset":"Bottom-up trades speed for accuracy.","chapterRef":"Chapter 8: Bottom-Up Estimating","tags":["Concept","Cost"],"examLike":true,"temptingWrong":"The tempting wrong answers usually mix up cost versus schedule performance. Read the formula and interpret whether the value is favorable or unfavorable."},{"q":"Which reserve covers known unknowns and is included in the cost baseline?","options":["Management reserve","Contingency reserve","Executive reserve","Sunk reserve"],"answer":1,"why":"Contingency reserves cover known unknowns and are included in the budget baseline.","mindset":"Known risk = contingency reserve.","chapterRef":"Chapter 8: Reserve Analysis","tags":["Concept","Cost"],"examLike":true,"temptingWrong":"The tempting wrong answers usually mix up cost versus schedule performance. Read the formula and interpret whether the value is favorable or unfavorable."},{"q":"Which reserve covers unknown unknowns and requires management approval?","options":["Contingency reserve","Management reserve","Activity reserve","Cost baseline"],"answer":1,"why":"Management reserves cover unknown unknowns and require management approval.","mindset":"Unknown unknown = management reserve.","chapterRef":"Chapter 8: Reserve Analysis","tags":["Process","Cost"],"examLike":true,"temptingWrong":"The tempting wrong answers usually mix up cost versus schedule performance. Read the formula and interpret whether the value is favorable or unfavorable."},{"q":"What does Determine Budget do?","options":["Aggregates cost estimates to create the project budget","Inspects deliverables","Identifies stakeholders","Creates quality reports"],"answer":0,"why":"Determine Budget aggregates project cost estimates to create the overall project budget.","mindset":"Budgeting rolls up activity/work package costs.","chapterRef":"Chapter 8: Determine Budget","tags":["Concept","Cost"],"examLike":true,"temptingWrong":"The tempting wrong answers usually mix up cost versus schedule performance. Read the formula and interpret whether the value is favorable or unfavorable."},{"q":"Does the cost baseline include management reserve?","options":["Yes, always","No, it includes project work and contingency reserve but not management reserve","Only in agile projects","Only after closeout"],"answer":1,"why":"The cost baseline includes project work and contingency reserve, but not management reserve.","mindset":"Management reserve sits above the cost baseline.","chapterRef":"Chapter 8: Cost Baseline","tags":["Process","Cost"],"examLike":true,"temptingWrong":"The tempting wrong answers usually mix up cost versus schedule performance. Read the formula and interpret whether the value is favorable or unfavorable."},{"q":"What is BAC?","options":["Budget at Completion, the original project budget","Actual Cost","Budget Adjustment Cost","Baseline Activity Cost"],"answer":0,"why":"BAC is Budget at Completion, the original total project budget.","mindset":"BAC is the budget anchor for EVM formulas.","chapterRef":"Chapter 8: EVM","tags":["Formula","Cost"],"examLike":true,"temptingWrong":"The tempting wrong answers usually mix up cost versus schedule performance. Read the formula and interpret whether the value is favorable or unfavorable."},{"q":"What is the formula for Cost Variance?","options":["EV - AC","EV / AC","EV - PV","BAC / CPI"],"answer":0,"why":"CV equals EV minus AC.","mindset":"Negative CV means over budget.","chapterRef":"Chapter 8: EVM Formulas","tags":["Formula","Cost"],"examLike":true,"temptingWrong":"The tempting wrong answers usually mix up cost versus schedule performance. Read the formula and interpret whether the value is favorable or unfavorable."},{"q":"If CPI is below 1, what does that mean?","options":["The project is under budget","The project is over budget","The project is ahead of schedule","The project has no variance"],"answer":1,"why":"CPI below 1 means the project is spending inefficiently and is over budget.","mindset":"For CPI, below 1 is bad.","chapterRef":"Chapter 8: CPI","tags":["Formula","Cost"],"examLike":true,"temptingWrong":"The tempting wrong answers usually mix up cost versus schedule performance. Read the formula and interpret whether the value is favorable or unfavorable."},{"q":"What is the formula for SPI?","options":["EV / PV","EV / AC","BAC / CPI","BAC - EAC"],"answer":0,"why":"SPI equals EV divided by PV.","mindset":"SPI measures schedule efficiency.","chapterRef":"Chapter 8: SPI","tags":["Formula","Cost"],"examLike":true,"temptingWrong":"The tempting wrong answers usually mix up cost versus schedule performance. Read the formula and interpret whether the value is favorable or unfavorable."},{"q":"What does EAC forecast?","options":["Final project cost at completion","Number of communication channels","Total work remaining in agile","Stakeholder engagement level"],"answer":0,"why":"EAC forecasts what the project could cost at completion based on current performance.","mindset":"Forecast final cost = EAC.","chapterRef":"Chapter 8: EAC","tags":["Formula","Cost"],"examLike":true,"temptingWrong":"The tempting wrong answers usually mix up cost versus schedule performance. Read the formula and interpret whether the value is favorable or unfavorable."}]},{"id":9,"title":"Chapter 9: Project Quality Management","summary":"Quality management focuses on planning quality, managing quality processes, and controlling deliverable quality.","notes":["Quality is the degree to which inherent characteristics fulfill requirements.","Quality must always be high, while grade can be low or high.","Continuous improvement is also known as Kaizen and focuses on small improvements to quality and processes.","Prevention is generally more cost-effective than inspection.","The three quality processes are Plan Quality Management, Manage Quality, and Control Quality.","Manage Quality focuses on processes used to produce deliverables.","Control Quality inspects deliverables to determine whether they meet quality standards and requirements.","Quality tools include flowcharts, checklists, check sheets, fishbone diagrams, histograms, audits, control charts, and testing."],"examples":["A basic TV can be low grade but high quality if it meets requirements.","A high-grade TV can still be low quality if it breaks often or has poor display quality.","A checklist confirms required items were reviewed; a check sheet counts defects.","A fishbone diagram helps identify possible causes of defects."],"podcast":[{"speaker":"Host 1","text":"Chapter 9 is Project Quality Management, and this chapter is very PMP mindset heavy. It is not just about inspecting work at the end. It is about understanding requirements, preventing defects, improving processes, and confirming deliverables meet standards."},{"speaker":"Host 2","text":"Exactly. Quality is defined as the degree to which a set of inherent characteristics fulfill requirements. So if requirements are unclear, quality becomes hard to prove."},{"speaker":"Host 1","text":"That is why collecting requirements correctly matters. If the project team does not understand what quality means for the stakeholder, the deliverable may fail even if the team thinks it did good work."},{"speaker":"Host 2","text":"Grade and quality are different. Grade is the category or level of features. Quality is whether the product meets requirements."},{"speaker":"Host 1","text":"A low-grade product can be high quality if it meets requirements. A high-grade product can be low quality if it fails, breaks, or does not meet requirements."},{"speaker":"Host 2","text":"The exam tip is simple: quality must always be high, while grade can be low or high."},{"speaker":"Host 1","text":"Just-in-time is also mentioned. It is where a product-based company maintains very low or no inventory and obtains latest products, helping with inventory quality and lower inventory cost."},{"speaker":"Host 2","text":"Plan-Do-Check-Act is another major quality theory. Plan means design or revise the process. Do means implement the plan and measure performance. Check means assess the measurements. Act means decide what changes are needed to improve the process."},{"speaker":"Host 1","text":"Continuous improvement, also called Kaizen, focuses on small changes to improve processes and quality. The key idea is that products and services become outdated if they are not continuously improved."},{"speaker":"Host 2","text":"And everyone is responsible for quality. Customers, project managers, team members, sponsors, and senior management all play a role."},{"speaker":"Host 1","text":"Prevention over inspection is a huge PMP mindset concept. It is generally more cost-effective to prevent defects than inspect after deliverables are already made."},{"speaker":"Host 2","text":"Prevention can include better planning, better materials, knowledgeable team members, and better equipment. The more prevention you build in, the fewer defects you should have later."},{"speaker":"Host 1","text":"Six Sigma focuses on improving processes to reduce defects. You do not need sigma calculations for the exam, but you do need to understand the theory."},{"speaker":"Host 2","text":"Now let’s separate attribute sampling and variable sampling. Attribute sampling is about presence or absence of characteristics. Good or bad. Yes or no. One or zero."},{"speaker":"Host 1","text":"Variable sampling measures degree. Something can be okay, good, very good, bad, or very bad. So attribute is binary, variable is degree."},{"speaker":"Host 2","text":"The three quality processes are Plan Quality Management, Manage Quality, and Control Quality."},{"speaker":"Host 1","text":"Plan Quality Management identifies quality requirements and documents how the project will meet them. The main outputs are the quality management plan and quality metrics."},{"speaker":"Host 2","text":"Quality metrics are used to measure deliverables and processes against quality standards. Examples include program load speed, software test coverage, and process improvements."},{"speaker":"Host 1","text":"Manage Quality is about executing the activities in the quality management plan. This is where quality assurance appears."},{"speaker":"Host 2","text":"Quality assurance ensures the correct processes are followed and processes are improved. Manage Quality focuses on the processes used to produce deliverables."},{"speaker":"Host 1","text":"Control Quality is different. Control Quality inspects completed deliverables to determine whether they meet quality standards and requirements."},{"speaker":"Host 2","text":"That is one of the biggest exam distinctions. Process focus equals Manage Quality. Deliverable inspection equals Control Quality."},{"speaker":"Host 1","text":"Now let’s talk tools. Benchmarking compares project quality requirements to other projects’ quality requirements. Cost-benefit analysis compares the benefits of meeting quality requirements against the cost of meeting them."},{"speaker":"Host 2","text":"Cost of quality includes cost of conformance and cost of nonconformance. Conformance includes prevention and appraisal costs. Nonconformance includes internal and external failure costs."},{"speaker":"Host 1","text":"A flowchart shows the process and room for improvement. If you want to make sure the team follows a process correctly, think flowchart."},{"speaker":"Host 2","text":"A checklist helps verify that deliverable components are checked correctly. A check sheet keeps a running total or tally of defects."},{"speaker":"Host 1","text":"A cause-and-effect diagram, also called a fishbone or Ishikawa diagram, identifies causes of defects and root causes of potential defects."},{"speaker":"Host 2","text":"Histograms are bar charts showing distribution of numerical data. They can show frequency of defects."},{"speaker":"Host 1","text":"Audits make sure the project follows organizational quality policies, processes, and procedures. They can also verify that approved change requests were implemented."},{"speaker":"Host 2","text":"Control charts show whether a process is in control. The mean is represented by the center line, and upper and lower control limits are typically three standard deviations from the mean."},{"speaker":"Host 1","text":"The rule of seven says if seven consecutive points fall on one side of the mean, the process must be inspected."},{"speaker":"Host 2","text":"Testing and product evaluations are used to verify that deliverables meet requirements. In software, examples include unit testing and integration testing."},{"speaker":"Host 1","text":"Final mindset for Chapter 9: quality is planned in, built through good processes, and confirmed through inspection and testing."},{"speaker":"Host 2","text":"Exactly. PMP wants the project manager to prevent defects, improve processes, understand requirements, use objective metrics, and confirm deliverables meet quality standards."}],"questions":[{"q":"How is quality defined in the notes?","options":["The degree to which inherent characteristics fulfill requirements","The number of features in a product","The cost of testing deliverables","The project manager’s opinion"],"answer":0,"why":"Quality is the degree to which inherent characteristics fulfill requirements.","mindset":"Quality starts with clear requirements.","chapterRef":"Chapter 9: Quality Definition","tags":["Quality"],"examLike":true,"temptingWrong":"The tempting wrong answers usually rely only on inspection. PMP prefers prevention, process improvement, and objective quality metrics."},{"q":"What is the difference between grade and quality?","options":["They mean the same thing","Grade is feature category; quality is meeting requirements","Quality is always lower than grade","Grade only applies to agile"],"answer":1,"why":"Grade is category/feature level; quality is whether requirements are met.","mindset":"Low grade can still be high quality.","chapterRef":"Chapter 9: Grade vs Quality","tags":["Quality"],"examLike":true,"temptingWrong":"The tempting wrong answers usually rely only on inspection. PMP prefers prevention, process improvement, and objective quality metrics."},{"q":"Which statement is true?","options":["Quality must always be high, while grade can be low or high","Grade must always be high","Low grade means low quality","High grade guarantees high quality"],"answer":0,"why":"Your notes state quality must always be high, while grade can be low or high.","mindset":"Do not confuse features with requirement fulfillment.","chapterRef":"Chapter 9: Grade vs Quality","tags":["Quality"],"examLike":true,"temptingWrong":"The tempting wrong answers usually rely only on inspection. PMP prefers prevention, process improvement, and objective quality metrics."},{"q":"What is Plan-Do-Check-Act used for?","options":["Process improvement","Contract selection","Communication channel counting","Float calculation"],"answer":0,"why":"PDCA is a process improvement cycle: plan, do, check, act.","mindset":"Quality is improved through measured process changes.","chapterRef":"Chapter 9: PDCA","tags":["Process","Quality"],"examLike":true,"temptingWrong":"The tempting wrong answers usually rely only on inspection. PMP prefers prevention, process improvement, and objective quality metrics."},{"q":"What is continuous improvement also known as?","options":["Kaizen","RACI","PERT","Sunk cost"],"answer":0,"why":"Continuous improvement is also called Kaizen.","mindset":"Kaizen focuses on small ongoing improvements.","chapterRef":"Chapter 9: Continuous Improvement","tags":["Concept","Quality"],"examLike":true,"temptingWrong":"The tempting wrong answers usually rely only on inspection. PMP prefers prevention, process improvement, and objective quality metrics."},{"q":"What is the principle of prevention over inspection?","options":["It is usually cheaper to prevent defects than inspect after they happen","Inspection should replace planning","Defects should be ignored until closeout","Only customers are responsible for quality"],"answer":0,"why":"Prevention is generally more cost-effective than inspection after deliverables are made.","mindset":"PMI favors proactive quality planning.","chapterRef":"Chapter 9: Prevention over Inspection","tags":["Formula","Quality"],"examLike":true,"temptingWrong":"The tempting wrong answers usually rely only on inspection. PMP prefers prevention, process improvement, and objective quality metrics."},{"q":"What does Six Sigma focus on?","options":["Improving processes to reduce defects","Counting stakeholders","Creating contracts","Estimating communication channels"],"answer":0,"why":"Six Sigma focuses on improving processes to reduce defects.","mindset":"For PMP, understand the theory, not sigma calculations.","chapterRef":"Chapter 9: Six Sigma","tags":["Concept","Quality"],"examLike":true,"temptingWrong":"The tempting wrong answers usually rely only on inspection. PMP prefers prevention, process improvement, and objective quality metrics."},{"q":"What is attribute sampling?","options":["Measuring presence or absence of characteristics","Measuring degree of performance","Calculating float","Ranking stakeholders"],"answer":0,"why":"Attribute sampling measures whether a characteristic is present or absent, such as yes/no or good/bad.","mindset":"Attribute is binary.","chapterRef":"Chapter 9: Attribute Sampling","tags":["Concept","Quality"],"examLike":true,"temptingWrong":"The tempting wrong answers usually rely only on inspection. PMP prefers prevention, process improvement, and objective quality metrics."},{"q":"What is variable sampling?","options":["Measuring degree of conformity or performance","Counting communication channels","A yes/no quality check","A procurement contract type"],"answer":0,"why":"Variable sampling measures degree, such as okay, good, very good, bad, or very bad.","mindset":"Variable sampling is not just yes/no.","chapterRef":"Chapter 9: Variable Sampling","tags":["Concept","Quality"],"examLike":true,"temptingWrong":"The tempting wrong answers usually rely only on inspection. PMP prefers prevention, process improvement, and objective quality metrics."},{"q":"What are the three quality management processes?","options":["Plan Quality Management, Manage Quality, Control Quality","Estimate Quality, Build Quality, Close Quality","Identify Quality, Rank Quality, Transfer Quality","Plan Scope, Validate Scope, Control Scope"],"answer":0,"why":"The notes list Plan Quality Management, Manage Quality, and Control Quality.","mindset":"Quality planning, assurance/process, and inspection/control are distinct.","chapterRef":"Chapter 9: Quality Processes","tags":["Process","Quality"],"examLike":true,"temptingWrong":"The tempting wrong answers usually rely only on inspection. PMP prefers prevention, process improvement, and objective quality metrics."},{"q":"What is a main output of Plan Quality Management?","options":["Quality management plan and quality metrics","Risk register","Resource calendar","Cost baseline"],"answer":0,"why":"Plan Quality Management outputs the quality management plan and quality metrics.","mindset":"Planning quality defines requirements and how they will be measured.","chapterRef":"Chapter 9: Plan Quality Management","tags":["Process","Quality"],"examLike":true,"temptingWrong":"The tempting wrong answers usually rely only on inspection. PMP prefers prevention, process improvement, and objective quality metrics."},{"q":"What are quality metrics used for?","options":["Measuring deliverables and processes against standards","Selecting sellers only","Counting stakeholders","Calculating SPI"],"answer":0,"why":"Quality metrics measure project quality for deliverables and processes.","mindset":"Metrics make quality objective.","chapterRef":"Chapter 9: Quality Metrics","tags":["Quality"],"examLike":true,"temptingWrong":"The tempting wrong answers usually rely only on inspection. PMP prefers prevention, process improvement, and objective quality metrics."},{"q":"What does Manage Quality focus on?","options":["Processes used to produce deliverables","Final inspection of completed deliverables only","Contract closeout","Schedule compression"],"answer":0,"why":"Manage Quality includes quality assurance and focuses on processes followed while creating deliverables.","mindset":"Process focus = Manage Quality.","chapterRef":"Chapter 9: Manage Quality","tags":["Process","Quality"],"examLike":true,"temptingWrong":"The tempting wrong answers usually rely only on inspection. PMP prefers prevention, process improvement, and objective quality metrics."},{"q":"What does Control Quality focus on?","options":["Inspecting deliverables to determine whether they meet requirements","Creating the team charter","Developing the cost baseline","Identifying stakeholders"],"answer":0,"why":"Control Quality inspects deliverables to determine whether they meet quality requirements.","mindset":"Deliverable inspection = Control Quality.","chapterRef":"Chapter 9: Control Quality","tags":["Process","Quality"],"examLike":true,"temptingWrong":"The tempting wrong answers usually rely only on inspection. PMP prefers prevention, process improvement, and objective quality metrics."},{"q":"Which tool helps verify deliverable components are checked correctly?","options":["Checklist","Check sheet","Histogram","Bubble chart"],"answer":0,"why":"A checklist helps the project manager determine what to check when inspecting deliverables.","mindset":"Checklist checks items.","chapterRef":"Chapter 9: Checklists","tags":["Quality"],"examLike":true,"temptingWrong":"The tempting wrong answers usually rely only on inspection. PMP prefers prevention, process improvement, and objective quality metrics."},{"q":"Which tool keeps a running total or tally of defects?","options":["Check sheet","Checklist","Flowchart","RACI chart"],"answer":0,"why":"A check sheet gathers defects and keeps a running total.","mindset":"Check sheet counts defects.","chapterRef":"Chapter 9: Check Sheets","tags":["Quality"],"examLike":true,"temptingWrong":"The tempting wrong answers usually rely only on inspection. PMP prefers prevention, process improvement, and objective quality metrics."},{"q":"What is a fishbone diagram also called?","options":["Ishikawa or cause-and-effect diagram","RACI chart","Gantt chart","Burnup chart"],"answer":0,"why":"A fishbone diagram is also called an Ishikawa or cause-and-effect diagram.","mindset":"Use fishbone for causes/root causes of defects.","chapterRef":"Chapter 9: Cause-and-Effect Diagrams","tags":["Concept","Quality"],"examLike":true,"temptingWrong":"The tempting wrong answers usually rely only on inspection. PMP prefers prevention, process improvement, and objective quality metrics."},{"q":"What do histograms show?","options":["Frequency/distribution of numerical data","Contract type risk","Stakeholder power only","Project funding timing"],"answer":0,"why":"Histograms are bar charts showing distribution/frequency of numerical data.","mindset":"Use histograms to see frequency of defects.","chapterRef":"Chapter 9: Histograms","tags":["Concept","Quality"],"examLike":true,"temptingWrong":"The tempting wrong answers usually rely only on inspection. PMP prefers prevention, process improvement, and objective quality metrics."},{"q":"What is an audit used for in quality?","options":["Ensuring policies, processes, and procedures are followed","Approving the project charter","Calculating EAC","Setting stakeholder urgency"],"answer":0,"why":"Audits ensure the project follows organizational quality policies, processes, and procedures.","mindset":"Audits check process compliance and implementation.","chapterRef":"Chapter 9: Audits","tags":["Quality"],"examLike":true,"temptingWrong":"The tempting wrong answers usually rely only on inspection. PMP prefers prevention, process improvement, and objective quality metrics."},{"q":"What does the Rule of Seven indicate on a control chart?","options":["If seven consecutive points fall on one side of the mean, inspect the process","Seven defects means close the project","Seven stakeholders means 21 channels","Seven activities make a critical path"],"answer":0,"why":"The Rule of Seven says the process must be inspected if seven consecutive points fall on one side of the mean.","mindset":"Control charts show when processes may be out of control.","chapterRef":"Chapter 9: Control Charts","tags":["Formula","Process","Quality"],"examLike":true,"temptingWrong":"The tempting wrong answers usually rely only on inspection. PMP prefers prevention, process improvement, and objective quality metrics."}]},{"id":10,"title":"Chapter 10: Project Resource Management","summary":"Chapter 10: Project Resource Management","notes":["Chapter 10: Project Resource Management","Resources are the backbone of any project","Resources are generally categorized into two main types: • Physical resources • Human resources","Physical resources generally include: • Materials • Equipment • Facilities","Human resources would be the project team","In this knowledge area, you will be: • Organizing the project team • Leading the project team to complete the project","This is an important knowledge area for the exam • Expect several questions on human resources • Expect questions on conflict management from these processes","Project management deals a lot with managing people","All projects have people, and this may be one of the hardest aspects of project management","A dysfunctional project team is more likely to produce a failed deliverable","One of the project manager’s main jobs: • Ensure the team functions well • Manage conflicts that occur as the project progresses","On an agile project: • The project team usually plays an important role • Team members are usually the main decision-makers and problem-solvers","On agile projects, the project manager is more of a “servant-leader” • Provides the tools the team needs to complete the work","Professional and ethical behaviors must be maintained within project development","The team should: • Be aware of professional and ethical behaviors • Follow those behaviors","The project manager should influence the project team, including: • Managing the environment • Communications • Cultural issues","Plan Resource Management • Process Group: Planning • Main Outputs: • Resource Management Plan • Team Charter","Estimate Activity Resources • Process Group: Planning • Main Outputs: • Resource Requirements • Resource Breakdown Structure • Basis of Estimates","Acquire Resources • Process Group: Executing • Main Outputs: • Physical Resource Assignments • Project Team Assignments • Resource Calendar","Develop Team • Process Group: Executing • Main Outputs: • Team Performance Assessments • Change Requests","Manage Team • Process Group: Executing • Main Outputs: • Change Requests","Control Resources • Process Group: Monitoring and Controlling • Main Outputs: • Work Performance Information • Change Requests"],"examples":["Resources are the backbone of any project","Resources are generally categorized into two main types: • Physical resources • Human resources","Physical resources generally include: • Materials • Equipment • Facilities","Human resources would be the project team"],"podcast":[{"speaker":"Maya","text":"Alright, let’s study Chapter 10: Project Resource Management. This is one of those PMP areas where you want to understand both the terminology and the project manager mindset behind it."},{"speaker":"Jordan","text":"Exactly. The PMP rarely rewards memorizing words only. It wants you to recognize the situation, identify what process or principle is being tested, and choose the next best action."},{"speaker":"Maya","text":"One key point is this: Chapter 10: Project Resource Management"},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. Resources are the backbone of any project"},{"speaker":"Maya","text":"One key point is this: Resources are generally categorized into two main types: • Physical resources • Human resources"},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. Physical resources generally include: • Materials • Equipment • Facilities"},{"speaker":"Maya","text":"One key point is this: Human resources would be the project team"},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. In this knowledge area, you will be: • Organizing the project team • Leading the project team to complete the project"},{"speaker":"Maya","text":"One key point is this: This is an important knowledge area for the exam • Expect several questions on human resources • Expect questions on conflict management from these processes"},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. Project management deals a lot with managing people"},{"speaker":"Maya","text":"One key point is this: All projects have people, and this may be one of the hardest aspects of project management"},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. A dysfunctional project team is more likely to produce a failed deliverable"},{"speaker":"Maya","text":"One key point is this: One of the project manager’s main jobs: • Ensure the team functions well • Manage conflicts that occur as the project progresses"},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. On an agile project: • The project team usually plays an important role • Team members are usually the main decision-makers and problem-solvers"},{"speaker":"Maya","text":"One key point is this: On agile projects, the project manager is more of a “servant-leader” • Provides the tools the team needs to complete the work"},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. Professional and ethical behaviors must be maintained within project development"},{"speaker":"Maya","text":"One key point is this: The team should: • Be aware of professional and ethical behaviors • Follow those behaviors"},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. The project manager should influence the project team, including: • Managing the environment • Communications • Cultural issues"},{"speaker":"Maya","text":"One key point is this: Plan Resource Management • Process Group: Planning • Main Outputs: • Resource Management Plan • Team Charter"},{"speaker":"Jordan","text":"And the way to think about that for the exam is to connect it to the project manager’s responsibility. Estimate Activity Resources • Process Group: Planning • Main Outputs: • Resource Requirements • Resource Breakdown Structure • Basis of Estimates"},{"speaker":"Maya","text":"So the big takeaway is not just knowing the definition. You want to ask: what is happening in the scenario, who is impacted, what process should be used, and what should the project manager do next?"},{"speaker":"Jordan","text":"Right. Slow down, do not jump straight to escalation, and use the correct PMP process. That is how this chapter turns into points on the exam."}],"questions":[{"q":"What are the two main categories of resources?","options":["Physical and human resources","Internal and external risks","Push and pull resources","Fixed and variable resources"],"answer":0,"why":"Resources are generally categorized as physical resources and human resources.","mindset":"Physical resources are things; human resources are the project team.","chapterRef":"Chapter 10: Resource Management","tags":["Process","Resource"],"examLike":true,"temptingWrong":"The tempting wrong answers usually jump to command-and-control. PMP prefers servant leadership, training, role clarity, and removing impediments."},{"q":"What are examples of physical resources?","options":["Materials, equipment, and facilities","Sponsors and customers only","Stakeholder expectations","Communication channels"],"answer":0,"why":"Physical resources include materials, equipment, and facilities.","mindset":"Do not limit resources to people only.","chapterRef":"Chapter 10: Physical Resources","tags":["Resource"],"examLike":true,"temptingWrong":"The tempting wrong answers usually jump to command-and-control. PMP prefers servant leadership, training, role clarity, and removing impediments."},{"q":"What is one of the project manager’s main jobs with the team?","options":["Ensure the team functions well and manage conflicts","Avoid all communication","Select only sellers","Create the cost baseline only"],"answer":0,"why":"The PM ensures the team functions well and manages conflicts as the project progresses.","mindset":"Projects succeed through people as much as process.","chapterRef":"Chapter 10: Team Management","tags":["Scenario","Process","Resource"],"examLike":true,"temptingWrong":"The tempting wrong answers usually jump to command-and-control. PMP prefers servant leadership, training, role clarity, and removing impediments."},{"q":"What is the project manager’s role on agile projects according to the notes?","options":["Servant-leader who provides tools and support","Dictator who makes every technical decision","Seller representative","Passive observer"],"answer":0,"why":"On agile projects, the PM is more of a servant-leader who provides the tools the team needs.","mindset":"Servant leadership supports and removes barriers.","chapterRef":"Chapter 10: Agile Resource Management","tags":["Scenario","Agile","Process","Resource"],"examLike":true,"temptingWrong":"The tempting wrong answers usually jump to command-and-control. PMP prefers servant leadership, training, role clarity, and removing impediments."},{"q":"What does Plan Resource Management identify?","options":["Roles, responsibilities, reporting, and how resources are managed","Only final project cost","Only contract penalties","Only quality metrics"],"answer":0,"why":"Plan Resource Management identifies roles, responsibilities, reporting, and how resources are acquired/managed/released.","mindset":"Resource planning clarifies who does what and how resources are handled.","chapterRef":"Chapter 10: Plan Resource Management","tags":["Process","Resource"],"examLike":true,"temptingWrong":"The tempting wrong answers usually jump to command-and-control. PMP prefers servant leadership, training, role clarity, and removing impediments."},{"q":"What is a hierarchical chart used for?","options":["Showing reporting relationships and project positions","Showing defect frequency","Calculating CPI","Choosing contract type"],"answer":0,"why":"Hierarchical charts show reporting relationships and project positions; they can be organizational breakdown structures.","mindset":"Use hierarchy when the question focuses on reporting structure.","chapterRef":"Chapter 10: Data Representation","tags":["Concept","Resource"],"examLike":true,"temptingWrong":"The tempting wrong answers usually jump to command-and-control. PMP prefers servant leadership, training, role clarity, and removing impediments."},{"q":"What does a Responsibility Assignment Matrix show?","options":["Resources assigned to work packages","Risk probability only","Earned value formulas","Quality control limits"],"answer":0,"why":"A RAM shows resources assigned to work packages.","mindset":"RAM/RACI helps clarify ownership.","chapterRef":"Chapter 10: RAM","tags":["Concept","Resource"],"examLike":true,"temptingWrong":"The tempting wrong answers usually jump to command-and-control. PMP prefers servant leadership, training, role clarity, and removing impediments."},{"q":"What does RACI stand for?","options":["Responsible, Accountable, Consulted, Informed","Risk, Action, Cost, Issue","Review, Approve, Control, Inspect","Resource, Agile, Charter, Influence"],"answer":0,"why":"RACI means Responsible, Accountable, Consulted, and Informed.","mindset":"RACI clarifies who does what and who needs input/status.","chapterRef":"Chapter 10: RACI","tags":["Resource"],"examLike":true,"temptingWrong":"The tempting wrong answers usually jump to command-and-control. PMP prefers servant leadership, training, role clarity, and removing impediments."},{"q":"What is the important RACI rule from the notes?","options":["Never have more than one person accountable","Always make everyone accountable","Only the customer can be responsible","Do not inform stakeholders"],"answer":0,"why":"The notes say never have more than one person held accountable.","mindset":"One accountable person prevents confusion and blame shifting.","chapterRef":"Chapter 10: RACI Rule","tags":["Resource"],"examLike":true,"temptingWrong":"The tempting wrong answers usually jump to command-and-control. PMP prefers servant leadership, training, role clarity, and removing impediments."},{"q":"What is a team charter?","options":["A document outlining acceptable behavior within the project","A seller invoice","A cost baseline","A burndown chart"],"answer":0,"why":"The team charter outlines acceptable behavior and team rules.","mindset":"Team-created ground rules improve buy-in.","chapterRef":"Chapter 10: Team Charter","tags":["Resource"],"examLike":true,"temptingWrong":"The tempting wrong answers usually jump to command-and-control. PMP prefers servant leadership, training, role clarity, and removing impediments."},{"q":"Who should best create the team charter?","options":["The project team for the project team","Only the sponsor without team input","Only procurement","Only external auditors"],"answer":0,"why":"The notes say the team charter is best created by the project team for the project team.","mindset":"People are more likely to follow rules they help create.","chapterRef":"Chapter 10: Team Charter","tags":["Resource","Scenario"],"examLike":true,"temptingWrong":"The tempting wrong answers usually jump to command-and-control. PMP prefers servant leadership, training, role clarity, and removing impediments."},{"q":"What does Estimate Activity Resources determine?","options":["What and how many resources are needed for each activity","Stakeholder engagement state","Contract legal terms","Final acceptance criteria only"],"answer":0,"why":"Estimate Activity Resources determines the types and quantities of resources needed for activities.","mindset":"This includes people, equipment, machines, and supplies.","chapterRef":"Chapter 10: Estimate Activity Resources","tags":["Process","Resource"],"examLike":true,"temptingWrong":"The tempting wrong answers usually jump to command-and-control. PMP prefers servant leadership, training, role clarity, and removing impediments."},{"q":"Which estimating method breaks work down until resources can be assigned?","options":["Bottom-up estimating","Analogous estimating","Pull communication","Control charting"],"answer":0,"why":"Bottom-up estimating breaks down activities into more detail until resources can be assigned.","mindset":"Accurate but time-consuming.","chapterRef":"Chapter 10: Bottom-Up Estimating","tags":["Resource"],"examLike":true,"temptingWrong":"The tempting wrong answers usually jump to command-and-control. PMP prefers servant leadership, training, role clarity, and removing impediments."},{"q":"What is analogous estimating also called?","options":["Top-down estimating","Bottom-up estimating","Fishbone estimating","Earned value estimating"],"answer":0,"why":"Analogous estimating is also known as top-down estimating and uses historical information.","mindset":"Analogous is quick but may be inaccurate.","chapterRef":"Chapter 10: Analogous Estimating","tags":["Concept","Resource"],"examLike":true,"temptingWrong":"The tempting wrong answers usually jump to command-and-control. PMP prefers servant leadership, training, role clarity, and removing impediments."},{"q":"What is a Resource Breakdown Structure?","options":["Hierarchical breakdown of resources by category and type","List of all stakeholders","A contract type","A project communication model"],"answer":0,"why":"An RBS is a hierarchical breakdown of resources by category and type.","mindset":"RBS helps organize and track resources.","chapterRef":"Chapter 10: Resource Breakdown Structure","tags":["Resource"],"examLike":true,"temptingWrong":"The tempting wrong answers usually jump to command-and-control. PMP prefers servant leadership, training, role clarity, and removing impediments."},{"q":"What is Acquire Resources about?","options":["Getting staff and physical resources needed to build deliverables","Inspecting quality only","Closing contracts","Ranking risks"],"answer":0,"why":"Acquire Resources gets the staff and physical resources needed for project deliverables.","mindset":"Right resources are critical during execution.","chapterRef":"Chapter 10: Acquire Resources","tags":["Resource"],"examLike":true,"temptingWrong":"The tempting wrong answers usually jump to command-and-control. PMP prefers servant leadership, training, role clarity, and removing impediments."},{"q":"What is multi-criteria decision analysis used for in acquiring resources?","options":["Selecting team members based on criteria","Calculating EVM","Counting defects","Choosing stakeholder engagement states"],"answer":0,"why":"It ranks candidates/resources using criteria such as communication, location, availability, cost, experience, and education.","mindset":"Use criteria to select the right person for the right activity.","chapterRef":"Chapter 10: Acquire Resources","tags":["Resource"],"examLike":true,"temptingWrong":"The tempting wrong answers usually jump to command-and-control. PMP prefers servant leadership, training, role clarity, and removing impediments."},{"q":"What is pre-assignment?","options":["Project team selected before the project starts","Stakeholders refusing engagement","A risk response after impact","A final inspection"],"answer":0,"why":"Pre-assignment means project team members were selected before the project starts.","mindset":"Pre-assigned resources may come from functional managers or early decisions.","chapterRef":"Chapter 10: Pre-assignment","tags":["Concept","Resource"],"examLike":true,"temptingWrong":"The tempting wrong answers usually jump to command-and-control. PMP prefers servant leadership, training, role clarity, and removing impediments."},{"q":"What is a drawback of virtual teams?","options":["Communication, language, cultural, technology, or isolation issues","No access to global talent","No need for collaboration","No possible stakeholder impact"],"answer":0,"why":"Virtual teams can face communication, language, cultural, technology cost, and isolation challenges.","mindset":"Virtual teams need intentional engagement and tools.","chapterRef":"Chapter 10: Virtual Teams","tags":["Resource"],"examLike":true,"temptingWrong":"The tempting wrong answers usually jump to command-and-control. PMP prefers servant leadership, training, role clarity, and removing impediments."},{"q":"What do resource calendars show?","options":["Resource availability and use on the project","Only defect totals","Only project risks","Only contract terms"],"answer":0,"why":"Resource calendars show staff availability, including project work, functional work, and vacations.","mindset":"Availability affects activity duration and scheduling.","chapterRef":"Chapter 10: Resource Calendars","tags":["Resource"],"examLike":true,"temptingWrong":"The tempting wrong answers usually jump to command-and-control. PMP prefers servant leadership, training, role clarity, and removing impediments."}]},{"id":11,"title":"Chapter 11: Project Communication Management","summary":"Project Communication Management","notes":["Project Communication Management","One of the most important knowledge areas in real-life project management","Communication is the key to a successful project","Management is about good communications","More than 90% of daily project manager tasks involve communication internally or externally","Project Manager’s Role","Set communication expectations for the project","Let peo
